<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>FLAP FIGHT — JnJ Arcade</title>
<!--
  FLAP FIGHT — the Game Mashup: BALLOON FIGHT × FLAPPY BIRD (Jimmy & Joe).
  Tap to flap through pipe gaps (Flappy Bird) WHILE popping balloon fighters mid-air (Balloon Fight).
  • Tap anywhere to flap — gravity pulls you down constantly.
  • Thread the gaps between pipes — one touch to a pipe = instant death.
  • Balloon enemy fighters float right-to-left — pop them by touching for +25 pts.
  • Chain pops within 2s for a combo multiplier (×2, ×3…).
  Difficulty curve:
    L1-4: speed 2.1, gap 155px, enemies fly horizontal only.
    L5-9: speed 2.6, gap 140px, enemies oscillate vertically.
    L10+: speed 3.0+, gap 125px, dual-enemy waves.
  Conventions: full-screen shell, tap-only, INSERT COIN overlay, cell-buffer in resize().
-->
<style>
  :root {
    --ink:#4dd9f5; --dim:#0d4a5c; --pit:#030f18;
    --glow:rgba(77,217,245,.22); --bg:#060d14;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:var(--bg); color:#fff;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  .game-shell {
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; width:100%;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0)
            env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  .game-header {
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.2));
    border-bottom:2px solid var(--dim);
  }
  .back-btn { color:var(--ink); text-decoration:none; font-weight:700; font-size:13px; letter-spacing:.05em; opacity:.85; }
  .game-name {
    font-family:'Bungee',cursive; letter-spacing:.14em;
    color:var(--ink); text-shadow:0 0 12px var(--glow); font-size:17px;
  }
  .hdr-right { text-align:right; }
  .score-label { font-size:9px; letter-spacing:.18em; opacity:.55; }
  .score-val { font-size:19px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .hud-bar {
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px 5px; font-size:12px;
    border-bottom:1px solid rgba(77,217,245,.1);
  }
  .combo-display { color:var(--ink); font-weight:700; font-size:13px; opacity:0; transition:opacity .3s; letter-spacing:.06em; }
  .combo-display.on { opacity:1; }
  .lvl { opacity:.65; letter-spacing:.1em; font-size:11px; }
  .canvas-wrap {
    flex:1; position:relative; padding:14px 6px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block; border:2px solid var(--dim); border-radius:10px;
    box-shadow:0 0 30px var(--glow), inset 0 0 24px rgba(0,0,0,.6);
    background:var(--pit); touch-action:none;
  }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(6,13,20,.88); backdrop-filter:blur(4px);
    text-align:center; padding:24px; z-index:5; border-radius:10px;
  }
  .overlay.hidden { display:none; }
  .overlay-emoji { font-size:48px; }
  .overlay-title {
    font-family:'Bungee',cursive; font-size:28px; font-weight:900;
    letter-spacing:.1em; color:var(--ink); text-shadow:0 0 18px var(--glow);
  }
  .overlay-sub { font-size:13px; line-height:1.6; opacity:.85; max-width:320px; }
  .board { font-size:12px; opacity:.8; line-height:1.7; margin-top:2px; }
  .board b { color:var(--ink); }
  .play-btn {
    margin-top:4px; background:var(--ink); color:#021518; border:none;
    border-radius:28px; padding:13px 28px; font-size:15px; font-weight:800;
    letter-spacing:.08em; cursor:pointer; box-shadow:0 0 24px var(--glow);
    font-family:'Bungee',cursive;
    transition:transform .06s, box-shadow .06s;
  }
  .play-btn:active { transform:translateY(3px); box-shadow:0 0 10px var(--glow); }
</style>
</head>
<body>
<div class="game-shell">
  <header class="game-header">
    <a class="back-btn" href="../index.html">‹ ARCADE</a>
    <div class="game-name">FLAP FIGHT</div>
    <div class="hdr-right"><div class="score-label">SCORE</div><div class="score-val" id="score">0</div></div>
  </header>
  <div class="hud-bar">
    <div class="combo-display" id="combo"></div>
    <div class="lvl" id="lvl">LEVEL 1</div>
  </div>
  <div class="canvas-wrap" id="wrap">
    <canvas id="c"></canvas>
    <div class="overlay hidden" id="ov">
      <div class="overlay-emoji" id="ovEmoji">🎈💨</div>
      <div class="overlay-title" id="ovTitle">FLAP FIGHT</div>
      <div class="overlay-sub" id="ovsub">
        Tap to flap — gaps shrink every minute.<br>
        Stomp <b>down</b> on enemy parachutes for <b>+25 pts</b>.<br>
        Chain stomps for a <b style="color:var(--ink)">×COMBO</b>.<br>
        One touch to any pipe = gone.
      </div>
      <div class="board" id="board"></div>
      <button class="play-btn" id="playBtn">INSERT COIN</button>
    </div>
  </div>
</div>
<script src="arcade-scores.js?v=10"></script>
<script>
// ─── constants ───────────────────────────────────────────────────────────────
const GAME_ID      = 'flap-fight';
const GAME_TITLE   = 'FLAP FIGHT';
const ACCENT       = '#4dd9f5';
const GRAVITY      = 0.40;
const FLAP_VY      = -7.8;
const PIPE_W       = 54;
const PIPE_CAP_OVR = 5;
const BIRD_R       = 11;
const ENEMY_R      = 14;
const POP_DIST     = BIRD_R + ENEMY_R + 3;
const COMBO_WINDOW = 2200;          // ms between pops to keep combo alive
const BASE_SPEED   = 2.1;
const PIPE_FRAMES  = 130;           // frames between pipe spawns
const CELL         = 18;            // resize cell buffer (convention)
const GROUND_H     = 26;            // scrolling ground strip height
const MAX_ENEMIES  = 7;             // cap on simultaneous balloon fighters
const STAR_COUNT   = 60;            // parallax background stars
const CHUTE_R      = 22;            // parachute dome radius
const CHUTE_OFFSET = CHUTE_R + 4;  // dome centre is this far above body centre
const GAP_START    = 220;           // initial pipe gap (wide)
const GAP_MIN      = 105;           // narrowest pipe gap

// ─── DOM ─────────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('wrap');
const ov      = document.getElementById('ov');
const ovTitle = document.getElementById('ovTitle');
const ovEmoji = document.getElementById('ovEmoji');
const ovsub   = document.getElementById('ovsub');
const board   = document.getElementById('board');
const playBtn = document.getElementById('playBtn');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const lvlEl   = document.getElementById('lvl');

// ─── game state ──────────────────────────────────────────────────────────────
let cw, ch;
let bird, pipes, enemies, particles, floaters, stars, clouds;
let score, frame, running, dead, waiting, bestScore, gameStartTime;
let pipeSpeed, level, pipesUntilLevel;
let comboCount, lastPopMs, comboTimer;
let birdInflate, inflateInvincible, nextSpecialSpawn;
let popping, popRingR, popRingX, popRingY;
let animId;
let groundX = 0;

// ─── stars init ──────────────────────────────────────────────────────────────
function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const layer = Math.random() < 0.5 ? 0 : 1;  // 0=slow, 1=fast
    stars.push({
      x: Math.random() * cw,
      y: Math.random() * (ch - GROUND_H),
      r: layer === 0 ? rnd(0.5, 1.2) : rnd(1.0, 2.0),
      speed: layer === 0 ? rnd(0.15, 0.35) : rnd(0.5, 0.9),
      alpha: rnd(0.2, 0.7),
    });
  }
}

// ─── clouds init ─────────────────────────────────────────────────────────────
function initClouds() {
  clouds = [];
  const layers = [
    { count: 4, wMin: 55,  wMax: 90,  spMin: 0.10, spMax: 0.20, alpha: 0.10 },
    { count: 4, wMin: 80,  wMax: 130, spMin: 0.25, spMax: 0.42, alpha: 0.20 },
    { count: 3, wMin: 110, wMax: 170, spMin: 0.50, spMax: 0.75, alpha: 0.28 },
  ];
  for (const l of layers) {
    for (let i = 0; i < l.count; i++) {
      clouds.push({
        x:     rnd(0, cw),
        y:     rnd(18, ch * 0.60),
        w:     rnd(l.wMin, l.wMax),
        speed: rnd(l.spMin, l.spMax),
        alpha: l.alpha,
      });
    }
  }
}

// ─── time-based gap ──────────────────────────────────────────────────────────
function currentGapSize() {
  const mins = (Date.now() - gameStartTime) / 60000;
  return Math.max(GAP_MIN, Math.round(GAP_START - mins * 25));
}

// ─── resize (convention: subtract CELL buffer top+bottom) ─────────────────────
function resize() {
  cw = wrap.clientWidth  - 12;
  ch = wrap.clientHeight - 28 - CELL * 2;
  canvas.width  = cw;
  canvas.height = ch;
}

// ─── helpers ─────────────────────────────────────────────────────────────────
function rnd(a, b) { return a + Math.random() * (b - a); }

function spawnPipe() {
  const gap    = currentGapSize();
  const margin = 60;
  const gapY   = rnd(margin, ch - GROUND_H - margin - gap);
  const wobble = level >= 6 && Math.random() < 0.35;
  pipes.push({
    x: cw + PIPE_W + 2, gapY, gapSize: gap, counted: false,
    wobble, wobblePhase: 0, wobbleXOff: 0,
    fallOffset: 0, falling: false,
    fallTimer: wobble ? Math.round(rnd(55, 100)) : 0,
  });
}

function spawnEnemy() {
  if (enemies.length >= MAX_ENEMIES) return;
  const y    = rnd(CHUTE_OFFSET + CHUTE_R + 12, ch - GROUND_H - 28);
  const vy   = level >= 5 ? (Math.random() < 0.5 ? 1 : -1) * rnd(0.35, 0.85) : 0;
  const fast = level >= 10;
  enemies.push({ x: cw + ENEMY_R + 8, y, vy, alive: true, phase: Math.random() * Math.PI * 2, fast });
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 * i) / count + rnd(-0.4, 0.4);
    const spd = rnd(2.5, 5.5);
    particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1.5,
                     alpha: 1, r: rnd(2.5, 5.5), color });
  }
}

function setLevel(n) {
  level           = n;
  pipeSpeed       = BASE_SPEED + (n - 1) * 0.18;
  pipesUntilLevel = 10;
  lvlEl.textContent = `LEVEL ${n}`;
}

// ─── init ─────────────────────────────────────────────────────────────────────
function initGame() {
  resize();
  bird      = { x: Math.round(cw * 0.22), y: Math.round(ch / 2), vy: 0, rot: 0, r: BIRD_R };
  birdInflate       = 0;
  inflateInvincible = 0;
  nextSpecialSpawn  = Date.now() + Math.round(rnd(40000, 70000));
  popping           = false;
  popRingR          = 0;
  pipes     = [];
  enemies   = [];
  particles = [];
  floaters      = [];
  groundX       = 0;
  score         = 0;
  frame         = 0;
  running       = false;
  waiting       = true;
  dead          = false;
  gameStartTime = Date.now();
  bestScore     = parseInt(localStorage.getItem('hs_flap-fight') || '0', 10);
  comboCount  = 0;
  lastPopMs   = 0;
  clearTimeout(comboTimer);
  comboEl.classList.remove('on');
  scoreEl.textContent = '0';
  setLevel(1);
  initStars();
  initClouds();
  spawnPipe();
}

// ─── flap ─────────────────────────────────────────────────────────────────────
function flap() {
  if (!running || popping) return;
  bird.vy = FLAP_VY;
}

function startPlaying() {
  if (!waiting) return;
  waiting = false;
  running = true;
  tryFullscreen();
  flap();
}

// ─── update ──────────────────────────────────────────────────────────────────
function update() {
  frame++;

  // pop animation — keep particles/floaters/ring alive, skip everything else
  if (popping) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.alpha -= 0.022;
      if (p.alpha <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.y += f.vy; f.vy *= 0.96; f.alpha -= 0.018;
      if (f.alpha <= 0) floaters.splice(i, 1);
    }
    popRingR += 4.5;
    return;
  }

  // bird physics
  bird.vy += GRAVITY;
  bird.y  += bird.vy;
  // clamp rotation: nose-down on fall, nose-up on rise
  bird.rot = Math.min(Math.max(bird.vy * 4.5, -28), 90);

  // ceiling / floor — skip if invincible (1s after inflate hit)
  if (bird.y - bird.r < 0 || bird.y + bird.r > ch - GROUND_H) {
    if (Date.now() >= inflateInvincible) inflate();
    return;
  }

  // scroll ground
  groundX = (groundX - pipeSpeed * 0.9) % (GROUND_H * 2);

  // stars parallax
  for (const s of stars) {
    s.x -= s.speed;
    if (s.x < 0) s.x = cw;
  }

  // clouds parallax
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x + c.w < -30) { c.x = cw + 30; c.y = rnd(18, ch * 0.60); }
  }

  // spawn pipes
  if (frame % PIPE_FRAMES === 0) spawnPipe();

  // spawn enemies: interval shrinks each level, min 45 frames
  const eInt = Math.max(45, 88 - (level - 1) * 5);
  if (frame > PIPE_FRAMES * 0.6 && frame % eInt === 0) {
    spawnEnemy();
    if (level >= 10 && frame % (eInt * 2) === 0) spawnEnemy(); // dual wave at L10+
  }

  // pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= pipeSpeed;
    if (p.x + PIPE_W < 0) { pipes.splice(i, 1); continue; }

    // wobble / falling top pipe update
    if (p.wobble) {
      p.wobblePhase += 0.10;
      if (!p.falling) {
        p.wobbleXOff = Math.sin(p.wobblePhase) * 5;
        p.fallTimer--;
        if (p.fallTimer <= 0) { p.falling = true; p.wobbleXOff = 0; }
      } else {
        p.fallOffset += 2.8;
      }
    }

    // score pipe
    if (!p.counted && p.x + PIPE_W < bird.x) {
      p.counted = true;
      score += 10;
      scoreEl.textContent = score;
      pipesUntilLevel--;
      if (pipesUntilLevel <= 0) setLevel(level + 1);
      floaters.push({ x: p.x + PIPE_W / 2, y: p.gapY + p.gapSize / 2, text: '+10', alpha: 1, vy: -1.4, color: '#4dd9f5' });
    }

    // collision: rect vs circle (dynamic bird.r)
    const effGapY = p.gapY + (p.wobble ? p.fallOffset : 0);
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    if (inX) {
      const inGap = bird.y - bird.r >= effGapY && bird.y + bird.r <= p.gapY + p.gapSize;
      if (!inGap) { if (Date.now() >= inflateInvincible) inflate(); return; }
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) { enemies.splice(i, 1); continue; }

    const spd = pipeSpeed * (e.fast ? 0.8 : 0.62);
    e.x -= spd;
    e.y += e.vy;
    // bounce off top/bottom
    const minY = CHUTE_OFFSET + CHUTE_R + 4;
    if (e.y < minY)  { e.y = minY;  e.vy = Math.abs(e.vy); }
    if (e.y > ch - GROUND_H - ENEMY_R - 2) { e.y = ch - GROUND_H - ENEMY_R - 2; e.vy = -Math.abs(e.vy); }
    if (e.x + CHUTE_R < 0) { enemies.splice(i, 1); continue; }

    // stomp check: bird falls onto parachute from above
    const cx = e.x, cy = e.y - CHUTE_OFFSET;
    const dcx = bird.x - cx, dcy = bird.y - cy;
    const chuteDist = Math.sqrt(dcx * dcx + dcy * dcy);
    if (chuteDist < bird.r + CHUTE_R && bird.vy > -2) {
      e.alive = false;
      bird.vy = -7;
      if (e.special) {
        // DEFLATE PARACHUTE — shrink bird back one inflation level
        spawnParticles(e.x, cy, '#00ffcc', 14);
        spawnParticles(e.x, cy, '#7fff00', 7);
        const sc = '#ffcf3d';
        if (birdInflate > 0) {
          birdInflate--;
          bird.r = Math.round(BIRD_R * Math.pow(1.5, birdInflate));
          floaters.push({ x: e.x, y: cy - CHUTE_R - 4, text: '🌀 DEFLATED!', alpha: 1, vy: -1.8, color: sc });
        } else {
          score += 50;
          scoreEl.textContent = score;
          floaters.push({ x: e.x, y: cy - CHUTE_R - 4, text: '+50 BONUS!', alpha: 1, vy: -1.8, color: sc });
        }
      } else {
        // normal stomp — combo + points
        const now = Date.now();
        if (now - lastPopMs < COMBO_WINDOW) {
          comboCount = Math.min(comboCount + 1, 9);
        } else {
          comboCount = 1;
        }
        lastPopMs = now;
        const pts = 25 * comboCount;
        score += pts;
        scoreEl.textContent = score;
        spawnParticles(e.x, cy, '#ff6b4a', 12);
        spawnParticles(e.x, cy, '#ffcf3d', 6);
        const popLabel = comboCount >= 2 ? `+${pts} ×${comboCount}` : `+${pts}`;
        floaters.push({ x: e.x, y: cy - CHUTE_R - 4, text: popLabel, alpha: 1, vy: -1.8, color: '#ffcf3d' });
        if (comboCount >= 2) {
          comboEl.textContent = `×${comboCount} COMBO  +${pts}`;
          comboEl.classList.add('on');
          clearTimeout(comboTimer);
          comboTimer = setTimeout(() => comboEl.classList.remove('on'), 1400);
        }
      }
    }
  }

  // rare deflate parachute: once per ~1 min at a random moment, only when inflated
  if (birdInflate > 0 && Date.now() >= nextSpecialSpawn) {
    nextSpecialSpawn = Date.now() + Math.round(rnd(45000, 75000));
    const hardY = Math.random() < 0.5
      ? rnd(CHUTE_OFFSET + CHUTE_R + 4, ch * 0.18)
      : rnd(ch * 0.82, ch - GROUND_H - CHUTE_OFFSET - 4);
    enemies.push({ x: cw + ENEMY_R + 8, y: hardY, vy: rnd(0.5, 1.1) * (Math.random() < 0.5 ? 1 : -1),
                   alive: true, phase: Math.random() * Math.PI * 2, fast: false, special: true });
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.18;
    p.alpha -= 0.038;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // floaters (rising score labels)
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y    += f.vy;
    f.alpha -= 0.028;
    if (f.alpha <= 0) floaters.splice(i, 1);
  }
}

// ─── draw ────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, cw, ch);

  // sky gradient background
  const sky = ctx.createLinearGradient(0, 0, 0, ch);
  sky.addColorStop(0, '#030f18');
  sky.addColorStop(1, '#071a2a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, cw, ch);

  // parallax stars
  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#b0f0ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // parallax clouds
  for (const c of clouds) drawCloud(c.x, c.y, c.w, c.alpha);

  // pipes (bottom pipe stops at ground; wobble pipes have animated top)
  for (const p of pipes) {
    const xOff   = p.wobble ? p.wobbleXOff : 0;
    const topH   = p.gapY + (p.wobble ? p.fallOffset : 0);
    drawPipe(p.x + xOff, 0,              PIPE_W, topH,                                   false);
    drawPipe(p.x,         p.gapY + p.gapSize, PIPE_W, ch - GROUND_H - p.gapY - p.gapSize, true);
    // danger glow on wobble pipe
    if (p.wobble && !p.falling) {
      const pulse = 0.3 + 0.3 * Math.abs(Math.sin(p.wobblePhase * 1.4));
      ctx.save();
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 18;
      ctx.strokeStyle = 'rgba(255,80,0,' + pulse + ')'; ctx.lineWidth = 3;
      ctx.strokeRect(p.x + xOff - PIPE_CAP_OVR, topH - 14, PIPE_W + PIPE_CAP_OVR * 2, 14);
      ctx.restore();
    }
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    drawEnemy(e.x, e.y, e.special);
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ground strip (drawn over pipes/enemies, under bird)
  drawGround();

  // floating score labels
  ctx.font = 'bold 13px "Barlow Condensed","Arial Narrow",sans-serif';
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.alpha);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  // bird (or pop ring if dying)
  if (popping) {
    const ringAlpha = Math.max(0, 1 - popRingR / 130);
    if (ringAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = ringAlpha;
      ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(popRingX, popRingY, popRingR, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = ringAlpha * 0.6;
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(popRingX, popRingY, popRingR * 0.65, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  } else {
    const _inv = Date.now() < inflateInvincible;
    const _waitFlash = waiting && Math.floor(Date.now() / 300) % 3 === 0;
    if ((!_inv || Math.floor(Date.now() / 75) % 2 === 0) && !_waitFlash) {
      if (_inv) ctx.globalAlpha = 0.35;
      drawBird(bird.x, bird.y, bird.rot);
      ctx.globalAlpha = 1;
    }
  }
  // waiting — tap to play hint
  if (waiting) {
    const a = 0.55 + 0.45 * Math.sin(Date.now() * 0.006);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px "Barlow Condensed","Arial Narrow",sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 8;
    ctx.fillText('TAP TO PLAY', cw * 0.5, ch * 0.68);
    ctx.restore();
  }
}

function drawGround() {
  const gy = ch - GROUND_H;
  // base fill
  const gg = ctx.createLinearGradient(0, gy, 0, ch);
  gg.addColorStop(0, '#0e5c30');
  gg.addColorStop(0.3, '#0a4a26');
  gg.addColorStop(1, '#051e10');
  ctx.fillStyle = gg;
  ctx.fillRect(0, gy, cw, GROUND_H);
  // top edge highlight
  ctx.fillStyle = '#15a358';
  ctx.fillRect(0, gy, cw, 3);
  // scrolling stripe pattern
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  const stripeW = GROUND_H * 2;
  for (let x = (groundX % stripeW) - stripeW; x < cw + stripeW; x += stripeW) {
    ctx.beginPath();
    ctx.moveTo(x, gy + 3);
    ctx.lineTo(x + stripeW * 0.5, gy + 3);
    ctx.lineTo(x + stripeW * 0.5, ch);
    ctx.lineTo(x, ch);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCloud(x, y, w, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(190,225,255,1)';
  const r = w * 0.18;
  ctx.beginPath(); ctx.arc(x,           y,           r * 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 1.3, y + r * 0.2, r,       0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 1.1, y + r * 0.3, r * 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.5, r * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 2.3, y + r * 0.4, r * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawPipe(x, y, w, h, isBottom) {
  if (h <= 2) return;

  // body gradient (left-to-right shading)
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0,    '#0a5e3a');
  g.addColorStop(0.30, '#12834f');
  g.addColorStop(0.65, '#0a6840');
  g.addColorStop(1,    '#053a24');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);

  // cap
  const capH = 14;
  const capY = isBottom ? y : y + h - capH;
  ctx.fillStyle = '#15a358';
  ctx.fillRect(x - PIPE_CAP_OVR, capY, w + PIPE_CAP_OVR * 2, capH);

  // dark edge under cap
  ctx.fillStyle = '#053a24';
  const edgeY = isBottom ? capY : capY + capH - 2;
  ctx.fillRect(x - PIPE_CAP_OVR, edgeY, w + PIPE_CAP_OVR * 2, 2);

  // highlight strip
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fillRect(x + 3, y, 6, h);
}

function drawEnemy(x, y, special = false) {
  ctx.save();
  ctx.translate(x, y);

  const CR = CHUTE_R;        // 22 — dome radius
  const CO = CHUTE_OFFSET;   // 26 — dome centre above body centre
  const BR = ENEMY_R - 4;    // 10 — body radius

  // special: flash panels red↔yellow every 280ms
  const flash = special && Math.floor(Date.now() / 280) % 2 === 0;

  // STRINGS (dome rim → body top)
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  const rimPts = [[-CR * 0.85, -CO + CR * 0.05], [-CR * 0.35, -CO + CR * 0.6],
                  [ CR * 0.35, -CO + CR * 0.6],  [ CR * 0.85, -CO + CR * 0.05]];
  const bodyAnchor = [[-5, -BR], [-2, -BR], [2, -BR], [5, -BR]];
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(rimPts[i][0], rimPts[i][1]);
    ctx.lineTo(bodyAnchor[i][0], bodyAnchor[i][1]);
    ctx.stroke();
  }

  // PARACHUTE DOME — special flips red/yellow each frame pair
  ctx.save();
  ctx.translate(0, -CO);
  const panels = flash
    ? ['#ffcf3d', '#ff6b4a', '#ffcf3d', '#ff6b4a']   // swapped
    : ['#ff6b4a', '#ffcf3d', '#ff6b4a', '#ffcf3d'];   // normal
  for (let i = 0; i < 4; i++) {
    const a1 = Math.PI + (i / 4) * Math.PI;
    const a2 = Math.PI + ((i + 1) / 4) * Math.PI;
    ctx.fillStyle = panels[i];
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, CR, a1, a2);
    ctx.closePath();
    ctx.fill();
  }
  // rib lines
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const a = Math.PI + (i / 4) * Math.PI;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a)*CR, Math.sin(a)*CR); ctx.stroke();
  }
  // dome outline
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, CR, Math.PI, 0); ctx.closePath(); ctx.stroke();
  ctx.restore();

  // BODY — flashes yellow when dome is red, red when dome is yellow
  ctx.fillStyle = flash ? '#ffcf3d' : '#e84040';
  ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.arc(-1, -2, 3, 0, Math.PI * 2); ctx.fill();
  // dangling legs
  ctx.strokeStyle = flash ? '#cc9900' : '#cc2020';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-3, BR - 1); ctx.lineTo(-4, BR + 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 3, BR - 1); ctx.lineTo( 4, BR + 5); ctx.stroke();

  ctx.restore();
}

function drawBird(x, y, rotDeg) {
  const R = bird.r;  // dynamic radius — grows with each inflation
  const scale = R / BIRD_R;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotDeg * Math.PI / 180);
  ctx.scale(scale, scale);

  // BACKPACK (behind body — draw first)
  ctx.fillStyle = '#7B4A1E';
  ctx.fillRect(-BIRD_R - 5, -5, 8, 13);
  ctx.fillStyle = '#5C3310';
  ctx.fillRect(-BIRD_R - 3, 1, 4, 2);
  ctx.fillStyle = '#D4A017';
  ctx.fillRect(-BIRD_R - 2, 0, 2, 3);
  ctx.strokeStyle = 'rgba(92,51,16,0.55)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-BIRD_R, -3);
  ctx.quadraticCurveTo(0, -6, 4, -1);
  ctx.stroke();

  // BODY (colour tints warmer with each inflation)
  const bodyColA = birdInflate === 0 ? '#FFE566' : birdInflate === 1 ? '#FFB03A' : '#FF6622';
  const bodyColB = birdInflate === 0 ? '#F5A623' : birdInflate === 1 ? '#E05000' : '#CC1100';
  const bg = ctx.createRadialGradient(-2, -2, 1, 0, 0, BIRD_R + 2);
  bg.addColorStop(0, bodyColA);
  bg.addColorStop(1, bodyColB);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 1, BIRD_R + 1, BIRD_R, 0, 0, Math.PI * 2);
  ctx.fill();

  // inflation stress lines (appear from inflate 1+)
  if (birdInflate >= 1) {
    ctx.strokeStyle = `rgba(255,255,255,${birdInflate * 0.18})`;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (BIRD_R * 0.4), Math.sin(a) * (BIRD_R * 0.4));
      ctx.lineTo(Math.cos(a) * (BIRD_R * 0.85), Math.sin(a) * (BIRD_R * 0.85));
      ctx.stroke();
    }
  }

  // WING
  ctx.fillStyle = birdInflate === 0 ? '#E8980E' : '#C05000';
  ctx.beginPath();
  ctx.ellipse(-5, 3, 6, 3, -0.25, 0, Math.PI * 2);
  ctx.fill();

  // BELLY
  ctx.fillStyle = '#FFF8E0';
  ctx.beginPath();
  ctx.ellipse(3, 4, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // EYE white base
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5, -2, 5.5, 0, Math.PI * 2); ctx.fill();

  // GOGGLE FRAME
  ctx.strokeStyle = '#2E1800';
  ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.arc(5, -2, 5.5, 0, Math.PI * 2); ctx.stroke();

  // GOGGLE LENS
  ctx.fillStyle = 'rgba(155, 95, 0, 0.40)';
  ctx.beginPath(); ctx.arc(5, -2, 4.8, 0, Math.PI * 2); ctx.fill();

  // GOGGLE STRAP
  ctx.strokeStyle = '#2E1800';
  ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(2.5, -7);
  ctx.quadraticCurveTo(-1, -10, -BIRD_R, -3);
  ctx.stroke();

  // PUPIL
  ctx.fillStyle = '#0a0500';
  ctx.beginPath(); ctx.arc(6, -2, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5, -3.5, 1.2, 0, Math.PI * 2); ctx.fill();

  // BEAK — upper jaw
  ctx.fillStyle = '#F5A000';
  ctx.beginPath();
  ctx.moveTo(BIRD_R - 1, -2);
  ctx.lineTo(BIRD_R + 9, -1.5);
  ctx.lineTo(BIRD_R + 9,  1);
  ctx.lineTo(BIRD_R - 1,  0.5);
  ctx.closePath();
  ctx.fill();
  // BEAK — lower jaw
  ctx.fillStyle = '#C47800';
  ctx.beginPath();
  ctx.moveTo(BIRD_R - 1, 0.5);
  ctx.lineTo(BIRD_R + 9, 1);
  ctx.lineTo(BIRD_R + 9, 3);
  ctx.lineTo(BIRD_R - 1, 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(BIRD_R - 1, 0.5); ctx.lineTo(BIRD_R + 9, 0.8); ctx.stroke();

  ctx.restore();
}

// ─── inflate (hit but not dead yet) ──────────────────────────────────────────
function inflate() {
  if (birdInflate >= 2) { balloonPop(); return; }  // 3rd hit = pop death
  birdInflate++;
  bird.r = Math.round(BIRD_R * Math.pow(1.5, birdInflate));
  bird.vy = -5;
  inflateInvincible = Date.now() + 1000;  // 1s invincibility flash
  spawnParticles(bird.x, bird.y, '#ffffff', 8);
  spawnParticles(bird.x, bird.y, '#ffaa44', 6);
  const msgs = ['', '💨 INFLATED!', '💨 BLOATED!!'];
  floaters.push({ x: bird.x, y: bird.y - bird.r - 6, text: msgs[birdInflate], alpha: 1, vy: -1.8, color: '#ff9944' });
}

// ─── balloon pop death ───────────────────────────────────────────────────────
function balloonPop() {
  popping  = true;
  popRingR = 0;
  popRingX = bird.x;
  popRingY = bird.y;
  // big radial burst — mixed colours, faster particles so they spread wide
  const cols = ['#ff4400', '#ffcc00', '#ffffff', '#ff8800'];
  for (let i = 0; i < 40; i++) {
    const ang = (Math.PI * 2 * i) / 40 + rnd(-0.25, 0.25);
    const spd = rnd(4, 11);
    particles.push({ x: bird.x, y: bird.y,
                     vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2.5,
                     alpha: 1, r: rnd(4, 10), color: cols[i % cols.length] });
  }
  floaters.push({ x: bird.x, y: bird.y - 20, text: '💥 POP!', alpha: 1, vy: -2.5, color: '#ff4400' });
  setTimeout(() => die(), 950);
}

// ─── game over ─────────────────────────────────────────────────────────────────
function die() {
  if (dead) return;
  dead    = true;
  running = false;
  spawnParticles(bird.x, bird.y, ACCENT, 12);
  draw();

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('hs_flap-fight', bestScore);
  }

  if (score > 0) {
    ArcadeScores.show({
      game: GAME_ID, title: GAME_TITLE, score,
      accent: ACCENT,
      onClose: showOverlay,
    });
  } else {
    showOverlay();
  }
}

function showOverlay(finalScore) {
  const s = (typeof finalScore === 'number') ? finalScore : score;
  ovTitle.textContent = 'FLAP FIGHT';
  ovEmoji.textContent = s > 0 ? '💥🎈' : '🎈💨';
  ovsub.innerHTML = s > 0
    ? `You scored <b style="color:var(--ink)">${s}</b> points!`
    : `Tap to flap — gaps shrink every level.<br>
       Hit a pipe → bird <b>inflates</b> &amp; flashes (2 lives before pop!).<br>
       Stomp <b>down</b> on orange parachutes for <b>+25 pts</b>.<br>
       Rare <b>coloured DEFLATE parachutes</b> shrink you back — stomp them!`;
  const stored = parseInt(localStorage.getItem('hs_flap-fight') || '0', 10);
  const best = Math.max(bestScore || 0, stored, s);
  board.innerHTML = best > 0 ? `BEST <b style="color:var(--ink)">${best}</b>` : '';
  playBtn.textContent = s > 0 ? 'PLAY AGAIN' : 'INSERT COIN';
  ov.classList.remove('hidden');
}

// ─── main loop ─────────────────────────────────────────────────────────────────
function loop() {
  if (running) update();
  if (running || waiting) draw();
  animId = requestAnimationFrame(loop);
}

// ─── input ───────────────────────────────────────────────────────────────────
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (waiting) { startPlaying(); return; }
  if (running) flap();
}, { passive: false });

canvas.addEventListener('click', () => {
  if (waiting) { startPlaying(); return; }
  if (running) flap();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (waiting) { startPlaying(); return; }
    if (running) flap();
  }
});

canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

playBtn.addEventListener('click', () => {
  ov.classList.add('hidden');
  if (animId) cancelAnimationFrame(animId);
  initGame();   // enters waiting state — tap again to launch bird
  loop();
});

// Auto-start in waiting state on load
initGame();
loop();

// live resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (running) resize();
  }, 120);
});

function tryFullscreen() {
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (_) {}
}

// one-time touchend fullscreen fallback (iOS Safari)
document.addEventListener('touchend', function ff() {
  tryFullscreen();
  document.removeEventListener('touchend', ff);
}, { passive: true });
</script>
