<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LUPO ALBERTO</title>
<link rel="stylesheet" href="../cabinet.css">
<script src="../vendor/gsap.min.js"></script>
<script src="../arcade-scores.js?v=22"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100dvh;overflow:hidden;background:#000;touch-action:none;user-select:none}
canvas{position:fixed;top:0;left:0;display:block}
#rot{display:none;position:fixed;inset:0;background:#0a0a1a;z-index:99;
  flex-direction:column;align-items:center;justify-content:center;
  color:#7755AA;font-family:Bungee,sans-serif;gap:18px;text-align:center}
#rot span{font-size:58px;animation:sp 2s ease-in-out infinite alternate}
@keyframes sp{to{transform:rotate(90deg)}}
@media(orientation:portrait){#rot{display:flex}canvas{display:none}}
</style>
</head>
<body>
<div id="rot"><span>📱</span><p style="font-family:Bungee;font-size:18px">ROTATE PHONE</p></div>
<canvas id="c"></canvas>
<script>
'use strict';

// ── INTERNAL RESOLUTION (C64-scale) ─────────────────────────────────────────
// All game logic runs in IW×IH coordinate space.
// ctx.scale(W/IW, H/IH) makes it fill any screen. Sprites stay visible.
const IW=320, IH=200;
const GY=183;        // ground surface y (logical)
const WW=2300;       // 230 tiles × 10px (from MAP.01 actual level data)
const PW=22, PH=34;  // Lupo hitbox
const EW=26, EH=26;  // Mosè hitbox
const GRAVITY=0.40, JUMP=8.5, SPEED=2.4, TERM_VEL=12, FRICTION=0.70, DEADZONE=16;

const C={
  skyDk:'#85b2c2',skyLt:'#b6edff',skyAlt:'#acf0ff',
  earthDk:'#8d6e37',earthLt:'#bf9241',earthSh:'#3a1900',earthDt:'#5d451b',
  grassBr:'#9bda84',grassDk:'#71a46d',grassXd:'#3a6e2a',
  treeBr:'#71a46d',treeXd:'#3a6e2a',trunk:'#5d451b',
  cloudSt:'rgba(26,10,0,0.82)',
  lupo:'#7755aa',lupoDk:'#442288',lupoLt:'#9977cc',
  moseMain:'#d4a818',moseDk:'#9c7510',moseLt:'#e8c858',
  heartC:'#ff2244',hudBg:'rgba(0,0,0,0.62)',
};

// ── PLATFORM DEFINITIONS — derived from MAP.01 (Amiga WHDLoad version) ──────
// MAP.01 level structure: 230×46 tiles. Key terrain:
//   Ground: cols 1-114 (ends before tower)
//   Left tower: 2 steps up, then bridge spans the central gap
//   Right section: large platform + upper ledge
// Platforms are kept non-overlapping for clean rendering.
// 'earth' type uses fixed 50px stub height so grass tops always visible.
const PD=[
  [10,  GY,  890,'ground',0,   0  ],  // ground floor (ends at x=900)
  [900, 135,  140,'earth', 0,   0  ],  // left step (rows 23)
  [1040,  70,  600,'earth',0,   0  ],  // bridge top (rows 1, spans gap)
  [1500, 100,  200,'earth',0,   0  ],  // right upper (rows 11)
  [1500, 140,  720,'earth',0,   0  ],  // right big platform (rows 23) ← MARTA
];

function platH(d){
  if(d[3]==='ground') return IH-GY+10;
  if(d[3]==='float')  return 12;
  return 50;  // fixed stub — grass top always visible, no merging with ground
}

let PLATS=[],HEARTS=[],POPS=[];

function buildLevel(){
  PLATS=PD.map(d=>({
    x:d[0],y:d[1],w:d[2],h:platH(d),type:d[3],
    mv:d[4]>0,mvRange:d[4],mvSpeed:d[5],baseX:d[0],phase:0,
  }));
  HEARTS=[
    {x:200, y:GY-16,  got:false,idx:0},  // ground 1
    {x:520, y:GY-16,  got:false,idx:0},  // ground 2
    {x:760, y:GY-16,  got:false,idx:0},  // ground 3
    {x:950, y:135-16, got:false,idx:1},  // left step
    {x:1180,y:70-16,  got:false,idx:2},  // bridge left
    {x:1430,y:70-16,  got:false,idx:2},  // bridge right
    {x:1580,y:100-16, got:false,idx:3},  // right upper
    {x:1680,y:140-16, got:false,idx:4},  // right big 1
    {x:1920,y:140-16, got:false,idx:4},  // right big 2
  ];
  POPS=[];
  resetPlayer();resetMose();
  cam.x=0;
}

// ── ENTITIES ────────────────────────────────────────────────────────────────
const p={x:0,y:0,vx:0,vy:0,grounded:false,prevY:0,facing:1,walk:0,inv:0};
const ms={x:0,y:0,vx:0,vy:0,grounded:false,prevY:0,facing:1,walk:0,state:'normal',stunTimer:0};
// ms.state: 'normal'|'stunned'|'dead'

let score=0,lives=3,level=1,timer=90,timerMs=0;
let state='ATTRACT',deathTimer=0,clearTimer=0,attractTick=0,gts=0;
let W=1,H=1,scaleX=1,scaleY=1;
const cam={x:0};

function resetPlayer(){p.x=60;p.y=GY-PH;p.vx=0;p.vy=0;p.grounded=true;p.facing=1;p.walk=0;p.inv=140;}
function resetMose(){
  // Spawn ahead of player but not too far, always on ground
  ms.x=Math.min(WW-EW-20, Math.max(p.x+IW*0.8, 300));
  ms.y=GY-EH;ms.vx=0;ms.vy=0;ms.grounded=true;ms.facing=-1;ms.walk=0;
  ms.state='normal';ms.stunTimer=0;
}
const martaPl=()=>PLATS[4];  // right big platform — Marta waits at far right
const nHeart=()=>HEARTS.filter(h=>!h.got).length;

// ── PHYSICS ─────────────────────────────────────────────────────────────────
function moveEnt(e,ew,eh){
  e.vy=Math.min(e.vy+GRAVITY,TERM_VEL);
  e.prevY=e.y;
  e.x+=e.vx;e.y+=e.vy;
  e.x=Math.max(0,Math.min(WW-ew,e.x));
  if(e.y>IH+100){e.y=GY-eh;e.vy=0;e.grounded=true;}
  e.grounded=false;
  for(const pl of PLATS){
    const lx=pl.x,rx=pl.x+pl.w;
    if(e.x+ew<=lx+2||e.x+2>=rx) continue;
    if(e.prevY+eh<=pl.y+2&&e.y+eh>=pl.y){
      e.y=pl.y-eh;e.vy=0;e.grounded=true;
    }
  }
}

// ── INPUT ───────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const js={active:false,id:-1,dx:0,_bx:0};
const jb={active:false,id:-1,pressed:false};

// Convert screen coords to IW×IH logical coords
function lx(screenX){return(screenX-canvas.getBoundingClientRect().left)*IW/W;}
function zoneOf(sx){const x=lx(sx);return x<IW*0.48?'L':x>IW*0.52?'R':'C';}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(state==='ATTRACT'){startGame();return;}
    if(state==='GAMEOVER'){endGame();return;}
    const z=zoneOf(t.clientX);
    if(z==='L'&&!js.active){js.active=true;js.id=t.identifier;js.dx=0;js._bx=lx(t.clientX);}
    else if(z==='R'&&!jb.active){jb.active=true;jb.id=t.identifier;if(p.grounded)jb.pressed=true;}
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)if(js.active&&t.identifier===js.id)js.dx=lx(t.clientX)-js._bx;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(js.active&&t.identifier===js.id){js.active=false;js.dx=0;}
    if(jb.active&&t.identifier===jb.id)jb.active=false;
  }
},{passive:false});
canvas.addEventListener('touchcancel',()=>{js.active=false;js.dx=0;jb.active=false;},{passive:false});
window.addEventListener('keydown',e=>{
  if(state==='ATTRACT'){startGame();return;}
  if(state==='GAMEOVER'){endGame();return;}
  if(e.key==='ArrowLeft'||e.key==='a'){js.active=true;js.dx=-60;}
  if(e.key==='ArrowRight'||e.key==='d'){js.active=true;js.dx=60;}
  if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&p.grounded)jb.pressed=true;
  e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d'){js.active=false;js.dx=0;}
});

// ── UPDATE ──────────────────────────────────────────────────────────────────
function update(dt){
  // Player input
  const L=js.active&&js.dx<-DEADZONE,R=js.active&&js.dx>DEADZONE;
  if(L&&!R){p.vx=-SPEED;p.facing=-1;}
  else if(R&&!L){p.vx=SPEED;p.facing=1;}
  else p.vx*=FRICTION;
  if(jb.pressed&&p.grounded){p.vy=-JUMP;p.grounded=false;}
  jb.pressed=false;
  if(Math.abs(p.vx)>0.4)p.walk++;
  if(p.inv>0)p.inv--;

  // Moving platforms
  for(const pl of PLATS){
    if(!pl.mv) continue;
    pl.phase=(pl.phase+pl.mvSpeed)%(pl.mvRange*2);
    pl.x=pl.baseX+(pl.phase<pl.mvRange?pl.phase:pl.mvRange*2-pl.phase);
  }

  moveEnt(p,PW,PH);

  // Mosè AI
  if(ms.state!=='dead'){
    if(ms.state==='stunned'){
      ms.vx*=0.7; // slide to stop while stunned
      ms.walk++;
    } else {
      const MSPD=1.3+(level-1)*0.2;
      const mdx=p.x-ms.x;
      if(mdx>6){ms.vx=Math.min(ms.vx+0.28,MSPD);ms.facing=1;}
      else if(mdx<-6){ms.vx=Math.max(ms.vx-0.28,-MSPD);ms.facing=-1;}
      else ms.vx*=0.80;
      ms.walk++;
      // Jump to reach player on higher platforms
      if(ms.grounded&&p.y<ms.y-40&&Math.abs(mdx)<300&&Math.random()<0.025){ms.vy=-JUMP*0.90;ms.grounded=false;}
      if(ms.grounded&&Math.abs(ms.vx)<0.3&&Math.abs(mdx)>60&&Math.random()<0.02){ms.vy=-JUMP*0.75;ms.grounded=false;}
    }
    moveEnt(ms,EW,EH);
  }

  // Stomp check — player landing on top of Mosè
  if(p.vy>0&&ms.state!=='dead'){
    const hOv=p.x+PW>ms.x+4&&p.x+4<ms.x+EW;
    if(hOv&&p.prevY+PH<=ms.y+6&&p.y+PH>=ms.y){
      p.vy=-JUMP*0.68;p.grounded=false;  // bounce player up
      if(ms.state==='normal'){
        ms.state='stunned';ms.stunTimer=160;
        score+=50;pop(ms.x+EW/2,ms.y,'#ffee00');
      } else if(ms.state==='stunned'){
        ms.state='dead';ms.stunTimer=70;
        score+=300;pop(ms.x+EW/2,ms.y,'#ff6600');
        pop(ms.x+EW/2,ms.y+EH/2,'#ffcc00');
      }
    }
  }

  // Mosè hurts player (normal/stunned can't hurt while stunned)
  if(p.inv<=0&&ms.state==='normal'){
    if(Math.abs(p.x+PW/2-(ms.x+EW/2))<(PW+EW)/2-6&&
       Math.abs(p.y+PH/2-(ms.y+EH/2))<(PH+EH)/2-6)
      killPlayer();
  }

  // Collect hearts
  for(const h of HEARTS){
    if(h.got) continue;
    if(Math.abs(p.x+PW/2-(h.x+7))<20&&Math.abs(p.y+PH/2-(h.y+7))<20){
      h.got=true;score+=100;pop(h.x+7,h.y,'#ff3355');
    }
  }

  timerMs+=dt;timer=Math.max(0,90-Math.floor(timerMs/1000));
  if(timer<=0)killPlayer();

  // Win condition
  if(nHeart()===0){
    const mp=martaPl();
    if(p.x+PW>mp.x&&p.x<mp.x+mp.w&&p.prevY+PH<=mp.y+2&&p.y+PH>=mp.y){
      state='CLEAR';clearTimer=200;score+=500+timer*10+lives*100;
      pop(p.x+PW/2,p.y,'#ffffaa');
    }
  }

  // Camera
  cam.x+=(Math.max(0,Math.min(WW-IW,p.x-IW*0.38))-cam.x)*0.13;

  // Pops
  for(let i=POPS.length-1;i>=0;i--){
    const pt=POPS[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.10;pt.life-=0.035;
    if(pt.life<=0)POPS.splice(i,1);
  }
}

function killPlayer(){
  lives--;pop(p.x+PW/2,p.y+PH/2,'#ff8800');
  if(lives<=0){state='GAMEOVER';return;}
  state='DEAD';deathTimer=90;timer=90;timerMs=0;
}
function pop(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,s=1.2+Math.random()*3;
    POPS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.8,life:1,color});
  }
}

function tickStates(){
  if(ms.state==='stunned'){if(--ms.stunTimer<=0)ms.state='normal';}
  if(ms.state==='dead'){if(--ms.stunTimer<=0)resetMose();}
  if(state==='DEAD'){if(--deathTimer<=0){resetPlayer();resetMose();state='PLAYING';timerMs=0;}}
  if(state==='CLEAR'){if(--clearTimer<=0){level++;buildLevel();state='PLAYING';timerMs=0;}}
  if(state==='ATTRACT'||state==='GAMEOVER')attractTick++;
}

function attractUpdate(){
  attractTick++;
  p.vx=1.4;p.facing=1;p.walk++;
  p.vy=Math.min(p.vy+GRAVITY,TERM_VEL);
  p.prevY=p.y;p.y+=p.vy;p.x+=p.vx;
  p.grounded=false;
  for(const pl of PLATS){
    if(p.x+PW>pl.x&&p.x<pl.x+pl.w&&p.prevY+PH<=pl.y+2&&p.y+PH>=pl.y){
      p.y=pl.y-PH;p.vy=0;p.grounded=true;
    }
  }
  if(p.grounded&&Math.random()<0.020){p.vy=-JUMP*0.80;p.grounded=false;}
  if(p.x>WW){p.x=0;p.y=GY-PH;p.vy=0;}
  cam.x+=(Math.max(0,p.x-IW*0.38)-cam.x)*0.09;
  ms.x+=0.7;ms.walk++;if(ms.x>WW)ms.x=0;
}

// ── DRAWING ─────────────────────────────────────────────────────────────────
// ALL drawing calls below are in IW×IH logical space.
// ctx.scale(scaleX,scaleY) is applied in draw() so everything scales to screen.

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.scale(scaleX,scaleY);  // ← all game content in IW×IH space

  drawBg();
  ctx.save();
  ctx.translate(-Math.round(cam.x),0);
  drawPlatforms();
  drawHearts();
  drawMarta();
  if(ms.state!=='dead') drawMose();
  drawLupo();
  ctx.globalAlpha=1;
  for(const pt of POPS){
    ctx.globalAlpha=pt.life;ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,3*pt.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.restore(); // remove game scale

  // HUD drawn in screen coords (crisp at any resolution)
  drawHUD();
  drawControls();
  drawOverlays();
}

function drawBg(){
  ctx.fillStyle=C.skyDk;ctx.fillRect(0,0,IW,IH);
  ctx.fillStyle=C.skyLt;
  for(let y=1;y<IH;y+=4)ctx.fillRect(0,y,IW,1);
  ctx.fillStyle=C.skyAlt;
  for(let y=3;y<IH;y+=4)ctx.fillRect(0,y,IW,1);
  // Bush silhouettes at horizon (parallax)
  const bsy=IH*0.90,to=(cam.x*0.30)%160;
  for(let tx=-to-60;tx<IW+60;tx+=160) drawBush(tx,bsy);
  // Outline clouds
  ctx.strokeStyle=C.cloudSt;ctx.lineWidth=1.2;
  const co=(cam.x*0.08)%(IW*1.6);
  [IW*0.14,IW*0.44,IW*0.72,IW*1.08].forEach((cx,i)=>{
    const ox=(cx-co+IW*1.8)%(IW*1.8);
    drawCloudOutline(ox,IH*0.12+(i%2)*IH*0.07);
  });
}

function drawBush(x,y){
  const r=IH*0.038;
  ctx.fillStyle=C.treeBr;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*1.05,y-r*0.22,r*0.80,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x-r*0.82,y-r*0.10,r*0.72,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.treeXd;
  ctx.beginPath();ctx.arc(x+2,y+r*0.28,r*0.52,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.trunk;ctx.fillRect(x-2,y+r*0.72,4,IH*0.022);
}

function drawCloudOutline(x,y){
  const r=IH*0.044;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.arc(x+r*1.18,y-r*0.26,r*0.74,0,Math.PI*2);
  ctx.arc(x-r*0.88,y+r*0.12,r*0.66,0,Math.PI*2);
  ctx.stroke();
}

function drawPlatforms(){
  for(const pl of PLATS) drawEarthBlock(pl.x,pl.y,pl.w,pl.h,pl.type==='ground',pl.type==='float');
}

function drawEarthBlock(x,y,w,h,isGround,isFloat){
  if(isFloat){
    // Thin floating platform — grass top, small earth block below
    ctx.fillStyle=C.grassBr;ctx.fillRect(x,y,w,3);
    ctx.fillStyle=C.grassDk;ctx.fillRect(x,y+2,w,2);
    ctx.fillStyle=C.grassXd;ctx.fillRect(x,y+4,w,3);
    ctx.fillStyle=C.earthLt;ctx.fillRect(x,y+7,w,h-7);
    ctx.fillStyle=C.earthSh;ctx.fillRect(x,y+h-1,w,1);
    return;
  }
  const gS=4,gE=3;
  for(let row=0;row<h&&row<300;row++){
    if(row<gS) ctx.fillStyle=(row%2===0)?C.grassBr:C.grassDk;
    else if(row<gS+gE) ctx.fillStyle=C.grassXd;
    else ctx.fillStyle=(row%2===0)?C.earthLt:C.earthDk;
    ctx.fillRect(x,y+row,w,1);
  }
  ctx.fillStyle=C.earthDt;
  for(let row=gS+gE;row<h&&row<300;row+=2){
    for(let col=4;col<w-3;col+=6){
      const jit=((row*7+col*13)%7)-3;
      ctx.fillRect(x+col+jit,y+row,1,1);
    }
  }
  if(h>60&&!isGround){
    ctx.fillStyle=C.earthSh;
    const f0=y+h*0.30,f1=y+h*0.55;
    for(let dx=x+22;dx<x+w-10;dx+=42){
      ctx.beginPath();ctx.ellipse(dx,f0,6,3.5,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(dx+5,f1,6,3.5,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.fillStyle=C.earthSh;ctx.fillRect(x,y+h-1,w,1);
}

function drawHearts(){
  for(const h of HEARTS){
    if(h.got)continue;
    const s=7,x=h.x,y=h.y;
    const pulse=1+0.08*Math.sin(attractTick*0.14+h.idx);
    ctx.save();ctx.translate(x+s,y+s);ctx.scale(pulse,pulse);
    ctx.fillStyle=C.heartC;
    ctx.beginPath();
    ctx.moveTo(0,s*0.35);
    ctx.bezierCurveTo(0,0,s*0.85,0,s*0.85,s*0.45);
    ctx.bezierCurveTo(s*0.85,s*0.95,0,s*1.2,0,s*1.55);
    ctx.bezierCurveTo(0,s*1.2,-s*0.85,s*0.95,-s*0.85,s*0.45);
    ctx.bezierCurveTo(-s*0.85,0,0,0,0,s*0.35);
    ctx.fill();
    ctx.restore();
  }
}

function drawMarta(){
  const mp=martaPl();
  const gx=mp.x+mp.w-36,gy=mp.y-36;
  const unlocked=nHeart()===0;
  ctx.save();ctx.translate(gx,gy);ctx.globalAlpha=unlocked?1:0.35;
  ctx.fillStyle=C.moseLt;
  ctx.beginPath();ctx.ellipse(14,22,10,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.moseMain;
  ctx.beginPath();ctx.ellipse(6,22,5,9,-0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.moseLt;
  ctx.beginPath();ctx.arc(20,9,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#cc2020';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(16+i*3,2,3-i*0.2,Math.PI,0);ctx.fill();}
  ctx.fillStyle='#e07010';
  ctx.beginPath();ctx.moveTo(27,8);ctx.lineTo(34,11);ctx.lineTo(27,13);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(22,7,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.moseDk;
  ctx.fillRect(9,33,4,5);ctx.fillRect(16,33,4,5);
  ctx.fillRect(7,37,7,2);ctx.fillRect(14,37,7,2);
  if(unlocked){
    const py=2+2*Math.abs(Math.sin(attractTick*0.09));
    ctx.fillStyle='#ffe844';ctx.font='bold 7px Bungee,sans-serif';
    ctx.textAlign='center';ctx.fillText('MARTA!',14,-10-py);ctx.textAlign='left';
  }
  ctx.globalAlpha=1;ctx.restore();
}

// LUPO ALBERTO — big round head, two round ear-blobs (matched to C64 sprite crops)
function drawLupo(){
  if(state==='DEAD'&&deathTimer%8<4)return;
  if(p.inv>0&&p.inv%6<3)return;
  const fl=p.facing<0,fr=Math.floor(p.walk/5)%4;
  ctx.save();
  ctx.translate(p.x+(fl?PW:0),p.y);
  if(fl)ctx.scale(-1,1);

  // Tail
  ctx.fillStyle=C.lupo;
  ctx.beginPath();
  ctx.moveTo(PW*0.12,PH*0.52);
  ctx.quadraticCurveTo(-6,PH*0.24,-3,PH*0.05);
  ctx.quadraticCurveTo(0,-1,PW*0.08,PH*0.10);
  ctx.quadraticCurveTo(-3,PH*0.22,PW*0.10,PH*0.48);
  ctx.closePath();ctx.fill();

  // Legs (alternating walk)
  const la=fr<2?2:0,lb=fr<2?0:2;
  ctx.fillStyle=C.lupoDk;
  ctx.fillRect(PW*0.18,PH*0.63+la,4,PH*0.37-la);
  ctx.fillRect(PW*0.56,PH*0.63+lb,4,PH*0.37-lb);
  ctx.fillRect(PW*0.12,PH-2,7,2);
  ctx.fillRect(PW*0.51,PH-2,7,2);

  // Body
  ctx.fillStyle=C.lupo;
  ctx.beginPath();ctx.ellipse(PW*0.44,PH*0.73,PW*0.28,PH*0.11,-0.1,0,Math.PI*2);ctx.fill();
  ctx.fillRect(PW*0.33,PH*0.53,PW*0.26,PH*0.16);

  // Head (dominant — ~45% of height)
  const hx=PW*0.50,hy=PH*0.29,hr=PW*0.38;
  ctx.fillStyle=C.lupo;
  ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();

  // Snout
  ctx.fillStyle=C.lupoLt;
  ctx.beginPath();ctx.ellipse(hx+hr*0.60,hy+hr*0.10,hr*0.46,hr*0.26,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#221144';
  ctx.beginPath();ctx.ellipse(hx+hr*0.98,hy+hr*0.06,2.2,1.5,0,0,Math.PI*2);ctx.fill();

  // Eye
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(hx+hr*0.10,hy-hr*0.22,3.5,2.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#110022';
  ctx.beginPath();ctx.arc(hx+hr*0.14,hy-hr*0.22,1.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(hx+hr*0.14,hy-hr*0.30,1.2,1.2);

  // Round ear-blobs (matched to actual C64 sprite — NOT pointy)
  ctx.fillStyle=C.lupoDk;
  ctx.beginPath();ctx.arc(hx-hr*0.38,hy-hr*0.76,hr*0.32,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+hr*0.28,hy-hr*0.84,hr*0.30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9966bb';
  ctx.beginPath();ctx.arc(hx-hr*0.36,hy-hr*0.73,hr*0.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+hr*0.29,hy-hr*0.81,hr*0.14,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// MOSÈ — guard dog. Chunky body, dark cap top (matched to C64 screenshot crops).
// When stunned: drawn crouched with star above.
function drawMose(){
  const fl=ms.facing<0,fr=Math.floor(ms.walk/5)%4;
  const stunned=ms.state==='stunned';
  // Flicker while stunned
  if(stunned&&ms.stunTimer%6<3)return;

  ctx.save();
  ctx.translate(ms.x+(fl?EW:0),ms.y+(stunned?EH*0.25:0));
  if(fl)ctx.scale(-1,1);
  const sy=stunned?0.65:1; // squash when stunned
  ctx.scale(1,sy);

  // Legs
  const la=fr<2?2:0,lb=fr<2?0:2;
  ctx.fillStyle=C.moseDk;
  if(!stunned){
    ctx.fillRect(EW*0.20,EH*0.60+la,5,EH*0.40-la);
    ctx.fillRect(EW*0.60,EH*0.60+lb,5,EH*0.40-lb);
    ctx.fillRect(EW*0.14,EH-2,8,2);
    ctx.fillRect(EW*0.56,EH-2,8,2);
  } else {
    // Crouched legs
    ctx.fillRect(EW*0.15,EH*0.72,8,EH*0.28);
    ctx.fillRect(EW*0.57,EH*0.72,8,EH*0.28);
    ctx.fillRect(EW*0.10,EH-2,10,2);
    ctx.fillRect(EW*0.53,EH-2,10,2);
  }

  // Tail
  ctx.fillStyle=C.moseMain;
  ctx.beginPath();
  ctx.moveTo(EW*0.08,EH*0.50);
  ctx.quadraticCurveTo(-7,EH*0.26,-5,EH*0.10);
  ctx.quadraticCurveTo(-1,EH*0.04,EW*0.06,EH*0.14);
  ctx.quadraticCurveTo(-3,EH*0.26,EW*0.08,EH*0.46);
  ctx.closePath();ctx.fill();

  // Body (chunky rectangle)
  ctx.fillStyle=C.moseMain;
  rR(ctx,EW*0.10,EH*0.38,EW*0.82,EH*0.34,3);ctx.fill();
  ctx.fillStyle=C.moseLt;
  ctx.beginPath();ctx.ellipse(EW*0.50,EH*0.55,EW*0.24,EH*0.10,0,0,Math.PI*2);ctx.fill();

  // Head
  const hx=EW*0.54,hy=EH*0.22,hr=EW*0.32;
  ctx.fillStyle=C.moseMain;
  ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();
  // Dark cap top (distinctive feature from screenshots)
  ctx.fillStyle=C.moseDk;
  ctx.beginPath();ctx.ellipse(hx,hy-hr*0.28,hr*0.82,hr*0.52,0,Math.PI,0);ctx.fill();

  // Muzzle
  ctx.fillStyle=C.moseLt;
  ctx.beginPath();ctx.ellipse(hx+hr*0.62,hy+hr*0.12,hr*0.48,hr*0.30,0.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#221100';
  ctx.beginPath();ctx.ellipse(hx+hr*1.02,hy+hr*0.08,3.5,2.2,0,0,Math.PI*2);ctx.fill();

  // Eye
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(hx-hr*0.06,hy-hr*0.18,4,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0000';
  ctx.beginPath();ctx.arc(hx-hr*0.04,hy-hr*0.18,2,0,Math.PI*2);ctx.fill();
  if(!stunned){
    ctx.strokeStyle=C.moseDk;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(hx-hr*0.28,hy-hr*0.36);ctx.lineTo(hx+hr*0.12,hy-hr*0.26);ctx.stroke();
  } else {
    // Swirly eyes when stunned
    ctx.strokeStyle='#442200';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(hx-hr*0.06,hy-hr*0.18,4,0,Math.PI*1.5);ctx.stroke();
  }

  // Floppy ear
  ctx.fillStyle=C.moseDk;
  ctx.beginPath();ctx.ellipse(hx-hr*0.60,hy+hr*0.28,hr*0.18,hr*0.40,0.2,0,Math.PI*2);ctx.fill();

  ctx.restore();

  // Stun stars (drawn unscaled above character)
  if(stunned&&ms.stunTimer>20){
    const sx=ms.x+EW/2,sy=ms.y-8;
    for(let i=0;i<3;i++){
      const a=(attractTick*0.12+i*Math.PI*0.67);
      const sx2=sx+Math.cos(a)*9,sy2=sy+Math.sin(a)*4;
      ctx.fillStyle='#ffee00';
      ctx.beginPath();ctx.arc(sx2,sy2,2.5,0,Math.PI*2);ctx.fill();
    }
  }
}

function rR(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

// ── HUD — drawn in SCREEN coordinates (outside scale transform) ─────────────
function drawHUD(){
  ctx.fillStyle=C.hudBg;ctx.fillRect(0,0,W,Math.round(H*0.09));
  const hh=Math.round(H*0.065);
  // Lives
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?C.heartC:'rgba(255,50,80,0.2)';
    sHeart(8+i*Math.round(W*0.032),Math.round(H*0.012),Math.round(H*0.025));
  }
  // Score
  ctx.fillStyle=C.moseMain;
  ctx.font=`bold ${hh}px Bungee,sans-serif`;
  ctx.textAlign='center';ctx.fillText(String(score).padStart(6,'0'),W/2,hh+2);
  // Timer
  const tc=timer<=15?(Math.floor(gts/250)%2?'#ff4444':'#ffaa00'):'#ffffffdd';
  ctx.fillStyle=tc;ctx.font=`bold ${Math.round(hh*0.82)}px Bungee,sans-serif`;
  ctx.textAlign='right';ctx.fillText('⏱ '+timer,W-8,hh);
  // Hearts left
  const hl=nHeart();
  ctx.fillStyle=hl>0?'#ffaacc':'#aaffaa';
  ctx.font=`${Math.round(hh*0.72)}px Bungee,sans-serif`;
  ctx.textAlign='left';ctx.fillText(hl>0?'♥×'+hl:'→ MARTA!',W/2+W*0.06,hh);
  // Level
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.font=`${Math.round(hh*0.66)}px Bungee,sans-serif`;
  ctx.textAlign='left';ctx.fillText('LV'+level,W/2-W*0.08,hh);
  // Stomp hint (show briefly at start)
  if(timer>80&&state==='PLAYING'){
    ctx.fillStyle='rgba(255,220,100,0.75)';
    ctx.font=`${Math.round(hh*0.56)}px Bungee,sans-serif`;
    ctx.textAlign='center';ctx.fillText('STOMP MOSÈ TWICE!',W/2,H*0.14);
  }
  minimap();ctx.textAlign='left';
}
function sHeart(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x+s,y+s*0.35);
  ctx.bezierCurveTo(x+s,y,x+s*1.85,y,x+s*1.85,y+s*0.45);
  ctx.bezierCurveTo(x+s*1.85,y+s,x+s,y+s*1.3,x+s,y+s*1.6);
  ctx.bezierCurveTo(x+s,y+s*1.3,x+s*0.15,y+s,x+s*0.15,y+s*0.45);
  ctx.bezierCurveTo(x+s*0.15,y,x+s,y,x+s,y+s*0.35);ctx.fill();
}
function minimap(){
  const mw=Math.round(W*0.07),mh=Math.round(H*0.022);
  const mx=W-mw-Math.round(W*0.10),my=Math.round(H*0.018);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle=C.moseMain;ctx.fillRect(mx+Math.floor(p.x/WW*mw)-1,my,2,mh);
  if(ms.state!=='dead'){
    ctx.fillStyle=ms.state==='stunned'?'#ffee00':'#ff4444';
    ctx.fillRect(mx+Math.floor(ms.x/WW*mw)-1,my,2,mh);
  }
  const mp=martaPl();
  ctx.fillStyle='#fff';ctx.fillRect(mx+Math.floor(mp.x/WW*mw),my,2,mh);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
}

function drawControls(){
  if(state!=='PLAYING'&&state!=='DEAD')return;
  ctx.save();
  const jcx=W*0.12,jcy=H*0.82,jr=Math.round(H*0.09);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.arc(jcx,jcy,jr,0,Math.PI*2);ctx.fill();
  const kx=jcx+Math.max(-jr*0.68,Math.min(jr*0.68,js.dx*(W/IW)));
  ctx.fillStyle=js.active?'rgba(119,85,170,0.75)':'rgba(119,85,170,0.28)';
  ctx.beginPath();ctx.arc(kx,jcy,jr*0.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`bold ${Math.round(H*0.03)}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('◀',jcx-jr*0.70,jcy);ctx.fillText('▶',jcx+jr*0.70,jcy);
  const jbr=Math.round(H*0.09);
  ctx.fillStyle=jb.active?'rgba(255,255,255,0.45)':'rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.arc(W*0.88,H*0.82,jbr,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=jb.active?'#ffe844':'rgba(212,168,24,0.65)';
  ctx.font=`bold ${Math.round(H*0.026)}px Bungee,sans-serif`;
  ctx.fillText('JUMP',W*0.88,H*0.82);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.restore();
}

// ── OVERLAYS ─────────────────────────────────────────────────────────────────
function drawOverlays(){
  if(state==='ATTRACT')drawAttract();
  if(state==='DEAD')drawDead();
  if(state==='CLEAR')drawClear();
  if(state==='GAMEOVER')drawGO();
}
function pnl(x,y,w,h){
  ctx.fillStyle='rgba(0,0,0,0.76)';
  ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();
}
function bT(t,y,col,sz){
  ctx.fillStyle=col;ctx.textAlign='center';
  ctx.font=`bold ${sz||Math.floor(H*0.070)}px Bungee,sans-serif`;
  ctx.fillText(t,W/2,y);
}
function sT(t,y,col){
  ctx.fillStyle=col||'#ffffffcc';ctx.textAlign='center';
  ctx.font=`${Math.floor(H*0.036)}px Bungee,sans-serif`;
  ctx.fillText(t,W/2,y);
}
function drawAttract(){
  pnl(W*.12,H*.18,W*.76,H*.62);
  bT('LUPO ALBERTO',H*.32,C.moseMain);
  sT('Collect all ♥ hearts · reach MARTA',H*.42,'#ffcccc');
  sT('Avoid MOSÈ the guard dog!',H*.49,'#ff9999');
  sT('STOMP him twice to defeat him',H*.55,'#ffdd88');
  sT('← joystick left · JUMP right →',H*.63,'rgba(255,255,200,0.65)');
  if(Math.floor(attractTick/28)%2)bT('TAP TO PLAY',H*.73,'#ffffaa',Math.floor(H*.052));
  ctx.textAlign='left';
}
function drawDead(){
  pnl(W*.27,H*.35,W*.46,H*.25);
  bT('WOOF!',H*.47,'#ff4444',Math.floor(H*.060));
  sT('Mosè got you!  ♥×'+lives,H*.56,'#ffaaaa');
}
function drawClear(){
  pnl(W*.20,H*.30,W*.60,H*.30);
  bT('CIAO MARTA!',H*.45,'#aaffaa',Math.floor(H*.058));
  sT('Level '+level+'  Score: '+score,H*.54,'#ffffaa');
}
function drawGO(){
  pnl(W*.22,H*.26,W*.56,H*.44);
  bT('GAME OVER',H*.41,'#ff4444');
  sT('Score: '+score,H*.51);
  if(Math.floor(attractTick/28)%2)bT('TAP TO CONTINUE',H*.62,C.moseMain,Math.floor(H*.042));
  ctx.textAlign='left';
}

function startGame(){
  score=0;lives=3;level=1;timer=90;timerMs=0;attractTick=0;POPS=[];
  buildLevel();state='PLAYING';
  canvas.requestFullscreen?.().catch(()=>{});
}
function endGame(){
  try{
    if(score>0)ArcadeScores.show('lupo-alberto',score,()=>{state='ATTRACT';buildLevel();});
    else{state='ATTRACT';buildLevel();}
  }catch(e){state='ATTRACT';buildLevel();}
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  scaleX=W/IW;scaleY=H/IH;
}

let lastTs=0;
function loop(ts){
  gts=ts;requestAnimationFrame(loop);
  const dt=ts-lastTs;if(dt<14)return;lastTs=ts;
  if(state==='ATTRACT'||state==='GAMEOVER')attractUpdate();
  else if(state==='PLAYING')update(dt);
  tickStates();draw();
}

window.addEventListener('resize',resize);
resize();buildLevel();requestAnimationFrame(loop);
</script>
