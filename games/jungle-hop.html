<script>
'use strict';

const IW=320, IH=200;
const GY=183;       // ground y in logical space
const WW=2400;      // world width
const PW=20, PH=30; // player hitbox
const EW=22, EH=22; // alien hitbox

// Physics — tuned for double-jump feel
const GRAVITY=0.42, TERM_VEL=12, DEADZONE=16;
const JUMP=9.2;         // ground jump impulse
const JUMP2=7.8;        // double jump (slightly weaker)
const SPEED_MAX=3.2;    // max run speed
const ACC=0.48;         // acceleration (JRK-style smooth run)
const FRICTION=0.70;    // decel factor
const COYOTE=8;         // coyote time frames (TWT pattern — grace after leaving edge)

const C={
  sky1:'#0d1a08',sky2:'#1a3010',sky3:'#254018',
  gnd:'#3d2008',gndEdge:'#66bb22',gndGrid:'rgba(80,140,30,0.35)',
  earth:'#2a1405',earthEdge:'#88aa44',
  semi:'rgba(80,60,20,0.40)',semiEdge:'#aacc44',
  mv:'#1e0e04',mvEdge:'#dd8833',mvGlow:'rgba(221,136,51,0.45)',
  plyr1:'#cc8833',plyr2:'#885522',visor:'#ffee88',visorDk:'#aa6610',
  jet:'#443311',jetFire:'#ffaa22',
  alien:'#228844',alienDk:'#114422',alienEye:'#ffff44',
  star:'#ffdd22',starGlow:'#ffbb00',
  rocket1:'#8b6914',rocket2:'#ccaa22',rocketFlame:'#ff9900',
  hud:'rgba(8,12,4,0.82)',ink:'#88dd33',scoreC:'#ffdd44',
  heart:'#ff3366',pop1:'#88dd33',pop2:'#ffcc44',pop3:'#ffe066',
  vine:'#4a7a1f',vineHi:'#79c93c',leaf:'#3f9425',
  water:'#1c4d6e',waterHi:'#3d85b0',
  croc:'#3f7a2a',crocDk:'#1f4a12',crocJaw:'#d8e8c8',crocEye:'#ffdd22',
  log:'#6b4218',logDk:'#3f2408',logRing:'#8a5c2c',
  snakeC:'#c9a227',snakeDk:'#6e5510',snakeTongue:'#ff4444',
  banana:'#ffe135',bananaDk:'#c9a800',
  gold:'#ffd700',goldHi:'#fff3a0',
  chestC:'#7a4a1a',chestDk:'#4a2a08',chestGold:'#ffd700',
};

// Fixed background star field (repurposed as firefly positions)
const BGSTARS=[];
for(let i=0;i<220;i++)BGSTARS.push({
  x:Math.random()*WW,y:Math.random()*(IH*0.92),
  r:Math.random()<0.75?0.5:1.1,spd:0.08+Math.random()*0.35
});

// [x, y, w, type, mvRange, mvSpeed]
// ground — solid floor
// semi   — pass-through from below; hold DOWN on joystick to drop through
// move   — solid moving platform (horizontal oscillator)
// earth  — solid stub (goal platform)
const PD=[
  [0,   183, 550,'ground',0,    0   ],
  [70,  155,  85,'semi',  0,    0   ],
  [230, 128,  80,'semi',  0,    0   ],
  [390, 102,  80,'semi',  0,    0   ],
  [580, 112,  78,'move',  85,  0.038],
  [840,  92,  78,'move',  70,  0.042],
  [1080,112,  78,'move',  95,  0.032],
  [1350, 98,  90,'semi',  0,    0   ],
  [1500,125,  90,'semi',  0,    0   ],
  [1650,152,  90,'semi',  0,    0   ],
  [1750,183, 650,'ground',0,    0   ],
  [1850,130, 100,'semi',  0,    0   ],
  [2010, 98, 100,'semi',  0,    0   ],
  [2150, 62, 200,'earth', 0,    0   ],
];

function platH(d){
  if(d[3]==='ground') return IH-GY+10;
  if(d[3]==='earth')  return 52;
  return 9; // semi & move — thin platforms
}

let PLATS=[],COLLECTIBLES=[],POPS=[];
let VINES=[],PITS=[],CROCS=[],LOGS=[],LOGSPAWNS=[],SNAKES=[],GOLDS=[],CHEST=null;
let WWlvl=2400;

// ── PITFALL × DK JR level generator (game-builder: RNG dresses, never decides) ──
// Course = alternating GROUND runs and WATER pits. Pits are crossed by VINES
// (the signature) or CROC-HEAD stepping stones (jaws open/close). Ground runs
// carry rolling LOGS, patrol SNAKES, platforms with bananas; GOLD hangs on vine
// arcs; the TREASURE CHEST ends the course. L1: short, vines only, no crocs/snakes.
function genLevel(lvl){
  PLATS=[];VINES=[];PITS=[];CROCS=[];LOGS=[];LOGSPAWNS=[];SNAKES=[];
  COLLECTIBLES=[];GOLDS=[];CHEST=null;
  const nSections=Math.min(3+lvl,7);           // ramp ONE axis: course length
  const pitEvery=lvl>=2?2:3;                   // pit frequency
  let x=0,sec=0;
  const groundRun=(w)=>{
    PLATS.push({x:x,y:GY,w:w,h:IH-GY+10,type:'ground',mv:false,semi:false,
      baseX:x,phase:0,_prevX:x,mvRange:0,mvSpeed:0});
    for(let bx=30;bx<w-20;bx+=55)
      COLLECTIBLES.push({x:x+bx,y:GY-14,got:false,idx:COLLECTIBLES.length});
    if(sec%2===1&&w>=150){
      const pw=70,px=x+w/2-pw/2,py=GY-52;
      PLATS.push({x:px,y:py,w:pw,h:9,type:'semi',mv:false,semi:true,
        baseX:px,phase:0,_prevX:px,mvRange:0,mvSpeed:0});
      COLLECTIBLES.push({x:px+18,y:py-14,got:false,idx:COLLECTIBLES.length});
      COLLECTIBLES.push({x:px+pw-24,y:py-14,got:false,idx:COLLECTIBLES.length});
    }
    if(w>=170&&!(lvl===1&&sec===0))
      LOGSPAWNS.push({x0:x,x1:x+w,next:120+Math.random()*140,
        speed:0.9+lvl*0.12});
    if(lvl>=2&&w>=140&&sec>=1&&(lvl>=3||sec%2===0)){
      const sx=x+40+Math.random()*(w-110);
      SNAKES.push({x:sx,x0:x+22,x1:x+w-40,dir:1,walk:0});
    }
    x+=w;sec++;
  };
  const pit=(w,useCrocs)=>{
    PITS.push({x:x,w:w});
    if(useCrocs){
      const n=Math.max(2,Math.round(w/56));
      for(let i=0;i<n;i++)
        CROCS.push({x:x+w*(i+0.5)/n-14,y:GY-4,phase:i*1.7,idx:i});
    }else{
      const n=Math.max(1,Math.round(w/85));
      for(let i=0;i<n;i++){
        const ax=x+w*(i+0.5)/n;
        VINES.push({ax:ax,ay:26+((i%2)*10),len:GY-70-((i%2)*10)});
        if(lvl>=2&&i===Math.floor(n/2))
          GOLDS.push({x:ax-6,y:GY-96,got:false});
      }
    }
    x+=w;
  };

  groundRun(200+(lvl===1?60:0));
  let pitN=0;
  for(let s2=1;s2<nSections;s2++){
    const wide=lvl>=3&&s2>=2;
    if(s2%pitEvery===0){
      // ALTERNATE pit types — vines are the signature, EVERY level gets them;
      // crocs join from L2 on every second pit
      const useCrocs=lvl>=2&&(pitN%2===1);
      pit(useCrocs?(wide?150:110):(wide?170:95),useCrocs);
      pitN++;
      groundRun(150+Math.random()*60);
    }else{
      groundRun(170+Math.random()*70);
    }
  }
  groundRun(180);
  const last=PLATS.filter(pl=>pl.type==='ground').pop();
  CHEST={x:last.x+last.w-46,y:GY-24,opened:false};
  WWlvl=x+40;

  POPS=[];
  resetPlayer();resetAlien();
  cam.x=0;
}

function buildLevel(){ genLevel(level||1); }

const p={x:0,y:0,vx:0,vy:0,prevY:0,grounded:false,
         jumpCount:0,coyote:0,standingOn:null,facing:1,walk:0,inv:0};
const al={x:0,y:0,vx:0,vy:0,prevY:0,grounded:false,
          standingOn:null,facing:1,walk:0,state:'normal',stunTimer:0};

let score=0,lives=3,level=1,timer=120,timerMs=0;
let gameState='ATTRACT',deathTimer=0,clearTimer=0,tick=0;
let W=1,H=1,scaleX=1,scaleY=1;
const cam={x:0};

// ── SFX (house style: lazy ctx, gesture unlock, mute, attract-silent) ──
let audioCtx=null,sfxMuted=localStorage.getItem('sfxMuted_junglehop')==='1';
function unlockAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
document.addEventListener('pointerdown',unlockAudio,{once:true});
function tone(f0,f1,dur,type,vol,delay){
  if(sfxMuted||!audioCtx||gameState==='ATTRACT')return;
  try{
    const t0=audioCtx.currentTime+(delay||0);
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,t0);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    g.gain.setValueAtTime(vol||0.14,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
const sfx={
  jump:  ()=>tone(300,520,0.09,'triangle',0.12),
  jump2: ()=>tone(420,700,0.09,'triangle',0.12),
  grab:  ()=>tone(240,180,0.08,'square',0.15),
  whoosh:()=>tone(140,480,0.22,'sine',0.10),
  release:()=>tone(380,760,0.14,'triangle',0.14),
  banana:()=>tone(880,1320,0.08,'square',0.13),
  gold:  ()=>{tone(1046,0,0.07,'square',0.15);tone(1568,0,0.09,'square',0.15,0.07);},
  hurt:  ()=>tone(220,70,0.25,'sawtooth',0.2),
  splash:()=>{tone(500,120,0.3,'sine',0.16);tone(300,80,0.35,'sine',0.12,0.05);},
  chomp: ()=>tone(160,50,0.15,'sawtooth',0.2),
  fanfare:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,0,0.16,'triangle',0.16,i*0.1));},
  death: ()=>tone(440,55,0.7,'sawtooth',0.2),
};

function resetPlayer(){
  p.vine=null;p.vAng=0;p.vVel=0;
  p.x=60;p.y=GY-PH;p.vx=0;p.vy=0;p.grounded=true;
  p.jumpCount=0;p.coyote=0;p.standingOn=null;p.facing=1;p.walk=0;p.inv=140;
}
function resetAlien(){
  al.x=Math.min(WW-EW-20,Math.max(p.x+IW*0.7,260));
  al.y=GY-EH;al.vx=0;al.vy=0;al.grounded=true;
  al.facing=-1;al.walk=0;al.state='normal';al.stunTimer=0;al.standingOn=null;
}
const goalPl=()=>PLATS[PLATS.length-1];
const nLeft=()=>COLLECTIBLES.filter(c=>!c.got).length;

// Separation: prevY is set here, carry runs before vx/vy applied.
function moveEnt(e,ew,eh){
  e.vy=Math.min(e.vy+GRAVITY,TERM_VEL);
  e.prevY=e.y;

  // Moving platform carry (SPW pattern) — use last frame's standingOn
  if(e.standingOn&&e.standingOn.mv)
    e.x+=e.standingOn.x-e.standingOn._prevX;

  e.x+=e.vx; e.y+=e.vy;
  e.x=Math.max(0,Math.min(WW-ew,e.x));
  if(e.y>IH+80){
    e.y=GY-eh;e.vy=0;e.grounded=true;e.standingOn=null;
    if(e===p)killPlayer();
    return;
  }

  e.grounded=false; e.standingOn=null;
  for(const pl of PLATS){
    if(e.x+ew<=pl.x+2||e.x+2>=pl.x+pl.w) continue;
    // Semi-platforms: skip if player pressing DOWN (hold down to drop through)
    if(pl.semi&&e===p&&js.dy>DEADZONE) continue;
    // AABB top-face only (canonical from lupo-alberto)
    if(e.prevY+eh<=pl.y+2&&e.y+eh>=pl.y){
      e.y=pl.y-eh;e.vy=0;e.grounded=true;e.standingOn=pl;
    }
  }
}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const js={active:false,id:-1,dx:0,dy:0,_bx:0,_by:0};
const jb={active:false,id:-1,pressed:false};

function lx(sx){return(sx-canvas.getBoundingClientRect().left)*IW/W;}
function ly(sy){return(sy-canvas.getBoundingClientRect().top)*IH/H;}
function zoneOf(sx){const x=lx(sx);return x<IW*0.48?'L':x>IW*0.52?'R':'C';}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(gameState==='ATTRACT'){startGame();return;}
    if(gameState==='GAMEOVER'){endGame();return;}
    // mute toggle: top-right HUD corner
    if(lx(t.clientX)>IW-26&&ly(t.clientY)<20){
      sfxMuted=!sfxMuted;localStorage.setItem('sfxMuted_junglehop',sfxMuted?'1':'0');
      continue;
    }
    const z=zoneOf(t.clientX);
    if(z==='L'&&!js.active){
      js.active=true;js.id=t.identifier;js.dx=0;js.dy=0;
      js._bx=lx(t.clientX);js._by=ly(t.clientY);
    } else if(z==='R'&&!jb.active){
      jb.active=true;jb.id=t.identifier;jb.pressed=true;
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)if(js.active&&t.identifier===js.id){
    js.dx=lx(t.clientX)-js._bx;
    js.dy=ly(t.clientY)-js._by;
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(js.active&&t.identifier===js.id){js.active=false;js.dx=0;js.dy=0;}
    if(jb.active&&t.identifier===jb.id)jb.active=false;
  }
},{passive:false});
canvas.addEventListener('touchcancel',()=>{js.active=false;js.dx=0;js.dy=0;jb.active=false;},{passive:false});

window.addEventListener('keydown',e=>{
  if(gameState==='ATTRACT'){startGame();return;}
  if(gameState==='GAMEOVER'){endGame();return;}
  if(e.key==='ArrowLeft'||e.key==='a'){js.active=true;js.dx=-60;js.dy=0;}
  if(e.key==='ArrowRight'||e.key==='d'){js.active=true;js.dx=60;js.dy=0;}
  if(e.key==='ArrowDown'||e.key==='s'){js.active=true;js.dy=60;}
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jb.pressed=true;
  e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d')
    {js.active=false;js.dx=0;}
  if(e.key==='ArrowDown'||e.key==='s')js.dy=0;
});

function update(dt){
  // Acceleration movement (JRK pattern — smoother than instant velocity)
  const L=js.active&&js.dx<-DEADZONE,R=js.active&&js.dx>DEADZONE;
  if(R&&!L){p.vx=Math.min(p.vx+ACC,SPEED_MAX);p.facing=1;}
  else if(L&&!R){p.vx=Math.max(p.vx-ACC,-SPEED_MAX);p.facing=-1;}
  else{p.vx*=FRICTION;if(Math.abs(p.vx)<0.08)p.vx=0;}

  // Double jump + coyote time (TWT pattern)
  // We process jump BEFORE moveEnt so we use last frame's grounded state.
  // Coyote: if was grounded last frame but not this frame → still allow jump for COYOTE frames.
  if(jb.pressed){
    if(p.vine){
      // RELEASE — momentum carries (tip velocity of the pendulum + a lift boost)
      const v=p.vine,om=p.vVel;
      p.vx=Math.cos(p.vAng)*om*v.len*1.12;
      p.vy=Math.sin(p.vAng)*om*v.len*-1.0-2.6;
      p.vx=Math.max(-6.5,Math.min(6.5,p.vx));
      p.vine=null;p.jumpCount=1;p.grounded=false;
      pop(p.x+PW/2,p.y+PH*0.4,C.vineHi);
      sfx.release();
    } else if(p.grounded||p.coyote>0){
      // Normal ground jump (or coyote)
      p.vy=-JUMP;p.grounded=false;p.jumpCount=1;p.coyote=0;
      pop(p.x+PW/2,p.y+PH,C.gndEdge);
      sfx.jump();
    } else if(grabVine()){
      // SIGNATURE: airborne grab — latch the nearest vine rope
      sfx.grab();
    } else if(p.jumpCount===1){
      // Double jump in air
      p.vy=-JUMP2;p.jumpCount=2;
      pop(p.x+PW/2,p.y+PH*0.5,C.pop1);
      pop(p.x+PW/2,p.y+PH*0.5,C.pop3);
      sfx.jump2();
    }
    jb.pressed=false;
  }

  // ── VINE SWING (pendulum) — the signature mechanic ──
  if(p.vine){
    const v=p.vine;
    p.vVel+=-Math.sin(p.vAng)*0.0115;         // gravity torque
    // pump the swing with the stick (DK Jr body-lean)
    const Lh=js.active&&js.dx<-DEADZONE,Rh=js.active&&js.dx>DEADZONE;
    if(Rh)p.vVel+=0.00042; if(Lh)p.vVel-=0.00042;
    p.vVel*=0.996;
    p.vAng+=p.vVel*dt*0.06;
    p.x=v.ax+Math.sin(p.vAng)*v.len-PW/2;
    p.y=v.ay+Math.cos(p.vAng)*v.len-PH*0.35;
    p.vx=0;p.vy=0;p.grounded=false;
    // whoosh at the bottom of a strong swing
    if(Math.abs(p.vAng)<0.06&&Math.abs(p.vVel)>0.028&&!p._whooshed){p._whooshed=true;sfx.whoosh();}
    if(Math.abs(p.vAng)>0.3)p._whooshed=false;
  }
  if(Math.abs(p.vx)>0.3)p.walk++;
  if(p.inv>0)p.inv--;

  // Update moving platforms (save _prevX for carry)
  for(const pl of PLATS){
    if(!pl.mv)continue;
    pl._prevX=pl.x;
    pl.phase+=pl.mvSpeed;
    pl.x=pl.baseX+Math.sin(pl.phase)*pl.mvRange;
  }

  if(!p.vine)moveEnt(p,PW,PH);

  // Coyote update AFTER physics (knows real grounded state)
  if(p.grounded){p.jumpCount=0;p.coyote=COYOTE;}
  else p.coyote=Math.max(0,p.coyote-1);

  if(al.state!=='dead'){
    if(al.state==='stunned'){
      al.vx*=0.62;al.walk++;
    } else {
      const spd=1.2+(level-1)*0.2;
      const mdx=p.x-al.x;
      if(mdx>6){al.vx=Math.min(al.vx+0.24,spd);al.facing=1;}
      else if(mdx<-6){al.vx=Math.max(al.vx-0.24,-spd);al.facing=-1;}
      else al.vx*=0.72;
      al.walk++;
      if(al.grounded&&p.y<al.y-38&&Math.abs(mdx)<260&&Math.random()<0.022)
        {al.vy=-JUMP*0.82;al.grounded=false;}
    }
    for(const pl of PLATS)if(!pl.mv)pl._prevX=pl.x; // alien doesn't ride movers
    moveEnt(al,EW,EH);
  }

  if(p.vy>0&&al.state!=='dead'){
    const hOv=p.x+PW>al.x+3&&p.x+3<al.x+EW;
    if(hOv&&p.prevY+PH<=al.y+6&&p.y+PH>=al.y){
      p.vy=-JUMP*0.60;p.grounded=false;
      if(al.state==='normal'){
        al.state='stunned';al.stunTimer=160;score+=50;
        pop(al.x+EW/2,al.y,C.pop2);
      } else if(al.state==='stunned'){
        al.state='dead';al.stunTimer=65;score+=300;
        pop(al.x+EW/2,al.y,C.pop1);pop(al.x+EW/2,al.y,C.pop2);
      }
    }
  }

  if(p.inv<=0&&al.state==='normal'){
    if(Math.abs(p.x+PW/2-(al.x+EW/2))<(PW+EW)/2-5&&
       Math.abs(p.y+PH/2-(al.y+EH/2))<(PH+EH)/2-5)
      killPlayer();
  }

  for(const c of COLLECTIBLES){
    if(c.got)continue;
    if(Math.abs(p.x+PW/2-(c.x+6))<18&&Math.abs(p.y+PH/2-(c.y+6))<18){
      c.got=true;score+=100;pop(c.x+6,c.y,C.banana);sfx.banana();
    }
  }

  timerMs+=dt;timer=Math.max(0,120-Math.floor(timerMs/1000));
  if(timer<=0)killPlayer();

  updateHazards(dt);   // logs, snakes, crocs, water, gold, chest (Pitfall layer)

  // Camera
  cam.x+=(Math.max(0,Math.min(WWlvl-IW,p.x-IW*0.38))-cam.x)*0.12;

  // Particles
  for(let i=POPS.length-1;i>=0;i--){
    const pt=POPS[i];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.10;pt.life-=0.038;
    if(pt.life<=0)POPS.splice(i,1);
  }
}

function grabVine(){
  for(const v of VINES){
    // grab anywhere on the rope's lower 60%
    const tipX=v.ax+Math.sin(0)*v.len; // rope hangs near-vertical for the check
    if(Math.abs(p.x+PW/2-v.ax)<20&&p.y>v.ay+v.len*0.35&&p.y<v.ay+v.len+14){
      p.vine=v;
      p.vAng=Math.atan2(p.x+PW/2-v.ax,(p.y+PH*0.35)-v.ay);
      // inherit momentum into angular velocity
      p.vVel=Math.max(-0.05,Math.min(0.05,p.vx*0.006))+ (p.vAng>0?-0.004:0.004);
      p.jumpCount=0;
      return true;
    }
  }
  return false;
}

function updateHazards(dt){
  // rolling logs
  for(const sp2 of LOGSPAWNS){
    sp2.next-=1;
    if(sp2.next<=0){
      LOGS.push({x:sp2.x1-14,y:GY-12,vx:-sp2.speed,r:7,rot:0});
      sp2.next=200+Math.random()*220-Math.min(120,level*14);
    }
  }
  for(let i=LOGS.length-1;i>=0;i--){
    const L2=LOGS[i];
    L2.x+=L2.vx;L2.rot-=0.12;
    if(L2.x<L2x0(L2)-20||L2.x<-30){LOGS.splice(i,1);continue;}
    // hit player (hitbox 15% forgiving)
    if(p.inv<=0&&!p.vine&&
       Math.abs(p.x+PW/2-L2.x)<(PW/2+L2.r)*0.85&&
       Math.abs(p.y+PH-(L2.y+L2.r))<PH*0.7){
      hurtPlayer();L2.x-=8;
    }
  }
  // snakes patrol
  for(const s2 of SNAKES){
    s2.x+=s2.dir*0.5;s2.walk++;
    if(s2.x<s2.x0)s2.dir=1;
    if(s2.x>s2.x1)s2.dir=-1;
    if(p.inv<=0&&!p.vine&&
       Math.abs(p.x+PW/2-(s2.x+11))<15&&Math.abs(p.y+PH-GY)<10){
      hurtPlayer();
    }
  }
  // crocs: jaw cycle — closed = safe stepping stone, open = death bite
  for(const c2 of CROCS){
    c2.phase+=0.016+level*0.0012;
    const open=Math.sin(c2.phase)>0.35;      // ~40% open time
    c2.open=open;
    const onX=p.x+PW>c2.x+3&&p.x<c2.x+25;
    if(onX&&p.prevY+PH<=c2.y+2&&p.y+PH>=c2.y&&p.vy>=0&&!p.vine){
      if(open){drownPlayer(true);}          // bit — jaws were open
      else{p.y=c2.y-PH;p.vy=0;p.grounded=true;p.jumpCount=0;p.coyote=COYOTE;}
    }
  }
  // water: falling into a pit below ground level = drown
  if(!p.vine&&p.y+PH>GY+8){
    for(const pit2 of PITS){
      if(p.x+PW/2>pit2.x&&p.x+PW/2<pit2.x+pit2.w){drownPlayer(false);break;}
    }
  }
  // gold pickup (usually mid-swing)
  for(const g2 of GOLDS){
    if(g2.got)continue;
    if(Math.abs(p.x+PW/2-(g2.x+7))<16&&Math.abs(p.y+PH/2-(g2.y+5))<18){
      g2.got=true;score+=250;pop(g2.x+7,g2.y,C.gold);sfx.gold();
    }
  }
  // treasure chest = level clear
  if(CHEST&&!CHEST.opened&&
     p.x+PW>CHEST.x&&p.x<CHEST.x+30&&Math.abs(p.y+PH-GY)<14){
    CHEST.opened=true;
    gameState='CLEAR';clearTimer=200;
    const bTot=COLLECTIBLES.length,bGot=COLLECTIBLES.filter(c=>c.got).length;
    score+=500+timer*10+lives*100+(bGot===bTot?300:0);
    pop(CHEST.x+15,CHEST.y,C.gold);pop(CHEST.x+15,CHEST.y-8,C.star);
    sfx.fanfare();
  }
}
function L2x0(L2){for(const s2 of LOGSPAWNS)if(L2.x<=s2.x1&&L2.x>=s2.x0-24)return s2.x0;return 0;}

function hurtPlayer(){
  lives--;p.inv=70;p.vy=-4.5;p.vx=p.facing*-2.5;
  pop(p.x+PW/2,p.y+PH/2,'#ff4422');sfx.hurt();
  if(lives<=0){gameState='GAMEOVER';sfx.death();}
}
function drownPlayer(bitten){
  for(let i2=0;i2<10;i2++)pop(p.x+PW/2,GY+4,bitten?'#ff4422':C.waterHi);
  sfx.splash();
  lives--;
  if(lives<=0){gameState='GAMEOVER';sfx.death();return;}
  gameState='DEAD';deathTimer=90;
  // respawn at the start of the current ground section (checkpoint feel)
  let rx=8;
  for(const pl of PLATS)if(pl.type==='ground'&&pl.x<p.x)rx=pl.x+10;
  p._respawnX=rx;
}

function killPlayer(){
  lives--;pop(p.x+PW/2,p.y+PH/2,'#ff4422');sfx.hurt();
  if(lives<=0){gameState='GAMEOVER';sfx.death();return;}
  gameState='DEAD';deathTimer=90;timer=120;timerMs=0;
}
function pop(x,y,color){
  for(let i=0;i<9;i++){
    const a=Math.random()*Math.PI*2,s=1.0+Math.random()*2.8;
    POPS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.0,life:1,color});
  }
}

function tickStates(){
  if(al.state==='stunned'){if(--al.stunTimer<=0)al.state='normal';}
  if(al.state==='dead'){if(--al.stunTimer<=0)resetAlien();}
  if(gameState==='DEAD'){if(--deathTimer<=0){const rx=p._respawnX;resetPlayer();resetAlien();if(rx){p.x=rx;p._respawnX=0;}gameState='PLAYING';timerMs=0;}}
  if(gameState==='CLEAR'){if(--clearTimer<=0){level++;buildLevel();gameState='PLAYING';timerMs=0;}}
  if(gameState==='ATTRACT'||gameState==='GAMEOVER')tick++;
}

function attractUpdate(){
  tick++;
  // vine swing showcase — the attract's job is selling the signature mechanic
  if(p.vine){
    const v=p.vine;
    p.vVel+=-Math.sin(p.vAng)*0.0115;
    p.vVel+=0.0004;                       // lean forward
    p.vVel*=0.996;
    p.vAng+=p.vVel;
    p.x=v.ax+Math.sin(p.vAng)*v.len-PW/2;
    p.y=v.ay+Math.cos(p.vAng)*v.len-PH*0.35;
    p._swingT=(p._swingT||0)+1;
    // release on a forward upswing after ~1.5 periods
    if(p._swingT>110&&p.vAng>0.35&&p.vVel>0){
      p.vx=Math.cos(p.vAng)*p.vVel*v.len*1.12;
      p.vy=Math.sin(p.vAng)*p.vVel*v.len*-1.0-2.6;
      p.vine=null;p._swingT=0;
      pop(p.x+PW/2,p.y+PH*0.4,C.vineHi);
    }
    cam.x+=(Math.max(0,p.x-IW*0.38)-cam.x)*0.09;
    return;
  }
  p.vx=Math.min(p.vx+ACC,SPEED_MAX);p.facing=1;p.walk++;
  if(p.grounded){p.coyote=COYOTE;p.jumpCount=0;}
  else p.coyote=Math.max(0,p.coyote-1);
  p.vy=Math.min(p.vy+GRAVITY,TERM_VEL);
  p.prevY=p.y;
  if(p.standingOn&&p.standingOn.mv)p.x+=p.standingOn.x-p.standingOn._prevX;
  p.x+=p.vx;p.y+=p.vy;
  p.grounded=false;p.standingOn=null;
  for(const pl of PLATS){
    if(p.x+PW>pl.x&&p.x<pl.x+pl.w&&p.prevY+PH<=pl.y+2&&p.y+PH>=pl.y){
      p.y=pl.y-PH;p.vy=0;p.grounded=true;p.standingOn=pl;p.jumpCount=0;
    }
  }
  // hop just before a pit edge, then grab the vine over it mid-air
  if(p.grounded){
    for(const pit2 of PITS){
      if(p.x+PW>pit2.x-16&&p.x<pit2.x){p.vy=-JUMP*0.9;p.grounded=false;break;}
    }
  }
  if(!p.grounded&&p.vy>-2){
    for(const v of VINES){
      if(Math.abs(p.x+PW/2-v.ax)<22&&p.y>v.ay+v.len*0.3&&p.y<v.ay+v.len+16){
        p.vine=v;p.vAng=Math.atan2(p.x+PW/2-v.ax,(p.y+PH*0.35)-v.ay);
        p.vVel=0.02;p._swingT=0;break;
      }
    }
  }
  // hop logs
  if(p.grounded)for(const L2 of LOGS){
    if(L2.x>p.x&&L2.x-p.x<34){p.vy=-JUMP*0.8;p.grounded=false;break;}
  }
  // fell in water — quiet reset to keep the loop clean
  if(p.y>IH+10){p.x=0;p.y=GY-PH;p.vx=0;p.vy=0;p.vine=null;}
  if(p.x>WWlvl-IW/2){p.x=0;p.y=GY-PH;p.vx=0;p.vy=0;p.vine=null;}
  cam.x+=(Math.max(0,p.x-IW*0.38)-cam.x)*0.09;
  al.x+=0.9;al.walk++;if(al.x>WWlvl)al.x=0;
  for(const pl of PLATS){
    if(!pl.mv)continue;
    pl._prevX=pl.x;pl.phase+=pl.mvSpeed;
    pl.x=pl.baseX+Math.sin(pl.phase)*pl.mvRange;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.scale(scaleX,scaleY);

  drawBg();
  ctx.save();ctx.translate(-Math.round(cam.x),0);
  drawWater();
  drawVines();
  drawPlatforms();
  drawCollectibles();
  drawGolds();
  drawChest();
  // (old drawGoal retired — the chest IS the goal)
  drawCrocs();
  drawLogs();
  drawSnakes();
  if(al.state!=='dead')drawAlien();
  drawPlayer();
  ctx.globalAlpha=1;
  for(const pt of POPS){
    ctx.globalAlpha=pt.life;ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,3*pt.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.restore();
  drawHUD();drawControls();drawOverlays();
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,IH);
  g.addColorStop(0,C.sky1);g.addColorStop(0.5,C.sky2);g.addColorStop(1,C.sky3);
  ctx.fillStyle=g;ctx.fillRect(0,0,IW,IH);
  // Background star field → fireflies
  const cx=cam.x;
  for(const bs of BGSTARS){
    const sx=((bs.x-cx*bs.spd)%WW+WW)%WW;
    if(sx>IW)continue;
    const flicker=0.3+0.5*Math.sin(tick*0.07+bs.x*0.02);
    ctx.fillStyle=`rgba(200,255,100,${flicker})`;
    ctx.fillRect(sx,bs.y,bs.r,bs.r);
  }
  // Tree silhouettes (parallax)
  const treeOff=(cam.x*0.25)%320;
  ctx.fillStyle='rgba(10,30,5,0.7)';
  for(let tx=-treeOff-60;tx<IW+60;tx+=80){
    // trunk
    ctx.fillRect(tx+18,IH*0.65,6,IH*0.40);
    // canopy blob
    ctx.beginPath();ctx.arc(tx+21,IH*0.58,18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(tx+32,IH*0.54,14,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(tx+10,IH*0.56,13,0,Math.PI*2);ctx.fill();
  }
  // Vines hanging from top
  ctx.strokeStyle='rgba(30,80,10,0.5)';ctx.lineWidth=2;
  for(let vx=40;vx<IW;vx+=70){
    const voff=((vx-cam.x*0.15)%IW+IW)%IW;
    const vlen=20+15*Math.sin(vx*0.1);
    ctx.beginPath();ctx.moveTo(voff,0);ctx.lineTo(voff+3,vlen);ctx.stroke();
  }
}

function drawPlatforms(){
  for(const pl of PLATS){
    if(pl.type==='ground'){
      ctx.fillStyle=C.gnd;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      ctx.fillStyle=C.gndEdge;ctx.fillRect(pl.x,pl.y,pl.w,2);
      ctx.strokeStyle=C.gndGrid;ctx.lineWidth=1;
      for(let gx2=pl.x+20;gx2<pl.x+pl.w;gx2+=20){
        ctx.beginPath();ctx.moveTo(gx2,pl.y);ctx.lineTo(gx2,pl.y+7);ctx.stroke();
      }
    } else if(pl.type==='earth'){
      ctx.fillStyle=C.earth;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      ctx.fillStyle=C.earthEdge;ctx.fillRect(pl.x,pl.y,pl.w,2);
      ctx.fillStyle=C.gndEdge;ctx.fillRect(pl.x,pl.y+3,pl.w,1);
    } else if(pl.type==='semi'){
      const pulse=0.6+0.18*Math.sin(tick*0.055+pl.x*0.012);
      // Log body
      ctx.fillStyle='#4a2e0a';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      // Moss top
      ctx.fillStyle=C.gndEdge;ctx.fillRect(pl.x,pl.y,pl.w,2);
      // Dashed green border
      ctx.globalAlpha=pulse;
      ctx.strokeStyle=C.semiEdge;ctx.lineWidth=1.5;
      ctx.setLineDash([5,4]);ctx.strokeRect(pl.x+0.5,pl.y+0.5,pl.w-1,pl.h-1);
      ctx.setLineDash([]);ctx.globalAlpha=1;
    } else if(pl.type==='move'){
      const pulse=0.7+0.25*Math.sin(tick*0.09+pl.phase);
      ctx.shadowColor=C.mvEdge;ctx.shadowBlur=5*pulse;
      ctx.fillStyle=C.mv;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      ctx.fillStyle=C.mvEdge;ctx.fillRect(pl.x,pl.y,pl.w,2);
      ctx.shadowBlur=0;
      ctx.fillStyle=C.mvGlow;
      ctx.font='5px sans-serif';ctx.textAlign='center';
      ctx.fillText('▶',pl.x+pl.w/2,pl.y+8);ctx.textAlign='left';
    }
  }
}

function drawCollectibles(){
  for(const c of COLLECTIBLES){
    if(c.got)continue;
    // BANANA (Pitfall treasure meets DK Jr fruit)
    const bob=Math.sin(tick*0.09+c.idx*1.2)*1.5;
    ctx.save();ctx.translate(c.x+6,c.y+6+bob);ctx.rotate(-0.5);
    ctx.strokeStyle=C.banana;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.shadowColor=C.banana;ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(0,0,5.5,0.35,Math.PI-0.35);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle=C.bananaDk;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,5.5,0.5,Math.PI-0.5);ctx.stroke();
    ctx.restore();
  }
}

function drawWater(){
  for(const pit2 of PITS){
    const g=ctx.createLinearGradient(0,GY,0,IH);
    g.addColorStop(0,C.waterHi);g.addColorStop(1,C.water);
    ctx.fillStyle=g;
    ctx.fillRect(pit2.x,GY+2,pit2.w,IH-GY);
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let wx=pit2.x;wx<=pit2.x+pit2.w;wx+=6)
      ctx.lineTo(wx,GY+3+Math.sin(wx*0.25+tick*0.08)*1.4);
    ctx.stroke();
  }
}
function drawVines(){
  for(const v of VINES){
    const held=p.vine===v;
    const ang=held?p.vAng:Math.sin(tick*0.02+v.ax*0.07)*0.08;
    const ex=v.ax+Math.sin(ang)*v.len,ey=v.ay+Math.cos(ang)*v.len;
    ctx.strokeStyle=held?C.vineHi:C.vine;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(v.ax,v.ay);
    ctx.quadraticCurveTo(v.ax+Math.sin(ang)*v.len*0.5,v.ay+v.len*0.55,ex,ey);
    ctx.stroke();
    // leaves along the rope
    ctx.fillStyle=C.leaf;
    for(let f2=0.3;f2<1;f2+=0.3){
      const lx2=v.ax+Math.sin(ang)*v.len*f2,ly2=v.ay+v.len*f2;
      ctx.beginPath();ctx.ellipse(lx2+3,ly2,4,2,0.6,0,Math.PI*2);ctx.fill();
    }
    // canopy anchor
    ctx.fillStyle=C.leaf;
    ctx.beginPath();ctx.arc(v.ax,v.ay,4,0,Math.PI*2);ctx.fill();
  }
}
function drawCrocs(){
  for(const c2 of CROCS){
    const jaw=c2.open?6:1;
    ctx.fillStyle=C.croc;ctx.strokeStyle=C.crocDk;ctx.lineWidth=1.5;
    // head
    ctx.beginPath();ctx.roundRect(c2.x,c2.y,28,9,3);ctx.fill();ctx.stroke();
    // snout + jaw
    ctx.fillStyle=C.croc;
    ctx.beginPath();ctx.moveTo(c2.x+28,c2.y+2);ctx.lineTo(c2.x+38,c2.y+2-jaw*0.4);
    ctx.lineTo(c2.x+38,c2.y+4-jaw*0.4);ctx.lineTo(c2.x+28,c2.y+5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(c2.x+28,c2.y+6);ctx.lineTo(c2.x+38,c2.y+6+jaw);
    ctx.lineTo(c2.x+38,c2.y+8+jaw);ctx.lineTo(c2.x+28,c2.y+9);ctx.closePath();ctx.fill();ctx.stroke();
    // teeth when open
    if(c2.open){
      ctx.fillStyle=C.crocJaw;
      for(let t2=0;t2<3;t2++)ctx.fillRect(c2.x+29+t2*3,c2.y+4-jaw*0.2+t2*0.2,2,2);
    }
    // eye
    ctx.fillStyle=C.crocEye;ctx.fillRect(c2.x+4,c2.y+2,3,3);
    ctx.fillStyle='#000';ctx.fillRect(c2.x+5,c2.y+3,1.5,1.5);
  }
}
function drawLogs(){
  for(const L2 of LOGS){
    ctx.save();ctx.translate(L2.x,L2.y+L2.r);ctx.rotate(L2.rot);
    ctx.fillStyle=C.log;ctx.strokeStyle=C.logDk;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,L2.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle=C.logRing;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,0,L2.r*0.55,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-L2.r,0);ctx.lineTo(L2.r,0);ctx.stroke();
    ctx.restore();
  }
}
function drawSnakes(){
  for(const s2 of SNAKES){
    const wig=Math.sin(s2.walk*0.2)*1.5;
    ctx.strokeStyle=C.snakeC;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s2.x,GY-3);
    ctx.quadraticCurveTo(s2.x+7,GY-3+wig,s2.x+14,GY-3);
    ctx.quadraticCurveTo(s2.x+18,GY-3-wig,s2.x+22,GY-5);
    ctx.stroke();
    // head
    ctx.fillStyle=C.snakeC;ctx.strokeStyle=C.snakeDk;ctx.lineWidth=1;
    const hx=s2.dir>0?s2.x+22:s2.x;
    ctx.beginPath();ctx.arc(hx,GY-6,3.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#000';ctx.fillRect(hx+(s2.dir>0?1:-2),GY-7.5,1.5,1.5);
    // flicking tongue
    if(s2.walk%40<12){
      ctx.strokeStyle=C.snakeTongue;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(hx+s2.dir*3,GY-6);ctx.lineTo(hx+s2.dir*7,GY-7);ctx.stroke();
    }
  }
}
function drawGolds(){
  for(const g2 of GOLDS){
    if(g2.got)continue;
    const shine=Math.sin(tick*0.15)*0.5+0.5;
    ctx.fillStyle=C.gold;ctx.strokeStyle=C.goldHi;ctx.lineWidth=1;
    ctx.shadowColor=C.gold;ctx.shadowBlur=6+shine*4;
    ctx.beginPath();ctx.moveTo(g2.x,g2.y+8);ctx.lineTo(g2.x+3,g2.y);
    ctx.lineTo(g2.x+11,g2.y);ctx.lineTo(g2.x+14,g2.y+8);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
  }
}
function drawChest(){
  if(!CHEST)return;
  const c2=CHEST;
  ctx.fillStyle=C.chestC;ctx.strokeStyle=C.chestDk;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(c2.x,c2.y+8,30,16,2);ctx.fill();ctx.stroke();
  // lid (opens on clear)
  ctx.save();ctx.translate(c2.x,c2.y+8);
  if(c2.opened)ctx.rotate(-0.9);
  ctx.fillStyle=C.chestC;
  ctx.beginPath();ctx.roundRect(0,-8,30,10,3);ctx.fill();ctx.stroke();
  ctx.restore();
  // gold band + glow when open
  ctx.fillStyle=C.chestGold;
  ctx.fillRect(c2.x+13,c2.y+8,4,16);
  if(c2.opened){
    ctx.shadowColor=C.gold;ctx.shadowBlur=12;
    ctx.fillStyle=C.gold;ctx.fillRect(c2.x+5,c2.y+4,20,4);
    ctx.shadowBlur=0;
  }else{
    const pulse=Math.sin(tick*0.1)*0.5+0.5;
    ctx.shadowColor=C.gold;ctx.shadowBlur=4+pulse*6;
    ctx.fillStyle=C.chestGold;ctx.fillRect(c2.x+13,c2.y+8,4,3);
    ctx.shadowBlur=0;
  }
}

function drawStar5(cx,cy,r,fill,glow){
  ctx.fillStyle=fill;ctx.shadowColor=glow;ctx.shadowBlur=5;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5-Math.PI/2;
    const ia=(i+0.5)*Math.PI*2/5-Math.PI/2;
    i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)
         :ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    ctx.lineTo(cx+Math.cos(ia)*r*0.4,cy+Math.sin(ia)*r*0.4);
  }
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;
}

function drawGoal(){
  const gp=goalPl();
  const rx=gp.x+gp.w/2-15,ry=gp.y-36;
  const unlocked=nLeft()===0;
  ctx.save();ctx.translate(rx,ry);ctx.globalAlpha=unlocked?1:0.30;
  // Chest body
  ctx.fillStyle='#6b3a1a';rR(ctx,0,14,30,22,2);ctx.fill();
  ctx.fillStyle='#cc9922';ctx.fillRect(0,14,30,3);
  // Chest lid (open if unlocked)
  ctx.fillStyle='#8b4a22';
  if(unlocked){
    ctx.save();ctx.translate(15,14);
    ctx.rotate(-0.6);
    rR(ctx,-15,-10,30,12,2);ctx.fill();
    ctx.fillStyle='#cc9922';ctx.fillRect(-15,-10,30,3);
    ctx.restore();
    // Gold glow
    ctx.shadowColor=C.star;ctx.shadowBlur=12;
    ctx.fillStyle=C.star;
    for(let i=0;i<3;i++){const a=tick*0.12+i*Math.PI*0.67;ctx.beginPath();ctx.arc(15+Math.cos(a)*6,10+Math.sin(a)*4,3,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0;
    ctx.fillStyle=C.star;ctx.font='bold 7px Bungee,sans-serif';ctx.textAlign='center';
    ctx.fillText('ESCAPE!',15,-12-Math.abs(Math.sin(tick*0.07))*2);ctx.textAlign='left';
  } else {
    rR(ctx,0,4,30,12,2);ctx.fill();
    ctx.fillStyle='#cc9922';ctx.fillRect(0,4,30,3);
  }
  // Latch
  ctx.fillStyle='#ffcc44';rR(ctx,12,21,6,6,2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

// Monkey player
function drawPlayer(){
  if(gameState==='DEAD'&&deathTimer%8<4)return;
  if(p.inv>0&&p.inv%6<3)return;
  const fl=p.facing<0,fr=Math.floor(p.walk/5)%4;
  const air=!p.grounded;
  ctx.save();ctx.translate(p.x+(fl?PW:0),p.y);if(fl)ctx.scale(-1,1);

  // Tail (curly, behind body)
  ctx.strokeStyle=C.plyr2;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(PW*0.10,PH*0.52);
  ctx.quadraticCurveTo(-8,PH*0.20,PW*0.05,PH*0.08);
  ctx.stroke();
  // Legs
  const la=fr<2?1.5:0,lb=fr<2?0:1.5;
  ctx.fillStyle=C.plyr2;
  if(!air){
    ctx.fillRect(PW*0.18,PH*0.65+la,5,PH*0.35-la);
    ctx.fillRect(PW*0.60,PH*0.65+lb,5,PH*0.35-lb);
  } else {
    ctx.fillRect(PW*0.14,PH*0.68,5,PH*0.18);
    ctx.fillRect(PW*0.62,PH*0.68,5,PH*0.18);
    ctx.fillRect(PW*0.08,PH*0.84,9,3);ctx.fillRect(PW*0.56,PH*0.84,9,3);
  }
  ctx.fillRect(PW*0.10,PH-2,9,2);ctx.fillRect(PW*0.52,PH-2,9,2);
  // Body
  ctx.fillStyle=C.plyr1;rR(ctx,PW*0.10,PH*0.40,PW*0.80,PH*0.30,4);ctx.fill();
  ctx.fillStyle=C.visor;ctx.beginPath();ctx.ellipse(PW*0.50,PH*0.54,PW*0.22,PH*0.07,0,0,Math.PI*2);ctx.fill();
  // Head
  const hx=PW*0.50,hy=PH*0.22,hr=PW*0.38;
  ctx.fillStyle=C.plyr1;ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();
  // Face (lighter muzzle)
  ctx.fillStyle=C.visor;ctx.beginPath();ctx.ellipse(hx+hr*0.15,hy+hr*0.18,hr*0.58,hr*0.40,0,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#221100';ctx.beginPath();ctx.arc(hx-hr*0.26,hy-hr*0.10,3.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+hr*0.36,hy-hr*0.10,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(hx-hr*0.30,hy-hr*0.18,2,2);ctx.fillRect(hx+hr*0.32,hy-hr*0.18,2,2);
  // Ears (round)
  ctx.fillStyle=C.plyr2;ctx.beginPath();ctx.arc(hx-hr*0.70,hy-hr*0.62,hr*0.28,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+hr*0.62,hy-hr*0.62,hr*0.28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.plyr1;ctx.beginPath();ctx.arc(hx-hr*0.70,hy-hr*0.60,hr*0.14,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+hr*0.62,hy-hr*0.60,hr*0.14,0,Math.PI*2);ctx.fill();

  // Double-jump sparkle ring
  if(p.jumpCount===2&&!p.grounded){
    ctx.globalAlpha=0.65;
    for(let i=0;i<6;i++){
      const a=(tick*0.28+i*Math.PI/3);
      ctx.fillStyle=i%2===0?C.pop1:C.pop3;
      ctx.beginPath();ctx.arc(hx+Math.cos(a)*(hr+3),hy+hr*0.8+Math.sin(a)*2.5,1.8,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// Space alien enemy
function drawAlien(){
  const fl=al.facing<0,fr=Math.floor(al.walk/5)%4;
  const stunned=al.state==='stunned';
  if(stunned&&al.stunTimer%6<3)return;
  ctx.save();ctx.translate(al.x+(fl?EW:0),al.y+(stunned?EH*0.22:0));
  if(fl)ctx.scale(-1,1);
  ctx.scale(1,stunned?0.65:1);

  // Feet
  const la=fr<2?1.5:0,lb=fr<2?0:1.5;
  ctx.fillStyle=C.alienDk;
  if(!stunned){
    ctx.fillRect(EW*0.14,EH*0.65+la,5,EH*0.35-la);
    ctx.fillRect(EW*0.54,EH*0.65+lb,5,EH*0.35-lb);
  } else {
    ctx.fillRect(EW*0.14,EH*0.72,5,EH*0.28);
    ctx.fillRect(EW*0.54,EH*0.72,5,EH*0.28);
  }
  ctx.fillRect(EW*0.08,EH-2,8,2);ctx.fillRect(EW*0.50,EH-2,8,2);

  // Body
  ctx.fillStyle=C.alien;
  ctx.beginPath();ctx.ellipse(EW*0.50,EH*0.54,EW*0.40,EH*0.27,0,0,Math.PI*2);ctx.fill();

  // Head
  const hx=EW*0.52,hy=EH*0.27,hr=EW*0.30;
  ctx.fillStyle=C.alien;ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();

  // Eyes
  ctx.fillStyle=C.alienEye;
  ctx.beginPath();ctx.ellipse(hx-hr*0.42,hy-hr*0.08,4,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx+hr*0.42,hy-hr*0.08,4,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  if(!stunned){
    ctx.beginPath();ctx.arc(hx-hr*0.42,hy-hr*0.08,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hx+hr*0.42,hy-hr*0.08,2,0,Math.PI*2);ctx.fill();
  } else {
    ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    const xl=hx-hr*0.62,xr=hx-hr*0.22;
    ctx.beginPath();ctx.moveTo(xl,hy-hr*0.22);ctx.lineTo(xr,hy+hr*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(xr,hy-hr*0.22);ctx.lineTo(xl,hy+hr*0.06);ctx.stroke();
    const xl2=hx+hr*0.22,xr2=hx+hr*0.62;
    ctx.beginPath();ctx.moveTo(xl2,hy-hr*0.22);ctx.lineTo(xr2,hy+hr*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(xr2,hy-hr*0.22);ctx.lineTo(xl2,hy+hr*0.06);ctx.stroke();
  }
  // Antenna
  ctx.strokeStyle=C.alienDk;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(hx,hy-hr);ctx.lineTo(hx-4,hy-hr-7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx-4,hy-hr-7);ctx.lineTo(hx-8,hy-hr-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx-4,hy-hr-7);ctx.lineTo(hx,hy-hr-5);ctx.stroke();
  ctx.fillStyle=C.alienDk;
  ctx.beginPath();ctx.arc(hx-8,hy-hr-5,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx,hy-hr-5,2,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Stun stars (above character, not squashed)
  if(stunned&&al.stunTimer>20){
    for(let i=0;i<3;i++){
      const a=(tick*0.13+i*Math.PI*0.67);
      drawStar5(al.x+EW/2+Math.cos(a)*9,al.y-8+Math.sin(a)*4,3,C.star,C.starGlow);
    }
  }
}

function drawHUD(){
  ctx.fillStyle=C.hud;ctx.fillRect(0,0,W,Math.round(H*0.09));
  ctx.font=`${Math.round(H*0.045)}px sans-serif`;ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillStyle='#fff';ctx.fillText(sfxMuted?'🔇':'🔊',W-8,4);
  const hh=Math.round(H*0.065);
  // Lives
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?C.heart:'rgba(255,50,80,0.18)';
    sHeart(8+i*Math.round(W*0.032),Math.round(H*0.012),Math.round(H*0.025));
  }
  // Score
  ctx.fillStyle=C.scoreC;ctx.font=`bold ${hh}px Bungee,sans-serif`;
  ctx.textAlign='center';ctx.fillText(String(score).padStart(6,'0'),W/2,hh+2);
  // Timer
  const tc=timer<=20?(Math.floor(tick/25)%2?'#ff3333':'#ffaa00'):C.ink+'ee';
  ctx.fillStyle=tc;ctx.font=`bold ${Math.round(hh*0.82)}px Bungee,sans-serif`;
  ctx.textAlign='right';ctx.fillText('⏱'+timer,W-8,hh);
  // Stars left
  const sl=nLeft();
  ctx.fillStyle=sl>0?'#ffaacc':'#88ffaa';
  ctx.font=`${Math.round(hh*0.72)}px Bungee,sans-serif`;
  ctx.textAlign='left';ctx.fillText(sl>0?'★×'+sl:'→ ESCAPE!',W/2+W*0.06,hh);
  // Level
  ctx.fillStyle='rgba(255,255,255,0.52)';
  ctx.font=`${Math.round(hh*0.66)}px Bungee,sans-serif`;
  ctx.textAlign='left';ctx.fillText('LV'+level,W/2-W*0.08,hh);
  // Hint
  if(timer>112&&gameState==='PLAYING'){
    ctx.fillStyle='rgba(136,221,51,0.80)';
    ctx.font=`${Math.round(hh*0.52)}px Bungee,sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('DOUBLE TAP JUMP  •  HOLD ↓ TO DROP THROUGH LOGS',W/2,H*0.14);
  }
  minimap();ctx.textAlign='left';
}
function sHeart(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x+s,y+s*0.35);
  ctx.bezierCurveTo(x+s,y,x+s*1.85,y,x+s*1.85,y+s*0.45);
  ctx.bezierCurveTo(x+s*1.85,y+s,x+s,y+s*1.3,x+s,y+s*1.6);
  ctx.bezierCurveTo(x+s,y+s*1.3,x+s*0.15,y+s,x+s*0.15,y+s*0.45);
  ctx.bezierCurveTo(x+s*0.15,y,x+s,y,x+s,y+s*0.35);ctx.fill();
}
function minimap(){
  const mw=Math.round(W*0.07),mh=Math.round(H*0.022);
  const mx=W-mw-Math.round(W*0.10),my=Math.round(H*0.018);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle=C.ink;ctx.fillRect(mx+Math.floor(p.x/WW*mw)-1,my,2,mh);
  if(al.state!=='dead'){
    ctx.fillStyle=al.state==='stunned'?C.star:'#ff3333';
    ctx.fillRect(mx+Math.floor(al.x/WW*mw)-1,my,2,mh);
  }
  const gp=goalPl();
  ctx.fillStyle='#fff';ctx.fillRect(mx+Math.floor((gp.x+gp.w)/WW*mw)-2,my,3,mh);
  ctx.strokeStyle='rgba(68,170,255,0.40)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
}

function drawControls(){
  if(gameState!=='PLAYING'&&gameState!=='DEAD')return;
  ctx.save();
  const jcx=W*0.12,jcy=H*0.82,jr=Math.round(H*0.09);
  ctx.fillStyle='rgba(68,170,255,0.07)';ctx.beginPath();ctx.arc(jcx,jcy,jr,0,Math.PI*2);ctx.fill();
  const kx=jcx+Math.max(-jr*0.70,Math.min(jr*0.70,js.dx*(W/IW)));
  const ky=jcy+Math.max(-jr*0.50,Math.min(jr*0.50,js.dy*(H/IH)));
  ctx.strokeStyle='rgba(68,170,255,0.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(jcx-jr*0.6,jcy);ctx.lineTo(jcx-jr*0.18,jcy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(jcx+jr*0.18,jcy);ctx.lineTo(jcx+jr*0.6,jcy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(jcx,jcy+jr*0.18);ctx.lineTo(jcx,jcy+jr*0.6);ctx.stroke();
  ctx.fillStyle=js.active?'rgba(68,170,255,0.72)':'rgba(68,170,255,0.26)';
  ctx.beginPath();ctx.arc(kx,ky,jr*0.34,0,Math.PI*2);ctx.fill();
  // Jump button
  const bx=W*0.88,by=H*0.82,br=Math.round(H*0.075);
  const jc=p.jumpCount===1?'rgba(100,180,255,0.85)':p.jumpCount===2?'rgba(255,180,50,0.85)':'rgba(50,200,80,0.28)';
  ctx.fillStyle=jb.active?'rgba(50,200,80,0.80)':jc;
  ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.font=`bold ${Math.round(br*0.75)}px Bungee,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('▲',bx,by);ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.restore();
}

function drawOverlays(){
  if(gameState==='ATTRACT'){
    ctx.fillStyle='rgba(2,2,20,0.70)';ctx.fillRect(0,H*0.30,W,H*0.44);
    ctx.shadowColor=C.ink;ctx.shadowBlur=18;
    ctx.fillStyle=C.ink;ctx.font=`bold ${Math.round(W*0.082)}px Bungee,sans-serif`;
    ctx.textAlign='center';ctx.fillText('JUNGLE-HOP',W/2,H*0.52);
    ctx.shadowBlur=0;
    ctx.fillStyle=C.scoreC;ctx.font=`${Math.round(W*0.032)}px Bungee,sans-serif`;
    ctx.fillText('DOUBLE JUMP  ·  MOVING PLATFORMS  ·  COYOTE TIME',W/2,H*0.61);
    if(Math.floor(tick/30)%2){
      ctx.fillStyle='#ffffff';ctx.font=`${Math.round(W*0.042)}px Bungee,sans-serif`;
      ctx.fillText('TAP TO START',W/2,H*0.70);
    }
    ctx.textAlign='left';return;
  }
  if(gameState==='GAMEOVER'){
    ctx.fillStyle='rgba(2,2,20,0.82)';ctx.fillRect(0,H*0.28,W,H*0.48);
    ctx.fillStyle='#ff3333';ctx.font=`bold ${Math.round(W*0.078)}px Bungee,sans-serif`;
    ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H*0.49);
    ctx.fillStyle=C.scoreC;ctx.font=`${Math.round(W*0.04)}px Bungee,sans-serif`;
    ctx.fillText('SCORE  '+score,W/2,H*0.60);
    if(Math.floor(tick/30)%2){
      ctx.fillStyle='#fff';ctx.font=`${Math.round(W*0.038)}px Bungee,sans-serif`;
      ctx.fillText('TAP TO RETRY',W/2,H*0.70);
    }
    ctx.textAlign='left';return;
  }
  if(gameState==='CLEAR'){
    ctx.fillStyle='rgba(2,2,20,0.78)';ctx.fillRect(0,H*0.28,W,H*0.48);
    ctx.shadowColor=C.star;ctx.shadowBlur=16;
    ctx.fillStyle=C.star;ctx.font=`bold ${Math.round(W*0.085)}px Bungee,sans-serif`;
    ctx.textAlign='center';ctx.fillText('ESCAPED!',W/2,H*0.50);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font=`${Math.round(W*0.038)}px Bungee,sans-serif`;
    ctx.fillText('SCORE  '+score,W/2,H*0.62);ctx.textAlign='left';
  }
}

function rR(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

function startGame(){
  score=0;lives=3;level=1;timer=120;timerMs=0;
  buildLevel();gameState='PLAYING';
}
function endGame(){
  if(score>0)ArcadeScores.show({game:'jungle-hop',title:'JUNGLE-HOP',score:score,onClose:()=>{gameState='ATTRACT';buildLevel();}});
  else{gameState='ATTRACT';buildLevel();}
}

function resize(){
  W=document.body.clientWidth;H=document.body.clientHeight;
  canvas.width=W;canvas.height=H;scaleX=W/IW;scaleY=H/IH;
}
window.addEventListener('resize',resize);resize();

buildLevel();
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastTs<14)return; // ~70fps cap
  const dt=Math.min(ts-lastTs,50);lastTs=ts;
  tick++;
  tickStates();
  if(gameState==='PLAYING'||gameState==='DEAD')update(dt);
  else if(gameState==='ATTRACT'||gameState==='GAMEOVER'){
    attractUpdate();
    // hazards animate in attract too (no damage path — attract never calls hurt)
    for(const sp2 of LOGSPAWNS){sp2.next-=1;
      if(sp2.next<=0){LOGS.push({x:sp2.x1-14,y:GY-12,vx:-sp2.speed,r:7,rot:0});sp2.next=260;}}
    for(let i=LOGS.length-1;i>=0;i--){const L2=LOGS[i];L2.x+=L2.vx;L2.rot-=0.12;
      if(L2.x<-30)LOGS.splice(i,1);}
    for(const s2 of SNAKES){s2.x+=s2.dir*0.5;s2.walk++;
      if(s2.x<s2.x0)s2.dir=1;if(s2.x>s2.x1)s2.dir=-1;}
    for(const c2 of CROCS){c2.phase+=0.016;c2.open=Math.sin(c2.phase)>0.35;}
  }
  draw();
}
requestAnimationFrame(loop);

// Fullscreen on first touch (one-shot, same pattern as hop-man)
function tryFullscreen(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req)req.call(el).catch(()=>{});
}
document.addEventListener('touchend',function fsOnce(){tryFullscreen();document.removeEventListener('touchend',fsOnce);});
</script>
