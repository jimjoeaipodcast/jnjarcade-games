<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PUNTER PLACER</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  Osimo 2026-09-07: "make an html page, background image, full screen of the new
  arcade, then place the 9 punters on the 9 arcades, and allow me while on that
  page, to select a punter, move his sprite in position, pinch to enlarge shrink,
  and a submit button, then I come back here and tell you I submitted it."

  Drag to move, pinch to size, SUBMIT posts to /api/punters (SUBMISSIONS KV).
  Claude reads it back and writes the numbers into the-count.html.

  Everything is drawn in the game's own 960x540 world at the game's own scale, so
  what is placed here is exactly what appears in the game — no conversion step to
  get wrong. Art comes from the live pack, so the hall and the sprites are always
  whatever the game currently ships.
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0904; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none;
               font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; color: #e8c35a; }
  #c { display: block; position: fixed; left: 0; top: 0; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center;
         gap: 8px; padding: 8px 12px; z-index: 5; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; background: linear-gradient(rgba(6,5,4,.85), rgba(6,5,4,0)); }
  #bot { bottom: 0; background: linear-gradient(rgba(6,5,4,0), rgba(6,5,4,.9)); }
  button { font: bold 15px/1 'Barlow Condensed', sans-serif; letter-spacing: .05em;
           padding: 11px 15px; border-radius: 9px; border: 1.5px solid #e8c35a66;
           background: #1a1409; color: #e8c35a; cursor: pointer; }
  button:active { background: #2c2110; }
  button.go { background: #e8c35a; color: #241a06; border-color: #e8c35a; }
  button.ghost { border-color: #ffffff33; color: #cfc6b4; }
  #sel { font-size: 15px; letter-spacing: .04em; color: #fff3d0; min-width: 0;
         flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint { font-size: 13px; color: #a99b80; }
  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
           background: rgba(10,8,4,.95); border: 2px solid #e8c35a; border-radius: 14px;
           padding: 20px 26px; font-size: 18px; text-align: center; z-index: 9;
           display: none; max-width: 80vw; }
  #rot { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rot { display: flex; position: fixed; inset: 0; z-index: 40; flex-direction: column;
           align-items: center; justify-content: center; gap: 18px; background: #0b0904;
           text-align: center; padding: 24px; }
    #rot .ph { font-size: 62px; }
    #c, .bar { display: none !important; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph">📱</div><h2>TURN YOUR PHONE</h2>
  <p style="color:#9aa;font-size:13px">The big room is sideways.</p></div>
<div class="bar" id="top">
  <div id="sel">TAP A PUNTER</div>
  <button class="ghost" id="prev">‹</button>
  <button class="ghost" id="next">›</button>
</div>
<div class="bar" id="bot">
  <button class="ghost" id="smaller">− SIZE</button>
  <button class="ghost" id="bigger">+ SIZE</button>
  <span id="hint">drag to move · pinch to size</span>
  <span style="flex:1"></span>
  <button class="ghost" id="reset">RESET</button>
  <button class="go" id="submit">SUBMIT</button>
</div>
<div id="toast"></div>
<script>
(function () {
'use strict';
// LOCKED is flipped to true once Osimo's layout has been read out and shipped into the
// game (Osimo 2026-09-07: "once I submit any one, we update our game and remove the submit
// button from the page so patreons can just play around with the sprites"). The page then
// stops being a work order and becomes a toy: everything still drags and pinches, nothing
// is sent anywhere. ?edit=1 puts the button back for the next round of placement.
// ?room=hall (the big room, default) or ?room=corridor (the first arcade). One page, one
// endpoint, a layout per room — Osimo 2026-09-07: "can we use the Placer for the other
// arcade please too."
const QS = new URLSearchParams(location.search);
const ROOM = QS.get('room') === 'corridor' ? 'corridor' : 'hall';
// LOCKED is per room: the big room's layout is placed and shipped, the corridor's is not.
const LOCKED = ROOM === 'hall';
const EDIT = QS.get('edit') === '1';
const W = 960, H = 540;                       // the game's world, one to one
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let DPR = 1, VIEW = { scale: 1, ox: 0, oy: 0 };

// The nine hall machines, in the order they are declared in the game's HALL_MACHINES.
// These are the CURRENT values — the tool opens on exactly what the game draws today, so
// Osimo is adjusting the real thing rather than starting from nothing.
// TWELVE, in the game's own HALL_MACHINES order, with the facing Osimo drew on 2026-09-07:
// "5 on the left facing left, and 6 on the right facing right", plus the one at the back
// wall beside the cash machine — the only one whose back we see. `face` picks BOTH the
// sprite set and the mirroring here exactly as it does in the game, so a punter in this
// tool can never be facing a different way from the same punter in the arcade.
// ELEVEN — Osimo's own placement, submitted 2026-09-07 and shipped. He corrected the count
// while he was in here ("I told you to add 5 on the left but it was indeed 4"), so the
// far-end left cabinet and its punter are gone. These numbers ARE the game's numbers.
const DEFAULTS = [
  { label: 'LEFT 1 — BY THE DOOR', x: 178, feet: 490, h: 286, face: 'left'  },
  { label: 'LEFT 2',               x: 267, feet: 435, h: 221, face: 'left'  },
  { label: 'LEFT 3',               x: 312, feet: 385, h: 164, face: 'left'  },
  { label: 'LEFT 4 — FAR END',     x: 345, feet: 358, h: 124, face: 'left'  },
  { label: 'BACK WALL (his back)', x: 404, feet: 344, h: 109, face: 'back'  },
  { label: 'THE PINBALL TABLE',    x: 533, feet: 353, h:  98, face: 'right' },
  { label: 'RIGHT 5 — FAR END',    x: 611, feet: 350, h: 113, face: 'right' },
  { label: 'RIGHT 4',              x: 631, feet: 373, h: 144, face: 'right' },
  { label: 'RIGHT 3',              x: 665, feet: 397, h: 172, face: 'right' },
  { label: 'RIGHT 2',              x: 708, feet: 428, h: 212, face: 'right' },
  { label: 'RIGHT 1 — BY THE DOOR',x: 776, feet: 482, h: 286, face: 'right' },
];
// THE FIRST ARCADE — the five corridor machines, as the game has them today. All five face
// left into their cabinets, the way that room's art is angled.
// Read straight off the game's MACHINES table, so RESET really is "back to the game".
const CORRIDOR = [
  { label: 'CABINET 1 — NEAREST',     x: 268, feet: 416, h: 225, face: 'left'  },
  { label: 'CABINET 2',               x: 327, feet: 361, h: 166, face: 'left'  },
  { label: 'CABINET 3',               x: 363, feet: 329, h: 121, face: 'left'  },
  { label: 'CABINET 4 — FAR END',     x: 397, feet: 309, h:  97, face: 'left'  },
  { label: 'CABINET 5 — THE RED ONE', x: 690, feet: 411, h: 216, face: 'right' },
];
const ROOMS = { hall: DEFAULTS, corridor: CORRIDOR };
const BACKS  = ['punterBackA', 'punterBackB', 'punterBackC'];
const FRONTS = ['punter34A', 'punter34B', 'punter34C'];
const SPRITES = [...BACKS, ...FRONTS];
const START = ROOMS[ROOM];
let punters = START.map((d, i) => ({
  ...d,
  flip: d.face === 'right',
  spr: (d.face === 'back' ? BACKS : FRONTS)[i % 3],
}));
let sel = 0, hall = null, SPR = {}, ready = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(document.documentElement.clientWidth);
  const h = Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  // CONTAIN: the whole room has to be visible or you cannot place what you cannot see
  VIEW.scale = Math.min(canvas.width / W, canvas.height / H);
  VIEW.ox = Math.round((canvas.width - W * VIEW.scale) / 2);
  VIEW.oy = Math.round((canvas.height - H * VIEW.scale) / 2);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
setInterval(resize, 300);
resize();

function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top) * DPR - VIEW.oy) / VIEW.scale };
}

// ── art, straight from the game's own pack ──────────────────────────────────
fetch('../games/the-count-pack.json?v=17').then(r => r.json()).then(p => {
  const mk = (src, cb) => { const im = new Image(); im.onload = () => cb(im); im.src = src; };
  mk(p.art[ROOM], im => { hall = im; });
  for (const k of SPRITES) if (p.sprites[k]) mk(p.sprites[k], im => { SPR[k] = im; });
  ready = true;
}).catch(() => toast('Could not load the art pack.'));

// ── a layout already submitted wins over the defaults, AND retires the button ─
// Osimo 2026-09-07: "I pressed submit, and the submit button should have vanished unless I
// ask you to add it again, but after you hide it once it needs to auto delete so no more
// submissions are made and html record for patreon list." So one submission closes the
// page: SUBMIT goes on the next load and stays gone. Only a write by HIM counts — my own
// resets are tagged differently so they cannot lock the page by accident. ?edit=1 reopens.
fetch('/api/punters?room=' + ROOM).then(r => r.json()).then(d => {
  if (!d || !Array.isArray(d.punters)) return;
  if (d.punters.length === punters.length) {
    d.punters.forEach((p, i) => {
      punters[i].x = p.x; punters[i].feet = p.feet; punters[i].h = p.h;
      if (typeof p.flip === 'boolean') punters[i].flip = p.flip;
    });
    updateSel();
  }
  if (d.by === 'osimo' && d.savedAt) retireSubmit();
}).catch(() => {});
function retireSubmit() {
  if (EDIT) return;
  const b = document.getElementById('submit');
  if (b) b.remove();
  document.getElementById('hint').textContent = 'submitted · drag · pinch · play about with it';
}

function drawPunter(p, on) {
  const im = SPR[p.spr];
  if (!im) return;
  const w = im.width * (p.h / im.height);
  ctx.save();
  if (p.flip) { ctx.translate(p.x * 2, 0); ctx.scale(-1, 1); }
  ctx.drawImage(im, p.x - w / 2, p.feet - p.h, w, p.h);
  ctx.restore();
  if (on) {
    ctx.save();
    ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
    ctx.strokeRect(p.x - w / 2 - 4, p.feet - p.h - 4, w + 8, p.h + 8);
    ctx.setLineDash([]);
    // the foot line, because the feet are the thing that has to sit on the floor
    ctx.strokeStyle = 'rgba(255,215,94,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x - w, p.feet); ctx.lineTo(p.x + w, p.feet); ctx.stroke();
    ctx.restore();
  }
}

function frame() {
  requestAnimationFrame(frame);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0904'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  if (hall) ctx.drawImage(hall, 0, 0, W, H);
  // painter's order, exactly as the game does it: furthest feet first
  const order = punters.map((p, i) => i).sort((a, b) => punters[a].feet - punters[b].feet);
  for (const i of order) drawPunter(punters[i], i === sel);
}
requestAnimationFrame(frame);

// ── input: drag to move, pinch to size ──────────────────────────────────────
let drag = null, pinch = null;
function pick(w) {
  let best = -1, bestD = 1e9;
  punters.forEach((p, i) => {
    const im = SPR[p.spr]; if (!im) return;
    const pw = im.width * (p.h / im.height);
    const inside = w.x > p.x - pw / 2 - 8 && w.x < p.x + pw / 2 + 8 &&
                   w.y > p.feet - p.h - 8 && w.y < p.feet + 8;
    if (!inside) return;
    const d = Math.hypot(w.x - p.x, w.y - (p.feet - p.h / 2));
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}
function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    pinch = { d: dist(e.touches[0], e.touches[1]), h: punters[sel].h };
    drag = null;
    return;
  }
  const w = toWorld(e.touches[0].clientX, e.touches[0].clientY);
  const hit = pick(w);
  if (hit >= 0) { sel = hit; updateSel(); }
  drag = { dx: w.x - punters[sel].x, dy: w.y - punters[sel].feet };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length === 2) {
    const d = dist(e.touches[0], e.touches[1]);
    punters[sel].h = Math.max(30, Math.min(420, Math.round(pinch.h * (d / pinch.d))));
    updateSel();
    return;
  }
  if (!drag || !e.touches.length) return;
  const w = toWorld(e.touches[0].clientX, e.touches[0].clientY);
  punters[sel].x = Math.round(w.x - drag.dx);
  punters[sel].feet = Math.round(w.y - drag.dy);
  updateSel();
}, { passive: false });

canvas.addEventListener('touchend', e => { if (!e.touches.length) { drag = null; pinch = null; } });

// mouse, so this is usable on a desktop too
canvas.addEventListener('mousedown', e => {
  const w = toWorld(e.clientX, e.clientY);
  const hit = pick(w);
  if (hit >= 0) { sel = hit; updateSel(); }
  drag = { dx: w.x - punters[sel].x, dy: w.y - punters[sel].feet };
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const w = toWorld(e.clientX, e.clientY);
  punters[sel].x = Math.round(w.x - drag.dx);
  punters[sel].feet = Math.round(w.y - drag.dy);
  updateSel();
});
window.addEventListener('mouseup', () => { drag = null; });
window.addEventListener('wheel', e => {
  punters[sel].h = Math.max(30, Math.min(420, punters[sel].h - Math.sign(e.deltaY) * 4));
  updateSel();
}, { passive: true });
// arrow keys for the last pixel
window.addEventListener('keydown', e => {
  const p = punters[sel], step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft')  p.x -= step;
  else if (e.key === 'ArrowRight') p.x += step;
  else if (e.key === 'ArrowUp')    p.feet -= step;
  else if (e.key === 'ArrowDown')  p.feet += step;
  else if (e.key === '[') p.h -= step;
  else if (e.key === ']') p.h += step;
  else return;
  e.preventDefault(); updateSel();
});

function updateSel() {
  const p = punters[sel];
  document.getElementById('sel').textContent =
    (sel + 1) + '/' + punters.length + '  ' + p.label + '   x' + Math.round(p.x) +
    ' feet' + Math.round(p.feet) + ' h' + Math.round(p.h);
}
updateSel();

document.getElementById('prev').onclick = () => { sel = (sel + punters.length - 1) % punters.length; updateSel(); };
document.getElementById('next').onclick = () => { sel = (sel + 1) % punters.length; updateSel(); };
document.getElementById('bigger').onclick  = () => { punters[sel].h = Math.min(420, punters[sel].h + 6); updateSel(); };
document.getElementById('smaller').onclick = () => { punters[sel].h = Math.max(30, punters[sel].h - 6); updateSel(); };
document.getElementById('reset').onclick = () => {
  punters = START.map((d, i) => ({ ...d, flip: d.face === 'right',
                                   spr: (d.face === 'back' ? BACKS : FRONTS)[i % 3] }));
  updateSel(); toast('Back to the current game positions.', 1400);
};

if (LOCKED && !EDIT) retireSubmit();
let toastT = 0;
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.display = 'none'; }, ms || 2600);
}

// LOCKED removes the button before this line runs, so the handler has to tolerate its
// absence — binding onclick on null threw on every locked load.
const submitBtn = document.getElementById('submit');
if (submitBtn) submitBtn.onclick = async () => {
  const btn = submitBtn;
  btn.disabled = true; btn.textContent = 'SENDING…';
  try {
    const r = await fetch('/api/punters', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        by: 'osimo', room: ROOM,
        punters: punters.map(p => ({ x: Math.round(p.x), feet: Math.round(p.feet),
                                     h: Math.round(p.h), flip: p.flip })),
      }),
    });
    const d = await r.json();
    if (d.ok) {
      toast('SUBMITTED ✅\nTell Claude and he will put it in the game.', 5000);
      retireSubmit();                    // one submission closes the page
      return;
    }
    toast('Did not save: ' + (d.error || r.status), 5000);
  } catch (e) {
    toast('Did not save: ' + e.message, 5000);
  }
  btn.disabled = false; btn.textContent = 'SUBMIT';
};
})();
</script>
</body>
</html>
