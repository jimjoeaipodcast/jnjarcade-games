<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DEAD AIR — JnJ Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ff8c1a;
    --dim: #5c3204;
    --pit: #0a0602;
    --accent: #ff2d8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100dvh; overflow: hidden;
    background: var(--pit);
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: 'Barlow Condensed', sans-serif;
    color: #f2e9d8;
  }
  .game-shell {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; width: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px 6px;
  }
  header .back {
    font-family: 'Bungee', cursive; font-size: 11px; color: var(--ink);
    text-decoration: none; opacity: .8;
  }
  header .title {
    font-family: 'Bungee', cursive; font-size: 15px; color: var(--ink);
    text-shadow: 0 0 12px rgba(255,140,26,.6);
  }
  header .score {
    font-family: 'Bungee', cursive; font-size: 13px; color: #fff;
  }
  #hud {
    flex-shrink: 0;
    display: flex; gap: 12px; align-items: center;
    padding: 4px 14px 8px;
    font-size: 13px; letter-spacing: 1px;
  }
  #hud .meter-label { color: #b8ad97; }
  #meter-wrap {
    flex: 1; height: 10px; background: #1a1208;
    border: 1px solid var(--dim); border-radius: 5px; overflow: hidden;
  }
  #meter {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff3355, var(--ink), #7dff5a);
    transition: width .2s;
  }
  #night { color: var(--ink); font-weight: 700; }
  #mute {
    flex-shrink: 0;
    background: none; border: 1px solid var(--dim); border-radius: 6px;
    color: var(--ink); font-size: 16px; padding: 2px 8px; cursor: pointer;
  }
  #wrap {
    flex: 1; position: relative; overflow: hidden;
    padding: 14px 6px;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #0d0803;
    border-radius: 8px;
    box-shadow: 0 0 24px rgba(255,140,26,.18), inset 0 0 40px rgba(0,0,0,.6);
  }
  /* coin overlay */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  .otitle {
    font-family: 'Bungee', sans-serif; font-size: clamp(34px,9vw,64px);
    color: var(--accent); text-shadow: 0 0 24px var(--accent), 0 0 48px var(--accent);
  }
  .osub {
    font-family: 'Bungee', sans-serif; font-size: 13px; color: #cc44ff; opacity: .85;
    letter-spacing: 2px;
  }
  .oinfo {
    margin-top: 18px; font-size: 15px; color: #b8ad97; max-width: 320px; line-height: 1.4;
  }
  .oinfo b { color: var(--ink); }
  #coin {
    font-family: 'Bungee', sans-serif; color: var(--accent); letter-spacing: 4px;
    border: 3px solid var(--accent); padding: 14px 32px; border-radius: 8px;
    box-shadow: 0 0 20px rgba(255,45,138,.5);
    animation: blink 1.1s steps(2,start) infinite; cursor: pointer; margin-top: 26px;
  }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<div class="game-shell">
  <header>
    <a class="back" href="../wip.html">← ARCADE</a>
    <div class="title">DEAD AIR</div>
    <div class="score" id="score">0</div>
  </header>
  <div id="hud">
    <span class="meter-label">ON AIR</span>
    <div id="meter-wrap"><div id="meter"></div></div>
    <span id="night">NIGHT 1</span>
    <button id="mute" aria-label="mute">🔊</button>
  </div>
  <div id="wrap"><canvas id="cv"></canvas></div>
</div>

<div id="overlay">
  <div class="otitle">DEAD AIR</div>
  <div class="osub">TAPPER × ZOMBIE HORDE</div>
  <div class="oinfo">
    Graveyard shift at the JnJ studio.<br>
    <b>Swipe DOWN</b> = slide coffee to real callers.<br>
    <b>Swipe UP</b> = dump static zombies.<br>
    Don't let the line go <b>DEAD AIR</b>.
  </div>
  <div id="coin">TAP TO INSERT COIN</div>
</div>

<script src="arcade-scores.js?v=10"></script>
<script>
'use strict';

/* ── setup ─────────────────────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const scoreEl = document.getElementById('score');
const meterEl = document.getElementById('meter');
const nightEl = document.getElementById('night');
const muteBtn = document.getElementById('mute');

const LANES = 4;
let W = 0, H = 0, CELL = 0;

/* ── audio (WebAudio synth, house style) ───────────────── */
let AC = null, muted = localStorage.getItem('deadair_mute') === '1';
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}
function blip(freq, dur, type, vol, slide) {
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function hiss(dur, vol) {
  if (muted) return;
  try {
    const a = ac(), len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol || 0.15;
    src.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
const sfx = {
  serve:  () => blip(880, .12, 'square', .10, 1320),
  dump:   () => { blip(220, .08, 'square', .12, 110); setTimeout(() => blip(440, .06, 'sine', .08), 60); },
  zombie: () => hiss(.25, .18),
  hit:    () => { hiss(.4, .25); blip(110, .3, 'sawtooth', .15, 55); },
  night:  () => { blip(523,.12,'square',.1); setTimeout(()=>blip(659,.12,'square',.1),120); setTimeout(()=>blip(784,.2,'square',.12),240); },
  over:   () => { blip(392,.3,'sawtooth',.15,196); setTimeout(()=>blip(196,.5,'sawtooth',.12,98),250); },
};
function setMute(m) {
  muted = m; localStorage.setItem('deadair_mute', m ? '1' : '0');
  muteBtn.textContent = m ? '🔇' : '🔊';
}
muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.addEventListener('click', (e) => { e.stopPropagation(); setMute(!muted); });

/* ── state ─────────────────────────────────────────────── */
let running = false, gameOver = false;
let score = 0, meter = 100, night = 1;
let internLane = 1;
let callers = [];     // {lane, x(0..1), speed, zombie, served, staticT}
let mugs = [];        // {lane, x, speed}
let spawnT = 0, nightT = 0, lastT = 0;
let particles = [];   // {x,y,vx,vy,life,color}
const NIGHT_LEN = 60; // seconds per night

function baseSpawn() { return Math.max(0.55, 1.7 - night * 0.15); }
function zombieRatio() { return Math.min(0.65, 0.3 + night * 0.08); }
function callerSpeed() { return 0.05 + night * 0.008; }

/* ── resize ────────────────────────────────────────────── */
function resize() {
  const pad = 28;
  const availW = wrap.clientWidth - 12;
  const availH = wrap.clientHeight - pad - CELL * 2;
  W = Math.max(200, availW);
  H = Math.max(200, availH);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { if (running) resize(); });

/* ── lane geometry ─────────────────────────────────────── */
function laneY(i) { return (H / LANES) * i + (H / LANES) / 2; }

/* ── game logic ────────────────────────────────────────── */
function resetGame() {
  score = 0; meter = 100; night = 1;
  callers = []; mugs = []; particles = [];
  internLane = 1;
  spawnT = 0; nightT = 0;
  gameOver = false;
  scoreEl.textContent = '0';
  nightEl.textContent = 'NIGHT 1';
  meterEl.style.width = '100%';
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  resize();
  resetGame();
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
  try { ac().resume(); } catch (e) {}
}

function endGame() {
  gameOver = true; running = false;
  sfx.over();
  setTimeout(() => {
    if (window.ArcadeScores) {
      ArcadeScores.show({
        game: 'dead-air',
        title: 'DEAD AIR',
        score: score,
        accent: '#ff8c1a',
        onClose: () => {
          resetGame(); running = true; lastT = performance.now(); requestAnimationFrame(loop);
        },
      });
    } else {
      document.getElementById('overlay').classList.remove('hidden');
    }
  }, 900);
}

function spawnCaller() {
  const lane = Math.floor(Math.random() * LANES);
  const zombie = Math.random() < zombieRatio();
  callers.push({
    lane, zombie,
    x: 1.0,
    speed: callerSpeed() * (zombie ? 1.1 : 1.0) * (0.85 + Math.random() * 0.3),
    staticT: 0,
    wob: Math.random() * Math.PI * 2,
  });
  if (zombie) sfx.zombie();
}

function slideCoffee() {
  mugs.push({ lane: internLane, x: 0.08, speed: 0.9 });
  blip(660, .06, 'square', .07, 880);
}

function dumpCall() {
  // dump the closest zombie in intern's lane, else closest caller
  let idx = -1;
  for (let i = 0; i < callers.length; i++) {
    if (callers[i].lane === internLane && callers[i].zombie) {
      if (idx < 0 || callers[i].x < callers[idx].x) idx = i;
    }
  }
  if (idx >= 0) {
    const c = callers[idx];
    burst(c.x, laneY(c.lane), '#b76bff', 10);
    callers.splice(idx, 1);
    score += 150; scoreEl.textContent = score;
    sfx.dump();
  } else {
    blip(180, .08, 'square', .06); // dead click — no zombie on this line
  }
}

function burst(nx, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: nx * W, y,
      vx: (Math.random() - .5) * 160,
      vy: (Math.random() - .9) * 160,
      life: .5 + Math.random() * .3, color,
    });
  }
}

function update(dt) {
  nightT += dt;
  // night complete?
  if (nightT >= NIGHT_LEN) {
    nightT = 0; night++;
    score += 1000 * (night - 1);
    scoreEl.textContent = score;
    nightEl.textContent = 'NIGHT ' + night;
    sfx.night();
    burst(0.5, H / 2, '#ffcf3d', 30);
  }
  // spawn
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = baseSpawn() * (0.7 + Math.random() * 0.6);
    spawnCaller();
  }
  // callers advance
  for (let i = callers.length - 1; i >= 0; i--) {
    const c = callers[i];
    c.x -= c.speed * dt;
    c.wob += dt * 3;
    if (c.zombie) {
      c.staticT += dt;
      // zombies hiss louder as they approach
    }
    if (c.x <= 0.06) {
      // reached the console
      if (c.zombie) {
        meter -= 33;
        sfx.hit();
        burst(0.06, laneY(c.lane), '#ff3355', 20);
      } else {
        // living caller hung up angry — small drain
        meter -= 12;
        blip(150, .2, 'sawtooth', .12, 90);
        burst(0.06, laneY(c.lane), '#888', 8);
      }
      callers.splice(i, 1);
      meterEl.style.width = Math.max(0, meter) + '%';
      if (meter <= 0) { endGame(); return; }
    }
  }
  // mugs travel
  for (let i = mugs.length - 1; i >= 0; i--) {
    const m = mugs[i];
    m.x += m.speed * dt;
    // hit a caller?
    let hit = false;
    for (let j = callers.length - 1; j >= 0; j--) {
      const c = callers[j];
      if (c.lane === m.lane && !c.zombie && Math.abs(c.x - m.x) < 0.03) {
        score += 100; scoreEl.textContent = score;
        meter = Math.min(100, meter + 4);
        meterEl.style.width = meter + '%';
        burst(c.x, laneY(c.lane), '#7dff5a', 12);
        sfx.serve();
        callers.splice(j, 1);
        hit = true;
        break;
      }
      if (c.lane === m.lane && c.zombie && Math.abs(c.x - m.x) < 0.03) {
        // mug smashes on zombie — no effect but the mug dies
        hiss(.1, .08);
        hit = true;
        break;
      }
    }
    if (hit || m.x > 1.05) mugs.splice(i, 1);
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // passive meter regen (small — keeps hope alive)
  meter = Math.min(100, meter + dt * 0.6);
  meterEl.style.width = meter + '%';
}

/* ── drawing ───────────────────────────────────────────── */
function drawIntern(x, y, size) {
  // pixel intern with headphones
  const s = size;
  ctx.save();
  ctx.translate(x, y);
  // body
  ctx.fillStyle = '#4dd9f5';
  ctx.fillRect(-s * .35, -s * .1, s * .7, s * .5);
  // head
  ctx.fillStyle = '#f2c99a';
  ctx.fillRect(-s * .28, -s * .45, s * .56, s * .4);
  // headphones
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(-s * .34, -s * .5, s * .68, s * .12);
  ctx.fillRect(-s * .36, -s * .42, s * .1, s * .22);
  ctx.fillRect(s * .26, -s * .42, s * .1, s * .22);
  // eyes
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(-s * .16, -s * .32, s * .08, s * .08);
  ctx.fillRect(s * .08, -s * .32, s * .08, s * .08);
  // mic boom
  ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s * .3, -s * .28); ctx.lineTo(s * .42, -s * .18); ctx.stroke();
  ctx.restore();
}

function drawCaller(x, y, size, zombie, wob) {
  const s = size;
  ctx.save();
  ctx.translate(x, y + Math.sin(wob) * 2);
  if (zombie) {
    // static fuzz particles
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(183,107,255,' + (0.3 + Math.random() * 0.4) + ')';
      ctx.fillRect((Math.random() - .5) * s, (Math.random() - .5) * s * 1.2, 2, 2);
    }
    // body — desaturated shambler
    ctx.fillStyle = '#5a6a52';
    ctx.fillRect(-s * .3, -s * .05, s * .6, s * .45);
    ctx.fillStyle = '#8a9a7a';
    ctx.fillRect(-s * .25, -s * .42, s * .5, s * .4);
    // hollow eyes
    ctx.fillStyle = '#0c0514';
    ctx.fillRect(-s * .14, -s * .3, s * .1, s * .1);
    ctx.fillRect(s * .04, -s * .3, s * .1, s * .1);
    // static mouth
    ctx.fillStyle = '#b76bff';
    ctx.fillRect(-s * .1, -s * .12, s * .2, s * .04);
    // phone held wrong (upside down, zombie style)
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(s * .28, s * .05, s * .12, s * .2);
  } else {
    // living caller — warm, alive, holds phone to ear
    ctx.fillStyle = '#e8a13c';
    ctx.fillRect(-s * .3, -s * .05, s * .6, s * .45);
    ctx.fillStyle = '#f2c99a';
    ctx.fillRect(-s * .25, -s * .42, s * .5, s * .4);
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(-s * .14, -s * .3, s * .08, s * .08);
    ctx.fillRect(s * .06, -s * .3, s * .08, s * .08);
    // smile
    ctx.fillStyle = '#7a4a1a';
    ctx.fillRect(-s * .08, -s * .14, s * .16, s * .04);
    // phone to ear
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(s * .22, -s * .34, s * .1, s * .2);
  }
  ctx.restore();
}

function drawMug(x, y, size) {
  const s = size;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-s * .3, -s * .3, s * .55, s * .6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(s * .32, 0, s * .18, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.fillStyle = '#5c3204';
  ctx.fillRect(-s * .26, -s * .3, s * .47, s * .12);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // backdrop — studio wall
  ctx.fillStyle = '#0d0803';
  ctx.fillRect(0, 0, W, H);

  // ON AIR sign glow top-right
  ctx.save();
  ctx.font = '700 ' + Math.max(10, H * 0.022) + 'px Bungee, sans-serif';
  ctx.fillStyle = 'rgba(255,51,85,' + (0.55 + Math.sin(performance.now() / 300) * 0.25) + ')';
  ctx.textAlign = 'right';
  ctx.fillText('● ON AIR', W - 10, 22);
  ctx.restore();

  // lanes
  const laneH = H / LANES;
  for (let i = 0; i < LANES; i++) {
    const y = laneY(i);
    // console surface (the "bar")
    const grad = ctx.createLinearGradient(0, y - laneH * 0.32, 0, y + laneH * 0.32);
    grad.addColorStop(0, '#241605');
    grad.addColorStop(0.5, '#3a2410');
    grad.addColorStop(1, '#241605');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y - laneH * 0.32, W, laneH * 0.64);
    // phone-line LED strip
    ctx.fillStyle = i === internLane ? 'rgba(255,140,26,0.25)' : 'rgba(255,140,26,0.06)';
    ctx.fillRect(0, y + laneH * 0.3, W, 2);
    // line number + LED
    ctx.fillStyle = i === internLane ? '#ff8c1a' : '#5c3204';
    ctx.beginPath(); ctx.arc(14, y - laneH * 0.22, 4, 0, Math.PI * 2); ctx.fill();
    ctx.font = '700 11px Barlow Condensed, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#b8ad97';
    ctx.fillText('LINE ' + (i + 1), 26, y - laneH * 0.22 + 4);
  }

  const cSize = Math.min(laneH * 0.5, 46);

  // mugs
  for (const m of mugs) drawMug(m.x * W, laneY(m.lane), cSize * 0.5);

  // callers
  for (const c of callers) drawCaller(c.x * W, laneY(c.lane), cSize, c.zombie, c.wob);

  // intern (console operator, left edge)
  drawIntern(0.05 * W + cSize * 0.2, laneY(internLane), cSize * 1.1);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ── loop ──────────────────────────────────────────────── */
function loop(t) {
  if (!running) return;
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  update(dt);
  if (!running) return; // endGame fired inside update
  draw();
  requestAnimationFrame(loop);
}

/* ── input ─────────────────────────────────────────────── */
let touchStartX = 0, touchStartY = 0, touchLane = -1;
function laneFromY(py) {
  const r = cv.getBoundingClientRect();
  const y = py - r.top;
  return Math.max(0, Math.min(LANES - 1, Math.floor(y / (r.height / LANES))));
}

document.addEventListener('touchstart', (e) => {
  if (!running) return;
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchLane = laneFromY(t.clientY);
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (running) e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!running) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < 18) {
    // tap = move intern to tapped lane
    internLane = laneFromY(t.clientY);
    blip(520, .05, 'square', .05);
    return;
  }
  if (ady > adx) {
    internLane = touchLane >= 0 ? touchLane : internLane;
    if (dy > 0) slideCoffee(); else dumpCall();
  }
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (!running) return;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    internLane = Math.max(0, internLane - 1);
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    internLane = Math.min(LANES - 1, internLane + 1);
  } else if (e.key === ' ') {
    slideCoffee(); e.preventDefault();
  } else if (e.key === 'x' || e.key === 'X') {
    dumpCall();
  }
});

/* ── boot ──────────────────────────────────────────────── */
document.getElementById('coin').addEventListener('click', () => {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  startGame();
});

resize(); // initial size for behind the overlay
</script>
</body>
</html>
