<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1405">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Snake Blaster — JnJ Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* landing-cabinet world: acid green on warm pit */
    :root {
      --accent: #5af23a;
      --dim:    #1d4a12;
      --bg:     #0a1405;
      --shell:  #0e0b07;
      --cream:  #f2e9d8;
      --cream-dim: #b8ad97;
      --fire:   #ff6a3d;
      --border: rgba(90,242,58,0.22);
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--cream);
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none;
    }

    .game-shell {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      max-width: 500px; margin: 0 auto;
      padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0)
               env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }

    /* Header — cabinet marquee strip */
    .game-header {
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 14px 8px;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.2));
      border-bottom: 2px solid var(--dim); gap: 8px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 3px; color: var(--accent);
      font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
      padding: 5px 8px 5px 2px; cursor: pointer; text-decoration: none; flex-shrink: 0;
    }
    .back-chevron { font-size: 18px; }
    .hdr-center { flex: 1; text-align: center; }
    .game-name {
      font-family: 'Bungee', cursive; font-size: 13px; letter-spacing: 0.18em;
      color: var(--accent); text-shadow: 0 0 12px rgba(90,242,58,0.4);
    }
    .game-level { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--cream-dim); margin-top: 2px; }
    .hdr-right { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; min-width: 80px; }
    .score-label { font-size: 10px; font-weight: 800; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 0.16em; }
    .score-val { font-size: 19px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .lives-row { display: flex; gap: 2px; margin-top: 2px; }
    .life-heart { font-size: 10px; transition: opacity 0.3s; }
    .life-heart.dead { opacity: 0.15; }

    /* HUD bar under header */
    .hud-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 5px 14px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border);
    }
    .gun-display { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
    .gun-icon { font-size: 13px; }
    .gun-name { font-weight: 800; color: var(--cream); }
    .gun-pips { display: flex; gap: 2px; }
    .gun-pip { width: 6px; height: 6px; border-radius: 50%; background: rgba(242,233,216,0.15); }
    .gun-pip.active { background: #ffd23d; box-shadow: 0 0 4px #ffd23d; }
    .level-progress { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--cream-dim); }
    .prog-bar { width: 70px; height: 5px; background: rgba(242,233,216,0.1); border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

    /* Canvas */
    .canvas-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 6px; position: relative; overflow: hidden;
    }
    canvas { display: block; border-radius: 10px; image-rendering: pixelated; touch-action: none; }

    /* Controls */
    .controls {
      flex-shrink: 0; padding: 6px 20px max(12px, env(safe-area-inset-bottom,12px));
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .ctrl-row { display: flex; gap: 4px; }
    /* cabinet buttons: chunky, physical press */
    .ctrl-btn {
      width: 54px; height: 54px; background: rgba(90,242,58,0.08);
      border: 2px solid var(--dim); border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; transition: transform 0.06s, box-shadow 0.06s;
      -webkit-tap-highlight-color: transparent; color: var(--cream);
      box-shadow: 0 4px 0 rgba(0,0,0,0.55);
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(90,242,58,0.22); border-color: var(--accent);
      transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.55);
    }
    .fire-btn {
      background: rgba(255,106,61,0.16); border-color: #571508; font-size: 22px;
    }
    .fire-btn:active, .fire-btn.pressed {
      background: rgba(255,106,61,0.45); border-color: var(--fire);
    }
    .ctrl-spacer { width: 52px; height: 52px; }

    /* Overlays — attract-screen style */
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: rgba(10,20,5,0.92);
      border-radius: 10px; padding: 20px; text-align: center;
    }
    .overlay.hidden { display: none; }
    .overlay-emoji { font-size: 52px; line-height: 1; }
    .overlay-title {
      font-family: 'Bungee', cursive; font-size: 22px; color: var(--cream);
      text-shadow: 0 3px 0 rgba(0,0,0,0.55), 0 0 26px rgba(90,242,58,0.25);
    }
    .overlay-sub { font-size: 16px; font-weight: 600; color: var(--cream-dim); line-height: 1.55; max-width: 270px; }
    .overlay-score { font-size: 46px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .play-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--accent); color: var(--shell);
      font-family: 'Bungee', cursive; font-size: 15px;
      padding: 15px 34px 12px; border-radius: 12px; cursor: pointer; border: none;
      transition: transform 0.06s, box-shadow 0.06s; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 0 var(--dim);
    }
    .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dim); }
    .hs-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,210,61,0.14); border: 1px solid rgba(255,210,61,0.35);
      color: #ffd23d; font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
      padding: 4px 11px; border-radius: 20px;
    }

    /* Level complete overlay */
    .level-badge {
      background: rgba(90,242,58,0.12); border: 1px solid rgba(90,242,58,0.35);
      color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
      padding: 5px 13px; border-radius: 20px;
    }

    /* HUD message flash */
    .hud-msg {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); color: var(--cream); font-size: 14px; font-weight: 800;
      letter-spacing: 0.08em;
      padding: 6px 15px; border-radius: 20px; pointer-events: none;
      transition: opacity 0.4s; white-space: nowrap; z-index: 10;
    }
    .hud-msg.hidden { opacity: 0; }
  </style>
</head>
<body>
<div class="game-shell">

  <header class="game-header">
    <a class="back-btn" href="../index.html"><span class="back-chevron">‹</span>ARCADE</a>
    <div class="hdr-center">
      <div class="game-name">SNAKE BLASTER</div>
      <div class="game-level" id="levelLabel">Level 1</div>
    </div>
    <div class="hdr-right">
      <div class="score-label">Score</div>
      <div class="score-val" id="scoreDisplay">0</div>
      <div class="lives-row" id="livesRow"></div>
    </div>
  </header>

  <div class="hud-bar">
    <div class="gun-display">
      <span class="gun-icon">🔫</span>
      <span class="gun-name" id="gunName">Basic</span>
      <div class="gun-pips" id="gunPips"></div>
    </div>
    <div class="level-progress">
      <span id="progLabel">0/10</span>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div class="hud-msg hidden" id="hudMsg"></div>

    <div class="overlay" id="startOverlay">
      <div class="overlay-emoji">🐍💥</div>
      <div class="overlay-title">SNAKE BLASTER</div>
      <div class="overlay-sub">
        SNAKE × ARKANOID<br>
        Shoot pellets to grow · Blast the brick wall (+2)<br>
        5 lives · Wall, brick or self = &minus;1 life + halved
      </div>
      <button class="play-btn" id="startBtn">INSERT COIN</button>
      <div style="font-size:11px;color:rgba(255,255,255,0.35)" id="startBest"></div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="overlay-emoji" id="goEmoji">💀</div>
      <div class="overlay-title" id="goTitle">Game Over</div>
      <div class="overlay-score" id="goScore">0</div>
      <div class="hs-badge" id="goBest" style="display:none">🏆 New High Score!</div>
      <div class="overlay-sub" id="goSub"></div>
      <button class="play-btn" id="retryBtn">↺ Try Again</button>
    </div>

    <div class="overlay hidden" id="levelOverlay">
      <div class="overlay-emoji">🎉</div>
      <div class="overlay-title" id="loTitle">Level Complete!</div>
      <div class="level-badge" id="loBadge">+5 Lives</div>
      <div class="overlay-sub" id="loSub"></div>
    </div>

  </div>

  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-spacer"></div>
      <button class="ctrl-btn" data-dir="UP">▲</button>
      <div class="ctrl-spacer"></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" data-dir="LEFT">◀</button>
      <button class="ctrl-btn fire-btn" id="fireBtn">🔥</button>
      <button class="ctrl-btn" data-dir="RIGHT">▶</button>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-spacer"></div>
      <button class="ctrl-btn" data-dir="DOWN">▼</button>
      <div class="ctrl-spacer"></div>
    </div>
  </div>

</div>
<script src="arcade-scores.js"></script>
<script>
(function () {
'use strict';

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const CELL       = 18;
const FOOD_COUNT = 4;   // dots on screen at once
const MAX_LIVES  = 9;
const GUN_MAX    = 5;

// Color themes per level (cycles)
// Level themes cycle; theme 1 matches the landing-page cabinet world
const THEMES = [
  { bg:'#0a1405', grid:'rgba(90,242,58,0.05)',   snake:'#5af23a', head:'#9cff7a', food:'#f2e9d8', wall:'#5af23a', wallGlow:'rgba(90,242,58,0.7)'  },
  { bg:'#160806', grid:'rgba(255,106,61,0.05)',  snake:'#ff6a3d', head:'#ffa07a', food:'#f2e9d8', wall:'#ff6a3d', wallGlow:'rgba(255,106,61,0.7)' },
  { bg:'#14100a', grid:'rgba(255,210,61,0.05)',  snake:'#ffd23d', head:'#ffe48a', food:'#f2e9d8', wall:'#ffd23d', wallGlow:'rgba(255,210,61,0.7)' },
  { bg:'#0a0f14', grid:'rgba(74,215,255,0.05)',  snake:'#4ad7ff', head:'#9ae8ff', food:'#f2e9d8', wall:'#4ad7ff', wallGlow:'rgba(74,215,255,0.7)' },
  { bg:'#120a14', grid:'rgba(191,90,242,0.05)',  snake:'#bf5af2', head:'#d99af7', food:'#f2e9d8', wall:'#bf5af2', wallGlow:'rgba(191,90,242,0.7)' },
];

// Gun tiers: [name, color, pellet count, spread deg, pixel speed, cooldown ms]
const GUNS = [
  { name:'Basic',   color:'#ffff55', count:1, spread:0,  spd:7,  cd:480, auto:true },
  { name:'Double',  color:'#ffbb00', count:2, spread:18, spd:8,  cd:380, auto:true },
  { name:'Triple',  color:'#ff7700', count:3, spread:26, spd:9,  cd:300, auto:true },
  { name:'Rapid',   color:'#ff3300', count:1, spread:0,  spd:12, cd:140, auto:true },
  { name:'Blaster', color:'#ff44ff', count:3, spread:26, spd:14, cd:90,  auto:true },
];

const PU_TYPES = ['gun','gun','gun','life','rapid']; // gun drops more common

// ─── DOM ──────────────────────────────────────────────────────────────────────
const canvas     = document.getElementById('gameCanvas');
const ctx        = canvas.getContext('2d');
const scoreEl    = document.getElementById('scoreDisplay');
const livesRow   = document.getElementById('livesRow');
const levelLabel = document.getElementById('levelLabel');
const gunName    = document.getElementById('gunName');
const gunPips    = document.getElementById('gunPips');
const progLabel  = document.getElementById('progLabel');
const progFill   = document.getElementById('progFill');
const hudMsg     = document.getElementById('hudMsg');
const startOverlay    = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const levelOverlay    = document.getElementById('levelOverlay');

// ─── STATE ────────────────────────────────────────────────────────────────────
let cols, rows;
let snake, dir, nextDir;
let food, powerUps, pellets;
let bricks;                    // Set("c,r") — arkanoid wall, rows 0-2
const BRICK_ROWS = 3;
let score, highScore, lives;
let level, levelScore, levelTarget;
let gunTier, levelStartGun;
let snakeInterval, lastTick, snakeTicker;
let perimPh = 0;
let glitching = false, glitchFrames = 0;
let lastFireTime = 0;
let rapidFireEnd = 0;
let running = false, animId;
let msgTimer = null;
let theme;
let growPending = 0;

// ─── SIZING ───────────────────────────────────────────────────────────────────
function resize() {
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth  - 12;
  const h = wrap.clientHeight - 12;
  cols = Math.floor(w / CELL);
  rows = Math.floor(h / CELL);
  canvas.width  = cols * CELL;
  canvas.height = rows * CELL;
  canvas.style.width  = canvas.width  + 'px';
  canvas.style.height = canvas.height + 'px';
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  scoreEl.textContent = score;
  levelLabel.textContent = 'Level ' + level;
  document.documentElement.style.setProperty('--accent', theme.snake);

  // Lives hearts
  livesRow.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('span');
    h.className = 'life-heart' + (i >= lives ? ' dead' : '');
    h.textContent = '❤️';
    livesRow.appendChild(h);
  }

  // Gun pips
  const g = GUNS[gunTier - 1];
  gunName.textContent = g.name;
  gunName.style.color = g.color;
  gunPips.innerHTML = '';
  for (let i = 0; i < GUN_MAX; i++) {
    const p = document.createElement('div');
    p.className = 'gun-pip' + (i < gunTier ? ' active' : '');
    if (i < gunTier) p.style.background = p.style.boxShadow = '';
    if (i < gunTier) p.style.background = g.color;
    gunPips.appendChild(p);
  }

  // Level progress — snake length toward filling screen
  const maxLen = (cols && rows) ? maxSnakeLength() : 1;
  const curLen = snake ? snake.length : 0;
  const pct = Math.min(100, Math.round(curLen / maxLen * 100));
  progLabel.textContent = curLen + '/' + maxLen;
  progFill.style.width  = pct + '%';
  progFill.style.background = theme.snake;
}

function showMsg(text, duration) {
  hudMsg.textContent = text;
  hudMsg.classList.remove('hidden');
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => hudMsg.classList.add('hidden'), duration || 1800);
}

// ─── RESET ────────────────────────────────────────────────────────────────────
function resetAll() {
  level = 1; levelScore = 0; levelTarget = 10;
  score = 0; lives = 5;
  gunTier = 1; levelStartGun = 1;
  snakeInterval = 140;
  theme = THEMES[0];
  resetLevel();
}

function resetLevel() {
  const cx = Math.floor(cols / 2);
  const cy = Math.floor(rows / 2);
  snake   = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir     = {x:1,y:0};
  nextDir = {x:1,y:0};
  food = []; powerUps = []; pellets = []; growPending = 0;
  bricks = new Set();
  for (let r = 0; r < BRICK_ROWS; r++)
    for (let c = 0; c < cols; c++) bricks.add(c + ',' + r);
  for (let i = 0; i < FOOD_COUNT; i++) placeFood();
  lastTick = 0; snakeTicker = 0;
  lastFireTime = 0; rapidFireEnd = 0;
  glitching = false;
}

// ─── FOOD ─────────────────────────────────────────────────────────────────────
function occupiedSet() {
  const s = new Set(snake.map(c => c.x+','+c.y));
  food.forEach(f => s.add(f.x+','+f.y));
  return s;
}

function placeFood() {
  const occ = occupiedSet();
  let fx, fy, tries = 0;
  do {
    fx = 1 + Math.floor(Math.random() * (cols - 2));
    fy = BRICK_ROWS + 1 + Math.floor(Math.random() * (rows - BRICK_ROWS - 2));
    tries++;
  } while (occ.has(fx+','+fy) && tries < 200);
  food.push({x:fx, y:fy});
}

// ─── POWER-UPS ────────────────────────────────────────────────────────────────
function spawnPowerUp(cx, cy) {
  const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
  const angle = Math.random() * Math.PI * 2;
  const spd = 1.2 + Math.random() * 0.8;
  powerUps.push({
    x: cx * CELL + CELL/2, y: cy * CELL + CELL/2,
    vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
    type, timer: 420, pulse: 0
  });
}

function collectPowerUp(type) {
  if (type === 'gun') {
    if (gunTier < GUN_MAX) { gunTier++; showMsg('🔫 ' + GUNS[gunTier-1].name + ' Gun!'); }
    else showMsg('🔫 Max Gun!');
  } else if (type === 'life') {
    lives = Math.min(lives + 1, MAX_LIVES);
    showMsg('❤️ Extra Life!');
  } else if (type === 'rapid') {
    rapidFireEnd = performance.now() + 5000;
    showMsg('⚡ Rapid Fire! 5s');
  }
  updateHUD();
}

function updatePowerUps() {
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const pu = powerUps[i];
    pu.x += pu.vx; pu.y += pu.vy;
    pu.timer--; pu.pulse++;

    const r = CELL * 0.5;
    if (pu.x < r) { pu.vx = Math.abs(pu.vx); pu.x = r; }
    if (pu.y < r) { pu.vy = Math.abs(pu.vy); pu.y = r; }
    if (pu.x > canvas.width  - r) { pu.vx = -Math.abs(pu.vx); pu.x = canvas.width  - r; }
    if (pu.y > canvas.height - r) { pu.vy = -Math.abs(pu.vy); pu.y = canvas.height - r; }

    if (pu.timer <= 0) { powerUps.splice(i, 1); continue; }

    // Snake head picks it up
    const hpx = snake[0].x * CELL + CELL/2, hpy = snake[0].y * CELL + CELL/2;
    if (Math.hypot(hpx - pu.x, hpy - pu.y) < CELL * 0.9) {
      collectPowerUp(pu.type);
      powerUps.splice(i, 1);
    }
  }
}

// ─── PELLETS ──────────────────────────────────────────────────────────────────
function fire() {
  if (!running) return;
  const now = performance.now();
  const g = GUNS[gunTier - 1];
  if (now - lastFireTime < g.cd) return;
  lastFireTime = now;

  const baseAngle = Math.atan2(dir.y, dir.x);
  const angles = [];
  if (g.count === 1) {
    angles.push(baseAngle);
  } else if (g.count === 2) {
    const rad = g.spread * Math.PI / 180 / 2;
    angles.push(baseAngle - rad, baseAngle + rad);
  } else {
    const rad = g.spread * Math.PI / 180;
    angles.push(baseAngle - rad, baseAngle, baseAngle + rad);
  }

  const sx = snake[0].x * CELL + CELL/2, sy = snake[0].y * CELL + CELL/2;
  angles.forEach(a => {
    pellets.push({ x:sx, y:sy, vx:Math.cos(a)*g.spd, vy:Math.sin(a)*g.spd, tier:gunTier });
  });
}

function updatePellets() {
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    p.x += p.vx; p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
      pellets.splice(i, 1); continue;
    }

    const px = Math.floor(p.x / CELL), py = Math.floor(p.y / CELL);
    let hit = false;

    // Hit a brick — blast it (the arkanoid bit)
    if (bricks.has(px + ',' + py)) {
      bricks.delete(px + ',' + py);
      score += 2;
      scoreEl.textContent = score;
      pellets.splice(i, 1);
      continue;
    }

    // Hit food
    for (let j = food.length - 1; j >= 0; j--) {
      if (food[j].x === px && food[j].y === py) {
        eatFood(j); hit = true; break;
      }
    }
    if (hit) { pellets.splice(i, 1); continue; }

    // Hit powerup
    for (let j = powerUps.length - 1; j >= 0; j--) {
      if (Math.hypot(p.x - powerUps[j].x, p.y - powerUps[j].y) < CELL * 0.55) {
        collectPowerUp(powerUps[j].type);
        powerUps.splice(j, 1);
        pellets.splice(i, 1); hit = true; break;
      }
    }
    if (hit) continue;
  }
}

function eatFood(idx) {
  score++; levelScore++;
  growPending++;
  scoreEl.textContent = score;
  if (Math.random() < 0.35) spawnPowerUp(food[idx].x, food[idx].y);
  food.splice(idx, 1);
  placeFood();
  updateHUD();
  checkLevelComplete();
}

// ─── LEVEL ────────────────────────────────────────────────────────────────────
function maxSnakeLength() {
  // brick rows aren't playable space
  return cols * (rows - BRICK_ROWS) - FOOD_COUNT - 4;
}

function checkLevelComplete() {
  if (snake.length < maxSnakeLength()) return;

  lives = Math.min(lives + 5, MAX_LIVES);
  levelStartGun = gunTier;
  level++;
  levelScore = 0;
  levelTarget = 10 + (level - 1) * 5;
  snakeInterval = Math.round(snakeInterval * 0.8);
  theme = THEMES[(level - 1) % THEMES.length];
  rapidFireEnd = 0;

  // Show level complete briefly then continue
  running = false;
  cancelAnimationFrame(animId);
  const lo = levelOverlay;
  document.getElementById('loTitle').textContent = 'Level ' + (level-1) + ' Complete!';
  document.getElementById('loBadge').textContent = '+5 Lives · Speed +20%';
  document.getElementById('loSub').textContent =
    GUNS[gunTier-1].name + ' gun locked in for Level ' + level + '. Colors shifting…';
  lo.classList.remove('hidden');
  updateHUD();

  setTimeout(() => {
    lo.classList.add('hidden');
    resetLevel();
    running = true;
    animId = requestAnimationFrame(loop);
  }, 2800);
}

// ─── SNAKE TICK ───────────────────────────────────────────────────────────────
function snakeTick() {
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision → -1 life
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    handleHit('wall'); return;
  }

  // Brick collision → same as wall
  if (bricks.has(head.x + ',' + head.y)) {
    handleHit('brick'); return;
  }

  // Self collision → -1 life
  for (let i = 0; i < snake.length - 1; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      handleHit('self'); return;
    }
  }

  // The wall slowly rebuilds itself (attract-mode rule)
  if (Math.random() < 0.05 && bricks.size < cols * BRICK_ROWS) {
    const c = Math.floor(Math.random() * cols), r = Math.floor(Math.random() * BRICK_ROWS);
    const key = c + ',' + r;
    if (!bricks.has(key) && !snake.some(s => s.x === c && s.y === r)) bricks.add(key);
  }

  snake.unshift(head);

  // Eat food
  let ate = false;
  for (let i = 0; i < food.length; i++) {
    if (food[i].x === head.x && food[i].y === head.y) {
      eatFood(i); ate = true; break;
    }
  }
  if (!ate) {
    if (growPending > 0) growPending--;
    else snake.pop();
  }
}

function handleHit(reason) {
  glitching = true; glitchFrames = 18;
  gunTier = levelStartGun;

  // Both wall and self: lose a life
  lives--;
  if (lives <= 0) {
    setTimeout(() => endGame(), 900);
    return;
  }

  const msgs = { wall: '💥 Wall! -1 Life · Halved', brick: '🧱 Brick! -1 Life · Halved', self: '🐍 Self! -1 Life · Halved' };
  showMsg(msgs[reason] || msgs.wall, 1600);

  // Halve snake + teleport
  const newLen = Math.max(3, Math.floor(snake.length / 2));
  const newHead = randomFreeCell();
  snake = [];
  for (let i = 0; i < newLen; i++) {
    const nx = Math.max(1, Math.min(cols-2, newHead.x - dir.x * i));
    const ny = Math.max(1, Math.min(rows-2, newHead.y - dir.y * i));
    snake.push({x:nx, y:ny});
  }
  growPending = 0;
  updateHUD();
}

function randomFreeCell() {
  const occ = occupiedSet();
  let x, y, tries = 0;
  do {
    x = 2 + Math.floor(Math.random() * (cols - 4));
    y = BRICK_ROWS + 1 + Math.floor(Math.random() * (rows - BRICK_ROWS - 3));
    tries++;
  } while (occ.has(x+','+y) && tries < 150);
  return {x, y};
}

// ─── GAME CONTROL ─────────────────────────────────────────────────────────────
function startGame() {
  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  levelOverlay.classList.add('hidden');
  resetAll();
  updateHUD();
  running = true;
  animId = requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  cancelAnimationFrame(animId);
  const isHS = score > highScore;
  if (isHS) { highScore = score; localStorage.setItem('jnj_snakeblaster_hs', score); }

  document.getElementById('goEmoji').textContent = lives <= 0 ? '💀' : '😵';
  document.getElementById('goTitle').textContent = 'GAME OVER';
  document.getElementById('goScore').textContent = score;
  document.getElementById('goBest').style.display = (isHS && score > 0) ? 'inline-flex' : 'none';
  document.getElementById('goSub').textContent = 'Reached Level ' + level + ' · Best: ' + highScore;

  // hi-score cabinet first, then the retry overlay
  if (window.ArcadeScores && score > 0) {
    ArcadeScores.show({
      game: 'snake', title: 'SNAKE BLASTER', score: score,
      accent: theme.snake,
      onClose: () => gameOverOverlay.classList.remove('hidden'),
    });
  } else {
    gameOverOverlay.classList.remove('hidden');
  }
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(ts) {
  const t = theme;

  // Background
  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = t.grid;
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke();
  }

  // Glitch overlay
  if (glitching) {
    const intensity = glitchFrames / 18;
    ctx.save();
    ctx.globalAlpha = intensity * 0.6;
    ctx.fillStyle = '#fff';
    // random static blocks
    for (let i = 0; i < 30; i++) {
      ctx.fillRect(
        Math.random() * canvas.width, Math.random() * canvas.height,
        Math.random() * 40 + 4, Math.random() * 8 + 2
      );
    }
    ctx.globalAlpha = intensity * 0.15;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // Pulsing perimeter glow
  perimPh += 0.04;
  const glowAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(perimPh));
  ctx.save();
  ctx.strokeStyle = t.wall;
  ctx.shadowColor = t.wallGlow;
  ctx.shadowBlur = 18;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = glowAlpha;
  ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
  ctx.restore();

  // Brick wall (attract style: crisp dim squares)
  const bpad = Math.max(1, Math.round(CELL * 0.1));
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = t.snake;
  bricks.forEach(key => {
    const [bc, br] = key.split(',').map(Number);
    ctx.fillRect(bc*CELL + bpad, br*CELL + bpad, CELL - bpad*2, CELL - bpad*2);
  });
  ctx.restore();

  // Food — crisp pulsing squares (attract style)
  food.forEach(f => {
    const pulse = 0.72 + 0.28 * Math.sin(ts * 0.005 + f.x + f.y);
    const fs = CELL * 0.6 * pulse;
    ctx.fillStyle = t.food;
    ctx.fillRect(f.x*CELL + (CELL - fs)/2, f.y*CELL + (CELL - fs)/2, fs, fs);
  });

  // Power-ups
  powerUps.forEach(pu => {
    const fade = Math.min(1, pu.timer / 80);
    const pulse = 0.65 + 0.35 * Math.sin(pu.pulse * 0.18);
    const colors = {gun:'#ff8800', life:'#ff3355', rapid:'#00ccff'};
    const labels = {gun:'🔫', life:'❤️', rapid:'⚡'};
    const r = CELL * 0.52;
    ctx.save();
    ctx.globalAlpha = fade * pulse;
    ctx.shadowColor = colors[pu.type];
    ctx.shadowBlur = 16;
    ctx.fillStyle = colors[pu.type];
    // Arcanoid capsule style
    ctx.beginPath();
    ctx.roundRect(pu.x - r*1.6, pu.y - r*0.65, r*3.2, r*1.3, r*0.65);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = fade;
    ctx.font = `${Math.round(r * 1.1)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[pu.type], pu.x, pu.y + 1);
    ctx.restore();
  });

  // Pellets — crisp pixel bullets (attract style)
  pellets.forEach(p => {
    const g = GUNS[Math.min(p.tier - 1, GUNS.length - 1)];
    ctx.fillStyle = g.color;
    ctx.fillRect(Math.round(p.x) - 2, Math.round(p.y) - 4, 4, 8);
  });

  // Snake body — flat chunky squares, fading like the attract demo
  const pad = Math.max(1, Math.round(CELL * 0.1));
  for (let i = snake.length - 1; i >= 1; i--) {
    const seg = snake[i];
    ctx.globalAlpha = Math.max(0.35, 1 - i * 0.07);
    ctx.fillStyle = t.snake;
    ctx.fillRect(seg.x*CELL + pad, seg.y*CELL + pad, CELL - pad*2, CELL - pad*2);
  }
  ctx.globalAlpha = 1;

  // Snake head — brighter, crisp
  const h = snake[0];
  ctx.save();
  ctx.fillStyle = t.head;
  ctx.fillRect(h.x*CELL + pad, h.y*CELL + pad, CELL - pad*2, CELL - pad*2);
  // Eyes
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  const hcx = h.x*CELL, hcy = h.y*CELL;
  if (dir.x === 1)       { dot(ctx,hcx+CELL-5,hcy+5); dot(ctx,hcx+CELL-5,hcy+CELL-5); }
  else if (dir.x === -1) { dot(ctx,hcx+5,hcy+5);      dot(ctx,hcx+5,hcy+CELL-5); }
  else if (dir.y === -1) { dot(ctx,hcx+5,hcy+5);      dot(ctx,hcx+CELL-5,hcy+5); }
  else                   { dot(ctx,hcx+5,hcy+CELL-5); dot(ctx,hcx+CELL-5,hcy+CELL-5); }
  ctx.restore();

  // Gun tier indicator on head
  if (gunTier > 1) {
    const g = GUNS[gunTier - 1];
    ctx.save();
    ctx.font = '9px sans-serif';
    ctx.fillStyle = g.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(gunTier + '★', h.x*CELL + CELL/2, h.y*CELL);
    ctx.restore();
  }
}

function dot(ctx, x, y) {
  ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(ts) {
  if (!running) return;

  // Snake tick
  snakeTicker += ts - (lastTick || ts);
  lastTick = ts;
  let effectiveInterval = snakeInterval;
  if (rapidFireEnd > 0 && ts < rapidFireEnd) effectiveInterval = Math.round(snakeInterval * 0.75);
  while (snakeTicker >= effectiveInterval) {
    snakeTicker -= effectiveInterval;
    snakeTick();
    if (!running) return; // endGame may have been called
  }

  // Auto-fire for gun tier 5
  const g = GUNS[gunTier - 1];
  if (g.auto || (rapidFireEnd > 0 && ts < rapidFireEnd)) fire();

  updatePellets();
  updatePowerUps();

  if (glitching && --glitchFrames <= 0) glitching = false;

  draw(ts);
  animId = requestAnimationFrame(loop);
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
const DIRS = { UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0} };

function changeDir(d) {
  const nd = DIRS[d];
  if (!nd) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
    w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
    W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT',
  };
  if (map[e.key]) { e.preventDefault(); if (!running) startGame(); else changeDir(map[e.key]); }
  if (e.key === ' ') { e.preventDefault(); if (!running) startGame(); else fire(); }
  if (e.key === 'Enter') { e.preventDefault(); if (!running) startGame(); }
});

document.querySelectorAll('.ctrl-btn[data-dir]').forEach(btn => {
  const d = btn.dataset.dir;
  function press() { btn.classList.add('pressed'); if (!running) { startGame(); return; } changeDir(d); }
  function release() { btn.classList.remove('pressed'); }
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(); }, {passive:false});
  btn.addEventListener('touchend', release);
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
});

const fireBtn = document.getElementById('fireBtn');
function pressFireBtn() { fireBtn.classList.add('pressed'); if (!running) startGame(); else fire(); }
function releaseFireBtn() { fireBtn.classList.remove('pressed'); }
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); pressFireBtn(); }, {passive:false});
fireBtn.addEventListener('touchend', releaseFireBtn);
fireBtn.addEventListener('mousedown', pressFireBtn);
fireBtn.addEventListener('mouseup', releaseFireBtn);

// Hold-to-fire support
let fireholding = false, fireHoldInterval;
fireBtn.addEventListener('touchstart', () => {
  fireholding = true;
  fireHoldInterval = setInterval(() => { if (fireholding && running) fire(); }, 80);
}, {passive:true});
fireBtn.addEventListener('touchend', () => { fireholding = false; clearInterval(fireHoldInterval); });
fireBtn.addEventListener('mousedown', () => {
  fireholding = true;
  fireHoldInterval = setInterval(() => { if (fireholding && running) fire(); }, 80);
});
fireBtn.addEventListener('mouseup', () => { fireholding = false; clearInterval(fireHoldInterval); });

// Swipe on canvas
let swipeStart = null;
canvas.addEventListener('touchstart', e => {
  swipeStart = {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
  if (!running) startGame();
}, {passive:true});
canvas.addEventListener('touchend', e => {
  if (!swipeStart || !running) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  if (Math.abs(dx) > Math.abs(dy)) changeDir(dx > 0 ? 'RIGHT' : 'LEFT');
  else changeDir(dy > 0 ? 'DOWN' : 'UP');
}, {passive:true});

function tryFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen
            || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) req.call(el).catch(() => {});
}

document.getElementById('startBtn').addEventListener('click', () => { tryFullscreen(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', () => { tryFullscreen(); startGame(); });
// first touch anywhere also claims fullscreen (mobile)
document.addEventListener('touchend', function fsOnce() { tryFullscreen(); document.removeEventListener('touchend', fsOnce); });

// ─── INIT ─────────────────────────────────────────────────────────────────────
highScore = parseInt(localStorage.getItem('jnj_snakeblaster_hs') || '0', 10);
if (highScore > 0) document.getElementById('startBest').textContent = 'Best: ' + highScore;
resize();
theme = THEMES[0];
// Draw idle screen
ctx.fillStyle = THEMES[0].bg;
ctx.fillRect(0, 0, canvas.width, canvas.height);

window.addEventListener('resize', () => { if (!running) { resize(); } });

})();
</script>
