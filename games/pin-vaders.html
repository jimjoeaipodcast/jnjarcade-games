<!DOCTYPE html>
<html lang="en">
<head>
<!-- PV_CHROME26_V8 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PIN-VADERS — JnJ Arcade</title>
<!-- PINBALL × SPACE INVADERS v5 (chrome pass) — v4 full-cabinet presentation
     (viewport bands = backbox marquee + lockdown bar, no letterbox), half-res pixelation
     pass over the whole world, lamp inserts + rail chases + posts + decals. v5 adds the
     mockup chrome: bevel+glow rails, per-hue glossy bumper domes, rim-lit invaders,
     HYPER/WARP lane branding, HUD cards/pills, flipper-contact juice (burst+clack+shake),
     functional PAUSE ring, attract-mode UFO scheduler. Physics per GAME_BIBLE §14
     (pinball-schminball MIT patterns, Igor Zinken — constants adapted). -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100dvh; background: #0b0618; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  #gameCanvas { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; }
  /* HOUSE CHROME — Osimo 2026-07-29: "all the games from patreon page have a distinct
     look and font... I need pin Vader's to have the same look and feel like hop man".
     Typography + layout copied from hop-man; the INK stays Pin-Vaders' purple, because
     each cabinet keeps its own accent (that is what the cassette glow is keyed to).
     Fonts self-hosted — arcade-scores.js shipped literal `cursive` scoreboards when a
     game relied on a CDN link, so `cursive` is banned as a fallback here. */
  @font-face { font-family:'Bungee'; font-style:normal; font-weight:400; font-display:swap;
               src:url('/vendor/fonts/bungee-400.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-style:normal; font-weight:600; font-display:swap;
               src:url('/vendor/fonts/barlow-condensed-600.woff2') format('woff2'); }

  #overlay { position: fixed; inset: 0; z-index: 10;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 12px; padding: 24px; text-align: center;
             background: rgba(7,8,13,.88); backdrop-filter: blur(4px); }
  #overlay.hidden { display: none; }
  #overlay h1 { font-family:'Bungee','Arial Black',sans-serif; font-weight:400;
                font-size: clamp(26px, 7.5vw, 44px); letter-spacing:.1em; line-height:1.15;
                color: var(--ink, #b76bff); text-shadow: 0 0 18px var(--ink, #b76bff);
                margin: 0; }
  #overlay .genre { font-family:'Bungee','Arial Black',sans-serif;
                    font-size: clamp(10px, 3vw, 13px); letter-spacing:.14em;
                    color: var(--ink, #b76bff); opacity:.7; }
  #overlay p { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:600;
               font-size: clamp(13px, 3.6vw, 15px); line-height:1.6; letter-spacing:.02em;
               color:#cfd4dd; opacity:.85; max-width: 340px; margin: 0; }
  #overlay p b { color: var(--ink, #b76bff); }
  #coinBtn { margin-top:4px; background: var(--ink, #b76bff); color:#150720; border:none;
             border-radius:28px; padding:13px 28px; font-size:15px; font-weight:800;
             letter-spacing:.08em; cursor:pointer;
             box-shadow: 0 0 24px var(--ink, #b76bff);
             font-family:'Bungee','Arial Black',sans-serif;
             transition: transform .06s, box-shadow .06s; }
  #coinBtn:active { transform: translateY(3px); box-shadow: 0 0 10px var(--ink, #b76bff); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
  <h1>PIN-VADERS</h1>
  <div class="genre">PINBALL × SPACE INVADERS</div>
  <p>Hold <b>LEFT</b> / <b>RIGHT</b> half = flippers · drag <b>DOWN</b> in lane = plunger<br>
  Swipe <b>UP</b> = nudge (3 = <b>TILT!</b>) · S-O-S lanes = bonus ×<br>
  Left bunkers = <b>SHIELD</b> · right bunkers = <b>UFO</b> · saucer ×2 = <b>MULTIBALL</b><br>
  Don't let them reach the line.</p>
  <button id="coinBtn">🪙 INSERT COIN</button>
</div>
<script src="../vendor/gsap.min.js"></script>
<script src="../arcade-scores.js?v=22"></script>
<script>
(function () {
'use strict';
// ── IDENTITY ─────────────────────────────────────────────────────────────────
const SLUG  = 'pin-vaders';
const TITLE = 'PIN-VADERS';
const INK   = '#b76bff';
// Live-verification marker for qa_game.sh --live — unique to THIS build (never reuse
// sfxMuted_+SLUG, which exists in every historical build and passes on stale deploys).
const BUILD_MARKER = 'PV_CHROME26_V8';
// Global best for the marquee. Populated async; the HUD redraws with it once it lands,
// so a slow network shows the local best rather than blocking or lying.
let GLOBAL_HI = 0;
fetch('/api/scores?game=pin-vaders')
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.scores && d.scores.length) GLOBAL_HI = d.scores[0].s || 0; })
  .catch(() => {});
document.documentElement.style.setProperty('--ink', INK);

// ── CANVAS + VIEW ────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const WORLD_W = 480, WORLD_H = 800;
const VIEW = { scale: 1, ox: 0, oy: 0 };
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR;
  const s = Math.min(innerWidth / WORLD_W, innerHeight / WORLD_H);
  VIEW.scale = s * DPR;
  VIEW.ox = (canvas.width  - WORLD_W * VIEW.scale) / 2;
  VIEW.oy = (canvas.height - WORLD_H * VIEW.scale) / 2;
}
addEventListener('resize', resize); resize();

// ── SFX ──────────────────────────────────────────────────────────────────────
let audioCtx = null, muted = localStorage.getItem('sfxMuted_' + SLUG) === '1';
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function tone(f0, f1, dur, type, vol, delay) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const MARCH_NOTES = [62, 55, 49, 44];
let marchIdx = 0;
const sfx = {
  flip:    () => tone(180, 240, 0.05, 'square', 0.10),
  clack:   () => tone(950, 260, 0.045, 'triangle', 0.13),  // real flipper-ball contact ONLY — distinct from the press-button flip sfx
  bumper:  () => tone(520, 780, 0.07, 'square', 0.14),
  sling:   () => tone(340, 520, 0.06, 'square', 0.12),
  alien:   () => tone(880 + Math.random() * 160, 220, 0.12, 'square', 0.16),
  march:   () => { tone(MARCH_NOTES[marchIdx], 0, 0.09, 'square', 0.07); marchIdx = (marchIdx + 1) % 4; },
  bossHit: () => tone(160, 90, 0.14, 'sawtooth', 0.18),
  ufo:     () => tone(660, 990, 0.25, 'triangle', 0.12),
  jackpot: () => { tone(660, 1320, 0.18, 'square', 0.16); tone(880, 1760, 0.3, 'square', 0.12, 0.09); },
  launch:  () => tone(140, 620, 0.25, 'sawtooth', 0.14),
  drain:   () => tone(300, 50, 0.5, 'sawtooth', 0.18),
  wave:    () => { tone(440, 880, 0.15, 'square', 0.14); tone(554, 1108, 0.25, 'square', 0.12, 0.1); },
  siren:   () => tone(700, 380, 0.3, 'sawtooth', 0.13),
  tilt:    () => tone(120, 45, 0.6, 'sawtooth', 0.2),
  over:    () => tone(440, 55, 0.7, 'sawtooth', 0.2),
  roll:    () => tone(980, 1400, 0.06, 'square', 0.12),
  sosDone: () => { tone(660, 0, 0.08, 'square', 0.14); tone(880, 0, 0.08, 'square', 0.14, 0.09); tone(1180, 0, 0.14, 'square', 0.16, 0.18); },
  drop:    () => tone(240, 110, 0.12, 'sawtooth', 0.16),
  bankL:   () => { tone(520, 0, 0.09, 'square', 0.14); tone(780, 0, 0.16, 'square', 0.14, 0.1); },
  shieldUp:() => tone(300, 900, 0.3, 'triangle', 0.15),
  shield:  () => { tone(900, 200, 0.3, 'sawtooth', 0.2); tone(1400, 300, 0.2, 'square', 0.12, 0.05); },
  spin:    () => tone(1200 + Math.random() * 200, 0, 0.03, 'square', 0.07),
  cannon:  () => tone(1500, 300, 0.16, 'sawtooth', 0.14),
  lock:    () => { tone(440, 0, 0.1, 'square', 0.14); tone(660, 0, 0.16, 'square', 0.16, 0.11); },
  multi:   () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0, 0.14, 'square', 0.16, i * 0.09)); },
  tally:   () => tone(1046, 0, 0.04, 'square', 0.1),
  skill:   () => { tone(784, 1568, 0.2, 'square', 0.16); tone(1046, 2092, 0.25, 'square', 0.12, 0.12); },
};

// ── PHYSICS (GAME_BIBLE §14) ────────────────────────────────────────────────
const G = 1750;
const MAXV = 1900;                           // max rise MAXV²/2G ≈ 1031 > lane climb 570
const WALL_REST = 0.28;
const BUMPER_KICK = 800, SLING_KICK = 880, ALIEN_KICK = 660;
const SUB = 1 / 240;

// ── TABLE GEOMETRY ───────────────────────────────────────────────────────────
const SEGS = [
  { x1: 14,  y1: 110, x2: 14,  y2: 760, rest: WALL_REST },
  { x1: 14,  y1: 110, x2: 120, y2: 20,  rest: WALL_REST },
  { x1: 120, y1: 20,  x2: 300, y2: 14,  rest: WALL_REST },
  { x1: 300, y1: 14,  x2: 390, y2: 40,  rest: WALL_REST },
  { x1: 390, y1: 40,  x2: 450, y2: 110, rest: WALL_REST },
  { x1: 450, y1: 110, x2: 466, y2: 190, rest: WALL_REST },
  { x1: 466, y1: 190, x2: 466, y2: 758, rest: 0.1 },
  { x1: 436, y1: 205, x2: 436, y2: 600, rest: 0.1 },
  { x1: 436, y1: 600, x2: 334, y2: 708, rest: 0.15 },
  { x1: 14,  y1: 600, x2: 146, y2: 708, rest: 0.15 },
  { x1: 436, y1: 758, x2: 466, y2: 758, rest: 0 },
  { x1: 205, y1: 74,  x2: 205, y2: 112, rest: 0.2 },
  { x1: 275, y1: 74,  x2: 275, y2: 112, rest: 0.2 },
];
const GATE = { x1: 436, y1: 205, x2: 466, y2: 178, rest: 0.05 };
const TIP  = { x: 436, y: 205, r: 5 };
const BUMPERS = [
  { x: 175, y: 158, r: 16, flash: 0, pop: 0, hue: '#ff2fd6' },  // magenta, left
  { x: 240, y: 145, r: 18, flash: 0, pop: 0, hue: '#2fd6ff' },  // cyan, centre — tallest, per mockup
  { x: 305, y: 158, r: 16, flash: 0, pop: 0, hue: '#ffcc33' },  // gold, right
];
const SLINGS = [
  { x: 120, y: 626, r: 14, flash: 0 },
  { x: 352, y: 626, r: 14, flash: 0 },
];
const FLIPPERS = [
  { px: 148, py: 716, len: 82, thick: 11, restAng: 0.50, raisedAng: -0.55,
    ang: 0.50, angVel: 0, pressed: false },
  { px: 332, py: 716, len: 82, thick: 11, restAng: Math.PI - 0.50, raisedAng: Math.PI + 0.55,
    ang: Math.PI - 0.50, angVel: 0, pressed: false },
];
const INVASION_Y = 585;
const SAUCER  = { x: 398, y: 142, r: 16, holdT: 0, heldBall: null, flash: 0 };
const SPINNER = { x: 33, y: 253, spins: 0, ang: 0, cd: 0 };
const CANNON  = { x: 240, y: 592, r: 14, dir: 1, cd: 0, beam: 0, beamX: 0 };
const ROLLS = [ { x: 177, lit: false }, { x: 240, lit: false }, { x: 302, lit: false } ];
const SOS_Y = 92;
const DROPS_L = [ { x: 88, y: 470, up: true }, { x: 123, y: 470, up: true }, { x: 158, y: 470, up: true } ];
const DROPS_R = [ { x: 322, y: 470, up: true }, { x: 357, y: 470, up: true }, { x: 392, y: 470, up: true } ];

// ── STATE ────────────────────────────────────────────────────────────────────
let state = 'attract';
let paused = false;                       // gameplay pause (PAUSE ring in top band; playing-state only)
const PAUSE_BTN = { x: 0, y: 0, r: 0 };   // screen-space (device px) hit target, updated each drawCabinet frame
let score = 0, wave = 1, stock = 3, shakeT = 0, tPrev = 0, acc = 0;
let tilted = false, bumps = [], launchedAt = 0;
let bonusX = 1, killsThisBall = 0, lockedCount = 0, multiball = false, shieldArmed = false;
let skillShotLive = false;
const ballsInPlay = [];
const particles = [], labels = [];
let msg = null;
const plunger = { pull: 0, dragId: null, dragY0: 0, snap: 0 };
const dmd = { text: 'PIN-VADERS', x: 340, timer: 0 };
function dmdSay(t) { dmd.text = t; dmd.x = 340; }

function makeBall(x, y, vx, vy) {
  return { x: x ?? 451, y: y ?? 730, vx: vx || 0, vy: vy || 0, r: 11,
           inLane: x === undefined, held: x === undefined,
           flipContact: null, cradleT: 0 };
}

// ── INVADERS + BOSS ──────────────────────────────────────────────────────────
const INV = { x: 60, y: 205, cols: 6, rows: 3, cw: 48, rh: 40, dir: 1,
              beatBase: 820, tAcc: 0, frame: 0, alive: [], count: 0, total: 1 };
const BOSS = { active: false, x: 240, y: 100, w: 96, h: 36, hp: 0, maxHp: 1, dir: 1, flash: 0 };
function isBossWave(w) { return w % 4 === 0; }
function spawnWave(w) {
  BOSS.active = false;
  if (isBossWave(w)) {
    BOSS.active = true; BOSS.x = 240; BOSS.y = 100; BOSS.dir = 1;
    BOSS.maxHp = BOSS.hp = 8 + Math.floor(w / 4) * 3;
    INV.alive = []; INV.count = 0; INV.total = 1;
    INV.beatBase = Math.max(700 - (w - 1) * 30, 380);
    dmdSay('MOTHERSHIP INBOUND');
    return;
  }
  INV.rows = Math.min(4 + ((w - 1) >> 1), 5);
  INV.beatBase = Math.max(820 - (w - 1) * 70, 420);
  INV.x = 60; INV.y = 205; INV.dir = 1; INV.tAcc = 0; INV.frame = 0;
  INV.alive = Array.from({ length: INV.rows }, () => Array(INV.cols).fill(true));
  INV.count = INV.total = INV.rows * INV.cols;
}
function alienPos(r, c) { return { x: INV.x + c * INV.cw + 24, y: INV.y + r * INV.rh + 16 }; }
function lowestAlienY() {
  if (BOSS.active) return BOSS.y + BOSS.h / 2;
  for (let r = INV.rows - 1; r >= 0; r--)
    for (let c = 0; c < INV.cols; c++)
      if (INV.alive[r][c]) return alienPos(r, 0).y + 12;
  return -1;
}
const UFO = { active: false, x: -30, y: 66, r: 13, vx: 0, timer: 11000 };
function callUFO() {
  if (UFO.active) return;
  UFO.active = true; UFO.x = Math.random() < 0.5 ? -20 : WORLD_W + 20;
  UFO.vx = UFO.x < 0 ? 130 : -130;
  sfx.ufo();
}

// pixel bitmaps
const BM_A = ['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'];
const BM_B = ['00100000100','10010001001','10111111101','11101110111','11111111111','01111111110','00100000100','01000000010'];
const BM_BOSS = ['000011111110000','001111111111100','011111111111110','110110110110011','011111111111110','000110000110000'];
const BM_BUNKER = ['0111110','1111111','1111111','1100011'];
const ROW_COL = ['#ff2fd6', '#2fd6ff', '#ffcc33', '#6dff4d'];  // mockup order: magenta / cyan / gold, green spare

// colour helpers (hex → rgba / tint-shade) — used by the chrome-pass rendering
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function hexA(hex, a) { const p = hexRGB(hex); return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')'; }
function mixHex(hex, f) {  // f>0 → toward white, f<0 → toward black
  let p = hexRGB(hex), r = p[0], g = p[1], b = p[2];
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

// ── JUICE ────────────────────────────────────────────────────────────────────
function burst(x, y, n, col) {
  for (let i = 0; i < (n || 10); i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                     life: 28, max: 28, r: 2 + Math.random() * 3, col: col || INK });
  }
}
function label(x, y, txt, col) { labels.push({ x, y, txt, col: col || '#fff', life: 55 }); }
function say(txt, life) { msg = { txt, life: life || 110 }; }

// ── INPUT ────────────────────────────────────────────────────────────────────
const touches = new Map();
const MUTE_RECT = { x: WORLD_W - 46, y: 6, w: 40, h: 34 };
function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top)  * DPR - VIEW.oy) / VIEW.scale };
}
function inRect(w, rc) { return w.x >= rc.x && w.x <= rc.x + rc.w && w.y >= rc.y && w.y <= rc.y + rc.h; }
function laneBall() { return ballsInPlay.find(b => b.inLane && b.held); }
function pressDown(id, cx, cy) {
  const w = toWorld(cx, cy);
  if (inRect(w, MUTE_RECT)) { touches.set(id, { zone: 'mute', x0: cx, y0: cy, t0: performance.now() }); return; }
  // PAUSE ring hit test (screen-space, top band — outside world coords)
  if (state === 'playing' && PAUSE_BTN.r > 0) {
    const rc = canvas.getBoundingClientRect();
    const dxp = (cx - rc.left) * DPR - PAUSE_BTN.x, dyp = (cy - rc.top) * DPR - PAUSE_BTN.y;
    if (Math.hypot(dxp, dyp) < PAUSE_BTN.r * 1.7) {
      togglePause();
      touches.set(id, { zone: 'none', x0: cx, y0: cy, t0: performance.now() });
      return;
    }
  }
  if (paused) { touches.set(id, { zone: 'none', x0: cx, y0: cy, t0: performance.now() }); return; }
  if (state !== 'playing') { touches.set(id, { zone: 'none', x0: cx, y0: cy, t0: performance.now() }); return; }
  if (laneBall() && w.x > 400) {
    plunger.dragId = id; plunger.dragY0 = cy;
    touches.set(id, { zone: 'plunger', x0: cx, y0: cy, t0: performance.now() });
    return;
  }
  const zone = w.x < WORLD_W / 2 ? 'L' : 'R';
  touches.set(id, { zone, x0: cx, y0: cy, t0: performance.now() });
  if (!tilted) { FLIPPERS[zone === 'L' ? 0 : 1].pressed = true; sfx.flip(); }
}
function pressUp(id, cx, cy) {
  const t = touches.get(id); touches.delete(id);
  if (!t) return;
  if (t.zone === 'mute') {
    const w = toWorld(cx, cy);
    if (inRect(w, MUTE_RECT)) { muted = !muted; localStorage.setItem('sfxMuted_' + SLUG, muted ? '1' : '0'); }
    return;
  }
  if (t.zone === 'plunger' && plunger.dragId === id) { firePlunger(); plunger.dragId = null; return; }
  if (t.zone === 'L') FLIPPERS[0].pressed = false;
  if (t.zone === 'R') FLIPPERS[1].pressed = false;
  const dy = cy - t.y0, dt = performance.now() - t.t0;
  if (state === 'playing' && dy < -90 && dt < 400) nudge();
}
function pressMove(id, cx, cy) {
  if (plunger.dragId === id) plunger.pull = Math.max(0, Math.min(120, cy - plunger.dragY0));
}
canvas.addEventListener('touchstart', e => { for (const t of e.changedTouches) pressDown(t.identifier, t.clientX, t.clientY); if (e.cancelable) e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend',   e => { for (const t of e.changedTouches) pressUp(t.identifier, t.clientX, t.clientY);   if (e.cancelable) e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove',  e => { for (const t of e.changedTouches) pressMove(t.identifier, t.clientX, t.clientY); if (e.cancelable) e.preventDefault(); }, { passive: false });
canvas.addEventListener('mousedown', e => pressDown('m', e.clientX, e.clientY));
canvas.addEventListener('mouseup',   e => pressUp('m', e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => pressMove('m', e.clientX, e.clientY));
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
  if (state !== 'playing' || tilted || paused) return;
  if (e.key === 'ArrowLeft'  || e.key === 'z') { if (!FLIPPERS[0].pressed) sfx.flip(); FLIPPERS[0].pressed = true; }
  if (e.key === 'ArrowRight' || e.key === '/') { if (!FLIPPERS[1].pressed) sfx.flip(); FLIPPERS[1].pressed = true; }
  if (e.key === ' ' && laneBall()) { plunger.pull = Math.min(120, plunger.pull + 14); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'z') FLIPPERS[0].pressed = false;
  if (e.key === 'ArrowRight' || e.key === '/') FLIPPERS[1].pressed = false;
  if (e.key === ' ' && laneBall() && plunger.pull > 0) firePlunger();
});
function firePlunger() {

// ── COLLISION PRIMITIVES ─────────────────────────────────────────────────────
function collideSeg(b, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L2 = dx * dx + dy * dy;
  const t = Math.max(0, Math.min(1, ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / L2));
  const cx = s.x1 + t * dx, cy = s.y1 + t * dy;
  let nx = b.x - cx, ny = b.y - cy, d = Math.hypot(nx, ny);
  if (!d || d > b.r) return false;
  nx /= d; ny /= d;
  b.x = cx + nx * b.r; b.y = cy + ny * b.r;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= (1 + s.rest) * vn * nx; b.vy -= (1 + s.rest) * vn * ny; }
  return true;
}
function collideCircle(b, p, kick) {
  let nx = b.x - p.x, ny = b.y - p.y, d = Math.hypot(nx, ny);
  if (!d || d > b.r + p.r) return false;
  nx /= d; ny /= d;
  b.x = p.x + nx * (b.r + p.r);
  b.vx = nx * kick; b.vy = ny * kick - 60;
  return true;
}
function collideStatic(b, p) {
  let nx = b.x - p.x, ny = b.y - p.y, d = Math.hypot(nx, ny);
  if (!d || d > b.r + p.r) return false;
  nx /= d; ny /= d;
  b.x = p.x + nx * (b.r + p.r);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= (1 + WALL_REST) * vn * nx; b.vy -= (1 + WALL_REST) * vn * ny; }
  return true;
}
function collideFlipper(b, f) {
  const dx = Math.cos(f.ang) * f.len, dy = Math.sin(f.ang) * f.len;
  const t = Math.max(0, Math.min(1, ((b.x - f.px) * dx + (b.y - f.py) * dy) / (dx * dx + dy * dy)));
  const cx = f.px + t * dx, cy = f.py + t * dy;
  let nx = b.x - cx, ny = b.y - cy, d = Math.hypot(nx, ny) || 1;
  if (d > b.r + f.thick) return;
  b.flipContact = f;   // consumed by the cradle-release detector in stepBall
  nx /= d; ny /= d;
  b.x = cx + nx * (b.r + f.thick); b.y = cy + ny * (b.r + f.thick);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 1.1 * vn * nx; b.vy -= 1.1 * vn * ny; }
  const surfV = f.angVel * t * f.len;
  b.vx += -Math.sin(f.ang) * surfV; b.vy += Math.cos(f.ang) * surfV;
  // CAUSALITY FIX (Osimo 2026-08-26 "pressing repeatedly with little no result"):
  // a REAL strike (closing velocity + flipper actually swinging) gets burst + jolt +
  // a distinct clack — a press that never connects gets none of this. The angVel gate
  // reuses anti-pattern #3's principle (flick force only exists while angVel != 0) so a
  // ball resting on a held-raised flipper can't spam it; vn flips positive the substep
  // after reflection, so this fires once per real contact with no cooldown state.
  if (vn < -30 && Math.abs(f.angVel) > 0.4) {
    burst(cx, cy, 6, f.px < WORLD_W / 2 ? '#ff2fd6' : '#2fd6ff');
    shakeT = Math.max(shakeT, 2);
    sfx.clack();
  }
}
function stepFlipper(f, dt) {
  const target = f.pressed && !tilted ? f.raisedAng : f.restAng, SWING = 14;
  const dir = Math.sign(target - f.ang);
  if (dir === 0) { f.angVel = 0; return; }
  f.angVel = dir * SWING;
  f.ang += f.angVel * dt;
  if ((dir > 0 && f.ang >= target) || (dir < 0 && f.ang <= target)) { f.ang = target; f.angVel = 0; }
}

// ── BALL STEP ────────────────────────────────────────────────────────────────
function stepBall(b, dt) {
  if (b.held || state === 'ended') return;
  b.vy += G * dt;
  b.vx = Math.max(-MAXV, Math.min(MAXV, b.vx));
  b.vy = Math.max(-MAXV, Math.min(MAXV, b.vy));
  b.x += b.vx * dt; b.y += b.vy * dt;

  if (b.inLane && b.y < 160) b.inLane = false;

  for (const s of SEGS) collideSeg(b, s);
  if (!b.inLane) collideSeg(b, GATE);
  collideStatic(b, TIP);
  b.flipContact = null;
  for (const f of FLIPPERS) collideFlipper(b, f);

  // CRADLE RELEASE (QA 3f, 2026-08-27): anti-pattern #3's physics ("flick force only
  // exists while angVel != 0") means a REAL sustained key-hold leaves a raised flipper
  // with angVel === 0 and a resting ball just balances on it indefinitely. The attract
  // AI pulses around this, but the physics itself never freed a ball under a raw held
  // input. Root fix lives here in the substep loop: a ball in contact with a HELD,
  // fully-raised flipper (pressed && angVel === 0) while nearly motionless for >1.1s
  // gets rolled off along the blade toward the tip, back into play. Gates keep normal
  // play untouched: alternating taps never hold a raised flipper + near-zero ball
  // speed continuously for 1.1s (organic 41-cycle playtest: zero triggers).
  const fc = b.flipContact;
  if (fc && fc.pressed && !tilted && fc.angVel === 0 && fc.ang === fc.raisedAng
      && Math.hypot(b.vx, b.vy) < 25) {
    b.cradleT = (b.cradleT || 0) + dt;
    if (b.cradleT > 1.1) {
      b.cradleT = 0;
      b.vx += Math.cos(fc.ang) * 240;          // along the blade, pivot → tip
      b.vy += Math.sin(fc.ang) * 240 - 140;    // small lift so it clears the blade
    }
  } else b.cradleT = 0;

  for (const p of BUMPERS)
    if (collideCircle(b, p, BUMPER_KICK)) {
      p.flash = 8; p.pop = 12; score += 25; label(p.x, p.y - 24, '+25'); burst(p.x, p.y, 8, '#6ee7ff');
      sfx.bumper(); shakeT = Math.max(shakeT, 3);
      skillShotLive = false;
    }
  for (const p of SLINGS)
    if (collideCircle(b, p, SLING_KICK)) {
      p.flash = 8; score += 10; sfx.sling(); burst(p.x, p.y, 6, '#ffd05a');
      label(p.x, p.y - 20, '+10', '#ffd05a');
      shakeT = Math.max(shakeT, 4);  // reads as a harder kicker hit than a bumper (3), per mockup energy
    }

  if (!b.inLane) {
    checkRollovers(b);
    checkDrops(b, DROPS_L, true);
    checkDrops(b, DROPS_R, false);
    checkSpinner(b);
    checkCannon(b);
    if (checkSaucer(b)) return;

    if (BOSS.active) {
      if (collideCircle(b, { x: BOSS.x, y: BOSS.y, r: 40 }, 620)) {
        damageBoss(1, b.x, b.y);
        skillShotLive = false;
      }
    } else {
      outer:
      for (let r = 0; r < INV.rows; r++)
        for (let c = 0; c < INV.cols; c++) {
          if (!INV.alive[r][c]) continue;
          const a = alienPos(r, c);
          if (collideCircle(b, { x: a.x, y: a.y, r: 15 }, ALIEN_KICK)) {
            hitAlien(r, c, 1);
            skillShotLive = false;
            break outer;
          }
        }
    }
    if (UFO.active && collideCircle(b, UFO, 700)) {
      UFO.active = false;
      const v = 500 * wave * (multiball ? 2 : 1);
      score += v; label(UFO.x, UFO.y + 24, 'JACKPOT +' + v, '#ff5470');
      burst(UFO.x, UFO.y, 26, '#ff5470'); sfx.jackpot(); shakeT = 12;
    }
  }

  if (shieldArmed && b.y > 752 && b.y < 790 && b.x > 150 && b.x < 330 && b.vy > 0) {
    shieldArmed = false;
    b.vy = -900;
    b.vx = (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 140);
    sfx.shield(); say('SHIELD SAVE', 90); dmdSay('SHIELD SPENT');
    burst(b.x, 760, 22, '#9fff8a'); shakeT = 8;
  }
}

// ── ATTRACT AI ───────────────────────────────────────────────────────────────
let attractT = 0, attractStill = 0, attractUfoT = 0;
function attractAI(dtMs) {
  attractT += dtMs;
  // cassette-causality: force the marquee UFO-jackpot moment on a ~12s schedule during
  // attract so recordings always capture a large, unmissable cause→effect event.
  // Silent per tone()'s state==='attract' mute gate.
  attractUfoT += dtMs;
  if (attractUfoT >= 12000) { attractUfoT = 0; if (!UFO.active) callUFO(); }
  const lb = laneBall();
  if (lb && attractT > 1200) { plunger.pull = 90 + Math.random() * 30; firePlunger(); attractT = 0; }
  if (SAUCER.heldBall) { lockedCount = 0; multiball = false; ejectSaucer(); }
  const b = ballsInPlay[0];
  if (!b) { serveBall(); return; }
  const speed = Math.hypot(b.vx, b.vy);
  attractStill = (!b.held && speed < 40 && b.y > 600) ? attractStill + dtMs : 0;
  for (let i = 0; i < 2; i++) {
    const f = FLIPPERS[i];
    const midX = f.px + Math.cos(f.restAng) * f.len * 0.5;
    const near = Math.abs(b.x - midX) < 80 && b.y > 630 && b.y < 775;
    f.pressed = near && (b.vy > 40 || (attractStill > 700 && (attractT % 800) < 260));
  }
  if (stock <= 0 || state === 'ended') { state = 'attract'; score = 0; wave = 1; stock = 3; spawnWave(1); serveBall(); }
}

// ── UPDATE ───────────────────────────────────────────────────────────────────
function update(dtMs) {
  if (paused) return;  // physics, timers, invaders, UFO all freeze; render keeps running
  if (state === 'attract') attractAI(dtMs);

  {
    const lb = laneBall();
    if (lb) lb.y = Math.min(742, 730 + plunger.pull * 0.11);
  }
  if (plunger.snap > 0) plunger.snap--;

  if (SAUCER.heldBall) {
    SAUCER.holdT -= dtMs;
    if (SAUCER.holdT <= 0) ejectSaucer();
  }
  if (SAUCER.flash > 0) SAUCER.flash--;

  CANNON.cd = Math.max(0, CANNON.cd - dtMs);
  CANNON.beam = Math.max(0, CANNON.beam - dtMs);
  CANNON.x += CANNON.dir * 40 * dtMs / 1000;
  if (CANNON.x < 170 || CANNON.x > 310) CANNON.dir *= -1;

  SPINNER.cd = Math.max(0, SPINNER.cd - dtMs);
  if (SPINNER.spins > 0) {
    SPINNER.ang += dtMs * 0.03;
    if ((SPINNER.ang | 0) % 2 === 0 && Math.random() < dtMs / 90) {
      SPINNER.spins--; score += 5; sfx.spin();
    }
  }

  // physics — flippers step at the same 240Hz as the ball (per-frame stepping
  // teleports the blade between substeps and sweeps THROUGH the ball)
  acc += dtMs / 1000;
  let n = 0;
  while (acc >= SUB && n < 10) {
    for (const f of FLIPPERS) stepFlipper(f, SUB);
    for (const b of ballsInPlay) stepBall(b, SUB);
    for (let i = ballsInPlay.length - 1; i >= 0; i--)
      if (ballsInPlay[i].y > WORLD_H + 24 && !ballsInPlay[i].held) {
        ballsInPlay.splice(i, 1);
        if (ballsInPlay.length === 1 && multiball) { multiball = false; say('MULTIBALL OVER', 80); }
      }
    if (ballsInPlay.length === 0 && !SAUCER.heldBall && state !== 'ended') {
      if (state === 'attract') serveBall(); else endBall(false);
    }
    acc -= SUB; n++;
  }
  if (n === 10) acc = 0;

  if (state !== 'ended') {
    INV.tAcc += dtMs;
    const beat = BOSS.active
      ? Math.max(300, INV.beatBase)
      : Math.max(160, INV.beatBase * (0.35 + 0.65 * INV.count / Math.max(1, INV.total)));
    if (INV.tAcc >= beat && (INV.count > 0 || BOSS.active)) {
      INV.tAcc = 0; INV.frame ^= 1;
      if (BOSS.active) {
        BOSS.x += 14 * BOSS.dir;
        if (BOSS.x < 110 || BOSS.x > 370) { BOSS.dir *= -1; BOSS.y += 10; }
        else if (Math.random() < 0.35) BOSS.y += 8;
        sfx.march();
      } else {
        INV.x += 12 * INV.dir;
        const maxX = 436 - INV.cols * INV.cw - 26;
        if (INV.x < 26 || INV.x > maxX) {
          INV.x = Math.max(26, Math.min(maxX, INV.x));
          INV.dir *= -1; INV.y += 16;
        }
        sfx.march();
      }
      const low = lowestAlienY();
      if (low > INVASION_Y - 60 && low < INVASION_Y) sfx.siren();
      if (low >= INVASION_Y) invade();
    }
  }

  UFO.timer -= dtMs;
  if (!UFO.active && UFO.timer <= 0) { callUFO(); UFO.timer = 13000 + Math.random() * 6000; }
  if (UFO.active) {
    UFO.x += UFO.vx * dtMs / 1000;
    if (UFO.x < -30 || UFO.x > WORLD_W + 30) UFO.active = false;
  }

  if (BOSS.flash > 0) BOSS.flash--;
  for (const p of BUMPERS) { if (p.flash > 0) p.flash--; if (p.pop > 0) p.pop--; }
  for (const p of SLINGS)  if (p.flash > 0) p.flash--;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = labels.length - 1; i >= 0; i--) {
    const l = labels[i]; l.y -= 0.7; l.life--;
    if (l.life <= 0) labels.splice(i, 1);
  }
  if (msg && --msg.life <= 0) msg = null;

  dmd.x -= dtMs * 0.045;
  const tw = dmd.text.length * 11;
  if (dmd.x < -tw) dmd.x = 200;
}

// ── PIXEL PIPELINE ───────────────────────────────────────────────────────────
// world renders at half res (240×400) then integer-upscales with smoothing off —
// everything quantizes to chunky pixels; HUD/DMD text drawn crisp on top.

const tableCanvas = document.createElement('canvas');

function bmOn(c2, bm, x, y, s, col) {
  c2.fillStyle = col;
  const rows = bm.length, cols = bm[0].length;
  for (let r = 0; r < rows; r++)
    for (let cc = 0; cc < cols; cc++)
      if (bm[r][cc] === '1') c2.fillRect(x - cols / 2 * s + cc * s, y - rows / 2 * s + r * s, s, s);
}
// outer boundary for rail chase lamps
const RAIL_PATH = [[14,760],[14,110],[120,20],[300,14],[390,40],[450,110],[466,190],[466,758]];
const CHASE = [];
(function () {
  for (let i = 0; i < RAIL_PATH.length - 1; i++) {
    const [x1, y1] = RAIL_PATH[i], [x2, y2] = RAIL_PATH[i + 1];
    const d = Math.hypot(x2 - x1, y2 - y1), steps = Math.max(1, Math.round(d / 30));
    for (let s = 0; s < steps; s++)
      CHASE.push([x1 + (x2 - x1) * s / steps, y1 + (y2 - y1) * s / steps]);
  }
})();
function buildTable() {

  // decals: watermark invader, ringed planet, comet

  c.globalAlpha = 1;
  // planet
  c.fillStyle = '#2a5a7a';

  // bevel+glow rail treatment (one-time static pass) — V8 DIMENSIONALITY REBUILD.

  const PAL_PINK   = { glow: 'rgba(255,47,214,0.80)',  dark: '#3c1238', midDark: '#b8449f', mid: '#d668bd', light2: '#ff86e2', light: '#ffc2f0', hi: '#ffeefc' };
  const PAL_CYAN   = { glow: 'rgba(47,214,255,0.80)',  dark: '#0f3340', midDark: '#26788f', mid: '#3fa8c2', light2: '#86dcf5', light: '#c2f0ff', hi: '#eefcff' };
  const tube = (x1, y1, x2, y2, pal, w) => {
    pal = pal || PAL_CHROME; w = w || 19;
    c.lineCap = 'round';
    const line = (w2, col) => {
      c.strokeStyle = col; c.lineWidth = w2;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    };
    c.save(); c.shadowColor = pal.glow; c.shadowBlur = 24;   // V7 glow level kept (verified correct)
    line(w, pal.dark);
    c.restore();
    line(w, pal.dark);
    line(w * 0.86, pal.midDark);
    line(w * 0.66, pal.mid);
    line(w * 0.45, pal.light2);
    line(w * 0.26, pal.light);
    const dx2 = x2 - x1, dy2 = y2 - y1, L = Math.hypot(dx2, dy2) || 1;

    c.beginPath(); c.moveTo(x1 + ox2, y1 + oy2); c.lineTo(x2 + ox2, y2 + oy2); c.stroke();
  };
  // width hierarchy (matches the mockup: outer boundary boldest, inner dividers slimmer):
  // outer boundary + lane cap = 19; HYPER/WARP inlane guides = 15; shooter-lane divider
  // and top rollover dividers = 12 so their narrow channels stay readable
  const TUBE_W = i => (i === 7 || i === 11 || i === 12) ? 12 : (i === 8 || i === 9) ? 15 : 19;
  SEGS.forEach((s, i) => tube(s.x1, s.y1, s.x2, s.y2, i === 9 ? PAL_PINK : i === 8 ? PAL_CYAN : PAL_CHROME, TUBE_W(i)));
  c.globalAlpha = 0.5;
  c.strokeStyle = '#8a55e0'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(GATE.x1, GATE.y1); c.lineTo(GATE.x2, GATE.y2); c.stroke();
  c.globalAlpha = 1;
  const bolts = [[14,110],[120,20],[300,14],[390,40],[450,110],[466,190],[436,205],[14,600],[436,600],[146,708],[334,708],[14,760],[466,758]];
  for (const [bx, by] of bolts) {

    c.fillStyle = '#7a5fb0'; c.fillRect(bx - 2.4, by - 0.7, 4.8, 1.4);

  const orb = (x, y, col, core) => {

  orb(334, 708, '#2fd6ff', '#9ae8ff');   // WARP LANE (right, cyan)

  // BOOST / EXTRA BALL / JACKPOT ring targets — VISUAL DECALS ONLY this round
  // (no collision circle, no score hook; mechanical wiring deferred to a balance round)
  const ringT = (x, y, r, col) => {

    c.globalAlpha = 0.18; c.fillStyle = col; c.fill(); c.globalAlpha = 1;

  c.strokeStyle = '#4a2470'; c.lineWidth = 3; c.strokeRect(146, 30, 188, 34);
  c.strokeStyle = '#8a55e0'; c.lineWidth = 1; c.strokeRect(149, 33, 182, 28);
  c.fillStyle = '#04140a'; c.fillRect(151, 35, 178, 24);
}

function drawInsert(c2, ins, t) {
  const on = ins.lit() && ((t / 320 | 0) % 2 === 0);
  c2.save();
  c2.translate(ins.x, ins.y);
  if (ins.rot) c2.rotate(ins.rot);
  if (ins.shape === 'arrow') {
    c2.fillStyle = '#120a28';
    c2.beginPath(); c2.moveTo(0, -11); c2.lineTo(9, 9); c2.lineTo(-9, 9); c2.closePath(); c2.fill();
    c2.fillStyle = on ? ins.color : 'rgba(255,255,255,0.08)';
    if (on) { c2.shadowColor = ins.color; c2.shadowBlur = 8; }
    c2.beginPath(); c2.moveTo(0, -8); c2.lineTo(6.5, 6.5); c2.lineTo(-6.5, 6.5); c2.closePath(); c2.fill();
  } else {
    c2.fillStyle = '#120a28';
    c2.beginPath(); c2.arc(0, 0, 8, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = on ? ins.color : 'rgba(255,255,255,0.08)';
    if (on) { c2.shadowColor = ins.color; c2.shadowBlur = 8; }
    c2.beginPath(); c2.arc(0, 0, 5.5, 0, Math.PI * 2); c2.fill();
  }
  c2.shadowBlur = 0;
  c2.restore();
}

// ── DYNAMIC WORLD DRAW ───────────────────────────────────────────────────────
function drawFlipper(c2, f) {
  // V8 DIMENSIONALITY: same widened multi-band chrome family as the rebuilt rail — the
  // flipper is drawn as a short thick tube. Capsule radii up 13/7 → 15/8.5 (RENDER ONLY:
  // physics reads f.thick=11 at the collision sites, untouched), the old 4-stop gradient
  // is now a 7-stop chrome falloff, and an along-blade specular streak mirrors the rail's
  // 'hi' pass. Tip glow / pivot cap language kept.
  const a = f.ang, ca = Math.cos(a), sa = Math.sin(a);
  const bR = 15, tR = 8.5;
  const tx = f.px + ca * f.len, ty = f.py + sa * f.len;
  c2.fillStyle = 'rgba(0,0,0,0.4)';
  c2.beginPath();
  c2.arc(f.px + 2, f.py + 3, bR, a + Math.PI / 2, a - Math.PI / 2);
  c2.arc(tx + 2, ty + 3, tR, a - Math.PI / 2, a + Math.PI / 2);
  c2.closePath(); c2.fill();
  c2.beginPath();
  c2.arc(f.px, f.py, bR, a + Math.PI / 2, a - Math.PI / 2);
  c2.arc(tx, ty, tR, a - Math.PI / 2, a + Math.PI / 2);

function drawCabinet(t) {

    // PAUSE ring (functional: tap toggles pause during play; 'P' key too)
    const pr = Math.min(inH * 0.22, W * 0.045);
    PAUSE_BTN.x = pad + pr * 2.1; PAUSE_BTN.y = inTop + inH * 0.30; PAUSE_BTN.r = pr;
    ctx.fillStyle = '#12102a';
    ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, pr, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.shadowColor = '#a04fe0'; ctx.shadowBlur = 8 * DPR;
    ctx.strokeStyle = paused ? '#ffd05a' : '#a04fe0'; ctx.lineWidth = 1.5 * DPR; ctx.stroke(); ctx.restore();
    ctx.fillStyle = paused ? '#ffd05a' : '#c9b8ff';
    if (paused) {
      ctx.beginPath();
      ctx.moveTo(PAUSE_BTN.x - pr * 0.28, PAUSE_BTN.y - pr * 0.42);
      ctx.lineTo(PAUSE_BTN.x + pr * 0.5, PAUSE_BTN.y);
      ctx.lineTo(PAUSE_BTN.x - pr * 0.28, PAUSE_BTN.y + pr * 0.42);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(PAUSE_BTN.x - pr * 0.38, PAUSE_BTN.y - pr * 0.42, pr * 0.28, pr * 0.84);
      ctx.fillRect(PAUSE_BTN.x + pr * 0.10, PAUSE_BTN.y - pr * 0.42, pr * 0.28, pr * 0.84);
    }
    // title: 'PIN-' magenta→pink gradient / 'VADERS' white→cyan gradient,
    // thick dark-navy outline stroke + outer glow (never flat text)
    const fs = Math.min(topH * 0.34, W * 0.058);
    const tCX = W * 0.34, tY = inTop + inH * 0.32;
    ctx.font = fs + 'px Bungee, "Arial Black", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const w1 = ctx.measureText('PIN-').width, w2 = ctx.measureText('VADERS').width;
    const minTX = PAUSE_BTN.x + PAUSE_BTN.r * 1.6;
    const tX = Math.max(minTX, tCX - (w1 + w2) / 2);
    ctx.strokeStyle = '#0d0a2c'; ctx.lineWidth = Math.max(2 * DPR, fs * 0.16);
    ctx.strokeText('PIN-', tX, tY); ctx.strokeText('VADERS', tX + w1, tY);
    const g1 = ctx.createLinearGradient(0, tY - fs * 0.55, 0, tY + fs * 0.55);
    g1.addColorStop(0, '#ff8ae8'); g1.addColorStop(1, '#ff2fd6');
    ctx.save(); ctx.shadowColor = '#ff2fd6'; ctx.shadowBlur = 9 * DPR;
    ctx.fillStyle = g1; ctx.fillText('PIN-', tX, tY);
    const g2 = ctx.createLinearGradient(0, tY - fs * 0.55, 0, tY + fs * 0.55);
    // V7: white-DOMINANT per forensic spec — white holds to 60% of the glyph height,
    // then eases into a LIGHT blue tint (was a hard white→saturated-cyan ramp)
    g2.addColorStop(0, '#ffffff'); g2.addColorStop(0.6, '#ffffff'); g2.addColorStop(1, '#9aeaff');
    ctx.shadowColor = '#2fd6ff';
    ctx.fillStyle = g2; ctx.fillText('VADERS', tX + w1, tY);
    ctx.restore();
    if (topH > 40 * DPR) {
      // tagline
      ctx.textAlign = 'center';
      ctx.font = (fs * 0.30) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
      ctx.fillStyle = '#c9b8ff';
      ctx.fillText('★ PINBALL. INVADE. WIN. ★', tCX, tY + fs * 0.78);
      // REAL hi-score (Osimo 2026-07-29): global first, local second; if neither, say so.
      let local = 0;
      try {
        const board = JSON.parse(localStorage.getItem('jnj_board_' + SLUG) || '[]');
        if (board.length) local = Math.max(...board.map(e => e.s || 0));
      } catch (e) {}
      const hi = Math.max(GLOBAL_HI, local);
      ctx.font = (fs * 0.34) + 'px Bungee, "Arial Black", sans-serif';
      ctx.fillStyle = '#ffd05a';
      ctx.fillText('HI-SCORE  ' + (hi ? hi.toLocaleString('en-GB') : '—'), tCX, inTop + inH * 0.86);
      // stat cards, right column — WAVE / SCORE / MULTIPLIER (live state)
      const cw = W * 0.26, chh = inH * 0.27, cx0 = W - pad - cw - 4 * DPR;
      drawCard(cx0, inTop + inH * 0.05,  cw, chh, BOSS.active ? 'BOSS' : 'WAVE', '' + wave, '#a04fe0', '#ffffff');
      drawCard(cx0, inTop + inH * 0.375, cw, chh, 'SCORE', score.toLocaleString('en-GB'), '#a04fe0', '#ffffff');
      drawCard(cx0, inTop + inH * 0.70,  cw, chh, 'MULT', '×' + bonusX + (multiball ? '·2X' : ''), '#a04fe0', '#4de8ff');
      // alien-head badge beside the WAVE card
      const frame = (t / 500 | 0) % 2;
      bmMain(frame ? BM_B : BM_A, cx0 - 12 * DPR, inTop + inH * 0.05 + chh / 2, Math.max(1, chh * 0.055), '#6dff4d');
    }
  }

  // ── LOCKDOWN BAR + COIN DOOR (bottom band) ──
  if (botH > 10 * DPR) {
    const bg = ctx.createLinearGradient(0, botY, 0, botY + botH);
    bg.addColorStop(0, '#3a2a68'); bg.addColorStop(0.25, '#241548'); bg.addColorStop(1, '#0e0820');
    ctx.fillStyle = bg; ctx.fillRect(0, botY, W, botH);
    ctx.fillStyle = '#8a55e0'; ctx.fillRect(0, botY, W, 3 * DPR);
    ctx.fillStyle = 'rgba(226,204,255,0.5)'; ctx.fillRect(0, botY + 3 * DPR, W, 1.5 * DPR);
    if (botH > 34 * DPR) {
      // BALL pill (left) · MISSION pill (centre-wide) · flipper-control glow buttons (right)
      const bpad = Math.min(10 * DPR, botH * 0.12);
      const ph2 = botH * 0.52, py2 = botY + botH * 0.24;
      drawCard(bpad, py2, W * 0.16, ph2, 'BALL', '' + Math.max(0, stock), '#a04fe0', '#ffffff');
      // MISSION pill — mechanically accurate: killing every alien DOES trigger wave-clear
      const mw = W * 0.42, mx = W * 0.5 - mw * 0.58;
      const mtxt = BOSS.active ? 'KILL THE MOTHERSHIP!' : 'CLEAR THE INVADERS!';
      const gm = ctx.createLinearGradient(0, py2, 0, py2 + ph2);
      gm.addColorStop(0, '#1a1638'); gm.addColorStop(1, '#12102a');
      rrect(ctx, mx, py2, mw, ph2, Math.min(7 * DPR, ph2 * 0.3));
      ctx.fillStyle = gm; ctx.fill();
      ctx.save(); ctx.shadowColor = '#a04fe0'; ctx.shadowBlur = 7 * DPR;
      ctx.strokeStyle = '#a04fe0'; ctx.lineWidth = 1.5 * DPR; ctx.stroke(); ctx.restore();
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.font = (ph2 * 0.26) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
      ctx.fillStyle = '#c9b8ff';
      ctx.fillText('MISSION:', mx + mw / 2, py2 + ph2 * 0.26);
      ctx.font = '600 ' + (ph2 * 0.30) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(mtxt, mx + mw / 2 - 6 * DPR, py2 + ph2 * 0.68);
      const fr2 = (t / 500 | 0) % 2;
      bmMain(fr2 ? BM_B : BM_A, mx + mw - 10 * DPR, py2 + ph2 * 0.68, Math.max(1, ph2 * 0.05), '#6dff4d');
      // flipper-control glow-ring buttons — cyan ◀ left / magenta ▶ right; the ring
      // brightens while that flipper is actually pressed (live causality feedback)
      const br = Math.min(botH * 0.26, W * 0.05);
      const bys = botY + botH * 0.5;
      const btns = [
        { x: W * 0.82, col: '#2fd6ff', glyph: '◀', on: FLIPPERS[0].pressed },
        { x: W * 0.93, col: '#ff2fd6', glyph: '▶', on: FLIPPERS[1].pressed },
      ];
      for (const bt of btns) {
        ctx.fillStyle = '#12102a';
        ctx.beginPath(); ctx.arc(bt.x, bys, br, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.shadowColor = bt.col; ctx.shadowBlur = (bt.on ? 16 : 8) * DPR;
        ctx.strokeStyle = bt.col; ctx.lineWidth = (bt.on ? 3 : 2) * DPR; ctx.stroke(); ctx.restore();
        ctx.fillStyle = bt.on ? '#ffffff' : bt.col;
        ctx.font = (br * 0.9) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(bt.glyph, bt.x, bys + 1 * DPR);
      }
    }
  }
}
function bmMain(bm, x, y, s, col) {
  ctx.fillStyle = col;
  const rows = bm.length, cols = bm[0].length;
  for (let r = 0; r < rows; r++)
    for (let cc = 0; cc < cols; cc++)
      if (bm[r][cc] === '1') ctx.fillRect(x - cols / 2 * s + cc * s, y - rows / 2 * s + r * s, s, s);
}

// ── RENDER (composite: cabinet → pixel world → crisp text layer) ─────────────
function render(t) {
  renderWorld(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawCabinet(t);

  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT--; sx = (Math.random() - .5) * shakeT * DPR; sy = (Math.random() - .5) * shakeT * DPR; }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(worldCanvas, VIEW.ox + sx, VIEW.oy + sy, WORLD_W * VIEW.scale, WORLD_H * VIEW.scale);

  // crisp layer (world coords)
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox + sx, VIEW.oy + sy);

  // DMD text
  ctx.save();
  ctx.beginPath(); ctx.rect(153, 36, 174, 22); ctx.clip();
  ctx.font = '16px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#48ff7a'; ctx.shadowColor = '#48ff7a'; ctx.shadowBlur = 6;
  ctx.fillText(dmd.text, 153 + dmd.x, 48);
  ctx.restore(); ctx.shadowBlur = 0;

  // S-O-S letters (lamps are pixel; letters crisp)
  const SOS = ['S', 'O', 'S'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = ROLLS[i].lit ? '#04140a' : '#9fff8a';
    ctx.font = '12px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(SOS[i], ROLLS[i].x, SOS_Y + 1);
  }
  // feature tags
  ctx.font = '10px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = shieldArmed ? '#9fff8a' : 'rgba(159,255,138,0.4)';
  ctx.fillText('SHIELD', 123, 490);
  ctx.fillStyle = UFO.active ? '#ff5470' : 'rgba(255,84,112,0.4)';
  ctx.fillText('UFO', 357, 490);
  ctx.fillStyle = '#ff8ab5'; ctx.font = '9px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillText(multiball ? '2X' : 'LOCK ' + lockedCount + '/2', SAUCER.x, SAUCER.y + SAUCER.r + 4);

  // decal branding text (crisp layer; static values are DECAL TEXT ONLY, not live score)
  ctx.textBaseline = 'middle';
  ctx.font = '9px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillStyle = 'rgba(77,232,255,0.8)';
  ctx.fillText('SUPER LANES', 34, 318);
  ctx.font = '600 10px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillStyle = '#4de8ff';
  ctx.fillText('250,000', 34, 330);
  ctx.font = '9px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillStyle = 'rgba(255,105,224,0.8)';
  ctx.fillText('INVADER JAM', 414, 318);
  ctx.font = '600 10px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillStyle = '#ff69e0';
  ctx.fillText('100,000', 414, 330);
  // HYPER / WARP lane labels along the existing inlane tubes
  ctx.font = '10px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.save(); ctx.translate(72, 648); ctx.rotate(Math.atan2(108, 132));
  ctx.fillStyle = 'rgba(255,105,224,0.85)'; ctx.fillText('HYPER LANE', 0, -10); ctx.restore();
  ctx.save(); ctx.translate(388, 648); ctx.rotate(Math.atan2(-108, 102));
  ctx.fillStyle = 'rgba(77,232,255,0.85)'; ctx.fillText('WARP LANE', 0, -10); ctx.restore();
  // ring-target call-outs (decals only — no mechanic wired this round)
  ctx.font = '8px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillStyle = '#4de8ff'; ctx.fillText('BOOST', 185, 550);
  ctx.fillStyle = '#ff69e0'; ctx.fillText('EXTRA', 240, 543); ctx.fillText('BALL', 240, 553);
  ctx.fillStyle = '#ff5470'; ctx.fillText('JACKPOT', 295, 550);
  // drop-target bank labels
  ctx.fillStyle = '#c9b8ff';
  ctx.fillText('DROP TARGETS', 123, 504);
  ctx.fillText('DROP TARGETS', 357, 504);

  // floating labels
  ctx.font = '15px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of labels) {
    ctx.globalAlpha = Math.min(1, l.life / 20);
    ctx.fillStyle = l.col;
    ctx.fillText(l.txt, l.x, l.y);
  }
  ctx.globalAlpha = 1;

  // HUD — SCORE/WAVE/MULT/BALL now live in the backbox stat cards + BALL pill
  // (screen-space bands), de-duplicating the old on-table text block; TILT stays on-table.
  if (tilted) {
    ctx.fillStyle = '#ff5470'; ctx.font = '16px "Barlow Condensed", "Arial Narrow", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('TILT', 14, 84);
  }
  ctx.font = '22px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillText(muted ? '🔇' : '🔊', WORLD_W - 12, 12);

  if (laneBall() && state === 'playing') {
    ctx.font = '13px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(t / 300)) + ')';
    ctx.fillText('⇣ DRAG DOWN ⇣', 390, 620);
  }

  if (msg) {
    ctx.font = '28px Bungee, "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = INK; ctx.shadowColor = INK; ctx.shadowBlur = 18;
    ctx.fillText(msg.txt, WORLD_W / 2, 540);
    ctx.shadowBlur = 0;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(7,8,13,0.55)';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.font = '32px Bungee, "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = INK; ctx.shadowColor = INK; ctx.shadowBlur = 18;
    ctx.fillText('PAUSED', WORLD_W / 2, 380);
    ctx.shadowBlur = 0;
    ctx.font = '13px "Barlow Condensed", "Arial Narrow", sans-serif';
    ctx.fillStyle = '#c9b8ff';
    ctx.fillText('TAP THE ⏸ RING TO RESUME', WORLD_W / 2, 416);
  }
}

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(t) {
  const dt = Math.min(32, t - tPrev); tPrev = t;
  update(dt);
  render(t);
  requestAnimationFrame(loop);
}

// ── COIN ─────────────────────────────────────────────────────────────────────
document.getElementById('coinBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  // belt-and-braces: some browsers don't fire a native resize event on the fullscreen
  // transition — recompute canvas/VIEW after the promise settles either way.
  try {
    const fsReq = document.documentElement.requestFullscreen?.();
    if (fsReq && fsReq.then) fsReq.then(() => setTimeout(resize, 80), () => resize());
  } catch (e) {}
  unlockAudio();
  startGame();
});

spawnWave(1);
serveBall();
requestAnimationFrame(loop);

// Installed-PWA fullscreen settle safety net (ported from hop-man.html 2026-08-26 Android
// report — same failure class: first layout pass measures the viewport before installed-PWA
// fullscreen chrome has settled, baking a stale canvas/VIEW into frame 1). visualViewport
// tracks the real visible area more reliably than window's native 'resize' on mobile; both
// paths route into the EXISTING resize() rather than duplicating its math. resize() only
// mutates VIEW.scale/ox/oy + canvas.width/height with zero game-state side effects, so
// redundant back-to-back calls are safe with no guard/debounce needed.
if (window.visualViewport) visualViewport.addEventListener('resize', () => dispatchEvent(new Event('resize')));
setTimeout(() => dispatchEvent(new Event('resize')), 300);

// QA hook (playtest-by-evaluate — read state, force scenarios; no score set)
window.__PV = {
  marker: BUILD_MARKER,
  get: () => {
    const b = ballsInPlay[0] || { x: 0, y: 0, vx: 0, vy: 0, inLane: false, held: false };
    return { state, paused, score, wave, stock, nBalls: ballsInPlay.length,
             x: b.x, y: b.y, vx: b.vx, vy: b.vy, inLane: b.inLane, held: b.held,
             invCount: INV.count, invY: INV.y, tilted, bonusX, lockedCount, multiball,
             shieldArmed, boss: BOSS.active ? { hp: BOSS.hp, x: BOSS.x, y: BOSS.y } : null,
             dropsL: DROPS_L.filter(d => d.up).length, dropsR: DROPS_R.filter(d => d.up).length,
             saucerHeld: !!SAUCER.heldBall, flipperAngs: FLIPPERS.map(f => f.ang) };
  },
  // Cassette-recorder camera handle (tools/show/render_game_footage.py). VIEW is a fixed
  // centred fit of the whole 480x800 table — right on a phone, but a 4:3 cassette frame of
  // it is mostly empty rails with the ball too small to see, so the recorder swaps in a
  // ball-following camera through this handle. Exposing the live VIEW object (not a copy)
  // is the point: the draw loop reads it every frame, so redefining its properties from
  // outside re-aims the camera with no changes to the game's own code.
  cam: { view: VIEW, canvas: canvas, world: [WORLD_W, WORLD_H], dpr: () => DPR },
  fire: p => { plunger.pull = p || 100; firePlunger(); },
  setBall: (x, y, vx, vy, i) => { const b = ballsInPlay[i || 0]; if (!b) return;
    b.x = x; b.y = y; b.vx = vx; b.vy = vy; b.held = false; b.inLane = false; },
  flip: (i, on) => { FLIPPERS[i].pressed = !!on; },
  forceWave: w => { wave = w; spawnWave(w); },
  setPull: p => { plunger.pull = p; },
};
})();
</script>
