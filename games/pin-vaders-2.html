<body>
<canvas id="cv"></canvas>
<script src="../arcade-scores.js"></script>
<script>
'use strict';
(function(){
/* ════════════════════════════════════════════════════════════════
   PIN VADERS 2 — pinball × space invaders — JNJ ARCADE
   Design canvas 390x844 world units. Physics in fixed world units.
   ════════════════════════════════════════════════════════════════ */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=390, H=844;                      // fixed world
var VIEW={scale:1,ox:0,oy:0,dpr:1,vw:390,vh:844};

/* ── palette ── */
var MAG='#ff2fd6', MAG_G='#ff69e0', CYN='#2fd6ff', CYN_L='#4de8ff',
    GLD='#ffcc33', GLD_D='#ffb300', GRN='#6dff4d', RED='#ff3355',
    LAV='#c9b8ff', CARD1='#12102a', CARD2='#1a1638', BORD='#a04fe0',
    NAVY='#0b0830';
var DISP='"Arial Rounded MT Bold","Verdana Rounded",Verdana,system-ui,sans-serif';
var COND='"Avenir Next Condensed","Arial Narrow",Arial,sans-serif';

/* ── physics constants ── */
var G=2000;                 // gravity, world-units/s^2
var CAP=1900;               // per-axis speed cap
var BR=6.5;                 // ball radius
var SUB=3;                  // max px per substep
var WALL_E=0.12, FRICT=0.994;
var LAUNCH_MIN=1700, LAUNCH_RANGE=150;   // v = 1700 + 150*power
/* plunger sanity: rest y=728.5, highest channel point y=143 → climb 585.5.
   min rise = 1700^2/(2*2000) = 722.5 > 585.5  ✓ (23% margin)
   max rise = 1850^2/(2*2000) = 855.6 ✓ ; cap 1900 >= 1850 → never clamped */

/* ── table geometry (world coords) ── */
var AC={x:195,y:302}, AR=172;          // outer arch centerline
var GR=145;                            // launch guide arc radius
var GEND=-2.4435;                      // guide arc end angle (-140°): releases the ball into the bumper cluster
var GEX=AC.x+GR*Math.cos(GEND), GEY=AC.y+GR*Math.sin(GEND); // (63.6,240.7)
var CHX=352.5;                         // launch channel center x
var BALL_REST_Y=728.5;

var WALLS=[ // capsules {a,b,r,e}
  {x1:23, y1:302, x2:23, y2:608, r:6.5},          // left wall
  {x1:23, y1:608, x2:113,y2:696, r:6.5},          // left funnel → pivot (rule 5)
  {x1:367,y1:302, x2:367,y2:742, r:6.5},          // right outer wall
  {x1:340,y1:302, x2:340,y2:736, r:4.5},          // launch guide straight + channel wall
  {x1:340,y1:608, x2:251,y2:696, r:4.5},          // right funnel → pivot (rule 5)
  {x1:344,y1:739, x2:363,y2:739, r:4},            // channel floor (plunger rest)
  {x1:100,y1:468, x2:60, y2:580, r:4.5},          // HYPER LANE guide
  {x1:264,y1:468, x2:306,y2:580, r:4.5}           // WARP LANE guide
];
var PIVOT_CAPS=[ {x:113,y:696,r:10.5}, {x:251,y:696,r:10.5} ];
var GUIDE_END_CAP={x:GEX,y:GEY,r:4.5};
var DRAIN_POST={x:182,y:724,flash:0};   // active drain guard: fires once per ball, then goes dark
var ORBS=[
  {x:60, y:580,r:8,col:MAG,name:'HYPER!',cd:0},
  {x:306,y:580,r:8,col:CYN,name:'WARP!', cd:0}
];
var BUMPERS=[
  {x:118,y:228,r:25,kick:920,col:MAG,tone:620,flash:0,cd:0},
  {x:195,y:200,r:29,kick:990,col:CYN,tone:760,flash:0,cd:0},
  {x:272,y:228,r:25,kick:920,col:GLD,tone:690,flash:0,cd:0}
];
var SHIP={x:182,y:400,r:14,cd:0,flash:0};
var TARGETS=[
  {x:144,y:452,up:true,flash:0},
  {x:182,y:452,up:true,flash:0},
  {x:220,y:452,up:true,flash:0}
];
var ROLLS=[
  {x:110,y:540,r:20,kind:'boost', col:CYN, cd:0,pulse:0},
  {x:182,y:544,r:24,kind:'extra', col:MAG, cd:0,pulse:0},
  {x:254,y:540,r:20,kind:'jackpot',col:RED,cd:0,pulse:0}
];
var FLIP_LEN=54, FLIP_R=10, FLIP_W=15;   // motor speed rad/s
var FL={px:113,py:696,len:FLIP_LEN,rest:0.576,up:-0.489,ang:0.576,angV:0,pressed:false,tint:MAG};
var FR={px:251,py:696,len:FLIP_LEN,rest:Math.PI-0.576,up:Math.PI+0.489,ang:Math.PI-0.576,angV:0,pressed:false,tint:CYN};

/* invaders: 4 rows x 5 cols */
var INV_COLS=[110,146,182,218,254], INV_ROWS=[268,296,324,352];
var ROW_COLS=[MAG,CYN,GLD,GRN];

/* ── game state ── */
var st='insert';            // insert | play | paused | over
var game=null;
var ball=null;
var parts=[], labels=[], banners=[];
var shake=0, nowS=0, lastT=0, lastInput=0;
var attract=false, attractURL=false;
var plunger={active:false,pull:0,touchId:null};
var press={L:0,R:0};
var best=0;
try{ best=parseInt(localStorage.getItem('pv2_best')||'0',10)||0; }catch(e){}

function newGame(){
  game={score:0,wave:1,mult:1,balls:3,kills:0,jam:0,lanes:0,
        jackpotLit:false,extraLit:true,respawnAt:0,overAt:0,
        saveUntil:0,saveUsed:false,invaders:[]};
  spawnGrid();
  parts.length=0; labels.length=0; banners.length=0;
  FL.pressed=FR.pressed=false; FL.ang=FL.rest; FR.ang=FR.rest;
  press.L=press.R=0;
  newBall();
}
function spawnGrid(){
  game.invaders=[];
  for(var r=0;r<4;r++)for(var c=0;c<5;c++)
    game.invaders.push({bx:INV_COLS[c],y:INV_ROWS[r],row:r,alive:true});
  game.kills=0; game.jam=0;
}
function newBall(){
  ball={x:CHX,y:BALL_REST_Y,vx:0,vy:0,waiting:true,trail:[]};
  game.saveUsed=false; game.saveUntil=0; game.saveArmed=true; game.postSave=true;
  plunger.active=false; plunger.pull=0; plunger.touchId=null;
}
function launch(p){
  if(!ball.waiting) return;
  p=Math.max(0,Math.min(1,p));
  ball.waiting=false; ball.vx=0; ball.vy=-(LAUNCH_MIN+LAUNCH_RANGE*p);
  /* ball-save arms ONCE per fresh ball — never re-arms on a save respawn,
     or a quick-draining ball would be saved forever */
  if(game.saveArmed){ game.saveArmed=false; game.saveUntil=nowS+8; }
  SFX.launch();
}

/* ── SFX: pure WebAudio house style ── */
var SFX={
  ctx:null,
  muted:(function(){ try{return localStorage.getItem('sfxMuted_pinvaders2')==='1';}catch(e){return false;} })(),
  ensure:function(){
    if(!this.ctx){ try{ var AC2=window.AudioContext||window.webkitAudioContext; this.ctx=new AC2(); }catch(e){} }
    if(this.ctx&&this.ctx.state==='suspended'){ this.ctx.resume().catch(function(){}); }
  },
  ok:function(){ return this.ctx&&!this.muted&&!attract; },
  toggle:function(){ this.muted=!this.muted; try{localStorage.setItem('sfxMuted_pinvaders2',this.muted?'1':'0');}catch(e){} },
  tone:function(f,dur,type,vol,slide,delay){
    if(!this.ok())return;
    var t0=this.ctx.currentTime+(delay||0);
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  noise:function(dur,vol,f0,f1,delay){
    if(!this.ok())return;
    var t0=this.ctx.currentTime+(delay||0);
    var n=Math.floor(this.ctx.sampleRate*dur)||1;
    var buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    var s=this.ctx.createBufferSource(); s.buffer=buf;
    var flt=this.ctx.createBiquadFilter(); flt.type='lowpass';
    flt.frequency.setValueAtTime(f0||2500,t0);
    flt.frequency.exponentialRampToValueAtTime(Math.max(60,f1||300),t0+dur);
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(flt); flt.connect(g); g.connect(this.ctx.destination);
    s.start(t0); s.stop(t0+dur+0.03);
  },
  flip:function(){ this.tone(95,0.055,'square',0.16); this.noise(0.03,0.07,1400,700); },
  bumper:function(f){ this.tone(f,0.08,'square',0.2,f*0.8); this.noise(0.03,0.1,3000,900); },
  pop:function(){ this.tone(880,0.09,'square',0.16,240); },
  ship:function(){ this.tone(180,0.16,'sawtooth',0.2,520); this.noise(0.08,0.1,2200,400); },
  drop:function(){ this.tone(420,0.07,'square',0.18,180); },
  roll:function(f){ this.tone(f||640,0.09,'triangle',0.18,f?f*1.4:900); },
  orb:function(){ this.tone(980,0.1,'sine',0.18,1400); },
  jackpot:function(){ var a=[523,659,784,1047,1319]; for(var i=0;i<a.length;i++)this.tone(a[i],0.12,'square',0.16,0,i*0.07); },
  extra:function(){ var a=[392,523,659,784]; for(var i=0;i<a.length;i++)this.tone(a[i],0.11,'triangle',0.18,0,i*0.08); },
  wave:function(){ var a=[440,554,659,880]; for(var i=0;i<a.length;i++)this.tone(a[i],0.13,'square',0.15,0,i*0.09); },
  lanes:function(){ var a=[659,784,988,1319]; for(var i=0;i<a.length;i++)this.tone(a[i],0.12,'square',0.16,0,i*0.06); },
  save:function(){ this.tone(300,0.22,'triangle',0.2,900); },
  drain:function(){ this.tone(220,0.5,'sawtooth',0.2,55); },
  nudge:function(){ this.noise(0.06,0.2,900,200); },
  launch:function(){ this.noise(0.28,0.22,3200,500); this.tone(160,0.25,'triangle',0.14,620); },
  over:function(){ var a=[330,262,196,131]; for(var i=0;i<a.length;i++)this.tone(a[i],0.2,'square',0.16,0,i*0.14); },
  coin:function(){ this.tone(1100,0.07,'square',0.16); this.tone(1600,0.1,'square',0.14,0,0.07); }
};

/* ── juice helpers ── */
function burst(x,y,col,n,sp){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283, s=(0.3+Math.random()*0.7)*(sp||260);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.55+Math.random()*0.3,t:0,col:col,sz:1.5+Math.random()*2.5});
  }
}
function label(x,y,txt,col,big){
  labels.push({x:x,y:y,txt:txt,col:col||'#fff',t:0,big:!!big});
}
function banner(txt,sub,col){
  banners.push({txt:txt,sub:sub||'',col:col||MAG,t:0});
}
function addScore(base,x,y,col,timesMult){
  var v=timesMult?Math.round(base*game.mult):base;
  game.score+=v;
  if(x!==undefined) label(x,y,'+'+fmt(v),col,v>=10000);
  return v;
}
function fmt(n){ return n.toLocaleString('en-US'); }

/* ── collision primitives ── */
function reflect(b,nx,ny,e,fr){
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    var tx=-ny,ty=nx, vt=b.vx*tx+b.vy*ty;
    vn=-vn*e; vt*=fr;
    b.vx=nx*vn+tx*vt; b.vy=ny*vn+ty*vt;
    return true;
  }
  return false;
}
function collideCapsule(b,w){
  var dx=w.x2-w.x1, dy=w.y2-w.y1, L2=dx*dx+dy*dy;
  var t=L2?(((b.x-w.x1)*dx+(b.y-w.y1)*dy)/L2):0;
  t=t<0?0:(t>1?1:t);
  var px=w.x1+dx*t, py=w.y1+dy*t;
  var nx=b.x-px, ny=b.y-py, d2=nx*nx+ny*ny, R=w.r+BR;
  if(d2>=R*R) return false;
  var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
  b.x=px+nx*R; b.y=py+ny*R;
  reflect(b,nx,ny,WALL_E,FRICT);
  return true;
}
function collideCircle(b,c,e){
  var nx=b.x-c.x, ny=b.y-c.y, d2=nx*nx+ny*ny, R=c.r+BR;
  if(d2>=R*R) return false;
  var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
  b.x=c.x+nx*R; b.y=c.y+ny*R;
  reflect(b,nx,ny,(e!==undefined?e:0.4),FRICT);
  return true;
}
function collideArc(b,cx,cy,R,rad,test){
  var dx=b.x-cx, dy=b.y-cy;
  if(!test(dx,dy)) return false;
  var d=Math.sqrt(dx*dx+dy*dy)||0.0001;
  var diff=d-R, pen=BR+rad-Math.abs(diff);
  if(pen<=0) return false;
  var s=diff<0?-1:1;
  var nx=dx/d*s, ny=dy/d*s;
  var target=R+s*(rad+BR);
  b.x=cx+dx/d*target; b.y=cy+dy/d*target;
  reflect(b,nx,ny,WALL_E,FRICT);
  return true;
}
var archTest=function(dx,dy){ return dy<=2; };
var guideTest=function(dx,dy){ var a=Math.atan2(dy,dx); return a<0.02&&a>GEND; };

/* ── flippers: motor stepped INSIDE substep loop (rule 2) ── */
function stepFlipper(f,h){
  var tgt=f.pressed?f.up:f.rest;
  var dir=tgt>f.ang?1:(tgt<f.ang?-1:0);
  if(!dir){ f.angV=0; return; }
  var na=f.ang+dir*FLIP_W*h;
  if((dir>0&&na>tgt)||(dir<0&&na<tgt)) na=tgt;
  f.angV=(na-f.ang)/h;   // 0 when parked at a limit → no flick force (rule 3 physics)
  f.ang=na;
}
function collideFlipper(b,f){
  var tx=f.px+Math.cos(f.ang)*f.len, ty=f.py+Math.sin(f.ang)*f.len;
  var dx=tx-f.px, dy=ty-f.py, L2=dx*dx+dy*dy;
  var t=(((b.x-f.px)*dx+(b.y-f.py)*dy)/L2);
  t=t<0?0:(t>1?1:t);
  var px=f.px+dx*t, py=f.py+dy*t;
  var nx=b.x-px, ny=b.y-py, d2=nx*nx+ny*ny, R=FLIP_R+BR;
  if(d2>=R*R) return false;
  var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
  b.x=px+nx*R; b.y=py+ny*R;
  // surface velocity at contact from angular velocity (tip moves fastest = the flick)
  var rx=px-f.px, ry=py-f.py;
  var svx=-ry*f.angV, svy=rx*f.angV;
  var relx=b.vx-svx, rely=b.vy-svy;
  var vn=relx*nx+rely*ny;
  if(vn<0){
    var e=0.3;
    relx-= (1+e)*vn*nx; rely-=(1+e)*vn*ny;
    b.vx=svx+relx; b.vy=svy+rely;
  }
  return true;
}

/* ── target / bumper / sensor logic ── */
function hitBumper(b,bmp){
  var nx=b.x-bmp.x, ny=b.y-bmp.y, d2=nx*nx+ny*ny, R=bmp.r+BR;
  if(d2>=R*R) return;
  var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
  b.x=bmp.x+nx*R; b.y=bmp.y+ny*R;
  // bumpers SET an outward velocity — strong pop at any approach speed
  var tx=-ny,ty=nx, vt=(b.vx*tx+b.vy*ty)*0.25;
  b.vx=nx*bmp.kick+tx*vt; b.vy=ny*bmp.kick+ty*vt;
  if(nowS>bmp.cd){
    bmp.cd=nowS+0.09; bmp.flash=1; shake=Math.max(shake,0.25);
    addScore(bmp.col===CYN?200:150,bmp.x,bmp.y-bmp.r-8,bmp.col,true);
    burst(b.x,b.y,bmp.col,10,300);
    SFX.bumper(bmp.tone);
  }
}
function hitShip(b){
  var nx=b.x-SHIP.x, ny=b.y-SHIP.y, d2=nx*nx+ny*ny, R=SHIP.r+BR;
  if(d2>=R*R) return;
  var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
  b.x=SHIP.x+nx*R; b.y=SHIP.y+ny*R;
  b.vx=nx*830; b.vy=ny*830-160;
  if(nowS>SHIP.cd){
    SHIP.cd=nowS+0.8; SHIP.flash=1; shake=Math.max(shake,0.3);
    addScore(2500,SHIP.x,SHIP.y-24,MAG_G,true);
    game.mult=Math.min(5,Math.round((game.mult+0.1)*10)/10);
    burst(SHIP.x,SHIP.y,MAG,14,340);
    SFX.ship();
  }
}
function hitTargets(b){
  for(var i=0;i<TARGETS.length;i++){
    var tg=TARGETS[i];
    if(!tg.up) continue;
    var c={x:tg.x,y:tg.y,r:12.5};
    var nx=b.x-c.x, ny=b.y-c.y, d2=nx*nx+ny*ny, R=c.r+BR;
    if(d2>=R*R) continue;
    var d=Math.sqrt(d2)||0.0001; nx/=d; ny/=d;
    b.x=c.x+nx*R; b.y=c.y+ny*R;
    reflect(b,nx,ny,0.35,FRICT);
    tg.up=false; tg.flash=1;
    addScore(500,tg.x,tg.y-16,MAG_G,true);
    burst(tg.x,tg.y,MAG,8,240);
    SFX.drop();
    if(!TARGETS[0].up&&!TARGETS[1].up&&!TARGETS[2].up){
      game.jackpotLit=true;
      banner('JACKPOT LIT!','HIT THE RED CIRCLE',RED);
      game.respawnTargetsAt=nowS+1.4;
      SFX.jackpot();
    }
  }
}
function hitRollovers(b){
  for(var i=0;i<ROLLS.length;i++){
    var ro=ROLLS[i];
    if(nowS<ro.cd) continue;
    var dx=b.x-ro.x, dy=b.y-ro.y;
    if(dx*dx+dy*dy > (ro.r-2)*(ro.r-2)) continue;
    ro.cd=nowS+1.5; ro.pulse=1;
    if(ro.kind==='boost'){
      var s=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)||1;
      var k=Math.min(1.32,(CAP*0.9)/s);
      ball.vx*=k; ball.vy*=k;
      addScore(750,ro.x,ro.y-26,CYN);
      burst(ro.x,ro.y,CYN,10,280); SFX.roll(700);
    }else if(ro.kind==='extra'){
      if(game.extraLit){
        game.extraLit=false; game.balls++;
        banner('EXTRA BALL!','',MAG);
        burst(ro.x,ro.y,MAG,18,340); shake=Math.max(shake,0.3);
        SFX.extra();
      }else{
        addScore(1000,ro.x,ro.y-28,MAG_G); SFX.roll(540);
      }
    }else{ // jackpot
      if(game.jackpotLit){
        game.jackpotLit=false;
        addScore(25000,ro.x,ro.y-30,RED,true);
        game.mult=Math.min(5,Math.round((game.mult+0.5)*10)/10);
        banner('JACKPOT!','MULTIPLIER UP',RED);
        burst(ro.x,ro.y,RED,22,380); shake=Math.max(shake,0.5);
        SFX.jackpot();
      }else{
        addScore(500,ro.x,ro.y-26,'#ff8899'); SFX.roll(440);
      }
    }
  }
}
function marchX(){ return Math.sin(nowS*1.1+game.wave)*13; }
function hitInvaders(b){
  var mx=marchX();
  for(var i=0;i<game.invaders.length;i++){
    var inv=game.invaders[i];
    if(!inv.alive) continue;
    var ix=inv.bx+mx;
    if(Math.abs(b.x-ix)<13&&Math.abs(b.y-inv.y)<11.5){
      inv.alive=false;
      game.kills++;
      game.jam=Math.min(4,Math.floor(game.kills/5));
      addScore(100+25*(game.wave-1),ix,inv.y-14,ROW_COLS[inv.row],true);
      burst(ix,inv.y,ROW_COLS[inv.row],12,260);
      b.vx*=0.96; b.vy*=0.96;   // smash-through with tiny damp
      SFX.pop();
      if(game.kills>=20) waveClear();
    }
  }
}
function waveClear(){
  game.score+=100000;
  banner('INVADER JAM!','+100,000 · WAVE CLEARED',MAG);
  game.mult=Math.min(5,Math.round((game.mult+0.5)*10)/10);
  game.wave++; game.extraLit=true;
  game.respawnAt=nowS+1.6;

/* ── physics master step ── */
function physics(dt){
  if(st!=='play') return;          // rule 4: no stepping after game end / while paused
  var b=ball;
  // targets pop back up
  if(game.respawnTargetsAt&&nowS>game.respawnTargetsAt){
    game.respawnTargetsAt=0;
    for(var i=0;i<3;i++){ TARGETS[i].up=true; TARGETS[i].flash=0.6; }
  }
  if(game.respawnAt&&nowS>game.respawnAt){ game.respawnAt=0; spawnGrid(); banner('WAVE '+game.wave,'CLEAR THE INVADERS!',CYN); }
  if(game.autoLaunchAt&&nowS>game.autoLaunchAt){ game.autoLaunchAt=0; launch(0.85); }
  if(b.waiting){
    // flippers still animate while ball waits on the plunger
    stepFlipper(FL,dt); stepFlipper(FR,dt);
    b.x=CHX; b.y=BALL_REST_Y+plunger.pull*7;
    return;
  }
  var sp=Math.max(Math.abs(b.vx),Math.abs(b.vy));
  var n=Math.ceil((sp*dt)/SUB); n=n<1?1:(n>40?40:n);
  var h=dt/n;
  for(var i2=0;i2<n;i2++){
    stepFlipper(FL,h); stepFlipper(FR,h);   // moving colliders per-substep (rule 2)
    b.vy+=G*h;
    var drg=1-0.045*h; b.vx*=drg; b.vy*=drg;
    b.x+=b.vx*h; b.y+=b.vy*h;
    for(var w=0;w<WALLS.length;w++) collideCapsule(b,WALLS[w]);
    collideArc(b,AC.x,AC.y,AR,6.5,archTest);
    collideArc(b,AC.x,AC.y,GR,4.5,guideTest);
    collideCircle(b,GUIDE_END_CAP,0.2);
    collideCircle(b,PIVOT_CAPS[0],0.15);
    collideCircle(b,PIVOT_CAPS[1],0.15);
    collideFlipper(b,FL); collideFlipper(b,FR);
    for(var q=0;q<BUMPERS.length;q++) hitBumper(b,BUMPERS[q]);
    /* active drain guard: one save per ball, straight-down drains get kicked back */
    if(game.postSave&&b.vy>0&&b.y>714&&b.y<746&&Math.abs(b.x-182)<16){
      game.postSave=false; DRAIN_POST.flash=1;
      b.y=712; b.vy=-680; b.vx+=(b.x-182)*9;
      label(182,700,'DRAIN GUARD!',MAG_G,true);
      burst(182,722,MAG,14,300); shake=Math.max(shake,0.35);
      SFX.save();
    }
    hitOrbs(b);
    hitTargets(b);
    hitShip(b);
    hitInvaders(b);
    hitRollovers(b);
    checkLanes(b);
    if(b.vx>CAP)b.vx=CAP; if(b.vx<-CAP)b.vx=-CAP;
    if(b.vy>CAP)b.vy=CAP; if(b.vy<-CAP)b.vy=-CAP;
    if(b.y>780){ drainBall(); return; }
  }
  // anti-softlock: dead-still ball anywhere on the playfield gets a micro nudge
  var spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(spd<15&&!b.waiting){
    b.still=(b.still||0)+dt;
    if(b.still>4){ b.still=0; b.vy-=140; b.vx+=(Math.random()*120-60); if(!attract)SFX.nudge(); }
  }else b.still=0;
  b.trail.push({x:b.x,y:b.y});
  if(b.trail.length>7)b.trail.shift();
}

  ctx.setTransform(1,0,0,1,0,0);
  if(hudC)ctx.drawImage(hudC,0,0);
  worldXform(ctx);
  if(game) drawHUDDyn(ctx);
  if(st==='insert') drawInsert(ctx);
  else if(st==='paused') drawPause(ctx);
  else if(st==='over'&&!(window.ArcadeScores&&window.ArcadeScores.show)) drawOverFallback(ctx);
  ctx.setTransform(1,0,0,1,0,0);
  if(crtC)ctx.drawImage(crtC,0,0);
}

/* ════════════════════ INPUT ════════════════════ */
var PTRS={}, keyL=false, keyR=false, keyCharge=false;
var nudgeTimes=[];
var flipPrevL=false, flipPrevR=false;

function dist2(x,y,px,py){ var dx=x-px,dy=y-py; return dx*dx+dy*dy; }
function setFlip(){
  if(attract) return;                 // AI owns flippers in attract
  FL.pressed=press.L>0||keyL;
  FR.pressed=press.R>0||keyR;
  if(FL.pressed&&!flipPrevL) SFX.flip();
  if(FR.pressed&&!flipPrevR) SFX.flip();
  flipPrevL=FL.pressed; flipPrevR=FR.pressed;
}
function tryFS(){
  var el=document.documentElement;
  try{
    if(el.requestFullscreen){ var p=el.requestFullscreen(); if(p&&p.catch)p.catch(function(){}); }
    else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
  }catch(e){}
}
function startPlay(){
  tryFS();
  newGame();
  st='play';
  SFX.coin();
  banner('WAVE 1','CLEAR THE INVADERS!',CYN);
}
function doNudge(dir){
  if(st!=='play'||!ball||ball.waiting) return;
  var t=nowS;
  nudgeTimes=nudgeTimes.filter(function(x){return t-x<1.6;});
  if(nudgeTimes.length>=3){ label(195,620,'TILT!',RED,true); return; }
  nudgeTimes.push(t);
  ball.vy-=170; ball.vx+=dir*80;
  shake=Math.max(shake,0.3);
  SFX.nudge();
}
function handleDown(id,cx,cy){
  lastInput=nowS;
  SFX.ensure();
  var wx=(cx-VIEW.ox)/VIEW.scale, wy=(cy-VIEW.oy)/VIEW.scale;
  if(attract){
    attract=false; FL.pressed=FR.pressed=false;
    resetGame();
    return;
  }
  if(st==='insert'){
    if(dist2(wx,wy,54,22)<19*19){ SFX.toggle(); return; }
    startPlay(); return;
  }
  if(st==='paused'){ st='play'; return; }
  if(st==='over'){
    if(!(window.ArcadeScores&&window.ArcadeScores.show)) resetGame();
    return;
  }
  /* play */
  if(dist2(wx,wy,22,22)<20*20){ st='paused'; return; }
  if(dist2(wx,wy,54,22)<19*19){ SFX.toggle(); return; }
  if(ball.waiting&&wx>326&&wy>340){
    PTRS[id]={plunger:true,y0:wy,t0:nowS};
    plunger.active=true; plunger.touchId=id;
    return;
  }
  var side=wx<195?'L':'R';
  PTRS[id]={side:side,x0:wx,y0:wy,t0:nowS,nudged:false};
  press[side]++;
  setFlip();
}
function handleMove(id,cx,cy){
  var p=PTRS[id]; if(!p) return;
  var wx=(cx-VIEW.ox)/VIEW.scale, wy=(cy-VIEW.oy)/VIEW.scale;
  if(p.plunger){
    plunger.pull=Math.max(0,Math.min(1,(wy-p.y0)/140));
    return;
  }
  if(!p.nudged&&(p.y0-wy)>26&&(nowS-p.t0)<0.35){
    p.nudged=true;
    doNudge(wx>p.x0+6?1:(wx<p.x0-6?-1:0));
  }
}
function handleUp(id){
  var p=PTRS[id]; if(!p) return;
  delete PTRS[id];
  if(p.plunger){
    if(st==='play'&&ball.waiting) launch(plunger.pull);
    plunger.active=false; plunger.pull=0; plunger.touchId=null;
    return;
  }
  press[p.side]=Math.max(0,press[p.side]-1);
  setFlip();
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; handleDown(t.identifier,t.clientX,t.clientY); }
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; handleMove(t.identifier,t.clientX,t.clientY); }
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++) handleUp(e.changedTouches[i].identifier);
},{passive:false});
cv.addEventListener('touchcancel',function(e){
  for(var i=0;i<e.changedTouches.length;i++) handleUp(e.changedTouches[i].identifier);
},{passive:false});
var mouseDown=false;
cv.addEventListener('mousedown',function(e){ mouseDown=true; handleDown('m',e.clientX,e.clientY); });
window.addEventListener('mousemove',function(e){ if(mouseDown) handleMove('m',e.clientX,e.clientY); });
window.addEventListener('mouseup',function(){ if(mouseDown){ mouseDown=false; handleUp('m'); } });
document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
window.addEventListener('keydown',function(e){
  if(e.repeat) return;
  lastInput=nowS;
  var k=e.code;
  if(attract){ attract=false; FL.pressed=FR.pressed=false; resetGame(); return; }
  if(st==='insert'&&(k==='Space'||k==='Enter')){ SFX.ensure(); startPlay(); return; }
  if(k==='ArrowLeft'||k==='KeyZ'){ keyL=true; setFlip(); }
  else if(k==='ArrowRight'||k==='KeyX'){ keyR=true; setFlip(); }
  else if(k==='Space'||k==='ArrowDown'){ if(st==='play'&&ball.waiting) keyCharge=true; }
  else if(k==='KeyN'){ doNudge(0); }
  else if(k==='KeyM'){ SFX.toggle(); }
  else if(k==='KeyP'){ if(st==='play')st='paused'; else if(st==='paused')st='play'; }
});
window.addEventListener('keyup',function(e){
  var k=e.code;
  if(k==='ArrowLeft'||k==='KeyZ'){ keyL=false; setFlip(); }
  else if(k==='ArrowRight'||k==='KeyX'){ keyR=false; setFlip(); }
  else if(k==='Space'||k==='ArrowDown'){
    if(keyCharge){ keyCharge=false; if(st==='play'&&ball&&ball.waiting) launch(plunger.pull); plunger.pull=0; }
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&st==='play'&&!attract) st='paused';
});

/* ════════════════════ ATTRACT AI ════════════════════ */
/* competent: launches, pulses flippers to flick at bumpers/targets.
   PULSES only — a held-up flipper has zero flick force (rule 3). */
var ai={cdL:0,cdR:0,relL:0,relR:0,launchAt:0};
function beginAttract(){
  attract=true;
  newGame();
  st='play';
  ai={cdL:0,cdR:0,relL:0,relR:0,launchAt:0};
}
function aiStep(){
  if(!attract||st!=='play') return;
  var b=ball;
  if(b.waiting){
    if(!ai.launchAt) ai.launchAt=nowS+0.9;
    if(nowS>ai.launchAt){ ai.launchAt=0; launch(0.55+Math.random()*0.45); }
    return;
  }
  var spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  var resting=spd<25&&b.y>636;
  var inL=(b.y>612&&b.y<708&&b.vy>-40&&b.x>56&&b.x<198)||(resting&&b.x<195);
  var inR=(b.y>612&&b.y<708&&b.vy>-40&&b.x>166&&b.x<312)||(resting&&b.x>=195);
  if(!FL.pressed&&inL&&nowS>ai.cdL){ FL.pressed=true; ai.relL=nowS+0.13; ai.cdL=nowS+0.44; }
  if(FL.pressed&&nowS>ai.relL) FL.pressed=false;
  if(!FR.pressed&&inR&&nowS>ai.cdR){ FR.pressed=true; ai.relR=nowS+0.13; ai.cdR=nowS+0.44; }
  if(FR.pressed&&nowS>ai.relR) FR.pressed=false;
}

/* ════════════════════ MAIN LOOP ════════════════════ */
function update(dt){
  var i;
  for(i=banners.length-1;i>=0;i--){ banners[i].t+=dt; if(banners[i].t>1.5)banners.splice(i,1); }
  for(i=labels.length-1;i>=0;i--){ labels[i].t+=dt; if(labels[i].t>0.95)labels.splice(i,1); }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.t+=dt;
    if(p.t>p.life){ parts.splice(i,1); continue; }
    p.vy+=G*0.28*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  if(shake>0) shake=Math.max(0,shake-dt*1.7);
  if(keyCharge&&st==='play'&&ball&&ball.waiting) plunger.pull=Math.min(1,plunger.pull+dt/0.9);
  if(st==='insert'&&!attract&&nowS-lastInput>16) beginAttract();
  aiStep();
  physics(dt);
}
function frame(t){
  requestAnimationFrame(frame);
  var tS=t/1000;
  var dt=Math.min(0.033,Math.max(0.0005,tS-lastT));
  lastT=tS; nowS=tS;
  update(dt);
  draw();
}

/* ── resize / boot ── */
function resize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(1,Math.round(vw*dpr));
  cv.height=Math.max(1,Math.round(vh*dpr));
  VIEW.dpr=dpr; VIEW.vw=vw; VIEW.vh=vh;
  VIEW.scale=Math.min(vw/W,vh/H);
  VIEW.ox=(vw-W*VIEW.scale)/2;
  VIEW.oy=(vh-H*VIEW.scale)/2;
  buildStatic();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,120); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);

/* QA/debug probe (read-only snapshot; no gameplay surface) */
window.__pv2=function(){
  return {st:st,attract:attract,x:ball?ball.x:0,y:ball?ball.y:0,
          vx:ball?ball.vx:0,vy:ball?ball.vy:0,waiting:ball?ball.waiting:true,
          score:game?game.score:0,balls:game?game.balls:0,wave:game?game.wave:0,
          flL:FL.pressed,flR:FR.pressed};
};

resize();
newGame();
lastInput=0;
if(new URLSearchParams(location.search).get('attract')==='1') beginAttract();
requestAnimationFrame(frame);
})();
</script>
