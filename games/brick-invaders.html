<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BRICK-INVADERS — JnJ Arcade</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  BRICK-INVADERS — first PHASER-track cabinet (engine-track PoC, 2026-07-16).
  BREAKOUT × SPACE INVADERS. Signature: the brick wall IS the invader formation —
  it marches sideways, drops at the edges, and reaching the deadline costs a life.
  Engine: Phaser 3 (same-origin /vendor/phaser.min.js — sanctioned like
  arcade-scores.js; no CDNs). SFX stay house-style WebAudio tone().
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { width: 100vw; height: 100vh; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 10;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             font-family: 'Courier New', monospace; color: #fff; text-align: center; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(28px, 8vw, 64px); letter-spacing: .06em;
                color: #7dff5a; text-shadow: 0 0 24px #7dff5a; }
  #overlay p { margin: 14px 0 26px; font-size: 14px; color: #9aa; max-width: 80vw; }
  #coinBtn { font: bold 18px 'Courier New', monospace; letter-spacing: .1em;
             padding: 16px 38px; background: #7dff5a; color: #000;
             border: none; border-radius: 10px; cursor: pointer;
             box-shadow: 0 0 30px #7dff5a; }
</style>
<link rel="stylesheet" href="../cabinet.css?v=1">
<style>:root { --ink: #7dff5a; }</style>
</head>
<body>
<div id="game"></div>
<div id="overlay">
  <h1>BRICK-INVADERS</h1>
  <div class="genre">BREAKOUT × SPACE INVADERS</div>
  <p>Drag to move the paddle · tap to launch<br>Don't let the wall reach the line</p>
  <button id="coinBtn">🪙 INSERT COIN</button>
</div>
<script src="../vendor/phaser.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../arcade-scores.js?v=13"></script>
<script>
(function () {
'use strict';
const SLUG = 'brick-invaders', TITLE = 'BRICK-INVADERS', INK = '#7dff5a';
const W = 720, H = 1280;
const ROW_COLS = [0x7dff5a, 0x4de6a0, 0x35c8e8, 0x8a7dff, 0xff7dc7]; // invader greens → violets

// ── house SFX (WebAudio, no Phaser audio, no files) ──────────────────────────
let audioCtx = null, muted = localStorage.getItem('sfxMuted_' + SLUG) === '1';
let mode = 'attract';                    // attract | playing | ended
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function tone(f0, f1, dur, type, vol) {
  if (muted || !audioCtx || mode === 'attract') return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  paddle: () => tone(440, 520, 0.06, 'square', 0.12),
  brick:  () => tone(700, 980, 0.07, 'square', 0.14),
  march:  () => tone(120, 100, 0.09, 'square', 0.10),
  life:   () => tone(220, 60, 0.3, 'sawtooth', 0.2),
  wave:   () => tone(660, 1320, 0.25, 'square', 0.16),
  over:   () => tone(440, 55, 0.7, 'sawtooth', 0.2),
};

// ── scene ─────────────────────────────────────────────────────────────────────
class Main extends Phaser.Scene {
  create() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xffffff); g.fillRoundedRect(0, 0, 150, 30, 8); g.generateTexture('paddle', 150, 30);
    g.clear(); g.fillStyle(0xffffff); g.fillCircle(11, 11, 11); g.generateTexture('ball', 22, 22);
    g.clear(); g.fillStyle(0xffffff); g.fillRoundedRect(0, 0, 74, 32, 5);
    g.fillStyle(0x000000, 0.28); g.fillRoundedRect(0, 20, 74, 12, { tl: 0, tr: 0, bl: 5, br: 5 });
    g.fillStyle(0xffffff, 0.35); g.fillRoundedRect(4, 3, 66, 7, 3);
    g.generateTexture('brick', 74, 32);
    g.clear(); g.fillStyle(0xffffff); g.fillRect(0, 0, 5, 5); g.generateTexture('spark', 5, 5);
    g.destroy();

    // slow starfield — invaders-era backdrop (cheap: 70 drifting images)
    this.stars = [];
    for (let i = 0; i < 70; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'spark')
        .setScale(Phaser.Math.FloatBetween(0.3, 0.9)).setAlpha(Phaser.Math.FloatBetween(0.15, 0.5));
      s.speed = Phaser.Math.FloatBetween(0.15, 0.6);
      this.stars.push(s);
    }
    this.paddle = this.physics.add.image(W / 2, H - 130, 'paddle').setTint(0x7dff5a).setImmovable(true);
    this.paddle.postFX && this.paddle.postFX.addGlow(0x7dff5a, 2, 0, false);
    this.paddle.body.allowGravity = false;
    this.ball = this.physics.add.image(W / 2, H - 170, 'ball').setTint(0xffffff);
    this.ball.setBounce(1).setCollideWorldBounds(true);
    this.physics.world.setBoundsCollision(true, true, true, false);
    this.ballStuck = true;

    this.bricks = this.physics.add.staticGroup();
    this.deadlineY = H - 240;
    this.deadline = this.add.rectangle(W / 2, this.deadlineY, W, 3, 0xff4d4d, 0.85);
    this.add.rectangle(W / 2, this.deadlineY, W, 14, 0xff4d4d, 0.12);

    this.sparks = this.add.particles(0, 0, 'spark', {
      speed: { min: 80, max: 320 }, lifespan: 450, gravityY: 500,
      scale: { start: 1.4, end: 0 }, emitting: false });

    this.physics.add.collider(this.ball, this.paddle, (b, p) => this.hitPaddle(b, p));
    this.brickCollider = this.physics.add.collider(this.ball, this.bricks, (b, br) => this.hitBrick(b, br));

    this.hud = this.add.text(14, 12, '', { fontFamily: 'Courier New', fontSize: '26px', fontStyle: 'bold', color: '#fff' });
    this.muteBtn = this.add.text(W - 14, 12, muted ? '🔇' : '🔊',
      { fontSize: '30px' }).setOrigin(1, 0).setInteractive();
    this.muteBtn.on('pointerdown', (p, x, y, ev) => {
      muted = !muted; localStorage.setItem('sfxMuted_' + SLUG, muted ? '1' : '0');
      this.muteBtn.setText(muted ? '🔇' : '🔊'); if (ev) ev.stopPropagation();
    });

    this.input.on('pointermove', p => { if (!this.ballStuck || mode === 'attract') this.movePaddle(p.worldX); });
    this.input.on('pointerdown', p => {
      if (mode !== 'playing') return;
      if (this.ballStuck) { this.launch(); } else { this.movePaddle(p.worldX); }
    });

    this.score = 0; this.lives = 3; this.wave = 1;
    this.newWave(1);
    this.updateHud();
    if (new URLSearchParams(location.search).get('play') !== null) { /* headless QA hook */ }
  }

  movePaddle(x) { this.paddle.x = Phaser.Math.Clamp(x, 80, W - 80); if (this.ballStuck) this.ball.x = this.paddle.x; }

  launch() {
    this.ballStuck = false;
    const a = Phaser.Math.FloatBetween(-0.35, 0.35);
    this.ball.setVelocity(Math.sin(a) * this.ballSpeed, -Math.cos(a) * this.ballSpeed);
  }

  newWave(n) {
    this.wave = n;
    this.bricks.clear(true, true);
    // difficulty ramps ONE axis: march interval. Ball speed + rows fixed per band.
    this.marchEvery = Math.max(900, 2600 - (n - 1) * 280);
    this.ballSpeed = 620 + Math.min(180, (n - 1) * 30);
    this.marchDir = 1; this.marchStep = 26;
    const rows = Math.min(5, 3 + Math.floor((n - 1) / 2));
    const startY = 170;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < 8; c++) {
        const br = this.bricks.create(64 + c * 85, startY + r * 46, 'brick').setTint(ROW_COLS[r % ROW_COLS.length]);
        br.hp = 1;
      }
    if (this.marchTimer) this.marchTimer.remove();
    this.marchTimer = this.time.addEvent({ delay: this.marchEvery, loop: true, callback: () => this.march() });
    this.resetBall();
  }

  march() {
    if (mode === 'ended') return;
    let hitEdge = false;
    this.bricks.children.iterate(b => {
      if (b && ((this.marchDir > 0 && b.x > W - 50) || (this.marchDir < 0 && b.x < 50))) hitEdge = true;
    });
    this.bricks.children.iterate(b => {
      if (!b) return;
      if (hitEdge) b.y += this.marchStep; else b.x += 18 * this.marchDir;
      b.body.updateFromGameObject();
    });
    if (hitEdge) this.marchDir *= -1;
    sfx.march();
    // deadline check — the invader loss condition
    let breached = false;
    this.bricks.children.iterate(b => { if (b && b.y + 16 >= this.deadlineY) breached = true; });
    if (breached) {
      this.cameras.main.shake(220, 0.012);
      if (mode === 'attract') { this.newWave(1); return; }
      this.loseLife(true);
    }
  }

  hitPaddle(ball, paddle) {
    sfx.paddle();
    const off = (ball.x - paddle.x) / 75;                 // -1..1 across the paddle
    ball.setVelocity(off * this.ballSpeed * 0.9,
                     -Math.max(0.55, Math.sqrt(1 - Math.min(1, off * off) * 0.5)) * this.ballSpeed);
  }

  hitBrick(ball, brick) {
    sfx.brick();
    this.sparks.setParticleTint(brick.tintTopLeft);
    this.sparks.explode(14, brick.x, brick.y);
    const pts = 10 * this.wave;
    if (mode === 'playing') {
      this.score += pts;
      const t = this.add.text(brick.x, brick.y, '+' + pts,
        { fontFamily: 'Courier New', fontSize: '24px', fontStyle: 'bold', color: INK }).setOrigin(0.5);
      this.tweens.add({ targets: t, y: brick.y - 60, alpha: 0, duration: 550, onComplete: () => t.destroy() });
    }
    brick.destroy();
    this.updateHud();
    if (this.bricks.countActive() === 0) {
      sfx.wave();
      this.cameras.main.flash(180, 125, 255, 90);
      this.newWave(this.wave + 1);
      this.updateHud();
    }
  }

  resetBall() {
    this.ballStuck = true;
    this.ball.setVelocity(0, 0);
    this.ball.setPosition(this.paddle.x, this.paddle.y - 40);
  }

  loseLife(fromMarch) {
    if (mode === 'attract') { this.resetBall(); return; }
    this.lives--; sfx.life();
    this.cameras.main.shake(250, 0.015);
    this.sparks.setParticleTint(0xff4d4d);
    this.sparks.explode(28, this.ball.x, Math.min(this.ball.y, H - 60));
    this.updateHud();
    if (this.lives <= 0) return this.gameOver();
    if (fromMarch) {                       // push the wall back a bit — fair retry
      this.bricks.children.iterate(b => { if (b) { b.y -= this.marchStep * 3; b.body.updateFromGameObject(); } });
    }
    this.resetBall();
  }

  gameOver() {
    mode = 'ended'; sfx.over();
    if (this.marchTimer) this.marchTimer.paused = true;
    this.ball.setVelocity(0, 0);
    const s = this.score;
    if (window.ArcadeScores) {
      ArcadeScores.show({ game: SLUG, title: TITLE, score: s, accent: INK,
        onClose: () => this.restart() });
    } else { this.restart(); }
  }

  restart() {
    mode = 'playing';
    this.score = 0; this.lives = 3;
    if (this.marchTimer) this.marchTimer.paused = false;
    this.newWave(1); this.updateHud();
  }

  updateHud() {
    this.hud.setText('SCORE ' + this.score + '   WAVE ' + this.wave + '   ' + '♥'.repeat(Math.max(0, this.lives)));
  }

  update() {
    for (const s of this.stars) { s.y += s.speed; if (s.y > H) { s.y = -4; s.x = Phaser.Math.Between(0, W); } }
    // ball drained below the paddle
    if (!this.ballStuck && this.ball.y > H + 30) {
      if (mode === 'attract') this.resetBall(); else if (mode === 'playing') this.loseLife(false);
      if (mode === 'attract' || mode === 'playing') { /* handled */ }
    }
    // attract AI: competent paddle — track the ball with a little lag, relaunch
    if (mode === 'attract') {
      if (this.ballStuck) { this.launchTimer = (this.launchTimer || 0) + 1; if (this.launchTimer > 40) { this.launchTimer = 0; this.launch(); } }
      const target = this.ball.y > H * 0.45 ? this.ball.x : W / 2 + Math.sin(this.time.now / 900) * 120;
      this.paddle.x += (Phaser.Math.Clamp(target, 80, W - 80) - this.paddle.x) * 0.12;
      if (this.ballStuck) this.ball.x = this.paddle.x;
    }
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: W, height: H,
  backgroundColor: '#0a0c10',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade' },
  scene: Main,
});
window.__game = game;   // QA handle (playtest-by-evaluate — Phaser 3 has no global registry)

document.getElementById('coinBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  unlockAudio();
  mode = 'playing';
  const sc = game.scene.getScene('default') || game.scene.scenes[0];
  sc.restart();
});

// ?attract=1 → skip the coin overlay, run the silent demo (cassette capture)
if (new URLSearchParams(location.search).get('attract') === '1') {
  document.getElementById('overlay').classList.add('hidden');
}
})();
</script>
</body>
</html>
