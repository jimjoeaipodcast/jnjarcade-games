<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OVERLAY PLACER</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  Osimo 2026-09-07: "let's try the placer on the ledger and see if I can best
  position the ledger overlays. and another placer for both arcades where I'm
  placing all the speech bubbles with money over the machines."

  Same handshake as the Punter Placer, different cargo. Two targets:

    ?target=ledger              — the writing on the open book: where the first
                                  line sits, where the last one sits, where the
                                  right-hand page starts, how wide the column is
    ?target=cards&room=hall     — the money/price card over every machine
    ?target=cards&room=corridor

  Everything is drawn the way the game draws it, at the game's own scale, so a
  thing dragged here lands in the same place in the game.
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0904; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none;
               font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; color: #e8c35a; }
  #c { display: block; position: fixed; left: 0; top: 0; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
         padding: 8px 12px; z-index: 5; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; background: linear-gradient(rgba(6,5,4,.88), rgba(6,5,4,0)); }
  #bot { bottom: 0; background: linear-gradient(rgba(6,5,4,0), rgba(6,5,4,.92)); }
  button { font: bold 15px/1 'Barlow Condensed', sans-serif; letter-spacing: .05em;
           padding: 11px 15px; border-radius: 9px; border: 1.5px solid #ffffff33;
           background: #1a1409; color: #cfc6b4; cursor: pointer; }
  button.go { background: #e8c35a; color: #241a06; border-color: #e8c35a; }
  #sel { font-size: 15px; color: #fff3d0; flex: 1; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  #hint { font-size: 13px; color: #a99b80; }
  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
           background: rgba(10,8,4,.95); border: 2px solid #e8c35a; border-radius: 14px;
           padding: 18px 24px; font-size: 17px; text-align: center; z-index: 9;
           display: none; max-width: 80vw; }
  #rot { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rot { display: flex; position: fixed; inset: 0; z-index: 40; flex-direction: column;
           align-items: center; justify-content: center; gap: 18px; background: #0b0904;
           text-align: center; padding: 24px; }
    #rot .ph { font-size: 62px; }
    #c, .bar { display: none !important; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph">📱</div><h2>TURN YOUR PHONE</h2>
  <p style="color:#9aa;font-size:13px">Sideways, like the game.</p></div>
<div class="bar" id="top">
  <div id="sel">TAP A HANDLE</div>
  <span style="flex:1"></span>
  <button id="flip">⇄ FLIP</button>
  <button id="fewer">− ROWS</button>
  <button id="more">+ ROWS</button>
  <button id="prev">‹</button><button id="next">›</button>
</div>
<div class="bar" id="bot">
  <button id="smaller">− W</button>
  <button id="bigger">+ W</button>
  <button id="shorter">− H</button>
  <button id="taller">+ H</button>
  <span id="hint">drag top &amp; bottom · the rows follow the line</span>
  <span style="flex:1"></span>
  <button id="reset">RESET</button>
  <button class="go" id="submit">SUBMIT</button>
</div>
<div id="toast"></div>
<script>
(function () {
'use strict';
const QS = new URLSearchParams(location.search);
const TARGET = ['cards', 'seats', 'stock', 'tv'].includes(QS.get('target')) ? QS.get('target') : 'ledger';
const ROOM = ['corridor', 'podcast', 'studio'].includes(QS.get('room')) ? QS.get('room') : 'hall';
const EDIT = QS.get('edit') === '1';
const SCENE = TARGET === 'cards' ? 'cards-' + ROOM
            : TARGET === 'tv' ? 'tv-' + (ROOM === 'podcast' ? 'podcast' : 'studio')
            : TARGET;
const W = 960, H = 540;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let DPR = 1, VIEW = { scale: 1, ox: 0, oy: 0 };
let plate = null, SPR = {}, sel = 0;

// ── what each target is made of ─────────────────────────────────────────────
// LEDGER: four handles that between them define the whole written column — the game
// derives every row from these, exactly as it does now from LEDGER_ART.
// FOUR row handles now — a first AND a last for each page. Osimo 2026-09-07: "allow me to
// lock in the top one, and select the one at the bottom of the relative page, and say I move
// it to the left, you get a straight line from the top one to the bottom one I just moved so
// I can follow the red line on the page."
// Every row between them is interpolated along that line, x as well as y, so the column
// leans with the page's own ruling. Leave a page's two x's equal and it stands plumb.
const LEDGER = [
  { id: 'firstRow', label: 'TOP LINE — left page',    x: 136, y: 87,  kind: 'row', col: 0, end: 0 },
  { id: 'lastRow',  label: 'BOTTOM LINE — left page', x: 136, y: 425, kind: 'row', col: 0, end: 1 },
  { id: 'col2',     label: 'TOP LINE — right page',   x: 498, y: 88,  kind: 'row', col: 1, end: 0 },
  { id: 'col2Last', label: 'BOTTOM LINE — right page',x: 498, y: 425, kind: 'row', col: 1, end: 1 },
  { id: 'width',    label: 'COLUMN WIDTH',            x: 136, y: 256, w: 298, kind: 'width' },
];
// Osimo 2026-09-07: "I need a total amount that we would use, the max per page, so you always
// know where to place them when there's loads." Three sample rows told him nothing about how
// a FULL page stacks. So the tool draws every row it would ever draw, evenly spaced between
// the first and last handles, and the count is a thing he sets — the game then divides the
// span by it instead of guessing a pitch and hoping the list fits.
let rows = 9;
const ROWS_MIN = 3, ROWS_MAX = 16;
// CARDS: one handle per machine — where its price/coins/jam bubble hangs. Stored as the
// card's anchor point in world space; the game keeps drawing the card upward from it.
const CARDS = {
  hall: [
    ['LEFT 1 — BY THE DOOR', 65, 160], ['LEFT 2', 145, 180], ['LEFT 3', 227, 198],
    ['LEFT 4 — FAR END', 305, 216], ['BACK WALL', 402, 204],
    ['THE PINBALL TABLE', 557, 225], ['RIGHT 5 — FAR END', 640, 224], ['RIGHT 4', 681, 154],
    ['RIGHT 3', 722, 223], ['RIGHT 2', 800, 191], ['RIGHT 1 — BY THE DOOR', 881, 163],
  ],
  corridor: [
    ['CABINET 1 — NEAREST', 139, 208], ['CABINET 2', 214, 176], ['CABINET 3', 289, 215],
    ['CABINET 4 — FAR END', 367, 178], ['CABINET 5 — THE RED ONE', 767, 156],
    ['THE WATER COOLER', 608, 196], ['THE VENDING MACHINE', 654, 163],
  ],
};
// SEATS: where Jimmy and Joe sit for a take, and how big they are. Jimmy is always the left
// chesterfield and Joe the right — that is fixed; what is being placed is where on the
// cushion, and the scale (Osimo 2026-09-07).
const SEATS = [
  { id: 'jimmySeat', label: 'JIMMY (left sofa)', x: 238, y: 466, h: 156, kind: 'sprite', spr: 'jimmySit' },
  { id: 'joeSeat',   label: 'JOE (right sofa)',  x: 760, y: 466, h: 156, kind: 'sprite', spr: 'joeSit' },
];
// STOCK: the water jugs and the vending boxes in the prop room, which is where a day's
// restocking starts. Both are placed as BOXES — they are things you tap, so the size is the
// tap area as well as the picture.
// The real PNGs, not placeholder boxes — Osimo 2026-09-07: "in the store, I was meant to
// move and place the boxes and bottles of water, it had just cash and bottle icon." They are
// sprites in the game too now, so what is dragged here is exactly what is drawn there, at
// the same resolution. x is the centre, y is the FEET, h is the height.
// THE SCREENS. Osimo 2026-09-07: "fix the TV, anything we play in it should fit perfectly,
// we can do a placer if you want and I'll match the size and location." Two boxes: the
// studio telly and the monitor in the podcast studio that carries a Buy or ByeBye product.
// The box IS the screen — a clip is cover-fitted into it and clipped by it — so what is
// dragged here is exactly the picture area.
const TVS = {
  studio:  [{ id: 'tv',    label: 'THE STUDIO TV',   x: 358, y: 121, w: 240, h: 143, kind: 'box' }],
  // FOUR monitors, one per show — Osimo 2026-09-07: "should we have four images to place?"
  // Yes: each position has its own screen, and whichever show is recording lights its own.
  podcast: [
    { id: 'podTv0', label: 'SERIOUSLY MONITOR',     x: 232, y: 289, w: 58, h: 40, kind: 'box' },
    { id: 'podTv1', label: 'BRIGHT SIDE MONITOR',   x: 404, y: 289, w: 58, h: 40, kind: 'box' },
    { id: 'podTv2', label: 'BUY OR BYEBYE MONITOR', x: 576, y: 289, w: 58, h: 40, kind: 'box' },
    { id: 'podTv3', label: 'HOROSCOPES MONITOR',    x: 742, y: 289, w: 58, h: 40, kind: 'box' },
  ],
};
const STOCK = [
  { id: 'jug', label: 'WATER JUGS',    x: 898, y: 493, h: 192, kind: 'sprite', spr: 'propJugs' },
  { id: 'box', label: 'VENDING BOXES', x: 190, y: 467, h: 151, kind: 'sprite', spr: 'propBox' },
];
function build() {
  if (TARGET === 'ledger') return LEDGER.map(o => ({ ...o }));
  if (TARGET === 'seats')  return SEATS.map(o => ({ ...o }));
  if (TARGET === 'stock')  return STOCK.map(o => ({ ...o }));
  if (TARGET === 'tv')     return (TVS[ROOM === 'podcast' ? 'podcast' : 'studio']).map(o => ({ ...o }));
  return CARDS[ROOM].map(([label, x, y], i) => ({ id: 'card' + i, label, x, y, s: 0.85, kind: 'card' }));
}
let items = build();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(document.documentElement.clientWidth);
  const h = Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  VIEW.scale = Math.min(canvas.width / W, canvas.height / H);
  VIEW.ox = Math.round((canvas.width - W * VIEW.scale) / 2);
  VIEW.oy = Math.round((canvas.height - H * VIEW.scale) / 2);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
setInterval(resize, 300);
resize();

function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top) * DPR - VIEW.oy) / VIEW.scale };
}

fetch('../games/the-count-pack.json?v=23').then(r => r.json()).then(p => {
  const mk = (src, cb) => { const im = new Image(); im.onload = () => cb(im); im.src = src; };
  if (TARGET === 'ledger') mk(p.sprites.ledger, im => { plate = im; });
  else if (TARGET === 'seats') mk(p.art.studio, im => { plate = im; });
  else if (TARGET === 'stock') mk(p.art.prop, im => { plate = im; });
  else if (TARGET === 'tv') mk(p.art[ROOM === 'podcast' ? 'podcast' : 'studio'], im => { plate = im; });
  else mk(p.art[ROOM], im => { plate = im; });
  for (const k of ['icCab', 'icCoin', 'jimmySit', 'joeSit', 'propJugs', 'propBox'])
    if (p.sprites[k]) mk(p.sprites[k], im => { SPR[k] = im; });
}).catch(() => toast('Could not load the art pack.'));

fetch('/api/press?kind=points&room=' + SCENE).then(r => r.json()).then(d => {
  if (!d || !Array.isArray(d.items)) return;
  d.items.forEach(it => {
    if (it.id === 'rowsPerPage') { rows = Math.max(ROWS_MIN, Math.min(ROWS_MAX, it.x)); return; }
    const m = items.find(o => o.id === it.id);
    if (!m) return;
    m.x = it.x; m.y = it.y;
    if (it.w !== undefined && it.w !== null) {
      if (m.kind === 'card') m.s = it.w / 100; else m.w = it.w;
    }
    if (it.h !== undefined && it.h !== null && m.kind !== 'row') m.h = it.h;
    if (typeof it.flip === 'boolean') m.flip = it.flip;
  });
  updateSel();
  if (d.by === 'osimo' && d.savedAt && !EDIT) retire();
}).catch(() => {});

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// A stand-in of the game's own card, so what is dragged looks like what will be drawn.
function drawCard(o, on) {
  const icon = SPR.icCoin || SPR.icCab;
  const s = o.s === undefined ? 0.85 : o.s;
  const ir = Math.round(40 * s), pad = Math.round(8 * s);
  ctx.font = 'bold ' + Math.round(20 * s) + 'px "Barlow Condensed",sans-serif';
  const txt = '£70.00';
  const w = Math.max(ir, ctx.measureText(txt).width) + pad * 2;
  const h = ir + Math.round(22 * s) + pad;
  const x = o.x - w / 2, y = o.y - h;
  ctx.fillStyle = 'rgba(252,246,232,0.97)';
  roundRect(x, y, w, h, 9 * s); ctx.fill();
  ctx.strokeStyle = on ? '#ffd75e' : '#7a4a1a'; ctx.lineWidth = on ? 3 : 2.2;
  roundRect(x, y, w, h, 9 * s); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(o.x - 7 * s, y + h); ctx.lineTo(o.x, y + h + 9 * s); ctx.lineTo(o.x + 7 * s, y + h);
  ctx.closePath(); ctx.fillStyle = 'rgba(252,246,232,0.97)'; ctx.fill(); ctx.stroke();
  if (icon) ctx.drawImage(icon, o.x - ir / 2, y + pad * 0.6, ir, ir);
  ctx.fillStyle = '#1f6b3a'; ctx.textAlign = 'center';
  ctx.fillText(txt, o.x, y + h - pad * 0.8);
  ctx.textAlign = 'left';
  o._box = { x, y, w, h: h + 9 };
}

// A row as it will really be written, but pale — these are the lines BETWEEN the handles.
function ghostRow(x, y, skip) {
  if (skip) return;
  const w = (items.find(i => i.id === 'width') || { w: 178 }).w, ir = 31;
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = 'rgba(226,178,86,0.13)';
  ctx.fillRect(x - 4, y - 15, w, 30);
  ctx.strokeStyle = 'rgba(122,74,26,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(x - 4, y - 15, w, 30);
  if (SPR.icCab) ctx.drawImage(SPR.icCab, x, y - ir / 2, ir, ir);
  ctx.fillStyle = '#5a4630'; ctx.font = 'bold 15px "Barlow Condensed",sans-serif';
  ctx.fillText('POWER UP CABINET 2', x + ir + 8, y - 2);
  ctx.font = '11px "Barlow Condensed",sans-serif'; ctx.fillStyle = '#8a7458';
  ctx.fillText('A second machine earning…', x + ir + 8, y + 11);
  ctx.textAlign = 'right'; ctx.font = 'bold 14px "Barlow Condensed",sans-serif';
  ctx.fillStyle = '#3f7a55';
  ctx.fillText('£8.00', x - 4 + w - 8, y + 11);
  ctx.textAlign = 'left';
  ctx.restore();
}
// A seated host, drawn exactly as the game draws him — same sprite, same anchor (feet), so
// what is dragged here is what sits on the sofa in the game.
function drawSprite(o, on) {
  const im = SPR[o.spr];
  if (!im) { o._box = { x: o.x - 40, y: o.y - o.h, w: 80, h: o.h }; return; }
  const w = im.width * (o.h / im.height);
  // ⇄ FLIP mirrors the art, the same way the game's own `flip` does
  ctx.save();
  if (o.flip) { ctx.translate(o.x * 2, 0); ctx.scale(-1, 1); }
  ctx.drawImage(im, o.x - w / 2, o.y - o.h, w, o.h);
  ctx.restore();
  if (on) {
    ctx.save();
    ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
    ctx.strokeRect(o.x - w / 2 - 4, o.y - o.h - 4, w + 8, o.h + 8);
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,215,94,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(o.x - w, o.y); ctx.lineTo(o.x + w, o.y); ctx.stroke();
    ctx.restore();
  }
  o._box = { x: o.x - w / 2, y: o.y - o.h, w, h: o.h };
}
// A tappable thing in a room: the box IS the tap area, so it is drawn as one.
let tvClip = null;
function drawBox(o, on) {
  // a screen box plays a real clip, cover-fitted and clipped exactly as the game does it —
  // so the fit you see while dragging is the fit you get
  if (o.id === 'tv' || o.id.startsWith('podTv')) {
    if (!tvClip) {
      const v = document.createElement('video');
      v.src = '../assets/footage/bbb/jellyfish-lamp.mp4?v=1';
      v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
      v.play().catch(() => {});
      tvClip = v;
    }
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(o.x, o.y, o.w, o.h);
    if (tvClip.readyState >= 2 && tvClip.videoWidth) {
      const s2 = Math.max(o.w / tvClip.videoWidth, o.h / tvClip.videoHeight);
      const dw = tvClip.videoWidth * s2, dh = tvClip.videoHeight * s2;
      ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip();
      ctx.drawImage(tvClip, o.x + (o.w - dw) / 2, o.y + (o.h - dh) / 2, dw, dh);
    }
    ctx.restore();
    ctx.strokeStyle = on ? '#ffd75e' : 'rgba(94,208,255,0.9)';
    ctx.lineWidth = on ? 3 : 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#fff3d0'; ctx.font = 'bold 13px "Barlow Condensed",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(o.label, o.x + o.w / 2, o.y - 6);
    ctx.textAlign = 'left';
    o._box = { x: o.x, y: o.y, w: o.w, h: o.h };
    return;
  }
  ctx.save();
  ctx.fillStyle = on ? 'rgba(255,215,94,0.26)' : 'rgba(94,208,255,0.20)';
  roundRect(o.x, o.y, o.w, o.h, 8); ctx.fill();
  ctx.strokeStyle = on ? '#ffd75e' : 'rgba(94,208,255,0.85)';
  ctx.lineWidth = on ? 3 : 2;
  roundRect(o.x, o.y, o.w, o.h, 8); ctx.stroke();
  const im = SPR[o.id === 'jug' ? 'icBottle' : 'icApron'];
  if (im) ctx.drawImage(im, o.x + o.w / 2 - 18, o.y + o.h / 2 - 18, 36, 36);
  ctx.fillStyle = '#fff3d0'; ctx.font = 'bold 13px "Barlow Condensed",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(o.label, o.x + o.w / 2, o.y - 6);
  ctx.textAlign = 'left';
  ctx.restore();
  o._box = { x: o.x, y: o.y, w: o.w, h: o.h };
}
function drawRow(o, on) {
  // a ledger line as the game writes it: icon, name, price under
  const ir = 31;
  ctx.fillStyle = on ? 'rgba(226,178,86,0.30)' : 'rgba(226,178,86,0.16)';
  const w = (items.find(i => i.id === 'width') || { w: 178 }).w;
  ctx.fillRect(o.x - 4, o.y - 15, w, 30);
  ctx.strokeStyle = on ? '#ffd75e' : 'rgba(122,74,26,0.55)';
  ctx.lineWidth = on ? 2.5 : 1.4;
  ctx.strokeRect(o.x - 4, o.y - 15, w, 30);
  if (SPR.icCab) ctx.drawImage(SPR.icCab, o.x, o.y - ir / 2, ir, ir);
  ctx.fillStyle = '#3c2410'; ctx.font = 'bold 15px "Barlow Condensed",sans-serif';
  ctx.fillText('POWER UP CABINET 2', o.x + ir + 8, o.y - 2);
  ctx.font = '11px "Barlow Condensed",sans-serif'; ctx.fillStyle = '#6b4a24';
  ctx.fillText('A second machine earning…', o.x + ir + 8, o.y + 11);
  ctx.textAlign = 'right'; ctx.font = 'bold 14px "Barlow Condensed",sans-serif';
  ctx.fillStyle = '#1f6b3a';
  ctx.fillText('£8.00', o.x - 4 + w - 8, o.y + 11);
  ctx.textAlign = 'left';
  o._box = { x: o.x - 4, y: o.y - 15, w, h: 30 };
}

function drawWidth(o, on) {
  const first = items.find(i => i.id === 'firstRow'), last = items.find(i => i.id === 'lastRow');
  // the guide follows the lean, so you can see the column running parallel to the rule
  ctx.strokeStyle = on ? '#ffd75e' : 'rgba(255,215,94,0.55)';
  ctx.lineWidth = on ? 3 : 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(first.x - 4, first.y - 15);
  ctx.lineTo(first.x - 4 + o.w, first.y - 15);
  ctx.lineTo(last.x - 4 + o.w, last.y + 15);
  ctx.lineTo(last.x - 4, last.y + 15);
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
  const hx = (first.x + last.x) / 2 - 4 + o.w, hy = (first.y + last.y) / 2;
  ctx.fillStyle = on ? '#ffd75e' : 'rgba(255,215,94,0.7)';
  roundRect(hx - 9, hy - 22, 18, 44, 6); ctx.fill();
  o._box = { x: hx - 16, y: hy - 28, w: 32, h: 56 };
}

function frame() {
  requestAnimationFrame(frame);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0904'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  if (plate) ctx.drawImage(plate, 0, 0, W, H);
  if (TARGET === 'ledger') {
    // the title block the game writes above the first line, so the page you are laying out
    // is the whole page and not just the list
    const f0 = items.find(i => i.id === 'firstRow');
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5a3618'; ctx.font = 'bold 22px "Barlow Condensed",sans-serif';
    ctx.fillText('THE LEDGER', f0.x - 20, f0.y - 42);
    ctx.fillStyle = '#7a5a38'; ctx.font = 'bold 14px "Barlow Condensed",sans-serif';
    ctx.fillText('£5.00 in the safe', f0.x - 20, f0.y - 24);
    // the whole column, both pages, at the density he has chosen — the ghosts are what the
    // page looks like FULL, and the three handles are drawn solid on top of them
    // both columns, each leaning between its own pair of handles
    for (let c = 0; c < 2; c++) {
      const a = items.find(i => i.col === c && i.end === 0);
      const b2 = items.find(i => i.col === c && i.end === 1);
      if (!a || !b2) continue;
      for (let n = 0; n < rows; n++) {
        const t = rows > 1 ? n / (rows - 1) : 0;
        if (n === 0 || n === rows - 1) continue;      // the handles draw those two
        ghostRow(a.x + (b2.x - a.x) * t, a.y + (b2.y - a.y) * t);
      }
    }
  }
  items.forEach((o, i) => {
    const on = i === sel;
    if (o.kind === 'card') drawCard(o, on);
    else if (o.kind === 'sprite') drawSprite(o, on);
    else if (o.kind === 'box') drawBox(o, on);
    else if (o.kind === 'width') drawWidth(o, on);
    else drawRow(o, on);
  });
}
requestAnimationFrame(frame);

function pick(w) {
  for (let i = items.length - 1; i >= 0; i--) {
    const b = items[i]._box;
    if (!b) continue;
    if (w.x >= b.x - 6 && w.x <= b.x + b.w + 6 && w.y >= b.y - 6 && w.y <= b.y + b.h + 6) return i;
  }
  return -1;
}
let drag = null, pinch = null;
function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const o = items[sel];
    pinch = { d: dist(e.touches[0], e.touches[1]),
              v: o.kind === 'card' ? o.s : o.kind === 'sprite' ? o.h : (o.kind === 'box' ? o.w
                 : (items.find(i => i.id === 'width') || { w: 178 }).w) };
    drag = null; return;
  }
  const w = toWorld(e.touches[0].clientX, e.touches[0].clientY);
  const hit = pick(w);
  if (hit >= 0) { sel = hit; updateSel(); }
  drag = { dx: w.x - items[sel].x, dy: w.y - items[sel].y };
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length === 2) {
    const o = items[sel], k = dist(e.touches[0], e.touches[1]) / pinch.d;
    if (o.kind === 'card') o.s = Math.max(0.35, Math.min(2, +(pinch.v * k).toFixed(3)));
    else if (o.kind === 'sprite') o.h = Math.max(40, Math.min(420, Math.round(pinch.v * k)));
    else if (o.kind === 'box') {
      // pinch scales both together; the − W / + W and − H / + H buttons move one at a time
      const r = o.h / o.w;
      o.w = Math.max(20, Math.min(700, Math.round(pinch.v * k)));
      o.h = Math.max(20, Math.min(500, Math.round(o.w * r)));
    } else {
      const w = items.find(i => i.id === 'width');
      if (w) w.w = Math.max(60, Math.min(600, Math.round(pinch.v * k)));
    }
    updateSel(); return;
  }
  if (!drag || !e.touches.length) return;
  const w = toWorld(e.touches[0].clientX, e.touches[0].clientY);
  items[sel].x = Math.round(w.x - drag.dx); items[sel].y = Math.round(w.y - drag.dy);
  updateSel();
}, { passive: false });
canvas.addEventListener('touchend', e => { if (!e.touches.length) { drag = null; pinch = null; } });
canvas.addEventListener('mousedown', e => {
  const w = toWorld(e.clientX, e.clientY);
  const hit = pick(w);
  if (hit >= 0) { sel = hit; updateSel(); }
  drag = { dx: w.x - items[sel].x, dy: w.y - items[sel].y };
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const w = toWorld(e.clientX, e.clientY);
  items[sel].x = Math.round(w.x - drag.dx); items[sel].y = Math.round(w.y - drag.dy);
  updateSel();
});
window.addEventListener('mouseup', () => { drag = null; });
window.addEventListener('keydown', e => {
  const o = items[sel], step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') o.x -= step;
  else if (e.key === 'ArrowRight') o.x += step;
  else if (e.key === 'ArrowUp') o.y -= step;
  else if (e.key === 'ArrowDown') o.y += step;
  else return;
  e.preventDefault(); updateSel();
});

function updateSel() {
  const o = items[sel];
  const first = items.find(i => i.id === 'firstRow'), last = items.find(i => i.id === 'lastRow');
  const lean = first && last ? Math.round(last.x - first.x) : 0;
  const pitch = (TARGET === 'ledger' && rows > 1 && first && last)
    ? '  ·  ' + rows + ' rows/page, ' + Math.round((last.y - first.y) / (rows - 1)) + 'px apart'
      + (lean ? ', lean ' + (lean > 0 ? '+' : '') + lean : '')
    : '';
  document.getElementById('sel').textContent =
    (sel + 1) + '/' + items.length + '  ' + o.label + '   x' + Math.round(o.x) +
    ' y' + Math.round(o.y) + (o.w !== undefined ? ' w' + Math.round(o.w) : '') +
    (o.h !== undefined && o.kind !== 'row' ? ' h' + Math.round(o.h) : '') +
    (o.s !== undefined ? ' size' + Math.round(o.s * 100) + '%' : '') +
    (o.flip ? ' ⇄' : '') + pitch;
}
updateSel();
// the hint belongs to whatever is being placed
document.getElementById('hint').textContent =
  TARGET === 'ledger' ? 'drag top & bottom · the rows follow the line'
  : TARGET === 'tv'   ? 'drag · pinch to scale · − W + W and − H + H to match the frame'
  : 'drag · pinch to size';
if (TARGET !== 'ledger') {
  const f = document.getElementById('fewer'), m = document.getElementById('more');
  if (f) f.style.display = 'none';
  if (m) m.style.display = 'none';
}

document.getElementById('prev').onclick = () => { sel = (sel + items.length - 1) % items.length; updateSel(); };
document.getElementById('next').onclick = () => { sel = (sel + 1) % items.length; updateSel(); };
// − / + act on whatever the selected handle actually scales: a sprite's height, a box's
// size, or the ledger column's width.
function resizeSel(d) {
  const o = items[sel];
  if (o.kind === 'card') o.s = Math.max(0.35, Math.min(2, +(o.s + d * 0.02).toFixed(3)));
  else if (o.kind === 'sprite') o.h = Math.max(40, Math.min(420, o.h + d));
  else if (o.kind === 'box') {
    // Osimo 2026-09-07: "allow me to stretch the image width wise as well as placing and
    // resizing so that it perfectly matches the TV frame." So width and height move
    // independently — a painted TV is whatever shape the artist drew, not 16:9.
    o.w = Math.max(20, Math.min(700, o.w + d));
  } else {
    const w = items.find(i => i.id === 'width');
    if (w) w.w = Math.max(60, Math.min(600, w.w + d));
  }
  updateSel();
}
function resizeSelH(d) {
  const o = items[sel];
  if (o.kind === 'box') { o.h = Math.max(20, Math.min(500, o.h + d)); updateSel(); }
}
document.getElementById('bigger').onclick  = () => resizeSel(6);
document.getElementById('smaller').onclick = () => resizeSel(-6);
document.getElementById('taller').onclick  = () => resizeSelH(6);
document.getElementById('shorter').onclick = () => resizeSelH(-6);
if (TARGET !== 'tv' && TARGET !== 'stock') {
  for (const id of ['shorter', 'taller']) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';        // only a box has a height of its own
  }
}
document.getElementById('reset').onclick = () => { items = build(); rows = 9; sel = 0; updateSel(); toast('Back to the game values.', 1400); };
document.getElementById('more').onclick  = () => { rows = Math.min(ROWS_MAX, rows + 1); updateSel(); };
document.getElementById('flip').onclick  = () => { items[sel].flip = !items[sel].flip; updateSel(); };
document.getElementById('fewer').onclick = () => { rows = Math.max(ROWS_MIN, rows - 1); updateSel(); };

let toastT = 0;
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.display = 'none'; }, ms || 2600);
}
function retire() { const b = document.getElementById('submit'); if (b) b.remove(); }

const submitBtn = document.getElementById('submit');
if (submitBtn) submitBtn.onclick = async () => {
  submitBtn.disabled = true; submitBtn.textContent = 'SENDING…';
  try {
    const r = await fetch('/api/press', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ by: 'osimo', room: SCENE, kind: 'points',
        items: items.map(o => ({ id: o.id, x: Math.round(o.x), y: Math.round(o.y),
                                 w: o.w === undefined ? undefined : Math.round(o.w),
                                 h: o.h === undefined ? undefined : Math.round(o.h),
                                 flip: !!o.flip,
                                 // card size rides in `w` as a percentage — the endpoint
                                 // already clamps and stores that field
                                 w: o.s !== undefined ? Math.round(o.s * 100)
                                    : (o.w === undefined ? undefined : Math.round(o.w)) }))
          // the row count rides along as an item so the endpoint needs no new field
          .concat(TARGET === 'ledger' ? [{ id: 'rowsPerPage', x: rows, y: 0 }] : []) }),
    });
    const d = await r.json();
    if (d.ok) { toast('SUBMITTED ✅\nTell Claude and he will put it in the game.', 5000); retire(); }
    else toast('Did not save: ' + (d.error || r.status), 5000);
  } catch (e) { toast('Did not save: ' + e.message, 5000); }
  submitBtn.disabled = false; submitBtn.textContent = 'SUBMIT';
};
})();
</script>
</body>
