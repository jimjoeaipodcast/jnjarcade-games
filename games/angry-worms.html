<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ANGRY WORMS</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Trebuchet MS', sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; text-align: center;
    transition: opacity .4s; padding: 20px;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(36px, 8vw, 92px);
    color: #ff2d8a;
    text-shadow: 0 0 20px #ff2d8a, 0 0 50px #ff2d8a, 0 4px 0 #6a0030, 0 8px 30px rgba(255,45,138,.6);
    letter-spacing: 3px; line-height: 1; margin-bottom: 8px;
    animation: titlePulse 2s ease-in-out infinite;
  }
  .subtitle {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(14px, 2.4vw, 22px);
    color: #ffe600; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 12px rgba(255,230,0,.7);
  }
  #coin {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(20px, 3.2vw, 32px);
    color: #fff; padding: 14px 36px;
    border: 3px solid #ff2d8a; border-radius: 8px;
    background: rgba(255,45,138,.12);
    cursor: pointer; letter-spacing: 4px;
    animation: blink 1.1s steps(2,start) infinite;
    box-shadow: 0 0 25px rgba(255,45,138,.5);
  }
  #coin:active { transform: scale(.96); }
  .hint { color: #888; font-size: 12px; margin-top: 24px; letter-spacing: 2px; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes titlePulse { 50% { text-shadow: 0 0 30px #ff2d8a, 0 0 70px #ff2d8a, 0 4px 0 #6a0030, 0 8px 40px rgba(255,45,138,.9); } }

  #rotate {
    position: absolute; inset: 0; background: #000; z-index: 100;
    display: none; align-items: center; justify-content: center; text-align: center;
    color: #ff2d8a; font-family: 'Bungee', sans-serif; font-size: 32px;
    flex-direction: column; gap: 20px; padding: 30px;
  }
  @media (orientation: portrait) and (max-width: 820px) {
    #rotate { display: flex; }
  }

  #mute {
    position: absolute; top: 12px; right: 12px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.3);
    color: #fff; font-size: 20px; cursor: pointer; z-index: 30;
    display: flex; align-items: center; justify-content: center;
  }
  #mute:active { transform: scale(.92); }

  #turn {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); color: #fff; padding: 8px 22px;
    border-radius: 22px; font-weight: bold; font-size: 14px; z-index: 30;
    letter-spacing: 2px; border: 2px solid rgba(255,255,255,.2);
  }
  #turn.enemy { color: #ff6464; border-color: rgba(255,100,100,.4); }
  #turn.player { color: #6affb4; border-color: rgba(106,255,180,.4); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="mute" aria-label="Mute">🔊</button>
  <div id="turn">YOUR TURN</div>

  <div id="overlay">
    <div class="title">ANGRY WORMS</div>
    <div class="subtitle">ARTILLERY MAYHEM</div>
    <div id="coin">TAP TO INSERT COIN</div>
    <div class="hint">DRAG SLINGSHOT · WATCH THE WIND · DESTROY THE ENEMY</div>
  </div>

  <div id="rotate">
    <div style="font-size:64px">🔄</div>
    <div>ROTATE YOUR PHONE</div>
    <div style="font-size:14px;color:#888">PLAY IN LANDSCAPE</div>
  </div>
</div>

<script src="arcade-scores.js?v=10"></script>
<script>
(function(){
'use strict';

// === SETUP ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const coinBtn = document.getElementById('coin');
const muteBtn = document.getElementById('mute');
const turnEl = document.getElementById('turn');

const WORLD_W = 2500;
const WORLD_H = 1400;
let viewW = 0, viewH = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// === STATE ===
const STATE = { MENU:0, PLAYING:1, GAMEOVER:2 };
let state = STATE.MENU;

let terrain = null;       // Uint8Array
let worms = [];
let projectiles = [];
let particles = [];
let trails = [];
let currentTurn = 'player';
let turnTimer = 0;
let aiming = false;
let aimStart = {x:0,y:0}, aimEnd = {x:0,y:0};
let cameraX = 0, cameraY = 0;
let cameraTargetX = 0, cameraTargetY = 0;
let shake = 0;
let wind = 0;
let selectedType = 0;
let pendingSwitch = 0;
let winner = null;
let finalScore = 0;
let gameOverShown = false;
let frameCount = 0;

const WORM_TYPES = [
  { name:'RED',     color:'#e74c3c', radius:14, damage:32, explodeRadius:60 },
  { name:'BOMBER',  color:'#2c3e50', radius:15, damage:55, explodeRadius:110 },
  { name:'SPLITTER',color:'#27ae60', radius:13, damage:22, explodeRadius:50, splits:true }
];

// === TERRAIN ===
function generateTerrain() {
  terrain = new Uint8Array(WORLD_W * WORLD_H);
  const baseY = WORLD_H * 0.68;
  const pts = [];
  let h = baseY;
  for (let x = 0; x <= WORLD_W; x += 12) {
    h += (Math.random() - 0.5) * 28;
    h = Math.max(WORLD_H * 0.42, Math.min(WORLD_H * 0.86, h));
    pts.push({x, y: h});
  }
  // Smooth a few times
  for (let s = 0; s < 2; s++) {
    for (let i = 1; i < pts.length - 1; i++) {
      pts[i].y = (pts[i-1].y + pts[i].y + pts[i+1].y) / 3;
    }
  }
  for (let x = 0; x < WORLD_W; x++) {
    // Interpolate between points
    const idx = Math.floor(x / 12);
    const p1 = pts[Math.min(idx, pts.length-1)];
    const p2 = pts[Math.min(idx+1, pts.length-1)];
    const t = (x % 12) / 12;
    const y = p1.y + (p2.y - p1.y) * t;
    const groundY = Math.floor(y);
    for (let yy = groundY; yy < WORLD_H; yy++) {
      terrain[yy * WORLD_W + x] = 1;
    }
  }
}

function terrainAt(x, y) {
  x = x | 0; y = y | 0;
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return 0;
  return terrain[y * WORLD_W + x];
}

function terrainColumnTop(x) {
  x = x | 0;
  if (x < 0 || x >= WORLD_W) return WORLD_H;
  for (let y = 0; y < WORLD_H; y++) {
    if (terrain[y * WORLD_W + x]) return y;
  }
  return WORLD_H;
}

function destroyTerrain(cx, cy, r) {
  cx = cx|0; cy = cy|0; r = r|0;
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx + dy*dy <= r2) {
        const x = cx + dx, y = cy + dy;
        if (x >= 0 && x < WORLD_W && y >= 0 && y < WORLD_H) {
          terrain[y * WORLD_W + x] = 0;
        }
      }
    }
  }
}

// === WORMS ===
function spawnWorms() {
  worms = [];
  // Player team (left side)
  const playerSpots = [180, 280, 380, 240];
  for (let i = 0; i < 3; i++) {
    const x = playerSpots[i] + Math.random()*30;
    const y = terrainColumnTop(x) - 14;
    worms.push({
      x, y, vx:0, vy:0, team:'player', type: i % 3,
      hp: 100, maxHp: 100, alive: true, facing: 1,
      blink: 0, hurt: 0, bob: Math.random()*Math.PI*2
    });
  }
  // Enemy team (right side)
  const enemySpots = [WORLD_W-180, WORLD_W-280, WORLD_W-380];
  for (let i = 0; i < 3; i++) {
    const x = enemySpots[i] - Math.random()*30;
    const y = terrainColumnTop(x) - 14;
    worms.push({
      x, y, vx:0, vy:0, team:'enemy', type: i % 3,
      hp: 100, maxHp: 100, alive: true, facing: -1,
      blink: 0, hurt: 0, bob: Math.random()*Math.PI*2
    });
  }
}

function activeWorm(team) {
  const list = worms.filter(w => w.alive && w.team === team);
  if (!list.length) return null;
  // Pick the one with highest hp that hasn't gone recently — simpler: rotate
  list.sort((a,b) => a._lastUsed - b._lastUsed || 0);
  const w = list[0];
  w._lastUsed = (w._lastUsed||0) + 1;
  return w;
}

// === PROJECTILE ===
function launchProjectile(x, y, vx, vy, type, team) {
  projectiles.push({
    x, y, vx, vy, type, team,
    radius: WORM_TYPES[type].radius,
    alive: true, bounces: 0, age: 0,
    hasSplit: false, spin: 0
  });
}

// === EXPLOSION ===
function explode(cx, cy, radius, damage, sourceTeam) {
  // Destroy terrain
  destroyTerrain(cx, cy, radius);
  // Damage worms
  for (const w of worms) {
    if (!w.alive) continue;
    const dx = w.x - cx, dy = w.y - cy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < radius + 20) {
      const factor = Math.max(0, 1 - d / (radius + 20));
      const dmg = damage * factor;
      w.hp -= dmg;
      w.hurt = 30;
      // Knockback
      const ang = Math.atan2(dy, dx);
      const kb = factor * 8;
      w.vx += Math.cos(ang) * kb;
      w.vy += Math.sin(ang) * kb - 2;
      if (w.hp <= 0) {
        w.hp = 0;
        w.alive = false;
        // Death burst
        for (let i = 0; i < 20; i++) {
          spawnParticle(w.x, w.y, '#ff4444', 4 + Math.random()*4);
        }
      }
    }
  }
  // Visual explosion
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 7;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 40 + Math.random()*20, maxLife: 60,
      color: ['#ff9500','#ffcc00','#ff4400','#fff'][i%4],
      size: 3 + Math.random()*5, kind:'spark'
    });
  }
  // Smoke
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: cx + (Math.random()-.5)*30, y: cy + (Math.random()-.5)*30,
      vx: (Math.random()-.5)*1.5, vy: -1 - Math.random()*1.5,
      life: 60 + Math.random()*30, maxLife: 90,
      color: 'rgba(60,60,60,0.6)', size: 8 + Math.random()*10, kind:'smoke'
    });
  }
  // Ring
  particles.push({
    x: cx, y: cy, vx:0, vy:0,
    life: 25, maxLife: 25, color:'#fff', size:5, kind:'ring', maxR: radius
  });
  shake = Math.min(25, shake + radius * 0.25);
  playSound('explode', radius);
}

function spawnParticle(x, y, color, size) {
  const a = Math.random() * Math.PI * 2;
  const sp = 1 + Math.random() * 4;
  particles.push({
    x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1,
    life: 30 + Math.random()*20, maxLife: 50,
    color, size, kind:'spark'
  });
}

// === INPUT ===
function getPointer(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = canvas.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function onDown(e) {
  if (state !== STATE.PLAYING) return;
  if (currentTurn !== 'player') return;
  if (pendingSwitch > 0) return;
  e.preventDefault();
  aiming = true;
  const p = getPointer(e);
  aimStart = p; aimEnd = p;
}
function onMove(e) {
  if (!aiming) return;
  e.preventDefault();
  aimEnd = getPointer(e);
}
function onUp(e) {
  if (!aiming) return;
  e.preventDefault();
  aiming = false;
  const w = activeWorm('player');
  if (!w) return;
  // Launch direction: opposite of drag (sling pulled back)
  const dx = aimStart.x - aimEnd.x;
  const dy = aimStart.y - aimEnd.y;
  const power = Math.min(22, Math.sqrt(dx*dx + dy*dy) * 0.08);
  if (power < 2) return;
  const ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * power;
  const vy = Math.sin(ang) * power;
  // Spawn from worm position (offset above)
  launchProjectile(w.x + w.facing*20, w.y - 18, vx, vy, selectedType, 'player');
  // Switch turn after a delay
  pendingSwitch = 90;
  turnEl.textContent = 'INCOMING...';
  turnEl.className = '';
  playSound('launch');
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
window.addEventListener('touchend', onUp, {passive:false});

// Keyboard for worm type selection
window.addEventListener('keydown', (e) => {
  if (state !== STATE.PLAYING) return;
  if (e.key === '1') selectedType = 0;
  if (e.key === '2') selectedType = 1;
  if (e.key === '3') selectedType = 2;
  if (e.key === ' ') { selectedType = (selectedType+1) % 3; }
});

// === SOUND ===
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem('aw_muted') === '1'; } catch(e) {}
muteBtn.textContent = muted ? '🔇' : '🔊';

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(kind, intensity) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  if (kind === 'explode') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    const vol = Math.min(0.4, 0.15 + (intensity||60)/300);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.5);
    // Noise burst
    const buf = audioCtx.createBuffer(1, 4410, 44100);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2);
    const src = audioCtx.createBufferSource();
    const ng = audioCtx.createGain();
    ng.gain.value = vol * 0.7;
    src.buffer = buf;
    src.connect(ng).connect(audioCtx.destination);
    src.start(t);
  } else if (kind === 'launch') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.2);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  } else if (kind === 'hit') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(200, t);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.15);
  } else if (kind === 'win') {
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t + i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.12 + 0.2);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i*0.12); o.stop(t + i*0.12 + 0.2);
    });
  } else if (kind === 'lose') {
    [400, 300, 200, 100].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t + i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.15 + 0.25);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i*0.15); o.stop(t + i*0.15 + 0.25);
    });
  }
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('aw_muted', muted ? '1' : '0'); } catch(e) {}
});

// === COIN / START ===
coinBtn.addEventListener('click', () => {
  ensureAudio();
  // Try fullscreen
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  startGame();
});

function startGame() {
  overlay.classList.add('hidden');
  generateTerrain();
  spawnWorms();
  projectiles = [];
  particles = [];
  trails = [];
  currentTurn = 'player';
  selectedType = 0;
  pendingSwitch = 0;
  winner = null;
  finalScore = 0;
  gameOverShown = false;
  wind = (Math.random() - 0.5) * 0.12;
  // Initial camera on player worms
  const w = worms[0];
  cameraX = w.x - viewW/2;
  cameraY = w.y - viewH/2;
  cameraTargetX = cameraX; cameraTargetY = cameraY;
  state = STATE.PLAYING;
  turnEl.textContent = 'YOUR TURN';
  turnEl.className = 'player';
}

function resetGame() {
  state = STATE.MENU;
  overlay.classList.remove('hidden');
  gameOverShown = false;
}

// === AI ===
function aiFire() {
  const shooter = activeWorm('enemy');
  if (!shooter) return;
  const targets = worms.filter(w => w.alive && w.team === 'player');
  if (!targets.length) return;
  const target = targets[Math.floor(Math.random()*targets.length)];
  // Calculate aim with some inaccuracy
  const dx = target.x - shooter.x;
  const dy = target.y - shooter.y - 30;
  const dist = Math.sqrt(dx*dx + dy*dy);
  // Aimed shot — solve for ~45 degree arc with wind compensation
  let power = Math.min(20, 8 + dist * 0.018);
  let angle = Math.atan2(-Math.abs(dy) - dist*0.15, dx); // arc upward
  // Add wind compensation
  angle += wind * 2;
  // Inaccuracy
  power *= 0.92 + Math.random()*0.16;
  angle += (Math.random() - 0.5) * 0.12;
  const vx = Math.cos(angle) * power;
  const vy = Math.sin(angle) * power;
  shooter.facing = dx > 0 ? 1 : -1;
  launchProjectile(shooter.x + shooter.facing*20, shooter.y - 18, vx, vy, Math.floor(Math.random()*3), 'enemy');
  playSound('launch');
  turnEl.textContent = 'ENEMY TURN';
  turnEl.className = 'enemy';
}

// === UPDATE ===
function update() {
  frameCount++;

  if (state !== STATE.PLAYING) return;

  // Update worms (gravity, terrain collision)
  for (const w of worms) {
    if (!w.alive) continue;
    w.bob += 0.05;
    w.blink = Math.max(0, w.blink - 1);
    if (Math.random() < 0.005) w.blink = 8;
    w.hurt = Math.max(0, w.hurt - 1);
    // Physics
    w.vy += 0.4;
    w.vx *= 0.92;
    w.x += w.vx;
    w.y += w.vy;
    // Bounds
    if (w.x < 10) { w.x = 10; w.vx = Math.abs(w.vx)*0.5; }
    if (w.x > WORLD_W-10) { w.x = WORLD_W-10; w.vx = -Math.abs(w.vx)*0.5; }
    // Terrain collision
    if (terrainAt(w.x, w.y + 14)) {
      // Move up to surface
      const topY = terrainColumnTop(w.x);
      w.y = topY - 14;
      w.vy = -w.vy * 0.25;
      w.vx *= 0.7;
      if (Math.abs(w.vy) < 1) w.vy = 0;
    }
    // Water
    if (w.y > WORLD_H - 50) {
      w.hp -= 2;
      w.hurt = 5;
      if (w.hp <= 0) { w.hp = 0; w.alive = false; }
    }
  }

  // Update projectiles
  for (const p of projectiles) {
    if (!p.alive) continue;
    p.age++;
    p.spin += 0.2;
    // Physics
    p.vy += 0.35;
    p.vx += wind;
    p.x += p.vx;
    p.y += p.vy;
    // Trail
    if (p.age % 2 === 0) {
      trails.push({x:p.x, y:p.y, life:20, color: WORM_TYPES[p.type].color});
    }
    // Splitter logic
    if (WORM_TYPES[p.type].splits && !p.hasSplit && p.age > 25 && p.vy > 0) {
      p.hasSplit = true;
      const sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      const ang = Math.atan2(p.vy, p.vx);
      for (const da of [-0.35, 0.35]) {
        const na = ang + da;
        launchProjectile(p.x, p.y, Math.cos(na)*sp*0.95, Math.sin(na)*sp*0.95, 0, p.team);
      }
      // Original continues
    }
    // Bounds
    if (p.x < 0 || p.x > WORLD_W) { p.alive = false; continue; }
    // Terrain hit
    if (terrainAt(p.x, p.y)) {
      const t = WORM_TYPES[p.type];
      explode(p.x, p.y, t.explodeRadius, t.damage, p.team);
      p.alive = false;
      playSound('hit');
      continue;
    }
    // Worm hit
    for (const w of worms) {
      if (!w.alive) continue;
      if (w.team === p.team) continue;
      const dx = w.x - p.x, dy = w.y - p.y;
      if (dx*dx + dy*dy < (w.radius + p.radius) * (w.radius + p.radius)) {
        const t = WORM_TYPES[p.type];
        explode(p.x, p.y, t.explodeRadius, t.damage, p.team);
        p.alive = false;
        playSound('hit');
        break;
      }
    }
    // Water
    if (p.y > WORLD_H - 40) {
      // Splash
      for (let i = 0; i < 10; i++) spawnParticle(p.x, WORLD_H-50, '#6ec6ff', 3);
      p.alive = false;
    }
  }
  projectiles = projectiles.filter(p => p.alive);

  // Trails
  for (const t of trails) t.life--;
  trails = trails.filter(t => t.life > 0);

  // Particles
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.kind === 'spark') {
      p.vy += 0.18;
      p.vx *= 0.98;
    } else if (p.kind === 'smoke') {
      p.vy *= 0.96;
      p.vx *= 0.96;
      p.size *= 1.02;
    } else if (p.kind === 'ring') {
      p.size = p.maxR * (1 - p.life / p.maxLife);
    }
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Camera follow active projectile or current worm
  let focusX, focusY;
  if (projectiles.length > 0) {
    const p = projectiles[0];
    focusX = p.x; focusY = p.y;
  } else if (currentTurn === 'player' && !aiming) {
    const w = worms.filter(w => w.alive && w.team === 'player')[0];
    if (w) { focusX = w.x; focusY = w.y; }
  } else if (aiming) {
    focusX = cameraX + viewW/2;
    focusY = cameraY + viewH/2;
  } else {
    const w = worms.filter(w => w.alive && w.team === currentTurn)[0];
    if (w) { focusX = w.x; focusY = w.y; }
  }
  if (focusX !== undefined) {
    cameraTargetX = focusX - viewW/2;
    cameraTargetY = focusY - viewH/2;
  }
  // Clamp camera
  cameraTargetX = Math.max(0, Math.min(WORLD_W - viewW, cameraTargetX));
  cameraTargetY = Math.max(0, Math.min(WORLD_H - viewH, cameraTargetY));
  // Smooth follow
  cameraX += (cameraTargetX - cameraX) * 0.08;
  cameraY += (cameraTargetY - cameraY) * 0.08;

  // Shake decay
  shake *= 0.85;
  if (shake < 0.1) shake = 0;

  // Turn switching
  if (pendingSwitch > 0) {
    pendingSwitch--;
    if (pendingSwitch === 0) {
      // Wait until projectiles clear
    }
  }
  // Only switch turns when no projectiles and no pending switch counter
  if (pendingSwitch === 0 && projectiles.length === 0) {
    if (currentTurn === 'player' && turnTimer > 0 && turnTimer < 9999) {
      // player already fired, switch to enemy
    }
  }

  // Turn logic: after player fires and projectiles settle, enemy fires
  if (pendingSwitch > 0 && projectiles.length === 0) {
    pendingSwitch--;
    if (pendingSwitch === 0 && currentTurn === 'player') {
      currentTurn = 'enemy';
      wind = (Math.random() - 0.5) * 0.14;
      turnTimer = 40; // delay before AI fires
    } else if (pendingSwitch === 0 && currentTurn === 'enemy') {
      currentTurn = 'player';
      wind = (Math.random() - 0.5) * 0.12;
      selectedType = 0;
      turnEl.textContent = 'YOUR TURN';
      turnEl.className = 'player';
    }
  }
  if (currentTurn === 'enemy' && projectiles.length === 0 && pendingSwitch === 0) {
    turnTimer--;
    if (turnTimer <= 0) {
      aiFire();
      pendingSwitch = 120;
    }
  }

  // Win/lose check
  const playersAlive = worms.filter(w => w.alive && w.team === 'player').length;
  const enemiesAlive = worms.filter(w => w.alive && w.team === 'enemy').length;
  if (!gameOverShown) {
    if (playersAlive === 0) {
      winner = 'enemy';
      finalScore = worms.filter(w => !w.alive && w.team === 'enemy').length * 50;
      gameOverShown = true;
      setTimeout(() => onGameOver(), 1200);
    } else if (enemiesAlive === 0) {
      winner = 'player';
      finalScore = playersAlive * 100 + Math.floor(worms.filter(w=>w.team==='player').reduce((s,w)=>s+w.hp,0));
      gameOverShown = true;
      setTimeout(() => onGameOver(), 1200);
    }
  }
}

function onGameOver() {
  state = STATE.GAMEOVER;
  if (winner === 'player') playSound('win');
  else playSound('lose');
  if (window.ArcadeScores) {
    ArcadeScores.show('angry-worms', finalScore, resetGame);
  } else {
    alert(winner === 'player' ? 'YOU WIN! Score: ' + finalScore : 'YOU LOSE!');
    resetGame();
  }
}

// === RENDER ===
function render() {
  // Clear
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, viewW, viewH);

  if (state === STATE.MENU) {
    // Just dark behind overlay
    return;
  }

  ctx.save();
  // Apply shake
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  ctx.translate(-cameraX + sx, -cameraY + sy);

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  skyGrad.addColorStop(0, '#3a8dc7');
  skyGrad.addColorStop(0.4, '#7ec0e8');
  skyGrad.addColorStop(0.8, '#c8e6f0');
  skyGrad.addColorStop(1, '#e0f0e0');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(cameraX, cameraY, viewW, viewH);

  // Sun
  ctx.fillStyle = 'rgba(255,240,180,0.9)';
  ctx.beginPath();
  ctx.arc(WORLD_W * 0.75, 150, 60, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,240,180,0.2)';
  ctx.beginPath();
  ctx.arc(WORLD_W * 0.75, 150, 90, 0, Math.PI*2);
  ctx.fill();

  // Distant hills (parallax)
  ctx.fillStyle = '#8fa68b';
  ctx.beginPath();
  ctx.moveTo(0, WORLD_H);
  for (let x = 0; x <= WORLD_W; x += 40) {
    const y = WORLD_H * 0.55 + Math.sin(x * 0.008) * 40 + Math.cos(x * 0.015) * 25;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(WORLD_W, WORLD_H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#6b8d65';
  ctx.beginPath();
  ctx.moveTo(0, WORLD_H);
  for (let x = 0; x <= WORLD_W; x += 30) {
    const y = WORLD_H * 0.62 + Math.sin(x * 0.012 + 1) * 30 + Math.cos(x * 0.02) * 20;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(WORLD_W, WORLD_H);
  ctx.closePath();
  ctx.fill();

  // Clouds (simple)
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 6; i++) {
    const cx = (i * 480 + (frameCount * 0.2) % WORLD_W) % WORLD_W;
    const cy = 100 + (i * 50) % 150;
    ctx.beginPath();
    ctx.arc(cx, cy, 25, 0, Math.PI*2);
    ctx.arc(cx+25, cy+5, 22, 0, Math.PI*2);
    ctx.arc(cx-25, cy+5, 20, 0, Math.PI*2);
    ctx.fill();
  }

  // Terrain - draw from heightmap
  // Draw as filled green with darker outline
  ctx.fillStyle = '#4a8c3a';
  ctx.beginPath();
  ctx.moveTo(0, WORLD_H);
  for (let x = 0; x < WORLD_W; x += 2) {
    const y = terrainColumnTop(x);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(WORLD_W, WORLD_H);
  ctx.closePath();
  ctx.fill();

  // Grass top line
  ctx.strokeStyle = '#5fb04a';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = 0; x < WORLD_W; x += 2) {
    const y = terrainColumnTop(x);
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // Darker dirt layer
  ctx.strokeStyle = '#3a6c2a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x < WORLD_W; x += 2) {
    const y = terrainColumnTop(x) + 5;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Water at bottom
  const waterY = WORLD_H - 35;
  ctx.fillStyle = 'rgba(40, 120, 200, 0.7)';
  ctx.fillRect(0, waterY, WORLD_W, 35);
  ctx.fillStyle = 'rgba(100, 180, 230, 0.4)';
  for (let x = 0; x < WORLD_W; x += 8) {
    const wy = waterY + Math.sin((x + frameCount*2) * 0.05) * 2;
    ctx.fillRect(x, wy, 8, 2);
  }

  // Worms
  for (const w of worms) {
    if (!w.alive) continue;
    drawWorm(w);
  }

  // Trails
  for (const t of trails) {
    const alpha = t.life / 20;
    ctx.fillStyle = t.color;
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Projectiles
  for (const p of projectiles) {
    drawProjectile(p);
  }

  // Particles
  for (const p of particles) {
    const alpha = Math.min(1, p.life / p.maxLife);
    if (p.kind === 'ring') {
      ctx.strokeStyle = `rgba(255,255,255,${alpha*0.8})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.stroke();
    } else if (p.kind === 'smoke') {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha * 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Trajectory preview when aiming
  if (aiming && currentTurn === 'player') {
    drawTrajectory();
  }

  // Catapult indicator on active worm
  if (currentTurn === 'player' && projectiles.length === 0 && pendingSwitch === 0) {
    const w = worms.filter(w => w.alive && w.team === 'player')[0];
    if (w) drawCatapult(w);
  }

  ctx.restore();

  // HUD (screen-space)
  drawHUD();
}

function drawWorm(w) {
  const bob = Math.sin(w.bob) * 1.5;
  const x = w.x, y = w.y + bob;
  const r = w.radius;
  const t = WORM_TYPES[w.type];

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, w.y + r + 2, r * 0.9, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // Body (worm-like capsule)
  const flashColor = w.hurt > 0 ? '#fff' : t.color;
  ctx.fillStyle = flashColor;
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;

  // Worm body: rounded rectangle
  ctx.beginPath();
  ctx.ellipse(x, y, r * 0.95, r * 1.05, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Belly highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(x - r*0.3, y - r*0.3, r*0.4, r*0.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Face — eyes
  const eyeY = y - r * 0.25;
  const eyeOff = r * 0.35;
  const lookX = w.facing * 2;
  // Eye whites
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x - eyeOff, eyeY, r*0.32, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + eyeOff, eyeY, r*0.32, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  // Pupils
  if (w.blink > 0) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - eyeOff - r*0.2, eyeY);
    ctx.lineTo(x - eyeOff + r*0.2, eyeY);
    ctx.moveTo(x + eyeOff - r*0.2, eyeY);
    ctx.lineTo(x + eyeOff + r*0.2, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(x - eyeOff + lookX, eyeY, r*0.15, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOff + lookX, eyeY, r*0.15, 0, Math.PI*2);
    ctx.fill();
  }

  // Mouth
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (w.hurt > 0) {
    // Open mouth (O shape)
    ctx.arc(x, y + r*0.35, r*0.15, 0, Math.PI*2);
  } else {
    // Smile
    ctx.arc(x, y + r*0.25, r*0.3, 0.15*Math.PI, 0.85*Math.PI);
  }
  ctx.stroke();

  // HP bar above worm
  const barW = 36, barH = 5;
  const barX = x - barW/2, barY = y - r - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
  ctx.fillStyle = '#333';
  ctx.fillRect(barX, barY, barW, barH);
  const hpPct = w.hp / w.maxHp;
  ctx.fillStyle = hpPct > 0.5 ? '#5fdc4a' : hpPct > 0.25 ? '#ffcc00' : '#ff4040';
  ctx.fillRect(barX, barY, barW * hpPct, barH);

  // Team indicator dot
  ctx.fillStyle = w.team === 'player' ? '#6affb4' : '#ff6464';
  ctx.beginPath();
  ctx.arc(x, barY - 5, 2.5, 0, Math.PI*2);
  ctx.fill();

  // Type indicator (small letter)
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center';
  const letter = w.type === 0 ? 'R' : w.type === 1 ? 'B' : 'S';
  ctx.fillText(letter, x, y + r + 12);
}

function drawProjectile(p) {
  const t = WORM_TYPES[p.type];
  const x = p.x, y = p.y, r = p.radius;
  // Shadow on ground
  const groundY = terrainColumnTop(p.x);
  if (groundY < WORLD_H) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, groundY - 2, r*0.7, 3, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // Body
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.spin);
  ctx.fillStyle = t.color;
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, r*0.95, r*1.05, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  // Belly
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-r*0.3, -r*0.3, r*0.4, r*0.5, 0, 0, Math.PI*2);
  ctx.fill();
  // Eyes (small)
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(-r*0.3, -r*0.1, r*0.25, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(r*0.3, -r*0.1, r*0.25, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-r*0.3 + r*0.05, -r*0.1, r*0.12, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r*0.3 + r*0.05, -r*0.1, r*0.12, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Glow for bomber
  if (p.type === 1) {
    ctx.fillStyle = 'rgba(255,80,0,0.3)';
    ctx.beginPath();
    ctx.arc(x, y, r * 1.8, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawTrajectory() {
  const w = worms.filter(w => w.alive && w.team === 'player')[0];
  if (!w) return;
  const dx = aimStart.x - aimEnd.x;
  const dy = aimStart.y - aimEnd.y;
  const power = Math.min(22, Math.sqrt(dx*dx + dy*dy) * 0.08);
  if (power < 2) return;
  const ang = Math.atan2(dy, dx);
  let vx = Math.cos(ang) * power;
  let vy = Math.sin(ang) * power;
  let px = w.x + w.facing*20;
  let py = w.y - 18;
  // Simulate
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 60; i++) {
    vy += 0.35;
    vx += wind;
    px += vx;
    py += vy;
    if (px < 0 || px > WORLD_W) break;
    if (terrainAt(px, py)) break;
    if (py > WORLD_H - 40) break;
    if (i % 3 === 0) {
      const sz = 4 - i * 0.04;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(1, sz), 0, Math.PI*2);
      ctx.fill();
    }
  }
  // Power bar near worm
  const barW = 60, barH = 6;
  const bx = w.x - barW/2, by = w.y - 40;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx-1, by-1, barW+2, barH+2);
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, barW, barH);
  const pct = power / 22;
  ctx.fillStyle = pct > 0.7 ? '#ff4040' : pct > 0.4 ? '#ffcc00' : '#5fdc4a';
  ctx.fillRect(bx, by, barW * pct, barH);
}

function drawCatapult(w) {
  // Simple slingshot Y shape on worm
  const x = w.x + w.facing * 18;
  const y = w.y - 5;
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - w.facing*8, y + 10);
  ctx.lineTo(x, y - 5);
  ctx.moveTo(x, y - 5);
  ctx.lineTo(x - 4, y - 18);
  ctx.moveTo(x, y - 5);
  ctx.lineTo(x + 4, y - 18);
  ctx.stroke();
  // Rubber band
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 18);
  ctx.lineTo(x + 4, y - 18);
  ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawHUD() {
  // Wind indicator (top left)
  const wx = 60, wy = 30;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(wx - 50, wy - 14, 130, 28);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('WIND', wx - 45, wy - 3);
  // Arrow
  const wlen = Math.abs(wind) * 800;
  ctx.strokeStyle = wind > 0 ? '#ff6464' : '#6affb4';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(wx, wy + 6);
  ctx.lineTo(wx + (wind > 0 ? wlen : -wlen), wy + 6);
  ctx.stroke();
  // Arrowhead
  const tip = wx + (wind > 0 ? wlen : -wlen);
  ctx.beginPath();
  ctx.moveTo(tip, wy + 6);
  ctx.lineTo(tip + (wind > 0 ? -6 : 6), wy + 2);
  ctx.moveTo(tip, wy + 6);
  ctx.lineTo(tip + (wind > 0 ? -6 : 6), wy + 10);
  ctx.stroke();

  // Worm type selector (bottom)
  const selY = viewH - 50;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, selY - 5, viewW, 60);
  for (let i = 0; i < 3; i++) {
    const sx = viewW/2 - 100 + i * 100;
    const t = WORM_TYPES[i];
    const isSel = i === selectedType;
    // Background
    ctx.fillStyle = isSel ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(sx - 35, selY, 70, 45);
    ctx.strokeStyle = isSel ? '#ffe600' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = isSel ? 3 : 1.5;
    ctx.strokeRect(sx - 35, selY, 70, 45);
    // Worm icon
    ctx.fillStyle = t.color;
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, selY + 18, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // Name
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.name, sx, selY + 38);
    // Number
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('[' + (i+1) + ']', sx - 25, selY + 10);
  }

  // Score / HP summary top right
  const players = worms.filter(w => w.team === 'player' && w.alive).length;
  const enemies = worms.filter(w => w.team === 'enemy' && w.alive).length;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(viewW - 130, 50, 120, 50);
  ctx.fillStyle = '#6affb4';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('YOU: ' + players, viewW - 120, 70);
  ctx.fillStyle = '#ff6464';
  ctx.fillText('ENEMY: ' + enemies, viewW - 120, 90);

  // Turn indicator pulsing arrow on active worm when player's turn
  if (currentTurn === 'player' && projectiles.length === 0 && pendingSwitch === 0 && !aiming) {
    const w = worms.filter(w => w.alive && w.team === 'player')[0];
    if (w) {
      const px = w.x - cameraX;
      const py = w.y - cameraY - 60 + Math.sin(frameCount * 0.1) * 4;
      ctx.fillStyle = '#ffe600';
      ctx.beginPath();
      ctx.moveTo(px, py + 15);
      ctx.lineTo(px - 10, py);
      ctx.lineTo(px + 10, py);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// === GAME LOOP ===
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Start the loop immediately (it checks state)
requestAnimationFrame(gameLoop);

// Prevent context menu on canvas
canvas.addEventListener('contextmenu', e => e.preventDefault());

})();
</script>
