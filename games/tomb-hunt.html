<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>TOMB HUNT — JnJ Arcade</title>
<style>
:root { --ink:#d4a017; --dim:#4a3200; --pit:#0d0a02; --glow:rgba(212,160,23,.22); --bg:#0d0a02; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; background:var(--bg); color:#fff;
  font-family:'Barlow Condensed','Arial Narrow',sans-serif;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
.game-shell {
  display:flex; flex-direction:column;
  height:100vh; height:100dvh; width:100%;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0)
          env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
.game-header {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px;
  background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.2));
  border-bottom:2px solid var(--dim);
}
.back-btn { color:var(--ink); text-decoration:none; font-weight:700; font-size:13px; letter-spacing:.05em; opacity:.85; }
.game-name { font-family:'Bungee',cursive; letter-spacing:.14em; color:var(--ink); text-shadow:0 0 12px var(--glow); font-size:17px; }
.hdr-right { text-align:right; }
.score-label { font-size:9px; letter-spacing:.18em; opacity:.55; }
.score-val { font-size:19px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.hud-bar {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px 5px; font-size:12px; border-bottom:1px solid rgba(212,160,23,.1);
}
.hearts-display { color:#ff5555; font-size:16px; letter-spacing:2px; }
.lvl { opacity:.65; letter-spacing:.1em; font-size:11px; }
.canvas-wrap {
  flex:1; position:relative; padding:14px 6px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
canvas { display:block; border:2px solid var(--dim); border-radius:10px;
  box-shadow:0 0 30px var(--glow), inset 0 0 24px rgba(0,0,0,.6);
  background:var(--pit); touch-action:none; }
.overlay {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px;
  background:rgba(13,10,2,.9); backdrop-filter:blur(4px);
  text-align:center; padding:24px; z-index:5; border-radius:10px;
}
.overlay.hidden { display:none; }
.overlay-emoji { font-size:48px; }
.overlay-title {
  font-family:'Bungee',cursive; font-size:28px; font-weight:900;
  letter-spacing:.1em; color:var(--ink); text-shadow:0 0 18px var(--glow);
}
.overlay-sub { font-size:13px; line-height:1.7; opacity:.85; max-width:320px; }
.board { font-size:12px; opacity:.8; line-height:1.7; margin-top:2px; }
.board b { color:var(--ink); }
.play-btn {
  margin-top:4px; background:var(--ink); color:#0d0a02; border:none;
  border-radius:28px; padding:13px 28px; font-size:15px; font-weight:800;
  letter-spacing:.08em; cursor:pointer; box-shadow:0 0 24px var(--glow);
  font-family:'Bungee',cursive; transition:transform .06s, box-shadow .06s;
}
.play-btn:active { transform:translateY(3px); box-shadow:0 0 10px var(--glow); }
</style>
</head>
<body>
<div class="game-shell">
  <header class="game-header">
    <a class="back-btn" href="../index.html">‹ ARCADE</a>
    <div class="game-name">TOMB HUNT</div>
    <div class="hdr-right"><div class="score-label">SCORE</div><div class="score-val" id="score">0</div></div>
  </header>
  <div class="hud-bar">
    <div class="hearts-display" id="hearts">♥ ♥ ♥</div>
    <div class="lvl" id="lvl">LEVEL 1</div>
  </div>
  <div class="canvas-wrap" id="wrap">
    <canvas id="c"></canvas>
    <div class="overlay hidden" id="ov">
      <div class="overlay-emoji" id="ovEmoji">🏺🌿</div>
      <div class="overlay-title" id="ovTitle">TOMB HUNT</div>
      <div class="overlay-sub" id="ovsub">
        Swipe <b>UP</b> to jump · tap again for <b>double jump</b><br>
        Swipe <b>DOWN</b> to slide under arrows<br>
        <b>Jump ON guards</b> to stomp them · arrows fire auto<br>
        Grab <b>vines</b> · <b style="color:var(--ink)">artifacts +50</b> · gems +10
      </div>
      <div class="board" id="board"></div>
      <button class="play-btn" id="playBtn">INSERT COIN</button>
    </div>
  </div>
</div>
<script src="../vendor/gsap.min.js"></script>
<script src="../arcade-scores.js?v=12"></script>
<script>
// ── constants ─────────────────────────────────────────────────────────────────
const GAME_ID    = 'tomb-hunt';
const GAME_TITLE = 'TOMB HUNT';
const ACCENT     = '#d4a017';
const CELL       = 18;
const GROUND_H   = 52;
const GRAVITY    = 0.52;
const JUMP_VY    = -13.5;
const PLAYER_W   = 20;
const PLAYER_H   = 36;
const SLIDE_H    = 18;
const BASE_SPEED = 3.2;
const INVINCIBLE_MS = 1800;
const ARROW_SPEED   = 5.5;   // player arrows — slow arc
const DART_SPEED    = 8.5;   // enemy darts — faster
const FIRE_INTERVAL = 950;
const VINE_GRAB_DIST = 28;
const PLAT_H     = 14;

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('wrap');
const ov      = document.getElementById('ov');
const ovTitle = document.getElementById('ovTitle');
const ovEmoji = document.getElementById('ovEmoji');
const ovsub   = document.getElementById('ovsub');
const board   = document.getElementById('board');
const playBtn = document.getElementById('playBtn');
const scoreEl = document.getElementById('score');
const heartsEl= document.getElementById('hearts');
const lvlEl   = document.getElementById('lvl');

// ── state ─────────────────────────────────────────────────────────────────────
let cw, ch, floorY;
let score, frame, running, dead, waiting, best, animId;
let level, speed, jumpsLeft, sliding, slideTimer;
let hitTime, lastFireTime, shootCooldown;
let playerX, playerY, prevPlayerY, playerVY;
let swinging, vineX, vineY0, vineLen, vineAngle, vineAV;
let worldX, platformGen, lives;

let platforms, boulders, spikes, guards, darts;
let vines, artifacts, gems, arrows, particles, floaters;

let touchStartY, touchStartX, touchStartTime;

// ── resize ────────────────────────────────────────────────────────────────────
function resize() {
  cw = wrap.clientWidth - 12;
  ch = wrap.clientHeight - 28 - CELL * 2;
  canvas.width  = cw;
  canvas.height = ch;
  floorY = ch - GROUND_H;
  if (running && !dead) playerX = Math.round(cw * 0.22);
}
window.addEventListener('resize', () => { resize(); if (!running) drawIdle(); });

// ── input ─────────────────────────────────────────────────────────────────────
const SWIPE_THRESH = 18;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dy = t.clientY - touchStartY;
  const dx = t.clientX - touchStartX;
  const dt = Date.now() - touchStartTime;
  if (!running && waiting) { startGame(); return; }
  if (!running || dead) return;
  if (Math.abs(dy) < SWIPE_THRESH && Math.abs(dx) < SWIPE_THRESH && dt < 250) { doJump(); return; }
  if (Math.abs(dy) > Math.abs(dx)) {
    if (dy < -SWIPE_THRESH) doJump();
    else if (dy > SWIPE_THRESH) doSlide();
  }
}, { passive: false });
document.addEventListener('keydown', e => {
  if (!running && waiting && (e.code === 'Space' || e.code === 'Enter')) { startGame(); return; }
  if (!running || dead) return;
  if (e.code === 'ArrowUp'   || e.code === 'KeyW' || e.code === 'Space') doJump();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') doSlide();
});
playBtn.addEventListener('click', () => { if (waiting || !running) startGame(); });

function doJump() {
  if (swinging) { releaseVine(); return; }
  if (jumpsLeft > 0) {
    playerVY = JUMP_VY;
    jumpsLeft--;
    spawnParticles(playerX, playerY + (sliding ? SLIDE_H : PLAYER_H), '#d4a017', 4, 'dust');
  }
}
function doSlide() {
  if (onGround() && !swinging) { sliding = true; slideTimer = 0; }
}
function onGround() {
  const pH = sliding ? SLIDE_H : PLAYER_H;
  if (playerY >= floorY - pH - 2) return true;
  for (const p of platforms) {
    if (playerX + PLAYER_W * 0.5 > p.x && playerX - PLAYER_W * 0.5 < p.x + p.w) {
      if (Math.abs(playerY + pH - p.y) < 4) return true;
    }
  }
  return false;
}

// ── vine ──────────────────────────────────────────────────────────────────────
function tryGrabVine() {
  if (swinging) return;
  for (const v of vines) {
    const vTipX = v.x + Math.sin(v.angle) * v.len;
    const vTipY = v.y0  + Math.cos(v.angle) * v.len;
    if (Math.hypot(playerX - vTipX, playerY - vTipY) < VINE_GRAB_DIST && playerVY >= -2) {
      swinging = true;
      vineX = v.x; vineY0 = v.y0; vineLen = v.len;
      vineAngle = v.angle; vineAV = v.av || 0;
      jumpsLeft = 2;
      return;
    }
  }
}
function releaseVine() {
  if (!swinging) return;
  swinging = false;
  playerVY = vineAV * vineLen * -0.7;
  playerX  = vineX + Math.sin(vineAngle) * vineLen;
  playerY  = vineY0 + Math.cos(vineAngle) * vineLen;
}

// ── helpers ───────────────────────────────────────────────────────────────────
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function spawnParticles(x, y, col, n, kind) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: rand(-3, 3),
      vy: rand(-5, kind === 'dust' ? -1 : -3),
      alpha: 1, col,
      r: rand(2, kind === 'gold' ? 5 : 3),
    });
  }
}
function addFloater(txt, x, y, col) {
  floaters.push({ txt, x, y, vy: -1.2, alpha: 1, col });
}
function addScore(n, x, y) {
  score += n;
  scoreEl.textContent = score;
  addFloater('+' + n, x, y, n >= 50 ? '#ffd700' : '#a8ff78');
}
function takeDamage() {
  if (Date.now() - hitTime < INVINCIBLE_MS) return;
  hitTime = Date.now();
  if (swinging) swinging = false;
  lives--;
  updateHearts();
  if (lives <= 0) { triggerDeath(); return; }
  spawnParticles(playerX, playerY, '#ff5555', 8, 'hit');
  playerVY = -8;
}
function updateHearts() {
  heartsEl.textContent = '♥ '.repeat(Math.max(0, lives)).trim() || '💀';
}

// ── platform generation (Ghosts 'n Goblins style) ────────────────────────────
// Cycles every 400 worldX:
//  0 = RUN     — flat ground + occasional platforms
//  1 = CLIMB   — staircase ascending then descending (vertical section)
//  2 = GAUNTLET— 2-3 platforms at varied heights, guards on some
function generatePlatformChunk(baseX) {
  const sType = Math.floor(worldX / 400) % 3;
  const maxH  = floorY - ch * 0.12;

  if (sType === 0) {
    if (Math.random() < 0.55) {
      const y = Math.max(maxH, floorY - rand(75, 130));
      platforms.push({ x: baseX, y, w: rand(80, 140), alive: true });
    }
  } else if (sType === 1) {
    // CLIMB — ascending staircase then back down
    const steps    = 5 + Math.min(level, 3);
    const stepXGap = 105;
    const stepYUp  = 48;
    let px = baseX, py = floorY - 75;
    for (let i = 0; i < steps; i++) {
      py = Math.max(maxH, py - stepYUp);
      platforms.push({ x: px, y: py, w: rand(85, 105), alive: true });
      px += stepXGap + rand(-8, 8);
    }
    // artifact at peak
    artifacts.push({ x: px - stepXGap * 0.5, y: py - 30, alive: true, bob: 0 });
    // descend back — same step count, different x
    py = floorY - 75;
    for (let i = 0; i < steps; i++) {
      py = Math.max(maxH, py - stepYUp);
      platforms.push({ x: px, y: py, w: rand(85, 105), alive: true });
      px += stepXGap + rand(-8, 8);
    }
    platformGen += steps * stepXGap * 1.8;
  } else {
    // GAUNTLET
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      const y  = Math.max(maxH, floorY - rand(80, 190));
      const w  = rand(70, 110);
      const px = baseX + i * rand(140, 200);
      platforms.push({ x: px, y, w, alive: true });
      if (Math.random() < 0.4) {
        guards.push({
          x: px + w * 0.5 - 11, y: y - PLAYER_H,
          w: 22, h: PLAYER_H, alive: true,
          shootTimer: Math.floor(rand(0, 500)),
          platY: y
        });
      }
    }
  }
}

// ── spawners ──────────────────────────────────────────────────────────────────
function spawnBoulder() {
  boulders.push({ x: cw + 40, y: floorY - 22, r: rand(18, 26), angle: 0, alive: true });
}
function spawnSpikePit() {
  spikes.push({ x: cw + 10, w: rand(60, 110), alive: true });
}
function spawnGroundGuard() {
  guards.push({ x: cw + 20, y: floorY - PLAYER_H, w: 22, h: PLAYER_H, alive: true, shootTimer: 0, platY: null });
}
function spawnVine() {
  vines.push({ x: cw + rand(30, 60), y0: 0, len: rand(ch * 0.38, ch * 0.52), angle: -0.4, av: 0, alive: true });
}
function spawnArtifact() {
  artifacts.push({ x: cw + rand(20, 80), y: floorY - rand(50, 120), alive: true, bob: Math.random() * Math.PI * 2 });
}
function spawnGem(x, y) {
  gems.push({ x, y, vy: -4, alive: true });
}

// ── schedule ──────────────────────────────────────────────────────────────────
let nextObstacle, nextCollect, nextVine, nextGuard;
function scheduleNext() {
  const gap = Math.max(80, 220 - level * 8);
  nextObstacle = frame + gap + Math.floor(rand(0, 60));
  nextCollect  = frame + Math.floor(rand(40, 120));
  nextGuard    = frame + Math.floor(rand(150, 280));
  nextVine     = frame + Math.floor(rand(200, 350));
}

// ── init ──────────────────────────────────────────────────────────────────────
function startGame() {
  ov.classList.add('hidden');
  score = 0; frame = 0; level = 1; speed = BASE_SPEED; lives = 3; hitTime = -9999;
  lastFireTime = 0; shootCooldown = FIRE_INTERVAL;
  worldX = 0; platformGen = 0;
  scoreEl.textContent = 0; lvlEl.textContent = 'LEVEL 1';
  updateHearts();
  resize();

  playerX = Math.round(cw * 0.22);
  playerY = floorY - PLAYER_H; prevPlayerY = playerY;
  playerVY = 0; jumpsLeft = 2; sliding = false; slideTimer = 0; swinging = false;

  platforms = []; boulders = []; spikes = []; guards = []; darts = [];
  vines = []; artifacts = []; gems = []; arrows = []; particles = []; floaters = [];

  // pre-seed so screen is never empty at start
  platforms.push({ x: cw * 0.50, y: floorY - 90,  w: 110, alive: true });
  platforms.push({ x: cw * 0.76, y: floorY - 160, w: 90,  alive: true });
  guards.push({ x: cw * 0.72, y: floorY - PLAYER_H, w: 22, h: PLAYER_H, alive: true, shootTimer: 400, platY: null });
  guards.push({ x: cw * 1.30, y: floorY - PLAYER_H, w: 22, h: PLAYER_H, alive: true, shootTimer: 0,   platY: null });
  boulders.push({ x: cw * 0.90, y: floorY - 22, r: 22, angle: 0, alive: true });
  artifacts.push({ x: cw * 0.55, y: floorY - 118, alive: true, bob: 0 });

  scheduleNext();
  running = true; dead = false; waiting = false;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(tick);
}

// ── tick ──────────────────────────────────────────────────────────────────────
function tick() {
  if (!running) return;
  frame++;
  worldX += speed;

  const newLevel = 1 + Math.floor(worldX / 400);
  if (newLevel > level) {
    level = newLevel;
    speed = BASE_SPEED + (level - 1) * 0.28;
    shootCooldown = Math.max(450, FIRE_INTERVAL - level * 40);
    lvlEl.textContent = 'LEVEL ' + level;
    spawnParticles(cw / 2, ch / 2, '#ffd700', 12, 'gold');
  }

  if (worldX > platformGen + 180) {
    platformGen = worldX;
    generatePlatformChunk(cw + 20);
  }

  if (frame >= nextObstacle) {
    const roll = Math.random();
    if (roll < 0.38) spawnBoulder();
    else if (roll < 0.62) spawnSpikePit();
    nextObstacle = frame + Math.max(70, 200 - level * 7) + Math.floor(rand(0, 50));
  }
  if (frame >= nextGuard)   { spawnGroundGuard(); nextGuard   = frame + Math.floor(rand(180, 320)); }
  if (frame >= nextVine)    { spawnVine();         nextVine    = frame + Math.floor(rand(220, 400)); }
  if (frame >= nextCollect) {
    if (Math.random() < 0.4) spawnArtifact();
    else spawnGem(cw + rand(20, 80), floorY - rand(40, 110));
    nextCollect = frame + Math.floor(rand(60, 130));
  }

  updatePhysics();
  updateEntities();
  autoShoot();
  checkCollisions();
  draw();
  if (!dead) animId = requestAnimationFrame(tick);
}

// ── physics ───────────────────────────────────────────────────────────────────
function updatePhysics() {
  if (swinging) {
    vineAV += -0.008 * Math.sin(vineAngle);
    vineAV *= 0.995;
    vineAngle += vineAV;
    playerX = vineX + Math.sin(vineAngle) * vineLen;
    playerY = vineY0 + Math.cos(vineAngle) * vineLen;
    if (Math.abs(vineAngle) > 1.2 || playerY >= floorY - PLAYER_H) releaseVine();
    return;
  }

  if (sliding) { slideTimer++; if (slideTimer > 24) sliding = false; }

  prevPlayerY = playerY;
  playerVY   += GRAVITY;
  playerY    += playerVY;

  const pH       = sliding ? SLIDE_H : PLAYER_H;
  const prevFeet = prevPlayerY + pH;
  const currFeet = playerY + pH;

  // platform landing — crossing top from above while falling
  if (playerVY >= 0) {
    for (const p of platforms) {
      const xOk = playerX + PLAYER_W * 0.5 > p.x && playerX - PLAYER_W * 0.5 < p.x + p.w;
      if (xOk && prevFeet <= p.y + 2 && currFeet >= p.y) {
        playerY = p.y - pH;
        playerVY = 0; jumpsLeft = 2;
        tryGrabVine(); break;
      }
    }
  }

  if (playerY >= floorY - pH) {
    playerY = floorY - pH; playerVY = 0; jumpsLeft = 2; tryGrabVine();
  }
  if (playerY < 0) { playerY = 0; playerVY = 0; }
}

// ── entities ──────────────────────────────────────────────────────────────────
function updateEntities() {
  for (const p of platforms) {
    p.x -= speed;
    if (p.x + p.w < -20) p.alive = false;
  }

  for (const b of boulders) {
    b.x -= speed * 1.1; b.angle += 0.058;
    if (b.x + b.r < 0) b.alive = false;
  }

  for (const s of spikes) {
    s.x -= speed;
    if (s.x + s.w < 0) s.alive = false;
  }

  // guards walk and shoot
  for (const g of guards) {
    g.x -= speed * (g.platY != null ? 0.3 : 0.55);
    if (g.platY != null) {
      // stay on platform, drop if platform scrolled away
      let found = false;
      for (const p of platforms) {
        if (g.x + g.w * 0.5 > p.x && g.x + g.w * 0.5 < p.x + p.w && Math.abs(p.y - g.platY) < 20) {
          g.y = p.y - PLAYER_H; found = true; break;
        }
      }
      if (!found) { g.platY = null; g.y = floorY - PLAYER_H; }
    } else {
      g.y = floorY - PLAYER_H;
    }
    g.shootTimer += 16;
    if (g.shootTimer > shootCooldown) {
      g.shootTimer = 0;
      // slight vertical aim at player
      const dx   = playerX - g.x;
      const dy   = (playerY + PLAYER_H * 0.4) - (g.y + PLAYER_H * 0.38);
      const dist = Math.hypot(dx, dy) || 1;
      darts.push({
        x: g.x - 6, y: g.y + PLAYER_H * 0.38,
        vx: (dx / dist) * DART_SPEED,
        vy: (dy / dist) * DART_SPEED * 0.3,
        alive: true
      });
    }
    if (g.x + g.w < 0) g.alive = false;
  }

  // darts (enemy arrows)
  for (const d of darts) {
    d.x += d.vx; d.y += d.vy;
    if (d.x < -10 || d.x > cw + 10 || d.y > floorY || d.y < 0) d.alive = false;
  }

  // player arrows — arc with gravity
  for (const a of arrows) {
    a.x += ARROW_SPEED;
    a.vy = (a.vy || 0) + 0.055;
    a.y += a.vy;
    if (a.x > cw + 10 || a.y > floorY) { a.alive = false; continue; }
    for (const g of guards) {
      if (!g.alive) continue;
      if (a.x > g.x - 14 && a.x < g.x + g.w + 14 &&
          a.y > g.y && a.y < g.y + g.h) {
        g.alive = false; a.alive = false;
        spawnParticles(g.x + g.w * 0.5, g.y + g.h * 0.5, '#ff6b35', 8, 'hit');
        addScore(25, g.x, g.y);
        break;
      }
    }
  }

  for (const v of vines) {
    v.x -= speed;
    if (!swinging) v.angle = Math.sin(frame * 0.025 + v.x * 0.01) * 0.25;
    if (v.x < -20) v.alive = false;
  }

  for (const a of artifacts) {
    a.x -= speed; a.bob += 0.06;
    if (a.x < -20) a.alive = false;
  }

  for (const g of gems) {
    g.x -= speed; g.vy += 0.3; g.y += g.vy;
    if (g.y > floorY - 8) { g.y = floorY - 8; g.vy = 0; }
    if (g.x < -10) g.alive = false;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.alpha -= 0.032;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy; f.alpha -= 0.025;
    if (f.alpha <= 0) floaters.splice(i, 1);
  }

  platforms = platforms.filter(p => p.alive !== false);
  boulders  = boulders .filter(b => b.alive);
  spikes    = spikes   .filter(s => s.alive);
  guards    = guards   .filter(g => g.alive);
  darts     = darts    .filter(d => d.alive);
  arrows    = arrows   .filter(a => a.alive);
  vines     = vines    .filter(v => v.alive !== false);
  artifacts = artifacts.filter(a => a.alive);
  gems      = gems     .filter(g => g.alive);
}

// ── auto-shoot ────────────────────────────────────────────────────────────────
function autoShoot() {
  const now = Date.now();
  const hasTarget = guards.some(g => g.alive && g.x > playerX && g.x < playerX + cw * 0.7);
  if (hasTarget && now - lastFireTime > shootCooldown) {
    lastFireTime = now;
    const pH = sliding ? SLIDE_H : PLAYER_H;
    arrows.push({ x: playerX + PLAYER_W, y: playerY + pH * 0.32, vy: 0, alive: true });
  }
}

// ── collisions ────────────────────────────────────────────────────────────────
function checkCollisions() {
  if (dead) return;
  const invincible = Date.now() - hitTime < INVINCIBLE_MS;
  const pH  = sliding ? SLIDE_H : PLAYER_H;
  const px1 = playerX - PLAYER_W * 0.5;
  const px2 = playerX + PLAYER_W * 0.5;
  const py1 = playerY;
  const py2 = playerY + pH;

  if (!invincible) {
    for (const g of guards) {
      if (!g.alive) continue;
      const guardTop = g.y;
      const prevFeet = prevPlayerY + pH;
      // STOMP: falling + feet crossing guard's head
      if (playerVY > 1 &&
          prevFeet <= guardTop + 4 &&
          py2 >= guardTop &&
          px2 > g.x - 4 && px1 < g.x + g.w + 4) {
        g.alive = false;
        playerVY = JUMP_VY * 0.55;
        jumpsLeft = 2;
        addScore(75, g.x + g.w * 0.5, g.y - 20);
        spawnParticles(g.x + g.w * 0.5, g.y, '#ff6b35', 10, 'hit');
        spawnParticles(g.x + g.w * 0.5, g.y, '#ffd700', 4, 'gold');
        continue;
      }
      // body = damage
      if (px2 > g.x - 4 && px1 < g.x + g.w + 4 &&
          py2 > g.y + 4  && py1 < g.y + g.h) {
        takeDamage();
      }
    }

    for (const b of boulders) {
      if (Math.hypot(playerX - b.x, (py1 + py2) * 0.5 - b.y) < b.r + PLAYER_W * 0.5) takeDamage();
    }

    for (const d of darts) {
      if (d.x > px1 - 4 && d.x < px2 + 4 && d.y > py1 && d.y < py2) {
        d.alive = false; takeDamage();
      }
    }

    for (const s of spikes) {
      if (playerX > s.x - 4 && playerX < s.x + s.w + 4 && py2 >= floorY - 4) takeDamage();
    }
  }

  for (let i = artifacts.length - 1; i >= 0; i--) {
    const a = artifacts[i];
    if (Math.hypot(playerX - a.x, (py1 + py2) * 0.5 - a.y) < 28) {
      artifacts.splice(i, 1);
      addScore(50, a.x, a.y);
      spawnParticles(a.x, a.y, '#ffd700', 8, 'gold');
    }
  }
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    if (Math.hypot(playerX - g.x, (py1 + py2) * 0.5 - g.y) < 20) {
      gems.splice(i, 1);
      addScore(10, g.x, g.y);
      spawnParticles(g.x, g.y, '#a8ff78', 4, 'gem');
    }
  }
}

// ── death ─────────────────────────────────────────────────────────────────────
function triggerDeath() {
  dead = true; running = false;
  spawnParticles(playerX, playerY, '#ff5555', 14, 'hit');
  spawnParticles(playerX, playerY, '#ffd700', 8, 'gold');
  drawAll();
  if (score > (best || 0)) best = score;
  setTimeout(() => {
    if (score > 0 && typeof ArcadeScores !== 'undefined') {
      ArcadeScores.show({ game: GAME_ID, title: GAME_TITLE, score, accent: ACCENT, onClose: showTitle });
    } else showTitle();
  }, 600);
}

function showTitle() {
  waiting = true; running = false; dead = false;
  ovEmoji.textContent = score > 0 ? '💀🏺' : '🏺🌿';
  ovTitle.textContent = score > 0 ? 'GAME OVER' : 'TOMB HUNT';
  ovsub.innerHTML = score > 0
    ? `You scored <b style="color:var(--ink)">${score}</b>. The temple keeps its secrets.<br>Best: <b style="color:var(--ink)">${best||score}</b>`
    : `Swipe <b>UP</b> to jump · tap again for double jump<br><b>Land on guards</b> to stomp them<br>Collect <b style="color:var(--ink)">artifacts +50</b> · gems +10`;
  board.innerHTML = best ? `Best: <b>${best}</b>` : '';
  playBtn.textContent = score > 0 ? 'TRY AGAIN' : 'INSERT COIN';
  ov.classList.remove('hidden');
  drawIdle();
}

// ── draw ──────────────────────────────────────────────────────────────────────
function drawAll() {
  ctx.clearRect(0, 0, cw, ch);
  drawBg();
  drawPlatforms();
  drawVines();
  drawPitSpikes();
  drawBoulders();
  drawGuards();
  drawDarts();
  drawArrows();
  drawArtifacts();
  drawGems();
  drawGround();
  drawPlayer();
  drawParticles();
  drawFloaters();
}
function draw() { drawAll(); }

// ── background ────────────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle = '#0b0802';
  ctx.fillRect(0, 0, cw, floorY);

  const hg = ctx.createLinearGradient(0, floorY * 0.5, 0, floorY);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(1, 'rgba(130,75,0,0.20)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, cw, floorY);

  // jungle canopy 10% parallax
  const tileW = 180;
  const treeScroll = worldX * 0.10 % tileW;
  ctx.fillStyle = '#0c1e08';
  for (let tx = -treeScroll; tx < cw + tileW; tx += tileW) {
    const th = ch * 0.30;
    ctx.beginPath(); ctx.arc(tx + 18,  floorY - th,      32, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx + 68,  floorY - th - 18, 40, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx + 118, floorY - th + 6,  28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx + 152, floorY - th - 8,  22, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(tx + 14,  floorY - th + 18, 8,  th - 18);
    ctx.fillRect(tx + 64,  floorY - th + 18, 10, th - 18);
    ctx.fillRect(tx + 114, floorY - th + 20, 7,  th - 20);
    ctx.fillRect(tx + 148, floorY - th + 14, 6,  th - 14);
  }

  // temple pillars 24% parallax
  const pillarW = 200;
  const pillarScroll = worldX * 0.24 % pillarW;
  const pillarH = Math.min(floorY * 0.68, 200);
  for (let px = -(pillarScroll % pillarW); px < cw + pillarW; px += pillarW) {
    ctx.fillStyle = '#1c1006';
    ctx.fillRect(px - 16, floorY - pillarH, 32, pillarH);
    ctx.fillStyle = '#0d0803';
    ctx.fillRect(px - 6, floorY - pillarH + 12, 12, pillarH - 12);
    ctx.fillStyle = '#281808';
    ctx.fillRect(px - 24, floorY - pillarH - 16, 48, 18);
    ctx.fillRect(px - 18, floorY - pillarH - 24, 36, 10);
    const flicker = 0.7 + 0.3 * Math.sin(frame * 0.13 + px * 0.05);
    const tY = floorY - pillarH - 34;
    ctx.save();
    ctx.globalAlpha = 0.65 * flicker;
    const tg = ctx.createRadialGradient(px, tY, 1, px, tY, 26);
    tg.addColorStop(0, '#ffdd55');
    tg.addColorStop(0.45, 'rgba(255,100,10,0.5)');
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(px, tY, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ── platforms (stone ledges) ──────────────────────────────────────────────────
function drawPlatforms() {
  for (const p of platforms) {
    ctx.fillStyle = '#2a1a08';
    ctx.fillRect(p.x, p.y, p.w, PLAT_H);
    ctx.fillStyle = '#503020'; ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillStyle = '#6a4228'; ctx.fillRect(p.x, p.y, p.w, 2);
    ctx.fillStyle = '#8a5a34'; ctx.fillRect(p.x, p.y, p.w, 1);
    ctx.fillStyle = '#1a0e04';
    for (let sx = p.x + 30; sx < p.x + p.w - 4; sx += 30) {
      ctx.fillRect(sx, p.y + 3, 2, PLAT_H - 3);
    }
    ctx.fillStyle = '#100804';
    ctx.fillRect(p.x + 3, p.y + PLAT_H - 2, p.w - 6, 3);
    // hanging moss
    ctx.fillStyle = '#2d5a1e';
    for (let vx = p.x + 10; vx < p.x + p.w - 6; vx += 18) {
      const vl = 6 + Math.sin(vx * 0.28 + frame * 0.018) * 3;
      ctx.fillRect(vx, p.y + PLAT_H, 3, Math.round(vl));
    }
  }
}

// ── ground ────────────────────────────────────────────────────────────────────
function drawGround() {
  ctx.fillStyle = '#060f04'; ctx.fillRect(0, floorY, cw, GROUND_H);
  ctx.fillStyle = '#0e2009'; ctx.fillRect(0, floorY, cw, Math.round(GROUND_H * 0.55));
  ctx.fillStyle = '#28601a'; ctx.fillRect(0, floorY, cw, 4);
  ctx.fillStyle = '#3a8022'; ctx.fillRect(0, floorY, cw, 2);
  ctx.fillStyle = '#55aa30'; ctx.fillRect(0, floorY, cw, 1);
  const tileW = 44, seam = worldX % tileW;
  ctx.fillStyle = '#081404';
  for (let tx = -seam % tileW; tx < cw + tileW; tx += tileW) {
    ctx.fillRect(tx, floorY + 5, 2, Math.round(GROUND_H * 0.5));
  }
  ctx.fillRect(0, floorY + Math.round(GROUND_H * 0.50), cw, 1);
}

// ── vines ─────────────────────────────────────────────────────────────────────
function drawVines() {
  for (const v of vines) {
    const angle = swinging && v.x === vineX ? vineAngle : v.angle;
    ctx.save();
    ctx.strokeStyle = '#2d5a1e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.setLineDash([8, 5]);
    ctx.beginPath(); ctx.moveTo(v.x, v.y0);
    for (let i = 1; i <= 8; i++) {
      const t = i / 8;
      ctx.lineTo(v.x + Math.sin(angle * t) * v.len * t,
                 v.y0 + Math.cos(angle * t) * v.len * t);
    }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#3a7a2a';
    for (let i = 0; i < 3; i++) {
      const t = 0.25 + i * 0.25;
      const lx = v.x + Math.sin(angle * t) * v.len * t;
      const ly = v.y0 + Math.cos(angle * t) * v.len * t;
      ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(lx - 7, ly, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── boulders ──────────────────────────────────────────────────────────────────
function drawBoulders() {
  for (const b of boulders) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle);
    const gr = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, b.r * 0.1, 0, 0, b.r);
    gr.addColorStop(0, '#8a7a6a'); gr.addColorStop(1, '#3a2a1a');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-b.r * 0.2, -b.r * 0.5); ctx.lineTo(b.r * 0.1, b.r * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.r * 0.3, -b.r * 0.3); ctx.lineTo(-b.r * 0.1, b.r * 0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(2, b.r + 5, b.r * 0.7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ── spike pits ────────────────────────────────────────────────────────────────
function drawPitSpikes() {
  for (const s of spikes) {
    ctx.fillStyle = '#050503';
    ctx.fillRect(s.x, floorY, s.w, GROUND_H);
    ctx.fillRect(s.x, floorY - 6, s.w, 8);
    ctx.fillStyle = '#8a7060';
    const numSpikes = Math.floor(s.w / 14);
    for (let i = 0; i < numSpikes; i++) {
      const sx = s.x + 7 + i * 14;
      ctx.beginPath(); ctx.moveTo(sx - 5, floorY + 4); ctx.lineTo(sx, floorY - 10); ctx.lineTo(sx + 5, floorY + 4); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 2;
    ctx.strokeRect(s.x, floorY - 6, s.w, GROUND_H + 6);
  }
}

// ── guards ────────────────────────────────────────────────────────────────────
function drawGuards() {
  for (const g of guards) {
    const wa    = frame * 0.13;
    const baseY = g.y + PLAYER_H;
    ctx.save();
    ctx.translate(g.x + g.w / 2, baseY);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(-6 + Math.sin(wa) * 9, -14 + 14 + Math.cos(wa) * 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6,  -14); ctx.lineTo(6  - Math.sin(wa) * 9, -14 + 14 - Math.cos(wa) * 5); ctx.stroke();
    ctx.fillStyle = '#1e0e04';
    ctx.fillRect(-12 + Math.sin(wa) * 9, -2, 14, 7);
    ctx.fillRect(4   - Math.sin(wa) * 9, -2, 14, 7);

    ctx.fillStyle = '#3a2010'; ctx.fillRect(-12, -46, 24, 32);
    ctx.fillStyle = '#5a3820'; ctx.fillRect(-10, -44, 20, 10);
    ctx.fillStyle = '#281408'; ctx.fillRect(-12, -24, 24, 6);
    ctx.fillStyle = '#c8a020'; ctx.fillRect(-4,  -24, 8,  6);

    ctx.fillStyle = '#281408';
    ctx.fillRect(-18, -46, 10, 10); ctx.fillRect(8, -46, 10, 10);
    ctx.fillStyle = '#5a3820';
    ctx.fillRect(-15, -43, 4, 4); ctx.fillRect(11, -43, 4, 4);

    ctx.fillStyle = '#7a5830'; ctx.fillRect(-5, -52, 10, 8);
    ctx.beginPath(); ctx.arc(0, -58, 13, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1e1008';
    ctx.beginPath(); ctx.arc(0, -60, 14, Math.PI, 0); ctx.fill();
    ctx.fillRect(-14, -66, 28, 8); ctx.fillRect(-17, -62, 34, 5);

    ctx.fillStyle = '#cc1111'; ctx.fillRect(-9, -62, 18, 5);
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff2222'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(-5, -60, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,  -60, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#483020'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-12, -38); ctx.lineTo(-28, -36); ctx.stroke();
    ctx.fillStyle = '#181818'; ctx.fillRect(-40, -40, 18, 9); ctx.fillRect(-30, -38, 8, 12);
    ctx.fillStyle = '#0e0e0e'; ctx.fillRect(-44, -38, 8, 5);

    if (g.shootTimer < 80) {
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - g.shootTimer / 80);
      ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(-50, -36, 7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.strokeStyle = '#483020'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(12, -38); ctx.lineTo(16, -22); ctx.stroke();

    ctx.restore();
  }
}

// ── darts (enemy arrows — aimed) ──────────────────────────────────────────────
function drawDarts() {
  for (const d of darts) {
    const ang = Math.atan2(d.vy, d.vx);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(ang);
    ctx.strokeStyle = '#a07828'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.fillStyle = '#d4a840';
    ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(1, -3); ctx.lineTo(1, 3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#cc2222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-7, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-7,  5); ctx.stroke();
    ctx.restore();
  }
}

// ── player arrows (arc) ────────────────────────────────────────────────────────
function drawArrows() {
  for (const a of arrows) {
    const ang = Math.atan2(a.vy || 0, ARROW_SPEED);
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(ang);
    ctx.strokeStyle = '#a07828'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(3, 0); ctx.stroke();
    ctx.fillStyle = '#d4a840';
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(0, -3.5); ctx.lineTo(0, 3.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#cc2222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-9, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-9,  5); ctx.stroke();
    ctx.restore();
  }
}

// ── artifacts ─────────────────────────────────────────────────────────────────
function drawArtifacts() {
  for (const a of artifacts) {
    const ay = a.y + Math.sin(a.bob) * 5;
    ctx.save();
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffd700';
    ctx.fillRect(a.x - 6, ay - 12, 12, 16);
    ctx.beginPath(); ctx.arc(a.x, ay - 12, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#b8860b'; ctx.fillRect(a.x - 8, ay + 4, 16, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(a.x - 2, ay - 14, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ── gems ──────────────────────────────────────────────────────────────────────
function drawGems() {
  for (const g of gems) {
    ctx.save(); ctx.translate(g.x, g.y);
    ctx.shadowColor = '#a8ff78'; ctx.shadowBlur = 8; ctx.fillStyle = '#a8ff78';
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(3, -2); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ── player ────────────────────────────────────────────────────────────────────
function drawPlayer() {
  if (dead) return;
  const invincible = Date.now() - hitTime < INVINCIBLE_MS;
  if (invincible && Math.floor(Date.now() / 80) % 2 === 0) return;

  const pH      = sliding ? SLIDE_H : PLAYER_H;
  const pfl     = frame * 0.18;
  const shooting = arrows.length > 0;

  ctx.save();
  ctx.translate(playerX, playerY + pH);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

  if (!sliding) {
    ctx.strokeStyle = '#5a3010'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, -10); ctx.lineTo(-3 + Math.sin(pfl) * 7, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,  -10); ctx.lineTo(3  - Math.sin(pfl) * 7, 0); ctx.stroke();
    ctx.fillStyle = '#3a1a0a';
    ctx.fillRect(-7 + Math.sin(pfl) * 7, -1, 8, 5);
    ctx.fillRect(3  - Math.sin(pfl) * 7, -1, 8, 5);

    ctx.fillStyle = '#6b8a3a'; ctx.fillRect(-7, -pH + 12, 14, pH - 22);

    ctx.strokeStyle = '#5a7830'; ctx.lineWidth = 5;
    if (shooting) {
      ctx.beginPath(); ctx.moveTo(6, -pH + 18); ctx.lineTo(20, -pH + 22); ctx.stroke();
      // bow
      ctx.strokeStyle = '#8b5e3c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(22, -pH + 22, 8, -0.8, 0.8); ctx.stroke();
      if (Math.floor(Date.now() / 80) % 2 === 0) {
        ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(24, -pH + 22, 3, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    } else {
      ctx.beginPath(); ctx.moveTo(6,  -pH + 18); ctx.lineTo(6  + Math.cos(pfl) * 8, -pH + 18 + Math.sin(pfl) * 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, -pH + 18); ctx.lineTo(-6 - Math.cos(pfl) * 8, -pH + 18 - Math.sin(pfl) * 6); ctx.stroke();
    }

    ctx.fillStyle = '#c49a6c';
    ctx.beginPath(); ctx.arc(0, -pH + 10, 9, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4a2800';
    ctx.fillRect(-9, -pH + 8, 18, 5);
    ctx.beginPath(); ctx.arc(0, -pH + 8, 9, Math.PI, 0); ctx.fill();

    const bsw = playerVY < -2 ? -0.28 : playerVY > 2 ? 0.18 : 0;
    ctx.strokeStyle = '#8b5e3c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-2, -pH + 6);
    ctx.quadraticCurveTo(-12 + bsw * 14, -pH + 14, -14 + bsw * 19, -pH + 22);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#6b8a3a'; ctx.fillRect(-14, -SLIDE_H + 2, 28, SLIDE_H - 4);
    ctx.fillStyle = '#c49a6c';
    ctx.beginPath(); ctx.arc(12, -SLIDE_H + 7, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a2800'; ctx.fillRect(6, -SLIDE_H + 5, 12, 5);
    ctx.beginPath(); ctx.arc(12, -SLIDE_H + 5, 6, Math.PI, 0); ctx.fill();
  }
  ctx.restore();
}

// ── particles / floaters ──────────────────────────────────────────────────────
function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.col;
    if (p.r > 3) { ctx.shadowColor = p.col; ctx.shadowBlur = 6; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function drawFloaters() {
  for (const f of floaters) {
    ctx.save(); ctx.globalAlpha = f.alpha;
    ctx.font = 'bold 18px "Barlow Condensed",sans-serif';
    ctx.fillStyle = f.col; ctx.textAlign = 'center';
    ctx.shadowColor = f.col; ctx.shadowBlur = 8;
    ctx.fillText(f.txt, f.x, f.y); ctx.restore();
  }
}

// ── idle screen ───────────────────────────────────────────────────────────────
function drawIdle() {
  resize();
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#0b0802'; ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = '#060f04'; ctx.fillRect(0, ch - GROUND_H - CELL, cw, GROUND_H + CELL);
  ctx.fillStyle = '#55aa30'; ctx.fillRect(0, ch - GROUND_H - CELL, cw, 1);
  const ax = cw / 2, ay = ch * 0.42;
  ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 22;
  ctx.fillRect(ax - 12, ay - 14, 24, 20);
  ctx.beginPath(); ctx.arc(ax, ay - 14, 14, Math.PI, 0); ctx.fill();
  ctx.shadowBlur = 0;
}

// ── boot ──────────────────────────────────────────────────────────────────────
resize();
requestAnimationFrame(() => resize());
best = parseInt(localStorage.getItem('th_best') || '0', 10) || 0;
showTitle();
document.addEventListener('visibilitychange', () => { if (document.hidden && best) localStorage.setItem('th_best', best); });
window.addEventListener('beforeunload', () => { if (best) localStorage.setItem('th_best', best); });
</script>
