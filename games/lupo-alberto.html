<style>
*{margin:0;padding:0;box-sizing:border-box}

canvas{position:fixed;top:0;left:0;display:block}
#rotate{
  display:none;position:fixed;inset:0;background:#1a0d00;z-index:99;
  flex-direction:column;align-items:center;justify-content:center;
  color:#e8b84b;font-family:Bungee,sans-serif;gap:18px;text-align:center;
}
#rotate span{font-size:58px;animation:sp 2s ease-in-out infinite alternate}
@keyframes sp{to{transform:rotate(90deg)}}
@media(orientation:portrait){#rotate{display:flex}canvas{display:none}}

<body>
<!-- ═══════════════════════════════════════════════════════════════════
     LUPO ALBERTO v3.0 — JnJ Arcade Training Cabinet
     Source: Lupo Alberto (Idea Software, C64, 1990)

     ── SCROLLING WORLD TEMPLATE ──────────────────────────────────────
     World: WW=5000 × WH=720 (absolute px units)
     Camera: lerp 0.13 soft-follow, clamped to world bounds
     Rendering: world ctx.save()/translate(-cam.x,-cam.y) then restore for HUD

     ── PHYSICS ───────────────────────────────────────────────────────
     GRAVITY=0.40  JUMP=13.0  SPEED=3.8  TERM_VEL=14  FRICTION=0.72
     AABB top-face: prevY+h <= pl.y+2 AND y+h >= pl.y
     prevY stored BEFORE y+=vy each frame

     ── MOSES CHASE AI ────────────────────────────────────────────────
     Accelerates toward player X up to MSPD (scales per level)
     Jumps when: grounded + player 70px above + within 350px X + rand<0.025
     Unstuck: grounded + |vx|<0.4 + |mdx|>80 → jump

     ── CONTROLS (landscape) ──────────────────────────────────────────
     Left 48% = joystick (drag ≥ DEADZONE=24 px from touch-base)
     Right 48% = jump button (grounded only, tap = jump)
     Centre 4% = dead band
     Multi-touch: separate touch.identifier per zone

     ── RESKIN CHECKLIST ──────────────────────────────────────────────
     1. drawLupo()   — sprite inside PW=24×PH=32 box
     2. drawMoses()  — sprite inside EW=34×EH=28 box
     3. drawMarta()  — goal sprite on martaPl()
     4. drawBg()     — parallax sky/hills (screen-space)
     5. PCOL{}       — platform fill/trim/stripe colours
     6. PLAT_DEF[]   — world platform positions
     Physics, AI, camera, controls, HUD: untouched
     ═══════════════════════════════════════════════════════════════════ -->

<div id="rotate"><span>📱</span><p style="font-family:Bungee,sans-serif;font-size:18px">ROTATE PHONE</p></div>
<canvas id="c"></canvas>

<script>
'use strict';
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');

// ── Physics ───────────────────────────────────────────────────────────────────
const GRAVITY=0.40, JUMP=13.0, SPEED=3.8, TERM_VEL=14, FRICTION=0.72, DEADZONE=24;

// ── World ─────────────────────────────────────────────────────────────────────
const WW=5000, WH=720, GY=692;   // world size, ground top-y

// ── Sprite bounds ─────────────────────────────────────────────────────────────
const PW=24, PH=32;   // Lupo
const EW=34, EH=28;   // Moses

// ── Platform colour palette ───────────────────────────────────────────────────
const PCOL={
  ground:{fill:'#3a7e2a',dirt:'#7a4e22'},
  hay:   {fill:'#e8b84b',trim:'#5ab04a',stripe:'#c89a20'},
  wood:  {fill:'#7a4e22',trim:'#5ab04a',stripe:'#5a3810'},
  fence: {fill:'#9b7b4e',trim:'#5ab04a',stripe:'#7a6040'},
};

// ── Platform layout (world coords) ───────────────────────────────────────────
// Zigzag path: bottom-left → top-right across 5 zones, 4 height rows
// rows: ground≈692, R1≈530, R2≈372, R3≈208, R4≈62
const PLAT_DEF=[
  //  x     y    w    h   type
  [    0,  GY, WW,  36, 'ground'],   // ground — full width

  // Zone 1: Farm entrance (x 0–900)
  [   70, 532, 240, 14, 'hay'  ],    // P01
  [  360, 416, 200, 14, 'wood' ],    // P02
  [  580, 290, 180, 14, 'fence'],    // P03
  [  100, 196, 210, 14, 'hay'  ],    // P04 high-left

  // Zone 2: Open field (x 900–1800)
  [  880, 538, 220, 14, 'hay'  ],    // P05
  [ 1110, 404, 200, 14, 'wood' ],    // P06
  [ 1330, 274, 210, 14, 'fence'],    // P07
  [ 1040, 144, 230, 14, 'hay'  ],    // P08 high

  // Zone 3: Barn (x 1800–2700)
  [ 1810, 532, 220, 14, 'wood' ],    // P09
  [ 2040, 402, 220, 14, 'wood' ],    // P10
  [ 1840, 264, 220, 14, 'fence'],    // P11
  [ 2060, 136, 210, 14, 'hay'  ],    // P12 barn roof

  // Zone 4: Deep farm (x 2700–3700)
  [ 2710, 542, 220, 14, 'hay'  ],    // P13
  [ 2950, 410, 200, 14, 'wood' ],    // P14
  [ 2730, 272, 220, 14, 'fence'],    // P15
  [ 2960, 144, 210, 14, 'hay'  ],    // P16

  // Zone 5: Approach (x 3700–4800)
  [ 3720, 546, 200, 14, 'hay'  ],    // P17
  [ 3940, 414, 200, 14, 'wood' ],    // P18
  [ 4160, 282, 200, 14, 'fence'],    // P19
  [ 4390, 158, 200, 14, 'fence'],    // P20

  // Marta's perch (win platform)
  [ 4660,  62, 310, 14, 'hay'  ],    // P21
];

let PLATS=[], HEARTS=[], POPS=[];

function buildLevel(lv){
  PLATS=PLAT_DEF.map(d=>({x:d[0],y:d[1],w:d[2],h:d[3],type:d[4]}));
  HEARTS=[];
  // One heart per platform, skip ground (idx 0) and Marta's perch (last)
  for(let i=1;i<PLATS.length-1;i++){
    const pl=PLATS[i];
    HEARTS.push({x:pl.x+pl.w/2-8, y:pl.y-22, got:false, idx:i});
  }
  POPS=[];
  resetPlayer();
  resetMoses(lv);
  cam.x=0; cam.y=0;
}

// ── Entity state ──────────────────────────────────────────────────────────────
const p={x:0,y:0,vx:0,vy:0,grounded:false,prevY:0,facing:1,walk:0,inv:0};
const ms={x:0,y:0,vx:0,vy:0,grounded:false,prevY:0,facing:1,walk:0};

let score=0,lives=3,level=1,timer=90,timerMs=0;
let state='ATTRACT',deathTimer=0,clearTimer=0,attractTick=0,gts=0;

let W=1,H=1;
const cam={x:0,y:0};

function resetPlayer(){
  p.x=80;p.y=GY-PH;p.vx=0;p.vy=0;p.grounded=true;p.facing=1;p.walk=0;p.inv=140;
}
function resetMoses(lv){
  ms.x=340;ms.y=GY-EH;ms.vx=0;ms.vy=0;ms.grounded=true;ms.facing=1;ms.walk=0;
}
const martaPl=()=>PLATS[PLATS.length-1];
const nHeart=()=>HEARTS.filter(h=>!h.got).length;

// ── AABB top-face platform collision ─────────────────────────────────────────
function moveEnt(e,ew,eh){
  e.vy=Math.min(e.vy+GRAVITY,TERM_VEL);
  e.prevY=e.y; e.x+=e.vx; e.y+=e.vy;
  e.x=Math.max(0,Math.min(WW-ew,e.x));
  if(e.y>WH+200){e.y=GY-eh;e.vy=0;e.grounded=true;}
  e.grounded=false;
  for(const pl of PLATS){
    if(e.x+ew<=pl.x+2||e.x+2>=pl.x+pl.w) continue;
    if(e.prevY+eh<=pl.y+2&&e.y+eh>=pl.y){e.y=pl.y-eh;e.vy=0;e.grounded=true;}
  }
}

// ── Input state ───────────────────────────────────────────────────────────────
const js={active:false,id:-1,dx:0,_bx:0};
const jb={active:false,id:-1,pressed:false};

function zoneOf(cx){
  const r=canvas.getBoundingClientRect(),x=(cx-r.left)/r.width*W;
  return x<W*0.48?'L':x>W*0.52?'R':'C';
}
function txOf(t){return (t.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width*W;}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(state==='ATTRACT'){startGame();return;}
    if(state==='GAMEOVER'){endGame();return;}
    const z=zoneOf(t.clientX);
    if(z==='L'&&!js.active){js.active=true;js.id=t.identifier;js.dx=0;js._bx=txOf(t);}
    else if(z==='R'&&!jb.active){jb.active=true;jb.id=t.identifier;if(p.grounded)jb.pressed=true;}
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)
    if(js.active&&t.identifier===js.id) js.dx=txOf(t)-js._bx;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(js.active&&t.identifier===js.id){js.active=false;js.dx=0;}
    if(jb.active&&t.identifier===jb.id){jb.active=false;}
  }
},{passive:false});
canvas.addEventListener('touchcancel',()=>{js.active=false;js.dx=0;jb.active=false;},{passive:false});

window.addEventListener('keydown',e=>{
  if(state==='ATTRACT'){startGame();return;}
  if(state==='GAMEOVER'){endGame();return;}
  if(e.key==='ArrowLeft'||e.key==='a'){js.active=true;js.dx=-60;}
  if(e.key==='ArrowRight'||e.key==='d'){js.active=true;js.dx=60;}
  if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&p.grounded)jb.pressed=true;
  e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d'){js.active=false;js.dx=0;}
});

// ── Game update ───────────────────────────────────────────────────────────────
function update(dt){
  // Lupo movement
  const L=js.active&&js.dx<-DEADZONE, R=js.active&&js.dx>DEADZONE;
  if(L&&!R){p.vx=-SPEED;p.facing=-1;}
  else if(R&&!L){p.vx=SPEED;p.facing=1;}
  else p.vx*=FRICTION;
  if(jb.pressed&&p.grounded){p.vy=-JUMP;p.grounded=false;}
  jb.pressed=false;
  if(Math.abs(p.vx)>0.5)p.walk++;
  if(p.inv>0)p.inv--;
  moveEnt(p,PW,PH);

  // Moses chase
  const MSPD=1.7+(level-1)*0.28;
  const mdx=p.x-ms.x;
  if(mdx>8){ms.vx=Math.min(ms.vx+0.35,MSPD);ms.facing=1;}
  else if(mdx<-8){ms.vx=Math.max(ms.vx-0.35,-MSPD);ms.facing=-1;}
  else ms.vx*=0.82;
  ms.walk++;
  if(ms.grounded&&p.y<ms.y-70&&Math.abs(mdx)<350&&Math.random()<0.025){ms.vy=-JUMP*0.82;ms.grounded=false;}
  if(ms.grounded&&Math.abs(ms.vx)<0.4&&Math.abs(mdx)>80){ms.vy=-JUMP*0.72;ms.grounded=false;}
  moveEnt(ms,EW,EH);

  // Collect hearts
  for(const h of HEARTS){
    if(h.got)continue;
    if(Math.abs(p.x+PW/2-(h.x+8))<26&&Math.abs(p.y+PH/2-(h.y+8))<26){
      h.got=true;score+=100;pop(h.x+8,h.y,'#ff3355');
    }
  }

  // Moses collision
  if(p.inv<=0){
    if(Math.abs(p.x+PW/2-(ms.x+EW/2))<(PW+EW)/2-6&&Math.abs(p.y+PH/2-(ms.y+EH/2))<(PH+EH)/2-6)
      killPlayer();
  }

  // Timer (real ms)
  timerMs+=dt;
  timer=Math.max(0,90-Math.floor(timerMs/1000));
  if(timer<=0)killPlayer();

  // Win condition
  if(nHeart()===0){
    const mp=martaPl();
    if(p.x+PW>mp.x&&p.x<mp.x+mp.w&&p.prevY+PH<=mp.y+2&&p.y+PH>=mp.y){
      state='CLEAR';clearTimer=180;score+=500+timer*10+lives*100;pop(p.x+PW/2,p.y,'#ffffaa');
    }
  }

  // Camera soft-follow
  cam.x+=(Math.max(0,Math.min(WW-W,p.x-W/2))-cam.x)*0.13;
  cam.y+=(Math.max(0,Math.min(WH-H,p.y-H*0.52))-cam.y)*0.13;

  // Particles
  for(let i=POPS.length-1;i>=0;i--){
    const pt=POPS[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.14;pt.life-=0.032;
    if(pt.life<=0)POPS.splice(i,1);
  }
}

function killPlayer(){
  lives--;pop(p.x+PW/2,p.y+PH/2,'#ff8800');
  if(lives<=0){state='GAMEOVER';return;}
  state='DEAD';deathTimer=95;timer=90;timerMs=0;
}
function pop(x,y,color){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*4;
    POPS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:1,color});
  }
}

function tickStates(){
  if(state==='DEAD'){if(--deathTimer<=0){resetPlayer();resetMoses(level);state='PLAYING';timerMs=0;}}
  if(state==='CLEAR'){if(--clearTimer<=0){level++;buildLevel(level);state='PLAYING';timerMs=0;}}
  if(state==='ATTRACT'||state==='GAMEOVER')attractTick++;
}

// ── Attract auto-walk ─────────────────────────────────────────────────────────
function attractUpdate(){
  attractTick++;
  p.vx=1.9;p.facing=1;p.walk++;
  p.vy=Math.min(p.vy+GRAVITY,TERM_VEL);
  p.prevY=p.y;p.y+=p.vy;p.x+=p.vx;
  p.grounded=false;
  for(const pl of PLATS){
    if(p.x+PW>pl.x&&p.x<pl.x+pl.w&&p.prevY+PH<=pl.y+2&&p.y+PH>=pl.y){
      p.y=pl.y-PH;p.vy=0;p.grounded=true;
    }
  }
  if(p.grounded&&(p.x>W*1.0||Math.random()<0.015)){p.vy=-JUMP*0.76;p.grounded=false;}
  if(p.x>WW){p.x=0;p.y=GY-PH;p.vy=0;}
  cam.x+=(Math.max(0,p.x-W/2)-cam.x)*0.09;cam.y=0;
  ms.x+=0.9;ms.walk++;if(ms.x>WW)ms.x=0;
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();                           // screen-space parallax bg

  ctx.save();
  ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  drawPlatforms();
  drawHearts();
  drawMarta();
  drawMosesSprite();
  drawLupoSprite();
  for(const pt of POPS){             // particles in world-space
    ctx.globalAlpha=pt.life;ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,4*pt.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();                      // back to screen-space

  drawHUD();
  drawControls();
  drawOverlays();
}

// Parallax background (all screen-space)
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#47a8ff');g.addColorStop(0.65,'#c8eaff');g.addColorStop(1,'#9ed870');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Sun
  ctx.fillStyle='#fffb8a';ctx.beginPath();ctx.arc(W*0.85,H*0.1,H*0.06,0,Math.PI*2);ctx.fill();
  // Clouds (0.12x parallax)
  ctx.fillStyle='rgba(255,255,255,0.90)';
  const co=cam.x*0.12;
  [[W*0.08,H*0.09,1.0],[W*0.32,H*0.06,0.9],[W*0.60,H*0.11,1.1],[W*0.82,H*0.07,0.8]].forEach(cl=>{
    const cx=(cl[0]-co%W+W*1.5)%W; cloud(cx,cl[1],cl[2]*H*0.055);
  });
  // Rolling hills (0.32x)
  ctx.fillStyle='#5cb84a';
  const ho=cam.x*0.32;
  ctx.beginPath();ctx.moveTo(0,H*0.76);
  for(let x=0;x<=W+60;x+=50)
    ctx.lineTo(x,H*0.76+Math.sin((x+ho)*0.0038)*H*0.11+Math.sin((x+ho)*0.010)*H*0.04);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // Distant trees (0.5x)
  ctx.fillStyle='#3d9030';
  const to=(cam.x*0.5)%180;
  for(let tx=-to;tx<W+60;tx+=180){
    ctx.beginPath();ctx.arc(tx,H*0.73,H*0.055,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(tx+24,H*0.75,H*0.042,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3810';ctx.fillRect(tx-3,H*0.775,6,H*0.05);ctx.fillStyle='#3d9030';
  }
}
function cloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r*1.3,y-r*0.28,r*0.78,0,Math.PI*2);
  ctx.arc(x-r*0.85,y+r*0.1,r*0.68,0,Math.PI*2);ctx.fill();
}

function drawPlatforms(){
  for(const pl of PLATS){
    const {x,y,w,h,type}=pl,c=PCOL[type];
    if(type==='ground'){
      ctx.fillStyle=c.fill;ctx.fillRect(x,y,w,6);
      ctx.fillStyle=c.dirt;ctx.fillRect(x,y+6,w,h-6);
      ctx.fillStyle='#5ab04a';
      for(let gx=x+6;gx<x+w;gx+=18){ctx.fillRect(gx,y-3,3,5);ctx.fillRect(gx+6,y-2,2,4);}
      continue;
    }
    ctx.fillStyle=c.fill;ctx.fillRect(x,y,w,h);
    ctx.fillStyle=c.trim;ctx.fillRect(x,y,w,4);   // grass trim
    ctx.fillStyle=c.stripe;ctx.globalAlpha=0.35;
    const st=type==='hay'?9:type==='wood'?14:11;
    for(let sx=x+st;sx<x+w;sx+=st)ctx.fillRect(sx,y+1,1,h-2);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,0.16)';ctx.fillRect(x,y+h,w,4);
  }
}

function drawHearts(){
  for(const h of HEARTS){
    if(h.got)continue;
    const {x,y}=h,s=9,pulse=1+0.08*Math.sin(attractTick*0.15+h.idx);
    ctx.save();ctx.translate(x+s,y+s);ctx.scale(pulse,pulse);
    ctx.fillStyle='#ff2244';
    ctx.beginPath();
    ctx.moveTo(0,s*0.35);
    ctx.bezierCurveTo(0,0,s*0.85,0,s*0.85,s*0.45);
    ctx.bezierCurveTo(s*0.85,s*0.95,0,s*1.22,0,s*1.55);
    ctx.bezierCurveTo(0,s*1.22,-s*0.85,s*0.95,-s*0.85,s*0.45);
    ctx.bezierCurveTo(-s*0.85,0,0,0,0,s*0.35);
    ctx.fill();
    ctx.fillStyle='rgba(255,180,180,0.7)';ctx.fillRect(-3,-3,4,4);
    ctx.restore();
  }
}

function drawMarta(){
  const mp=martaPl(),gx=mp.x+mp.w-46,gy=mp.y-38;
  const unlocked=nHeart()===0;
  ctx.save();ctx.translate(gx,gy);ctx.globalAlpha=unlocked?1:0.35;
  // Body
  ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.ellipse(16,22,13,14,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.arc(20,9,10,0,Math.PI*2);ctx.fill();
  // Comb
  ctx.fillStyle='#cc2222';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(15+i*4,2,4-i,Math.PI,0);ctx.fill();}
  // Beak
  ctx.fillStyle='#f5a623';ctx.beginPath();ctx.moveTo(29,9);ctx.lineTo(37,11);ctx.lineTo(29,13);ctx.closePath();ctx.fill();
  // Eye
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(25,8,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(26,7,1,0,Math.PI*2);ctx.fill();
  // Wing
  ctx.fillStyle='#e5e5e0';ctx.beginPath();ctx.ellipse(8,22,7,11,-0.4,0,Math.PI*2);ctx.fill();
  if(unlocked){
    const py=2+3*Math.abs(Math.sin(attractTick*0.09));
    ctx.fillStyle='#ffdd44';ctx.font='bold 12px Bungee,sans-serif';
    ctx.textAlign='center';ctx.fillText('MARTA!',16,-6-py);ctx.textAlign='left';
  }
  ctx.globalAlpha=1;ctx.restore();
}

// ── Lupo Alberto sprite ───────────────────────────────────────────────────────
function drawLupoSprite(){
  if(state==='DEAD'&&deathTimer%8<4)return;
  if(p.inv>0&&p.inv%6<3)return;
  const fl=p.facing<0,fr=Math.floor(p.walk/5)%4;
  ctx.save();ctx.translate(p.x+(fl?PW:0),p.y);if(fl)ctx.scale(-1,1);
  // Shoes
  ctx.fillStyle='#3a2208';
  ctx.fillRect(2,PH-(fr<2?5:8),9,5);ctx.fillRect(PW-11,PH-(fr<2?8:5),9,5);
  // Legs
  ctx.fillStyle='#1a44bb';
  ctx.fillRect(3,PH-16,8,fr<2?16:12);ctx.fillRect(PW-11,PH-16,8,fr<2?12:16);
  // Overalls bib
  ctx.fillStyle='#2255cc';rR(ctx,3,13,PW-6,PH-14,3);ctx.fill();
  // Suspenders
  ctx.fillStyle='#1633aa';ctx.fillRect(6,12,3,9);ctx.fillRect(PW-9,12,3,9);
  // Torso
  ctx.fillStyle='#c0c0c0';rR(ctx,4,9,PW-8,10,2);ctx.fill();
  // Head
  ctx.fillStyle='#c8c8c8';rR(ctx,2,2,PW-4,14,5);ctx.fill();
  // Snout
  ctx.fillStyle='#ddd';rR(ctx,PW-14,7,14,9,3);ctx.fill();
  // Nose
  ctx.fillStyle='#333';rR(ctx,PW-9,8,7,3,1);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(PW-8,9,2,2);ctx.fillRect(PW-5,9,2,2);
  // Eye
  ctx.fillStyle='#fff';rR(ctx,4,4,9,7,2);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(8,6,4,4);
  ctx.fillStyle='rgba(255,255,255,0.75)';ctx.fillRect(8,6,1,2);
  // Ears
  ctx.fillStyle='#aaa';
  ctx.beginPath();ctx.moveTo(3,3);ctx.lineTo(-2,-5);ctx.lineTo(8,3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(PW-6,3);ctx.lineTo(PW,-5);ctx.lineTo(PW+3,3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath();ctx.moveTo(4,2);ctx.lineTo(0,-2);ctx.lineTo(7,2);ctx.closePath();ctx.fill();
  // Hat
  ctx.fillStyle='#cc1111';ctx.fillRect(-1,3,PW+2,4);
  ctx.fillStyle='#cc1111';rR(ctx,2,-9,PW-4,13,2);ctx.fill();
  ctx.fillStyle='#991111';ctx.fillRect(2,-2,PW-4,5);
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(3,3,PW-6,2);
  ctx.restore();
}

// ── Moses bulldog sprite ──────────────────────────────────────────────────────
function drawMosesSprite(){
  const fl=ms.facing<0,fr=Math.floor(ms.walk/5)%4;
  ctx.save();ctx.translate(ms.x+(fl?EW:0),ms.y);if(fl)ctx.scale(-1,1);
  // Paws
  ctx.fillStyle='#c08060';
  ctx.fillRect(2,EH-(fr<2?4:8),10,5);ctx.fillRect(EW-12,EH-(fr<2?8:4),10,5);
  ctx.fillStyle='#e0a880';
  ctx.fillRect(0,EH-(fr<2?2:5),13,4);ctx.fillRect(EW-13,EH-(fr<2?5:2),13,4);
  // Legs
  ctx.fillStyle='#b07050';
  ctx.fillRect(3,EH-14,9,fr<2?14:10);ctx.fillRect(EW-12,EH-14,9,fr<2?10:14);
  // Body
  ctx.fillStyle='#c88060';rR(ctx,2,10,EW-4,EH-12,4);ctx.fill();
  // Head
  ctx.fillStyle='#c88060';ctx.beginPath();ctx.ellipse(EW*0.6,9,13,11,0.15,0,Math.PI*2);ctx.fill();
  // Jowls/muzzle
  ctx.fillStyle='#d8a085';ctx.beginPath();ctx.ellipse(EW-4,13,10,7,0,0,Math.PI*2);ctx.fill();
  // Nose
  ctx.fillStyle='#2a1000';ctx.beginPath();ctx.ellipse(EW+2,11,5,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#555';ctx.fillRect(EW-1,11,2,2);ctx.fillRect(EW+3,11,2,2);
  // Eyes (angry red)
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(EW-16,6,4.5,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aa0000';ctx.beginPath();ctx.arc(EW-15,6,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(EW-14,6,1,0,Math.PI*2);ctx.fill();
  // Angry brow
  ctx.strokeStyle='#5a3010';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(EW-21,1);ctx.lineTo(EW-11,5);ctx.stroke();
  // Spike collar
  ctx.fillStyle='#1a0800';ctx.fillRect(2,16,EW-4,5);
  ctx.fillStyle='#c0c0a0';
  for(let sx=6;sx<EW-4;sx+=7){ctx.beginPath();ctx.moveTo(sx,16);ctx.lineTo(sx+3,10);ctx.lineTo(sx+6,16);ctx.closePath();ctx.fill();}
  // Tail
  ctx.fillStyle='#c88060';ctx.beginPath();ctx.ellipse(2,EH*0.42,4,5,0.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function rR(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

// ── HUD (screen-space) ────────────────────────────────────────────────────────
function drawHUD(){
  // Thin top bar
  ctx.fillStyle='rgba(0,0,0,0.42)';ctx.fillRect(0,0,W,34);
  // Lives
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?'#ff3355':'rgba(255,50,80,0.2)';
    sHeart(10+i*22,9);
  }
  // Score
  ctx.fillStyle='#e8b84b';ctx.font='bold 15px Bungee,sans-serif';
  ctx.textAlign='center';ctx.fillText(String(score).padStart(6,'0'),W/2,23);
  // Timer (flashes red when low)
  const tc=timer<=15?(Math.floor(gts/250)%2?'#ff4444':'#ffaa00'):'#fff';
  ctx.fillStyle=tc;ctx.font='bold 13px Bungee,sans-serif';
  ctx.textAlign='right';ctx.fillText('⏱'+timer,W-10,22);
  // Hearts remaining
  const hl=nHeart();
  ctx.fillStyle=hl>0?'#ffaacc':'#aaffaa';ctx.font='11px Bungee,sans-serif';
  ctx.textAlign='left';ctx.fillText(hl>0?'♥×'+hl:'→ MARTA!',W/2+30,22);
  // Level
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='10px Bungee,sans-serif';
  ctx.textAlign='left';ctx.fillText('LV'+level,W/2-70,22);
  // Minimap
  minimap();
  ctx.textAlign='left';
}
function sHeart(x,y){
  const s=7;ctx.beginPath();
  ctx.moveTo(x+s,y+s*.35);ctx.bezierCurveTo(x+s,y,x+s*1.85,y,x+s*1.85,y+s*.45);
  ctx.bezierCurveTo(x+s*1.85,y+s,x+s,y+s*1.3,x+s,y+s*1.6);
  ctx.bezierCurveTo(x+s,y+s*1.3,x+s*.15,y+s,x+s*.15,y+s*.45);
  ctx.bezierCurveTo(x+s*.15,y,x+s,y,x+s,y+s*.35);ctx.fill();
}
function minimap(){
  const mw=90,mh=14,mx=W-mw-110,my=2;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(mx,my,mw,mh);
  // player
  ctx.fillStyle='#e8b84b';ctx.fillRect(mx+Math.floor(p.x/WW*mw)-1,my,3,mh);
  // moses
  ctx.fillStyle='#ff4444';ctx.fillRect(mx+Math.floor(ms.x/WW*mw)-1,my,3,mh);
  // marta
  const mp=martaPl();ctx.fillStyle='#fff';ctx.fillRect(mx+Math.floor(mp.x/WW*mw),my,2,mh);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
}

// ── Virtual controls ──────────────────────────────────────────────────────────
function drawControls(){
  if(state!=='PLAYING'&&state!=='DEAD')return;
  ctx.save();
  const jcx=W*0.13,jcy=H*0.82;
  ctx.fillStyle='rgba(255,255,255,0.11)';ctx.beginPath();ctx.arc(jcx,jcy,50,0,Math.PI*2);ctx.fill();
  const kx=jcx+Math.max(-34,Math.min(34,js.dx));
  ctx.fillStyle=js.active?'rgba(232,184,75,0.75)':'rgba(232,184,75,0.30)';
  ctx.beginPath();ctx.arc(kx,jcy,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.40)';ctx.font='bold 14px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('◀',jcx-38,jcy);ctx.fillText('▶',jcx+38,jcy);
  ctx.fillStyle=jb.active?'rgba(255,255,255,0.48)':'rgba(255,255,255,0.11)';
  ctx.beginPath();ctx.arc(W*0.87,H*0.82,44,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=jb.active?'#ffee44':'rgba(232,184,75,0.65)';
  ctx.font='bold 13px Bungee,sans-serif';ctx.fillText('JUMP',W*0.87,H*0.82);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.restore();
}

// ── State overlays ────────────────────────────────────────────────────────────
function drawOverlays(){
  if(state==='ATTRACT')  drawAttract();
  if(state==='DEAD')     drawDead();
  if(state==='CLEAR')    drawClear();
  if(state==='GAMEOVER') drawGO();
}
function pnl(x,y,w,h){ctx.fillStyle='rgba(0,0,0,0.70)';rR(ctx,x,y,w,h,12);ctx.fill();}
function bT(txt,y,col,sz){ctx.fillStyle=col;ctx.textAlign='center';ctx.font=`bold ${sz||Math.floor(H*.074)}px Bungee,sans-serif`;ctx.fillText(txt,W/2,y);}
function sT(txt,y,col){ctx.fillStyle=col||'#fff';ctx.textAlign='center';ctx.font=`${Math.floor(H*.037)}px Bungee,sans-serif`;ctx.fillText(txt,W/2,y);}

function drawAttract(){
  pnl(W*.16,H*.2,W*.68,H*.56);
  bT('LUPO ALBERTO',H*.37,'#e8b84b');
  sT('Collect ♥ hearts · Reach MARTA',H*.47,'#ffcccc');
  sT('Avoid MOSES the guard dog!',H*.54,'#ff9999');
  sT('Joystick: left of screen   Jump: right of screen',H*.62,'rgba(255,255,200,0.7)');
  if(Math.floor(attractTick/28)%2)bT('TAP TO PLAY',H*.72,'#ffffaa',Math.floor(H*.054));
  ctx.textAlign='left';
}
function drawDead(){
  pnl(W*.28,H*.36,W*.44,H*.24);
  bT('WOOF!',H*.49,'#ff4444',Math.floor(H*.063));
  sT('Moses got you!  ♥×'+lives,H*.57,'#ffaaaa');
}
function drawClear(){
  pnl(W*.22,H*.33,W*.56,H*.28);
  bT('CIAO MARTA! ♥',H*.47,'#aaffaa',Math.floor(H*.058));
  sT('Level '+level+'  Score: '+score,H*.56,'#ffffaa');
}
function drawGO(){
  pnl(W*.22,H*.28,W*.56,H*.42);
  bT('GAME OVER',H*.43,'#ff4444');
  sT('Score: '+score,H*.52);
  if(Math.floor(attractTick/28)%2)bT('TAP TO CONTINUE',H*.63,'#e8b84b',Math.floor(H*.042));
  ctx.textAlign='left';
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(){
  score=0;lives=3;level=1;timer=90;timerMs=0;attractTick=0;POPS=[];
  buildLevel(1);state='PLAYING';
  canvas.requestFullscreen?.().catch(()=>{});
}
function endGame(){
  try{
    if(score>0)ArcadeScores.show('lupo-alberto',score,()=>{state='ATTRACT';buildLevel(1);});
    else{state='ATTRACT';buildLevel(1);}
  }catch(e){state='ATTRACT';buildLevel(1);}
}

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
}

// ── Game loop ─────────────────────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  gts=ts;requestAnimationFrame(loop);
  const dt=ts-lastTs;if(dt<13)return;lastTs=ts;
  if(state==='ATTRACT')attractUpdate();
  else if(state==='PLAYING')update(dt);
  tickStates();
  draw();
}

window.addEventListener('resize',resize);
resize();
buildLevel(1);
requestAnimationFrame(loop);
</script>
