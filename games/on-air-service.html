// ── SEEDED RNG (art is deterministic across frames + reloads) ────────────────
function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  return function () {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    return (s >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = a => a[(Math.random() * a.length) | 0];
function fmtCash(n) {
  n = Math.round(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';

}
// colour helpers — every surface gets a lit top / mid side / dark front from one base
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(r, g, b, a) { return a == null ? `rgb(${r|0},${g|0},${b|0})` : `rgba(${r|0},${g|0},${b|0},${a})`; }
function shade(hex, k, a) {          // k>0 lighten toward white, k<0 darken toward black
  const [r, g, b] = hexToRgb(hex);
  const f = c => k >= 0 ? c + (255 - c) * k : c * (1 + k);
  return rgbStr(f(r), f(g), f(b), a);
}

// ── SFX — house style: lazy ctx, gesture unlock, mute + localStorage ────────
let audioCtx = null, muted = localStorage.getItem('sfxMuted_' + SLUG) === '1';
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function tone(f0, f1, dur, type, vol, when) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const t0 = audioCtx.currentTime + (when || 0);
    const jit = 1 + (Math.random() * 2 - 1) * 0.04;           // ±4% pitch jitter, anti-repetition
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0 * jit, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * jit), t0 + dur);
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function noise(dur, vol, hp) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const n = (audioCtx.sampleRate * dur) | 0, buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.value = vol || 0.1;
    const f = audioCtx.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 900;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
  } catch (e) {}
}

  if (G.turbo > 0 && a.id === 'jimmy') s *= 1.5;

function patienceMul() { return 1 + 0.18 * G.up.sofa; }

function isUnlocked(id) { return !!G.unlocked[id]; }

function stationById(id) { return STATIONS.find(s => s.id === id); }
function seatPos(t, i) { return { x: t.x + (i ? SEAT_DX : -SEAT_DX), y: t.y + SEAT_DY }; }
function tableFront(t) { return { x: t.x, y: t.y + 50 }; }

function rebuildObstacles() {
  obstacles = [];
  for (const t of TABLES) if (isUnlocked(t.id)) obstacles.push({ x: t.x - TABLE_W / 2 - 2, y: t.y - TABLE_D / 2 - 2, w: TABLE_W + 4, h: TABLE_D + 4, id: t.id });
  for (const s of STATIONS) if (isUnlocked(s.id)) obstacles.push({ x: s.x - s.w / 2 - 2, y: s.y - s.d / 2 - 2, w: s.w + 4, h: s.d + 4, id: s.id });
  for (const dc of DECOR) if (!dc.flat) obstacles.push({ x: dc.x - dc.w / 2, y: dc.y - dc.d / 2, w: dc.w, h: dc.d, id: dc.kind });
  // pads for locked things are walkable (you stand on them to pay)
  padsVisible = UNLOCK_ORDER.filter(id => !isUnlocked(id)).slice(0, 3);
}
function initStations() {

// circle vs AABB slide — resolve per axis so the actor glides along edges
function collideMove(a, dx, dy) {
  const lo = WALL_Y + 6, hi = FLOOR_BOTTOM() - 8;
  a.x = clamp(a.x + dx, ACTOR_R + 4, WORLD_W - ACTOR_R - 4);
  for (const o of obstacles) pushOut(a, o, true);
  a.y = clamp(a.y + dy, lo, hi);
  for (const o of obstacles) pushOut(a, o, false);
}
function pushOut(a, o, axisX) {
  const cx = clamp(a.x, o.x, o.x + o.w), cy = clamp(a.y, o.y, o.y + o.h);
  const ddx = a.x - cx, ddy = a.y - cy, d2 = ddx * ddx + ddy * ddy;
  if (d2 >= ACTOR_R * ACTOR_R) return;
  if (d2 < 0.01) {                       // centre inside the box: eject along the shorter axis
    const l = a.x - o.x, r = o.x + o.w - a.x, t = a.y - o.y, b = o.y + o.h - a.y;
    const m = Math.min(l, r, t, b);
    if (m === l) a.x = o.x - ACTOR_R; else if (m === r) a.x = o.x + o.w + ACTOR_R;
    else if (m === t) a.y = o.y - ACTOR_R; else a.y = o.y + o.h + ACTOR_R;
    return;
  }
  const d = Math.sqrt(d2), k = (ACTOR_R - d) / d;
  if (axisX) { if (Math.abs(ddx) > 0.01) a.x += ddx * k; else a.y += ddy * k; }
  else       { if (Math.abs(ddy) > 0.01) a.y += ddy * k; else a.x += ddx * k; }
}

  let pool = GUEST_TYPES.filter(t => !t.vip || G.day >= 2);
  let sum = 0; for (const t of pool) sum += t.weight;
  let r = Math.random() * sum;
  for (const t of pool) { r -= t.weight; if (r <= 0) return t; }
  return pool[0];
}

// one actor working whatever is in reach — runs every frame for Jimmy and Joe
function interact(a, dt) {
  const cap = carryCap(a);
  a.cool = Math.max(0, (a.cool || 0) - dt);
  for (const st of STATIONS) {
    if (!isUnlocked(st.id)) continue;
    if (dist(a.x, a.y, st.stand.x, st.stand.y) > 44) continue;
    const s = S[st.id];
    if (st.kind === 'shoot') {
      if (a.stack.length >= cap) continue;
      s.user = a.id; s.progress += dt / shootTime();
      if (Math.random() < dt * 4) particles.push(mkParticle(st.x + 30, st.y - 60, 20 + Math.random() * 20, -10 - Math.random() * 30, '#ff3030', 0.5, 2.5, 0.3));
      if (s.progress >= 1) {
        s.progress = 0; a.stack.push('raw'); sfx.shoot(); s.glow = 1;
        flash(st.x, st.y - 62); floaters.push({ x: a.x, y: a.y - 70, txt: 'TAPE!', col: '#8fd0ff', t: 0, life: 0.8 });
      }
    } else if (st.kind === 'edit' || st.kind === 'fx') {
      const want = st.kind === 'fx' ? 'edited' : 'raw';
      if (a.cool > 0) continue;
      if (s.output.length && a.stack.length < cap) { a.stack.push(s.output.shift()); a.cool = 0.22; sfx.tape(); continue; }
      const k = a.stack.lastIndexOf(want);

    } else if (st.kind === 'merch') {
      if (a.cool > 0 || s.stock <= 0 || a.stack.length >= cap) continue;
      if (a.stack.filter(c => c === 'merch').length >= merchDemand()) continue;   // don't hoard caps nobody ordered
      s.stock--; a.stack.push('merch'); a.cool = 0.3; sfx.tape(); s.glow = 1;
    }

    for (let i = 0; i < g.order.length; i++) {

// ── AI PLANNER — drives Joe, and Jimmy in attract mode ───────────────────────
function needs() {                       // what the seated crowd is waiting for, by carry type
  const n = { raw: 0, edited: 0, spooky: 0, merch: 0 };
  for (const g of G.guests) if (g.state === 'seated') for (const o of g.order) n[ITEM_CARRY[o]]++;
  return n;
}
function planFor(a, other) {
  const cap = carryCap(a), stack = a.stack, n = needs();
  const has = c => stack.includes(c);
  const otherHas = c => other && other.stack.includes(c);
  const near = pts => { let b = null, bd = 1e9; for (const p of pts) { const d = dist(a.x, a.y, p.x, p.y); if (d < bd) { bd = d; b = p; } } return b; };
  // 1. deliver anything a seated guest wants and we're holding
  const del = [];
  for (const g of G.guests) if (g.state === 'seated') for (const o of g.order) if (has(ITEM_CARRY[o])) { const t = tableById(g.tableId); del.push({ ...tableFront(t), why: 'deliver' }); }
  if (del.length) return near(del);
  // 2. collect finished tapes from the bays if there's room and someone wants them
  if (stack.length < cap) {
    const outs = [];
    for (const st of STATIONS) if (isUnlocked(st.id) && (st.kind === 'edit' || st.kind === 'fx') && S[st.id].output.length) {
      const c = st.kind === 'fx' ? 'spooky' : 'edited';
      if (n[c] > 0 || (st.kind === 'edit' && n.spooky > 0 && isUnlocked('fx'))) outs.push({ ...st.stand, why: 'collect' });
    }
    if (outs.length) return near(outs);
  }
  // 3. cash on the tables
  const cash = G.cash$.filter(c => c.t > 0.3).map(c => ({ x: c.x, y: c.y + 46, why: 'cash' }));
  if (cash.length) return near(cash);
  // 4. drop raw tapes into an edit bay when episodes/specials are wanted, edited into FX when specials wanted
  if (has('raw') && (n.edited > 0 || n.spooky > 0)) {
    const bays = STATIONS.filter(st => isUnlocked(st.id) && st.kind === 'edit' && S[st.id].input.length < BAY_IN_CAP).map(st => ({ ...st.stand, why: 'drop' }));
    if (bays.length) return near(bays);
  }
  if (has('edited') && n.spooky > 0 && isUnlocked('fx') && S.fx.input.length < BAY_IN_CAP) return { ...stationById('fx').stand, why: 'dropfx' };
  // 5. make what's missing
  if (stack.length < cap) {

    const pg = g.createLinearGradient(0, SPLIT_Y, 0, WORLD_H);
    pg.addColorStop(0, '#f6e3bf'); pg.addColorStop(1, '#ecd0a3');
    g.fillStyle = pg; g.fillRect(0, SPLIT_Y + 5, WORLD_W, WORLD_H - SPLIT_Y);
    g.save(); g.beginPath(); g.rect(0, SPLIT_Y + 5, WORLD_W, WORLD_H - SPLIT_Y); g.clip();
    g.strokeStyle = 'rgba(200,160,110,0.45)'; g.lineWidth = 1.6;
    const step = 44;
    for (let k = -WORLD_H; k < WORLD_W + WORLD_H; k += step) {
      g.beginPath(); g.moveTo(k, SPLIT_Y); g.lineTo(k + WORLD_H, SPLIT_Y + WORLD_H); g.stroke();
      g.beginPath(); g.moveTo(k, SPLIT_Y); g.lineTo(k - WORLD_H, SPLIT_Y + WORLD_H); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
    for (let k = -WORLD_H; k < WORLD_W + WORLD_H; k += step) {
      g.beginPath(); g.moveTo(k + 2, SPLIT_Y); g.lineTo(k + 2 + WORLD_H, SPLIT_Y + WORLD_H); g.stroke();
    }
    for (let y = SPLIT_Y + step / 2; y < WORLD_H; y += step / 2) for (let x = ((y - SPLIT_Y) / (step / 2)) % 2 ? step / 2 : 0; x < WORLD_W; x += step) {
      g.fillStyle = 'rgba(190,140,90,0.35)'; ell(g, x, y, 2.2, 2.2); g.fill();
    }
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${0.05 + rng() * 0.07})`; ell(g, rng() * WORLD_W, SPLIT_Y + rng() * (WORLD_H - SPLIT_Y), 4 + rng() * 10, 2 + rng() * 3); g.fill(); }
    g.restore();
    const ao2 = g.createLinearGradient(0, SPLIT_Y + 5, 0, SPLIT_Y + 30);
    ao2.addColorStop(0, 'rgba(90,50,20,0.22)'); ao2.addColorStop(1, 'rgba(90,50,20,0)');
    g.fillStyle = ao2; g.fillRect(0, SPLIT_Y + 5, WORLD_W, 25);
    // rug in the deep end — teal runner with a cream border, woven stripes, fringe and a soft AO
    for (const dc of DECOR) if (dc.kind === 'rug') {
      const x0 = dc.x - dc.w / 2, y0 = dc.y - dc.d / 2;
      softShadow(g, x0 - 4, y0 - 2, dc.w + 8, dc.d + 8, 0.22, 8);
      g.fillStyle = '#efe3c6'; rr(g, x0, y0, dc.w, dc.d, 6); g.fill();
      const rg = g.createLinearGradient(0, y0, 0, y0 + dc.d);
      rg.addColorStop(0, '#d06d5f'); rg.addColorStop(1, '#a94a43');
      g.fillStyle = rg; rr(g, x0 + 9, y0 + 9, dc.w - 18, dc.d - 18, 4); g.fill();
      g.save(); rr(g, x0 + 9, y0 + 9, dc.w - 18, dc.d - 18, 4); g.clip();
      g.fillStyle = 'rgba(255,255,255,0.10)';
      for (let y = y0 + 16; y < y0 + dc.d - 12; y += 14) g.fillRect(x0 + 9, y, dc.w - 18, 4);
      g.fillStyle = 'rgba(80,20,20,0.07)';
      for (let x = x0 + 20; x < x0 + dc.w - 12; x += 26) g.fillRect(x, y0 + 9, 3, dc.d - 18);
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${0.03 + rng() * 0.07})`; g.fillRect(x0 + 9 + rng() * (dc.w - 18), y0 + 9 + rng() * (dc.d - 18), 2 + rng() * 5, 1); }
      g.restore();
      g.fillStyle = '#e2c99a'; rr(g, x0 + 16, y0 + dc.d / 2 - 12, dc.w - 32, 24, 3); g.fill();    // centre medallion band
      g.fillStyle = '#a94a43'; ell(g, dc.x, dc.y, 26, 9); g.fill(); g.fillStyle = '#efe3c6'; ell(g, dc.x, dc.y, 14, 5); g.fill();
      g.strokeStyle = '#d9cba8'; g.lineWidth = 2;                                                    // fringe
      for (let x = x0 + 6; x < x0 + dc.w - 4; x += 7) { g.beginPath(); g.moveTo(x, y0); g.lineTo(x - 1, y0 - 6); g.moveTo(x, y0 + dc.d); g.lineTo(x + 1, y0 + dc.d + 6); g.stroke(); }
    }
    // queue lane markings — little "wait here" dots down the left wall
    for (let i = 0; i < QUEUE_MAX; i++) { g.fillStyle = 'rgba(255,255,255,0.35)'; ell(g, QUEUE_X, QUEUE_Y0 + i * QUEUE_DY + 4, 12, 5); g.fill(); g.fillStyle = 'rgba(200,90,70,0.35)'; ell(g, QUEUE_X, QUEUE_Y0 + i * QUEUE_DY + 4, 9, 3.2); g.fill(); }
    // camera floor marks (tape X) at every rig stand point
    for (const st of STATIONS) if (st.kind === 'shoot') {
      g.strokeStyle = 'rgba(230,120,60,0.55)'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(st.stand.x - 9, st.stand.y - 4); g.lineTo(st.stand.x + 9, st.stand.y + 4); g.moveTo(st.stand.x + 9, st.stand.y - 4); g.lineTo(st.stand.x - 9, st.stand.y + 4); g.stroke();
    }
  });
}

// ── CHARACTERS: body (3 frames) + head (per mood) ────────────────────────────
// Guests are chibi humans; Jimmy and Joe are the JnJ astronauts (jnj-on-air palette).
function drawLegs(g, x, y, frame, col, small) {
  const k = small ? 0.85 : 1, lh = 9 * k, lw = 7 * k;
  const up = frame === 1 ? 3 : 0, up2 = frame === 2 ? 3 : 0;
  g.fillStyle = col; rr(g, x - 7 * k, y - lh - up, lw, lh + up, 3); g.fill(); rr(g, x + 0.5 * k, y - lh - up2, lw, lh + up2, 3); g.fill();
  g.fillStyle = shade(col, -0.35); ell(g, x - 3.5 * k, y - 1 - up, 4.2 * k, 2.2); g.fill(); ell(g, x + 4 * k, y - 1 - up2, 4.2 * k, 2.2); g.fill();
}
function drawTorso(g, x, y, col, small, host, trim) {
  const k = small ? 0.85 : 1, w = 24 * k, h = 24 * k;
  const tg = g.createLinearGradient(x - w / 2, y - h, x + w / 2, y);
  tg.addColorStop(0, shade(col, 0.28)); tg.addColorStop(0.55, col); tg.addColorStop(1, shade(col, -0.22));
  g.fillStyle = tg; rr(g, x - w / 2, y - h, w, h + 2, 9 * k); g.fill();
  // arms
  g.fillStyle = shade(col, -0.12); rr(g, x - w / 2 - 4 * k, y - h + 6, 6 * k, 14 * k, 3); g.fill(); rr(g, x + w / 2 - 2 * k, y - h + 6, 6 * k, 14 * k, 3); g.fill();
  g.fillStyle = host ? '#ffffff' : '#f4cfa8'; ell(g, x - w / 2 - 1, y - h + 20 * k, 3.2, 3.2); g.fill(); ell(g, x + w / 2 + 1, y - h + 20 * k, 3.2, 3.2); g.fill();
  if (host) {

let panel = null;
function openPanel(id) { panel = id; sfx.ui(); }
function closePanel() { panel = null; sfx.ui(); }
let scoresShown = false;
function nextDay() {
  G.day++; G.giftReady = true; scoresShown = false;
  startDay();
}
function claimGift() {
  if (!G.giftReady) { sfx.nope(); return; }
  G.giftReady = false;
  const roll = Math.random();
  if (roll < 0.4) addGems(2, hud.gift.x + 20, hud.gift.y + 10);
  else if (roll < 0.8) addCash(40 + 20 * G.day, hud.gift.x + 30, hud.gift.y + 10, true);
  else { G.hype = 12; floaters.push({ x: hud.gift.x + 60, y: hud.gift.y, txt: 'HYPE 12s', col: '#ff8a3c', t: 0, life: 1.2, big: true }); sfx.buy(); }

}
// returns true when the tap was eaten by UI
function uiTap(x, y, down) {
  if (!down) return false;
  const inRect = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const inCircle = c => dist(x, y, c.x, c.y) <= c.r;
  if (state === 'ended') return true;
  if (state === 'dayend') {
    if (G.endReason) { if (!scoresShown) { scoresShown = true; showScores(); } return true; }
    if (hud.dayBtn && inRect(hud.dayBtn)) { sfx.ui(); nextDay(); }
    return true;
  }
  if (panel) {
    if (hud.close && inCircle(hud.close)) { closePanel(); return true; }
    for (const r of hud.rows) if (inRect(r)) { r.action(); return true; }
    return true;                                   // taps outside rows do nothing but never leak to the floor
  }
  if (state !== 'playing') return false;
  if (inCircle(hud.gear)) { openPanel('settings'); return true; }
  if (inCircle(hud.gift)) { claimGift(); return true; }
  for (const b of hud.btns) if (x >= b.x - 69 && x <= b.x + 69 && y >= b.y + 6 && y <= b.y + 80) {
    openPanel(b.id === 'shop' ? 'shop' : b.id === 'coll' ? 'collection' : 'upgrade'); return true;
  }
  if (inRect(hud.next) || inRect(hud.dayPill) || inRect(hud.rent) || inRect(hud.cashPill) || inRect(hud.gemPill)) return true;
  return false;
}

  const giftBob = G.giftReady ? Math.sin(worldT * 5) * 3 : 0;
  blit(SPR.btnGift, hud.gift.x, hud.gift.y + giftBob, G.giftReady ? 1 : 0.55);
  if (G.giftReady) { ctx.fillStyle = '#ff4d6a'; ell(ctx, hud.gift.x + 16, hud.gift.y - 16 + giftBob, 6, 6); ctx.fill(); }
  // cash + gem pills
  const cp = hud.cashPill; pill(cp.x, cp.y, cp.w, cp.h); blit(SPR.icon_bill, cp.x + 20, cp.y + 17);
  textStroke(ctx, '$' + fmtCash(G.cash), cp.x + cp.w - 12, cp.y + 18, F_NUM(22), '#fff', null, 0, 'right');
  const gp = hud.gemPill; pill(gp.x, gp.y, gp.w, gp.h); blit(SPR.icon_gem, gp.x + 20, gp.y + 17);
  textStroke(ctx, String(G.gems), gp.x + gp.w - 12, gp.y + 18, F_NUM(22), '#ffb0ea', null, 0, 'right');
  // boosts
  let bx = WORLD_W / 2 - (G.hype > 0 && G.turbo > 0 ? 44 : 0);
  if (G.hype > 0) { pill(bx - 40, 118, 80, 26); blit(SPR.icon_hype, bx - 24, 131); textStroke(ctx, Math.ceil(G.hype) + 's', bx + 8, 132, F_NUM(16), '#ffb545', null); bx += 88; }
  if (G.turbo > 0) { pill(bx - 40, 118, 80, 26); blit(SPR.icon_turbo, bx - 24, 131); textStroke(ctx, Math.ceil(G.turbo) + 's', bx + 8, 132, F_NUM(16), '#ffd23c', null); }
  // bottom-left: hearts, day + timer, rent bar
  for (let i = 0; i < MAX_REP; i++) blit(SPR.icon_heart, hud.hearts.x + 12 + i * 22, hud.hearts.y, i < G.rep ? 1 : 0.22);
  const dp = hud.dayPill; pill(dp.x, dp.y, dp.w, dp.h);
  textStroke(ctx, 'DAY ' + G.day, dp.x + 12, dp.y + 15, F_NUM(18), '#ffd76a', null, 0, 'left');
  const tl = DAY_LEN - G.dayT;
  textStroke(ctx, fmtTime(tl), dp.x + dp.w - 12, dp.y + 15, F_NUM(18), tl < 15 && Math.floor(worldT * 4) % 2 ? '#ff6a6a' : '#fff', null, 0, 'right');
  const rb = hud.rent, rent = rentFor(G.day), fr = clamp(G.earnedDay / rent, 0, 1);
  ctx.fillStyle = 'rgba(60,45,40,0.58)'; rr(ctx, rb.x, rb.y, rb.w, rb.h, 10); ctx.fill();
  const bg = ctx.createLinearGradient(rb.x, 0, rb.x + rb.w, 0); bg.addColorStop(0, fr >= 1 ? '#ffd23c' : '#4ccf5a'); bg.addColorStop(1, fr >= 1 ? '#ff9a3c' : '#2fae3f');
  ctx.fillStyle = bg; rr(ctx, rb.x + 2, rb.y + 2, (rb.w - 4) * fr, rb.h - 4, 8); ctx.fill();
  textStroke(ctx, 'RENT $' + fmtCash(G.earnedDay) + ' / $' + fmtCash(rent), rb.x + rb.w / 2, rb.y + rb.h / 2 + 1, F_NUM(13), '#fff', 'rgba(30,15,10,0.6)', 3);
  // NEXT card

    textStroke(ctx, '$' + fmtCash(np.left), nx.x + 142, nx.y + 24, F_NUM(19), '#f27d1c', null, 0, 'right');
    textStroke(ctx, np.p.name, nx.x + 75, nx.y + 42, F_NUM(11), '#a55a10', null);
  }
  // bottom buttons
  for (const b of hud.btns) blit(SPR[b.spr], b.x, b.y);
  if (!G.joe && G.cash >= SHOP[0].cost) { ctx.fillStyle = '#ff4d6a'; ell(ctx, hud.btns[0].x + 58, hud.btns[0].y + 14, 7, 7); ctx.fill(); }
  const upAff = UPGRADES.some(u => { const c = upgradeCost(u); return c != null && G.cash >= c; });
  if (upAff) { ctx.fillStyle = '#ff4d6a'; ell(ctx, hud.btns[2].x + 58, hud.btns[2].y + 14, 7, 7); ctx.fill(); }
  // day banner
  if (G.banner) {
    const k = G.banner.t, a = k < 0.3 ? k / 0.3 : k > 1.7 ? Math.max(0, 1 - (k - 1.7) / 0.5) : 1, sc = 1 + Math.max(0, 0.3 - k) * 1.5;
    ctx.globalAlpha = a; ctx.save(); ctx.translate(WORLD_W / 2, 300); ctx.scale(sc, sc);
    textStroke(ctx, G.banner.txt, 0, -10, F_DISP(46), '#fff', 'rgba(30,15,10,0.8)', 8);
    textStroke(ctx, G.banner.sub, 0, 30, F_NUM(24), '#ffd76a', 'rgba(30,15,10,0.8)', 5);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ── PANELS + OVERLAYS ────────────────────────────────────────────────────────
function drawBlueBtn(x, y, w, h, label, on, col) {
  ctx.save(); if (!on) ctx.globalAlpha = 0.45;
  ctx.fillStyle = col ? shade(col, -0.4) : '#1f5fb0'; rr(ctx, x, y + 3, w, h, 10); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, col ? shade(col, 0.3) : '#79ccff'); g.addColorStop(1, col || '#2d86e6');
  ctx.fillStyle = g; rr(ctx, x, y, w, h - 2, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(ctx, x + 6, y + 3, w - 12, 5, 2.5); ctx.fill();
  textStroke(ctx, label, x + w / 2, y + h / 2 - 1, F_NUM(18), '#fff', 'rgba(20,60,120,0.5)', 3);
  ctx.restore();
}
function card(x, y, w, h, title) {
  softShadow(ctx, x, y + 6, w, h, 0.5, 12);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#fff7e8'); g.addColorStop(1, '#f5dfbd');
  ctx.fillStyle = g; rr(ctx, x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = '#d9a568'; ctx.lineWidth = 4; rr(ctx, x, y, w, h, 18); ctx.stroke();
  ctx.fillStyle = '#d9a568'; rr(ctx, x, y, w, 52, 18); ctx.fill(); ctx.fillRect(x, y + 30, w, 22);
  textStroke(ctx, title, x + w / 2, y + 27, F_DISP(22), '#fff', 'rgba(90,50,20,0.5)', 4);
  hud.close = { x: x + w - 26, y: y + 26, r: 20 };
  ctx.fillStyle = '#c9576f'; ell(ctx, hud.close.x, hud.close.y, 16, 16); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hud.close.x - 6, hud.close.y - 6); ctx.lineTo(hud.close.x + 6, hud.close.y + 6); ctx.moveTo(hud.close.x + 6, hud.close.y - 6); ctx.lineTo(hud.close.x - 6, hud.close.y + 6); ctx.stroke();
}
function drawPanel() {
  ctx.fillStyle = 'rgba(20,10,8,0.6)'; ctx.fillRect(-20, -20, WORLD_W + 40, WORLD_H + 40);
  hud.rows = [];
  const x = 30, w = 480;
  if (panel === 'upgrade') {
    const h = 70 + UPGRADES.length * 66 + 16, y = (WORLD_H - h) / 2;
    card(x, y, w, h, 'UPGRADE');
    UPGRADES.forEach((u, i) => {
      const ry = y + 66 + i * 66, c = upgradeCost(u), lvl = G.up[u.id];
      ctx.fillStyle = i % 2 ? 'rgba(217,165,104,0.10)' : 'rgba(217,165,104,0.0)'; rr(ctx, x + 10, ry, w - 20, 62, 10); ctx.fill();
      blit(SPR.icon_upgrade, x + 40, ry + 31);
      textStroke(ctx, u.name + (lvl ? ' ' + 'I'.repeat(lvl) : ''), x + 70, ry + 22, F_NUM(21), '#3a2416', null, 0, 'left');
      textStroke(ctx, u.desc, x + 70, ry + 44, F_NUM(15), '#8a6a50', null, 0, 'left');
      const bx = x + w - 16 - 112, by = ry + 11;
      if (c == null) drawBlueBtn(bx, by, 112, 40, 'MAXED', false, '#8a8f96');
      else { drawBlueBtn(bx, by, 112, 40, '$' + c, G.cash >= c); hud.rows.push({ x: bx, y: by, w: 112, h: 40, action: () => buyUpgrade(u) }); }
    });
  } else if (panel === 'shop') {
    const h = 70 + SHOP.length * 66 + 16, y = (WORLD_H - h) / 2;
    card(x, y, w, h, 'SHOP');
    SHOP.forEach((it, i) => {
      const ry = y + 66 + i * 66, owned = it.once && G.joe;
      ctx.fillStyle = i % 2 ? 'rgba(217,165,104,0.10)' : 'rgba(217,165,104,0.0)'; rr(ctx, x + 10, ry, w - 20, 62, 10); ctx.fill();
      blit(SPR['icon_' + it.id], x + 40, ry + 31);
      textStroke(ctx, it.name, x + 70, ry + 22, F_NUM(21), '#3a2416', null, 0, 'left');
      textStroke(ctx, it.desc, x + 70, ry + 44, F_NUM(15), '#8a6a50', null, 0, 'left');
      const bx = x + w - 16 - 112, by = ry + 11;
      if (owned) drawBlueBtn(bx, by, 112, 40, 'HIRED', false, '#8a8f96');
      else {
        const have = it.cur === 'gems' ? G.gems : G.cash;
        drawBlueBtn(bx, by, 112, 40, (it.cur === 'gems' ? '◆ ' : '$') + it.cost, have >= it.cost, it.cur === 'gems' ? '#e04fb0' : null);
        hud.rows.push({ x: bx, y: by, w: 112, h: 40, action: () => buyShop(it) });
      }
    });
  } else if (panel === 'collection') {
    const cols = 3, cw = 150, ch = 96, rows = Math.ceil(GUEST_TYPES.length / cols);
    const h = 70 + rows * ch + 74, y = (WORLD_H - h) / 2;
    card(x, y, w, h, 'COLLECTION');
    GUEST_TYPES.forEach((t, i) => {
      const cx = x + 20 + (i % cols) * cw + cw / 2, cy = y + 66 + Math.floor(i / cols) * ch;
      const seen = G.seenTypes[t.id] || 0;
      ctx.fillStyle = 'rgba(217,165,104,0.12)'; rr(ctx, cx - cw / 2 + 4, cy, cw - 8, ch - 8, 12); ctx.fill();
      if (seen) { drawCharacter(t.id, cx, cy + 62, 1, 0, 'ok', t.small, 0); }
      else { ctx.fillStyle = 'rgba(0,0,0,0.12)'; ell(ctx, cx, cy + 34, 16, 16); ctx.fill(); textStroke(ctx, '?', cx, cy + 35, F_NUM(22), '#fff', null); }
      textStroke(ctx, seen ? t.name : '???', cx, cy + 78, F_NUM(13), '#3a2416', null);
      if (seen) textStroke(ctx, '×' + seen, cx + cw / 2 - 18, cy + 14, F_NUM(13), '#8a6a50', null);
      if (t.vip) textStroke(ctx, 'VIP', cx - cw / 2 + 22, cy + 14, F_NUM(12), '#e04fb0', null);
    });
    const iy = y + 66 + rows * ch + 6;
    Object.keys(ITEMS).forEach((k, i) => { const ix = x + 60 + i * 110; drawIcon(ctx, ITEMS[k].icon, ix, iy + 18, 13); textStroke(ctx, '×' + G.servedItems[k], ix + 22, iy + 18, F_NUM(16), '#3a2416', null, 0, 'left'); });
    textStroke(ctx, 'SERVED', x + w / 2, iy + 46, F_NUM(13), '#8a6a50', null);
  } else if (panel === 'settings') {
    const h = 70 + 3 * 66 + 100, y = (WORLD_H - h) / 2;
    card(x, y, w, h, 'JIMMY & JOE\'S');
    const items = [
      { label: 'SOUND', val: muted ? 'OFF' : 'ON', on: !muted, action: () => { toggleMute(); sfx.ui(); } },
      { label: 'RESTART RUN', val: 'RESET', on: true, col: '#c9576f', action: () => { panel = null; startGame(); } },
      { label: 'BACK TO ARCADE', val: 'EXIT', on: true, col: '#8a8f96', action: () => { location.href = '../'; } },
    ];
    items.forEach((it, i) => {
      const ry = y + 66 + i * 66, bx = x + w - 16 - 112, by = ry + 11;
      textStroke(ctx, it.label, x + 30, ry + 31, F_NUM(21), '#3a2416', null, 0, 'left');
      drawBlueBtn(bx, by, 112, 40, it.val, it.on, it.col); hud.rows.push({ x: bx, y: by, w: 112, h: 40, action: it.action });
    });
    const ty = y + 66 + 3 * 66 + 6;
    ['Drag anywhere to walk. Stand at a station to use it.', 'Shoot at the rig → edit in the bay → deliver → grab cash.', 'Stand on a floor pad to pay for it. Make rent every day.'].forEach((l, i) => textStroke(ctx, l, x + w / 2, ty + 14 + i * 22, F_NUM(15), '#8a6a50', null));
  }
}
function drawDayEnd(dt) {
  ctx.fillStyle = 'rgba(20,10,8,0.6)'; ctx.fillRect(-20, -20, WORLD_W + 40, WORLD_H + 40);
  const x = 40, w = 460;
  if (G.endReason) {
    const h = 280, y = (WORLD_H - h) / 2;
    card(x, y, w, h, G.endReason === 'rent' ? 'RENT MISSED' : 'REPUTATION GONE');
    hud.close = null;
    textStroke(ctx, G.endReason === 'rent' ? 'The landlord took the mics.' : 'Nobody wants to be on the show.', x + w / 2, y + 86, F_NUM(19), '#8a6a50', null);
    textStroke(ctx, 'TOTAL EARNED', x + w / 2, y + 128, F_NUM(16), '#8a6a50', null);
    textStroke(ctx, '$' + fmtCash(G.earnedTotal), x + w / 2, y + 166, F_DISP(36), '#3a2416', null);
    textStroke(ctx, 'DAYS ' + G.day + '   ·   SERVED ' + G.servedTotal + '   ·   BEST ' + '★'.repeat(G.bestStars), x + w / 2, y + 210, F_NUM(16), '#8a6a50', null);
    textStroke(ctx, IS_ATTRACT ? '' : 'TAP FOR SCORES', x + w / 2, y + 250, F_NUM(15), '#c9576f', null);
    return;
  }
  const h = 380, y = (WORLD_H - h) / 2;
  card(x, y, w, h, 'DAY ' + G.day + ' DONE');
  hud.close = null;
  for (let i = 0; i < 3; i++) {
    const sx = x + w / 2 - 60 + i * 60, pop = clamp((dayEndT - 0.3 - i * 0.25) * 4, 0, 1), sc = 1 + Math.sin(pop * Math.PI) * 0.5;
    ctx.save(); ctx.translate(sx, y + 92); ctx.scale(sc * 1.5, sc * 1.5); blit(SPR.icon_star, 0, 0, i < G.stars && pop > 0 ? 1 : 0.18); ctx.restore();
  }
  const rent = rentFor(G.day);
  const lines = [['EARNED', '$' + fmtCash(G.earnedDay) + '  /  rent $' + fmtCash(rent)], ['TIPS', '$' + fmtCash(G.tipsDay)], ['SERVED', String(G.servedDay)], ['WALKOUTS', String(G.walkouts)]];
  lines.forEach((l, i) => { const ly = y + 150 + i * 34; textStroke(ctx, l[0], x + 40, ly, F_NUM(17), '#8a6a50', null, 0, 'left'); textStroke(ctx, l[1], x + w - 40, ly, F_NUM(20), '#3a2416', null, 0, 'right'); });
  if (G.stars === 3) textStroke(ctx, '+1 ♥  +3 ◆  PERFECT DAY', x + w / 2, y + 292, F_NUM(16), '#e04fb0', null);
  const bx = x + w / 2 - 100, by = y + h - 66;
  drawBlueBtn(bx, by, 200, 48, 'OPEN DAY ' + (G.day + 1), true);
  hud.dayBtn = { x: bx, y: by, w: 200, h: 48 };
}
function drawEnded() {
  ctx.fillStyle = 'rgba(20,10,8,0.5)'; ctx.fillRect(-20, -20, WORLD_W + 40, WORLD_H + 40);
  textStroke(ctx, G.endReason === 'rep' ? 'REPUTATION GONE' : 'CLOSED', WORLD_W / 2, WORLD_H / 2 - 20, F_DISP(34), '#fff', 'rgba(30,15,10,0.8)', 8);
  textStroke(ctx, '$' + fmtCash(G.earnedTotal) + ' earned over ' + G.day + (G.day === 1 ? ' day' : ' days'), WORLD_W / 2, WORLD_H / 2 + 24, F_NUM(20), '#ffd76a', 'rgba(30,15,10,0.8)', 4);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a100c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { const k = Math.min(1, shakeT / 10) * 4; sx = (Math.random() - .5) * k; sy = (Math.random() - .5) * k; }
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox + sx * VIEW.scale, VIEW.oy + sy * VIEW.scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WORLD_W, WORLD_H); ctx.clip();
  if (!G) { ctx.restore(); return; }
  drawWorld();
  drawHud();
  if (panel && state === 'playing') drawPanel();
  if (state === 'dayend') drawDayEnd();
  if (state === 'ended') drawEnded();
  ctx.restore();
  // letterbox bars stay dark
}

// ═════════════════════════════════════════════════════════════════════════════
// GAME LOOP
// ═════════════════════════════════════════════════════════════════════════════
let dayEndT = 0;
function update(dt) {
  quipCool = Math.max(0, quipCool - dt);
  G.hype = Math.max(0, G.hype - dt); G.turbo = Math.max(0, G.turbo - dt);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 2.2) G.banner = null; }
  if (G.buildPop) { G.buildPop.t += dt; if (G.buildPop.t > 0.6) G.buildPop = null; }
  G.dayT += dt;
  if (G.dayT >= DAY_LEN) { endDay(); return; }
  if (G.dayT < DAY_LEN - 12) {                     // last-minute arrivals would only walk out
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawnGuest(); G.spawnT = spawnGap() * (0.8 + Math.random() * 0.4); }
  }
  for (const c of G.cash$) c.t += dt;
  if (!panel) updatePads(dt);
  updateStations(dt);
  updateGuests(dt);
  if (state !== 'playing') return;                 // a walkout may have ended the run
  if (player.ai) driveAi(player, joe, dt); else if (panel) { player.vx = player.vy = 0; } else readPlayerInput(player);
  updateActor(player, dt);
  if (joe) { driveAi(joe, player, dt); updateActor(joe, dt); }
  if (IS_ATTRACT && !G.joe && G.day >= 2 && G.cash >= SHOP[0].cost) buyShop(SHOP[0]);
  updateFx(dt);
}
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(32, t - tPrev) / 1000; tPrev = t;
  worldT += dt;
  if (state === 'playing') { dayEndT = 0; update(dt); }
  else if (state === 'dayend') {
    dayEndT += dt; updateGuests(dt); updateFx(dt);
    if (G.endReason) { if (IS_ATTRACT && dayEndT > 2.5 && !scoresShown) { scoresShown = true; showScores(); } else if (!IS_ATTRACT && dayEndT > 4 && !scoresShown) { scoresShown = true; showScores(); } }
    else if (IS_ATTRACT && dayEndT > 2.5) nextDay();
  }
  else if (state === 'ended') { updateFx(dt); }
  render();
}

// ── START / RESTART ──────────────────────────────────────────────────────────
function startGame() {
  G = newRun();
  for (const id of ['t1', 't2', 'rig1', 'bay1']) G.unlocked[id] = true;
  G.giftReady = true; scoresShown = false;
  rebuildObstacles(); initStations();
  player = makeActor('jimmy', PLAYER_START.x, PLAYER_START.y); player.ai = IS_ATTRACT;
  joe = null; panel = null; walkTo = null; stick.active = false;
  particles.length = 0; floaters.length = 0; flyers.length = 0; shakeT = 0; quipCool = 0;
  startDay();
}

// ── COIN OVERLAY + ATTRACT ───────────────────────────────────────────────────
const overlay = document.getElementById('overlay'), coinBtn = document.getElementById('coinBtn');
function insertCoin() {
  overlay.classList.add('hidden');
  unlockAudio();
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } catch (e) {}
  sfx.ui();
  startGame();
}
coinBtn.addEventListener('click', insertCoin);
if (IS_ATTRACT) { muted = true; overlay.classList.add('hidden'); }

// read-only debug / recording hook (camera-follow scripts, QA)
window.__JJ = {
  get state() { return state; }, get G() { return G; }, get player() { return player; }, get joe() { return joe; },
  get panel() { return panel; }, VIEW, WORLD_W, get WORLD_H() { return WORLD_H; }, MARKER, hud, S, STATIONS, TABLES,
  startGame, startDay, nextDay, unlock, buyShop, buyUpgrade, spawnGuest, get fontsReady() { return fontsReady; },
};

// ── INIT ─────────────────────────────────────────────────────────────────────
buildAllArt();
resize();
if (IS_ATTRACT) startGame();
requestAnimationFrame(t => { tPrev = t; requestAnimationFrame(loop); });
})();
