<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORK IN PROGRESS — JnJ Arcade Lab</title>
<!--
  /wip — the Arcade LAB. Shows tester games as the SAME cabinet cassettes as the live site
  (Osimo 2026-06-16) so they can be reviewed exactly as they'll look. Reads wip-games.json via
  app.js (body[data-wip="1"] branch). Promote a finished game with tools/games/promote_game.py.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
<style>
  .wip-head{ text-align:center; padding:30px 18px 6px; }
  .wip-kicker{ font-size:11px; letter-spacing:.4em; color:var(--ink,#ffcf3d); opacity:.85; }
  .wip-head h1{ font-size:30px; font-weight:900; letter-spacing:.05em; margin:6px 0 4px; }
  .wip-sub{ font-size:13px; opacity:.6; max-width:520px; margin:0 auto; line-height:1.5; }
  .wip-back{ display:inline-block; margin-top:10px; color:var(--ink,#ffcf3d); text-decoration:none;
             font-size:12px; letter-spacing:.1em; opacity:.85; }
</style>
</head>
<body data-wip="1">
  <header class="wip-head">
    <div class="wip-kicker">JNJ ARCADE LAB</div>
    <h1>🛠️ WORK IN PROGRESS</h1>
    <p class="wip-sub">Every game we're testing, shown as its real cabinet. Play them, break them, tell us what to change. When one's ready it graduates to the arcade.</p>
    <a class="wip-back" href="index.html">‹ back to the arcade</a>
  </header>

  <main id="cabinets" aria-label="Tester games"></main>

  <!-- hidden stubs so app.js's shared setup is a no-op here -->
  <button id="fsBtn" hidden></button>
  <button id="a2hsBtn" hidden></button>
  <div id="a2hsSheet" hidden></div>
  <div id="toast"></div>

  <script src="arcade-scores.js?v=9"></script>
  <script src="app.js?v=wip6"></script>
</body>
</html>
