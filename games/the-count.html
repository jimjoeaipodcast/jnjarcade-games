<!-- ══════════════════════════════════════════════════════════════════════════
  THE COUNT — Jim & Joe's arcade, from the money side.
  Osimo 2026-09-04, picking concept 2 of four brainstormed with Grok Build:
  "make it like actual games where you start with little money and buy/pay for
  things that will help us yield more money just like the farmer games."

  You start with £5 and one working cabinet. Punters play, cabinets fill with
  coins, you empty them into your apron, you walk the takings to the safe next
  door, and you spend the takings on things that make the next day earn more.
  Rent is due every night and it goes up.

  THE JNJ PART: money is the only resource the arcade floor and the podcast
  actually share, so every pound is a choice between the two. Coins bought
  cabinets (Jimmy's side, more punters) or whisky (Joe's side, the show keeps
  recording, which is what pulls punters in). And you play BOTH hosts — whoever
  you are not driving stays where you left him, so pulling Joe off the mic to
  help carry coins costs you hype while he is away.

  Rooms are the jnj-on-air set (studio / arcade corridor / prop room) plus a new
  one to the LEFT of the studio: THE COIN CLOSET. Art regenerated to the mockup
  standard Osimo set, with the canonical McCarthy + Hinton portraits composited
  into the studio's frames.

  Conventions: 960x540 world letterboxed by VIEW, tap-to-walk point and click,
  INSERT COIN overlay, WebAudio-only sfx with the house speaker cycle,
  ArcadeScores options object. Structure follows games/jnj-on-air.html.
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100dvh; background: #000; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  #gameCanvas { display: block; width: 100vw; height: 100dvh; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 10;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             font-family: 'Courier New', monospace; color: #fff; text-align: center; padding: 18px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(24px, 6.5vw, 54px); letter-spacing: .06em;
                color: #e8c35a; text-shadow: 0 0 24px #e8c35a; }

          padding: 15px 34px; background: #e8c35a; color: #000; border: none;
          border-radius: 10px; cursor: pointer; margin: 6px; box-shadow: 0 0 26px #e8c35a; }

  /* Landscape nudge, same pattern as jnj-on-air: this is a 16:9 room game, so a portrait
     phone letterboxes it into a strip. Non-blocking on purpose — iOS cannot lock
     orientation, so it hints rather than gates, and hides the moment the phone turns. */
  #rotateHint { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotateHint { display: flex; position: fixed; top: 10px; left: 50%;
      transform: translateX(-50%); z-index: 9; align-items: center; gap: 8px;
      background: rgba(10,10,16,.92); color: #e8c35a; border: 1px solid #e8c35a55;
      border-radius: 10px; padding: 8px 14px; font-size: 12px; letter-spacing: .06em;
      pointer-events: none; font-family: 'Courier New', monospace; }
  }
</style>

<body>

     You start with <b>£5</b> and one working cabinet.<br><br>
     Empty the cabinets into your apron, walk the takings to the <b>safe</b> in the coin
     closet, and spend them on things that earn more tomorrow. <b>Rent is due every night

<script>
(function () {
'use strict';
const SLUG = 'the-count', ACCENT = '#e8c35a';
const WORLD_W = 960, WORLD_H = 540;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

// ── VIEW: fit the 960x540 world into whatever the device gives us ────────────
const VIEW = { scale: 1, ox: 0, oy: 0 };
let DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(canvas.clientWidth * DPR);
  canvas.height = Math.round(canvas.clientHeight * DPR);
  const sx = canvas.width / WORLD_W, sy = canvas.height / WORLD_H;
  // Osimo 2026-09-04: "make screen fit phones that are wider than 16:9 like my Google
  // pixel. so I don't get black lines on the side". A phone in landscape is ~20:9, so
  // fitting a 16:9 room by the SMALLER axis pillarboxes it. When the viewport is wider
  // than the room we now scale by WIDTH and let the room overflow vertically; when it is
  // taller (portrait) we fall back to fitting, because covering there would crop the room
  // down to a narrow slice. The vertical crop is biased 62/38 toward the ceiling so the
  // floor — where everything is tapped — always survives.
  VIEW.scale = (sx > sy) ? sx : Math.min(sx, sy);
  VIEW.ox = Math.round((canvas.width - WORLD_W * VIEW.scale) / 2);
  VIEW.oy = Math.round((canvas.height - WORLD_H * VIEW.scale) * (sx > sy ? 0.62 : 0.5));
}
window.addEventListener('resize', resize);
function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top) * DPR - VIEW.oy) / VIEW.scale };
}

// ── SFX — house style, no audio files. Speaker cycle is the house contract
//    (FLAP_FIGHT_BIBLE v10): this cabinet has no voice pack yet, so it runs the
//    two-state end of it, 🔊 sound FX → 🔇 mute. ─────────────────────────────
let audioCtx = null, muted = false;
try { muted = localStorage.getItem('sfxMuted_' + SLUG) === '1'; } catch (e) {}
// Osimo 2026-09-04: "put the 3 jingles in there from crushtris". Same three files
// candy-tris uses, same quiet backing-bed volume; the speaker button cycles
// 🔊 sound FX → the three jingles in turn → 🔇 mute, and the choice persists.
const JINGLES = [
  { label: '8-BIT',      file: '../assets/audio/candy-tris/jingle-8bit-town.mp3' },
  { label: 'MUSIC BOX',  file: '../assets/audio/candy-tris/jingle-music-box.mp3' },
  { label: 'RETRO WAVE', file: '../assets/audio/candy-tris/jingle-retro-wave.mp3' },
];
const MUSIC_VOL = 0.32;
let musicIdx = -1, musicEl = null;      // -1 = no music, 0..2 = a jingle
try { const mi = parseInt(localStorage.getItem('music_' + SLUG), 10);
      if (mi >= 0 && mi < JINGLES.length) musicIdx = mi; } catch (e) {}
function applyMusic() {
  if (musicEl) { musicEl.pause(); musicEl = null; }
  if (musicIdx < 0 || muted || state === 'attract') return;
  const a = new Audio(JINGLES[musicIdx].file);
  a.loop = true; a.volume = MUSIC_VOL;
  a.play().catch(() => {});
  musicEl = a;
}
function cycleSound() {
  // sfx → jingle 1 → jingle 2 → jingle 3 → mute → sfx …
  if (muted) { muted = false; musicIdx = -1; }
  else if (musicIdx < 0) musicIdx = 0;
  else if (musicIdx < JINGLES.length - 1) musicIdx++;
  else { muted = true; musicIdx = -1; }
  try {
    localStorage.setItem('sfxMuted_' + SLUG, muted ? '1' : '0');
    localStorage.setItem('music_' + SLUG, String(musicIdx));
  } catch (e) {}
  applyMusic();
  if (!muted) say(musicIdx < 0 ? 'Sound FX only.' : JINGLES[musicIdx].label + ' playing.');
}
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const jit = 1 + (Math.random() * 2 - 1) * 0.04;          // LittleJS pitch jitter
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0 * jit, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1 * jit), t + dur);
    g.gain.setValueAtTime(vol || 0.14, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  coin:   () => { tone(880, 1320, 0.07, 'square', 0.13); setTimeout(() => tone(1320, 1760, 0.07, 'square', 0.10), 60); },
  bank:   () => { tone(320, 880, 0.22, 'triangle', 0.16); },
  buy:    () => { tone(440, 660, 0.12, 'sawtooth', 0.13); setTimeout(() => tone(660, 990, 0.14, 'sawtooth', 0.12), 110); },
  deny:   () => { tone(220, 130, 0.18, 'square', 0.12); },
  jam:    () => { tone(180, 90, 0.3, 'sawtooth', 0.14); },
  fix:    () => { tone(500, 900, 0.13, 'triangle', 0.13); },
  pour:   () => { tone(300, 420, 0.3, 'sine', 0.10); },
  punter: () => { tone(660, 880, 0.06, 'sine', 0.07); },
  swap:   () => { tone(520, 780, 0.09, 'triangle', 0.11); },
  day:    () => { tone(392, 523, 0.2, 'triangle', 0.15); setTimeout(() => tone(523, 784, 0.3, 'triangle', 0.14), 190); },
  bust:   () => { tone(300, 70, 0.7, 'sawtooth', 0.17); },
  box:    () => { tone(140, 700, 0.35, 'sawtooth', 0.15); },
};

// ── ART PACK — 4 room plates (320x180 drawn at 3x) + sprites ────────────────
const PLATES = {}, SPR = {};
let packState = 'idle';
function loadPack() {
  if (packState !== 'idle') return;
  packState = 'loading';
  fetch('the-count-pack.json?v=5').then(r => r.json()).then(p => {
    const mk = (src, cb) => { const im = new Image(); im.onload = () => cb(im); im.src = src; };
    for (const k in p.art) mk(p.art[k], im => { PLATES[k] = im; });
    for (const k in p.sprites) {
      const v = p.sprites[k];
      if (Array.isArray(v)) { SPR[k] = []; v.forEach((u, i) => mk(u, im => { SPR[k][i] = im; })); }
      else mk(v, im => { SPR[k] = im; });
    }
    packState = 'ready';
  }).catch(() => { packState = 'failed'; });   // canvas fallback below keeps it playable
}

// ── the studio's big screen plays the real smoke title b-roll ──────────────
// Osimo 2026-09-04: "big screen should have our Jimmy & Joe smoke b roll". Same clip the
// show's cold open uses (assets/diorama/jimmy-joe-title-LOOP.mp4), cut to 12s and squeezed
// to 256x144 @15fps — 10KB, so it costs nothing to ship inside a room. Rect measured
// against the studio plate, not guessed.
const TV = { x: 352, y: 108, w: 256, h: 146 };
let tvVideo = null;
function tvFrame() {
  if (!tvVideo) {
    const v = document.createElement('video');
    v.src = '../assets/footage/jnj-smoke-screen.mp4?v=1';
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
    v.play().catch(() => {});
    tvVideo = v;
  }
  if (tvVideo.readyState >= 2 && tvVideo.videoWidth) {
    ctx.save();
    ctx.drawImage(tvVideo, TV.x, TV.y, TV.w, TV.h);
    // a little screen glow spilling onto the brick, so it reads as ON
    const g = ctx.createRadialGradient(TV.x + TV.w / 2, TV.y + TV.h / 2, 10,
                                       TV.x + TV.w / 2, TV.y + TV.h / 2, TV.w * 0.9);
    g.addColorStop(0, 'rgba(255,214,140,0.10)');
    g.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(TV.x - 90, TV.y - 60, TV.w + 180, TV.h + 140);
    ctx.restore();
  }
}

// ── ROOMS ────────────────────────────────────────────────────────────────────
// Left to right: coinroom | studio | corridor | prop. walkX is where a host has
// to stand to use a hotspot; hit-testing is FIRST MATCH, so exits and small
// interactive props are listed BEFORE big scenery (the jnj-on-air lesson —
// a chesterfield rect listed above a doorway silently ate the doorway).
const ORDER = ['coinroom', 'studio', 'corridor', 'prop'];
// Osimo 2026-09-04: "make everyone a lot bigger, so they may [reach] the height of the
// consoles, maybe make jnj bigger too same height as each other". Hosts are one height
// everywhere; punters are sized PER CABINET because the corridor art recedes — a punter
// at the far machine has to be smaller or he reads as a giant standing in the doorway.
// ONE box for both hosts. Osimo 2026-09-04: "stick to Jimmy size and shape as per image
// but make Joe identical height and width". The source sprites are different shapes
// (jimmyFront 40x57, joeFront 38x60), so scaling both to a common HEIGHT still left Joe
// visibly narrower and shorter-looking. Both are now drawn into the SAME rendered box,
// which is Jimmy's — 213 tall by 142 wide, his own 38px-wide content stretched 12% in
// height at unchanged width, exactly as asked last round.
const HOST_BOX = { w: 142, h: 213 };
// FIVE playable machines (Osimo 2026-09-04: "make all 5 arcades available in total for
// game play"): four down the left wall, one on the right. The corridor plate is now the
// ALL-SCREENS-OFF art, so an unpowered machine simply LOOKS off — no translucent rectangle
// painted over it. A powered one gets its own lit game picture blitted into the screen
// quad, plus the light it throws into the room.
const MACHINES = [
  // PUNTER PLACEMENT, 2026-09-05. Osimo read five cells off a grid overlaid on a live
  // frame — M21, O19, R17, T16, AI21 — each one the tip of that punter's LEFT foot. Cell
  // letter i is world x = i*20 + 10, row n is world y = (n-1)*20 + 10, so those points are
  // (250,410) (290,370) (350,330) (390,310) (690,410).
  // The sprite is 35x64 and its baseline foot pixels run 0.314w..0.857w from its left
  // edge, so the LEFT foot tip sits 0.186w left of the sprite centre — measured off the
  // sprite, not guessed. punter.x below is therefore tip + 0.186w (and tip + 0.357w for
  // the mirrored right-hand machine, where the near foot is the mirrored one).
  // Heights come from the head line Osimo drew earlier — head(x) = 255 - 0.057(x-246) —
  // so each punter is exactly as tall as the gap between his foot point and that line.
  { pay: 22, secs: 4.5, body: [100, 185, 152, 240], screen: [170, 213, 214, 261],
    punter: { h: 155, feet: 410, x: 266 }, flip: false },
  { pay: 34, secs: 7.0, body: [240, 195,  72, 200], screen: [246, 216, 286, 256],
    punter: { h: 118, feet: 370, x: 302 }, flip: false },
  { pay: 16, secs: 3.2, body: [300, 205,  52, 168], screen: [305, 219, 332, 252],
    punter: { h:  81, feet: 330, x: 358 }, flip: false },
  { pay: 48, secs: 9.5, body: [345, 210,  42, 145], screen: [350, 222, 374, 249],
    punter: { h:  63, feet: 310, x: 396 }, flip: false },
  { pay: 70, secs: 12.0, body: [686, 150, 130, 275], screen: [736, 216, 778, 260],
    punter: { h: 155, feet: 410, x: 720 }, flip: true },
];
const CAB_N = MACHINES.length;
const ROOMS = {
  coinroom: {
    name: 'THE COIN CLOSET', floorY: 470,
    hotspots: [
      { id: 'toStudio', x: 880, y: 150, w: 80, h: 340, walkX: 890, label: 'TO THE STUDIO', exit: 'studio' },
      { id: 'safe',     x: 690, y: 300, w: 130, h: 150, walkX: 690, label: 'THE SAFE' },
      // Osimo 2026-09-04: "finding what to click for the ledger is too small, anywhere on
      // the desk should cover it" — the hotspot is the whole desk now, top to floor.
      { id: 'ledger',   x: 386, y: 268, w: 286, h: 210, walkX: 470, label: 'THE LEDGER' },
      { id: 'counter',  x: 60,  y: 250, w: 170, h: 220, walkX: 210, label: 'COIN COUNTER' },
    ],
  },
  studio: {
    name: 'THE STUDIO', floorY: 480,
    hotspots: [
      { id: 'toCoin',   x: 0,   y: 150, w: 70,  h: 340, walkX: 60,  label: 'TO THE COIN CLOSET', exit: 'coinroom' },
      { id: 'toCorr',   x: 890, y: 150, w: 70,  h: 340, walkX: 900, label: 'TO THE ARCADE', exit: 'corridor' },
      { id: 'decanter', x: 400, y: 300, w: 90,  h: 90,  walkX: 420, label: 'THE DECANTER' },
      { id: 'mic',      x: 520, y: 270, w: 120, h: 120, walkX: 560, label: 'THE MIC' },
      { id: 'sofaL',    x: 90,  y: 290, w: 260, h: 140, walkX: 240, label: 'THE CHESTERFIELD' },
    ],
  },
  corridor: {
    name: 'THE ARCADE', floorY: 486,
    hotspots: MACHINES.map((m, i) => ({
      id: 'cab' + i, x: m.body[0], y: m.body[1], w: m.body[2], h: m.body[3],

    })).concat([
      { id: 'toStudio2', x: 0,   y: 150, w: 56,  h: 340, walkX: 60,  label: 'TO THE STUDIO', exit: 'studio' },
      { id: 'toProp',    x: 428, y: 155, w: 94,  h: 155, walkX: 470, label: 'PROP ROOM', exit: 'prop' },

      { id: 'vending',   x: 627, y: 167, w: 54,  h: 164, walkX: 600, label: 'VENDING MACHINE' },
    ]),
  },
  prop: {
    name: 'THE PROP ROOM', floorY: 480,
    hotspots: [
      // Osimo 2026-09-04: "once I entered to store room at the end of the corridor could
      // only exit to the right make it left and right". The prop room is through a door in
      // the MIDDLE of the corridor, so either end of it should put you back on the floor.
      { id: 'toCorrL',  x: 0,   y: 150, w: 70,  h: 340, walkX: 65,  label: 'BACK TO THE ARCADE', exit: 'corridor' },
      { id: 'toCorr2',  x: 890, y: 150, w: 70,  h: 340, walkX: 895, label: 'BACK TO THE ARCADE', exit: 'corridor' },
      { id: 'whisky',   x: 250, y: 300, w: 130, h: 130, walkX: 300, label: 'WHISKY CRATE' },
      { id: 'bitsBox',  x: 420, y: 320, w: 130, h: 110, walkX: 430, label: 'BITS BOX — DO NOT OPEN' },
      { id: 'parts',    x: 600, y: 260, w: 120, h: 190, walkX: 610, label: 'SPARE PARTS' },

// ── ECONOMY ──────────────────────────────────────────────────────────────────
// Everything is PENCE so nothing ever hits a float rounding edge; only the HUD
// divides by 100. Osimo's ask: "start with little money and buy/pay for things
// that will help us yield more money just like the farmer games."
const START_CASH = 500;                 // £5.00
const DAY_MS = 100000;                  // a shift is 100 seconds
const RENT = d => 300 + (d - 1) * 250;  // £3 on day one, +£2.50 a night after
const UPGRADES = [
  { id: 'cab2',    name: 'POWER UP CABINET 2', cost: 800,  once: true, icon: 'cab',
    blurb: 'A second machine earning at the same time.' },
  { id: 'cab3',    name: 'POWER UP CABINET 3', cost: 2000, once: true, icon: 'cab',
    blurb: 'Three machines. Three queues.' },
  { id: 'cab4',    name: 'POWER UP CABINET 4', cost: 3600, once: true, icon: 'cab',
    blurb: 'The one at the dark end of the row.' },
  { id: 'cab5',    name: 'POWER UP THE RED ONE', cost: 5200, once: true, icon: 'cab',
    blurb: 'The big machine on the right. Earns the most.' },
  { id: 'apron',   name: 'BIGGER APRON',       cost: 600,  max: 3, scale: 2.2, icon: 'apron',
    blurb: 'Carry more coins per trip to the safe.' },
  { id: 'marquee', name: 'MARQUEE LIGHTS',     cost: 1200, once: true, icon: 'bulb',
    blurb: 'People can see the place. Punters arrive faster.' },
  { id: 'sticks',  name: 'NEW JOYSTICKS',      cost: 1000, once: true, icon: 'stick',
    blurb: 'Cabinets jam far less often.' },
  { id: 'onair',   name: 'ON AIR SIGN',        cost: 1600, once: true, icon: 'onair',
    blurb: 'The show reads as live. Hype drains slower.' },
  { id: 'crate',   name: 'WHISKY CRATE',       cost: 900,  once: true, icon: 'bottle',
    blurb: 'The decanter holds double. Fewer trips to the prop room.' },
  { id: 'counter', name: 'COIN COUNTER',       cost: 2500, once: true, icon: 'coin',
    blurb: 'The safe pays a 10% counting bonus on every bag.' },
];

let cash, carry, day, dayEndsAt, hype, decanter, bottles, cabs, owned, apronLvl;
let banked, punters, floaters, coins, state, room, msg, msgUntil, shopOpen;
let lastTs, dayPaused, turnedAway = 0;
let tutorial = -1, talkUntil = 0, talkWho = 'jimmy';   // tutorial step, and who is speaking
let boxOpenedToday = false;   // the DO NOT OPEN box is a once-a-night decision, not a tap

function apronCap() { return Math.round(60 * Math.pow(2.2, apronLvl)); }
function has(id) { return !!owned[id]; }
function cabCount() { return 1 + ['cab2', 'cab3', 'cab4', 'cab5'].filter(has).length; }

function newRun() {
  cash = START_CASH; carry = 0; day = 1; hype = 80; decanter = 3; bottles = 0;
  banked = 0; apronLvl = 0; owned = {}; punters = []; floaters = []; coins = [];
  cabs = MACHINES.map(() => ({ till: 0, jam: false, cursed: false, busy: null, playT: 0 }));
  room = 'corridor'; shopOpen = false; msg = ''; msgUntil = 0;
  dayEndsAt = performance.now() + DAY_MS; dayPaused = false; turnedAway = 0; boxOpenedToday = false;
  hosts.jimmy = { room: 'corridor', x: 300, target: 300, walk: 0, face: 1 };
  hosts.joe   = { room: 'studio',   x: 560, target: 560, walk: 0, face: 1 };
  active = 'jimmy';
}
const hosts = { jimmy: null, joe: null };
let active = 'jimmy';
function me() { return hosts[active]; }
function other() { return hosts[active === 'jimmy' ? 'joe' : 'jimmy']; }
function otherName() { return active === 'jimmy' ? 'joe' : 'jimmy'; }

function say(t, ms) { msg = t; msgUntil = performance.now() + (ms || 2200); }

// Osimo 2026-09-04: "first time playing just like the farming games you should have speech
// bubbles explainers (for now the we use Jimmy tts)". Six lines, in Jimmy's voice, each
// anchored over whichever host you are driving, advanced by tapping. Shown once per device
// — TIP_KEY — and the text is already written as spoken lines so the TTS pass is a render,
// not a rewrite.
const TIP_KEY = 'tc_tips_v1';
const TIPS = [
  { text: "Right — one machine working, a fiver in the tin, and rent due at midnight.", icon: 'icCoin' },
  { text: "Punters play and the coins pile up INSIDE the cabinet. Tap the machine to empty it into your apron.", icon: 'icCab' },
  { text: "Your apron only holds so much. Walk left, past the studio, to the coin closet.", icon: 'icApron' },
  { text: "The safe eats the bags. The ledger beside it is where you spend what's in it.", icon: 'icCounter' },
  { text: "Buy a second cabinet first. Two machines earn while you are walking.", icon: 'icCab', qty: 2 },
  { text: "That's Joe on the mic. Pull him off it and hype drops — hype is how fast punters turn up.", icon: 'icOnair' },
  // Osimo 2026-09-04: "do they explain how to pay rent?" — they do now, and it is the last
  // thing said, because it is the thing that ends the run.
  { text: "Rent comes out of the safe on its own at midnight, every night, and it goes up. Bank before the clock runs out or that's the run.", icon: 'icCounter' },
];
function tipsSeen() { try { return localStorage.getItem(TIP_KEY) === '1'; } catch (e) { return true; } }
function startTips() { if (!tipsSeen()) { tutorial = 0; talkWho = 'jimmy'; talkUntil = performance.now() + 9e5; } }
function nextTip() {
  tutorial++;
  if (tutorial >= TIPS.length) {
    tutorial = -1; talkUntil = 0;
    try { localStorage.setItem(TIP_KEY, '1'); } catch (e) {}
  }
}
// Township-style bubble (Osimo 2026-09-04: "graphics are more important than written
// stuff… speech bubbles with images let you know where to drop off anything collected, and
// speech bubbles with image and quantities of what you need to pick up"): a round portrait
// badge outside the bubble, a short line inside, and the THING itself drawn as an icon with
// a quantity rather than spelled out. Screen space, so the wide-phone crop cannot clip it.
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBubble(SW, SH) {
  if (tutorial < 0) return;
  const t = TIPS[tutorial];
  ctx.font = '17px "Barlow Condensed",sans-serif';
  // Osimo 2026-09-04: "make sure it's not that wide if it doesn't have to". Measure the
  // longest word-wrapped line and size the bubble to THAT, not to the maximum allowed.
  const maxW = Math.min(430, SW - 200);
  const words = t.text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    if (ctx.measureText(cur + ' ' + w).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  const iconH = t.icon ? 50 : 0;
  let textW = 0;
  for (const l of lines) textW = Math.max(textW, ctx.measureText(l).width);
  const bw = Math.max(190, Math.min(maxW, textW) + 28), bh = 22 + lines.length * 21 + iconH;
  const px = 104, py = Math.max(56, SH - bh - 72);
  const po = SPR.poJimmy;
  if (po) ctx.drawImage(po, px - 84, py + bh / 2 - 36, 72, 72);
  ctx.fillStyle = 'rgba(252,246,232,0.97)';
  roundRect(px, py, bw, bh, 12); ctx.fill();
  ctx.strokeStyle = '#7a4a1a'; ctx.lineWidth = 3;
  roundRect(px, py, bw, bh, 12); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px, py + bh / 2 - 10); ctx.lineTo(px - 15, py + bh / 2);
  ctx.lineTo(px, py + bh / 2 + 10); ctx.closePath();
  ctx.fillStyle = 'rgba(252,246,232,0.97)'; ctx.fill();
  ctx.strokeStyle = '#7a4a1a'; ctx.stroke();
  ctx.fillStyle = '#5a3618'; ctx.font = 'bold 17px "Barlow Condensed",sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, px + 14, py + 26 + i * 21));
  if (t.icon) {
    const iy = py + 22 + lines.length * 21, im = SPR[t.icon];
    if (im) ctx.drawImage(im, px + 12, iy, 44, 44);      // cut-out art, no tile behind it
    if (t.qty) {
      ctx.fillStyle = '#1f6b3a'; ctx.font = 'bold 26px "Barlow Condensed",sans-serif';
      ctx.fillText('\u00d7' + t.qty, px + 62, iy + 32);
    }
  }
  ctx.fillStyle = 'rgba(122,74,26,0.75)'; ctx.font = 'bold 12px "Barlow Condensed",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('TAP TO CONTINUE  ' + (tutorial + 1) + '/' + TIPS.length, px + bw - 12, py + bh - 9);
  ctx.textAlign = 'left';
}

// ── the floor: punters arrive, pick a free cabinet, play, pay, leave ─────────
// Cabinets are the crop. A punter only lands if a cabinet is powered, unjammed
// and free — every punter turned away is money that never existed, which is
// what makes buying the second and third cabinet feel like a real decision.
function freeCab() {
  for (let i = 0; i < cabCount(); i++) {
    const c = cabs[i];
    if (!c.jam && !c.busy) return i;
  }
  return -1;
}
let nextPunter = 0;
function updateFloor(dt, now) {
  const rate = (2600 - hype * 12) / (has('marquee') ? 1.35 : 1);
  if (now > nextPunter) {
    nextPunter = now + rate * (0.6 + Math.random() * 0.8);
    const ci = freeCab();
    if (ci >= 0) {
      const c = cabs[ci];
      c.busy = { spr: ['punter34A', 'punter34B', 'punter34C'][Math.floor(Math.random() * 3)] };
      c.playFull = MACHINES[ci].secs * 1000 * (0.85 + Math.random() * 0.3);
      c.playT = c.playFull;
      SFX.punter();
    } else if (hype > 12) {
      hype -= 1.2;                     // turned away, and they tell people
      turnedAway++;                    // shown once on the HUD, not flashed mid-screen
    }
  }
  for (let i = 0; i < cabs.length; i++) {
    const c = cabs[i];
    if (i >= cabCount()) { c.busy = null; continue; }
    if (!c.busy) continue;
    c.playT -= dt;
    if (c.playT <= 0) {
      const take = Math.round(MACHINES[i].pay * (0.8 + Math.random() * 0.4) *
                              (c.cursed ? 0.45 : 1) * (1 + hype / 220));
      c.till += take;
      c.busy = null;
      if (room === 'corridor') {
        const hs = ROOMS.corridor.hotspots.find(h => h.cab === i);
        floaters.push({ x: hs.x + hs.w / 2, y: hs.y + 40, t: now, txt: '+' + take + 'p', col: '#ffd75e' });
      }
      // jam roll — the one thing that stops a cabinet earning until you walk over
      const jamChance = (c.cursed ? 0.22 : 0.10) * (has('sticks') ? 0.4 : 1);
      if (Math.random() < jamChance) { c.jam = true; SFX.jam(); }
    }
  }
}

// ── hype: the show is what pulls punters in ─────────────────────────────────
// Joe standing in the studio IS the show. Take him out to carry coins and hype
// falls three times faster — that is the whole Jimmy-versus-Joe tension.
function updateHype(dt) {
  const joeOnMic = hosts.joe.room === 'studio';
  let drain = (joeOnMic && decanter > 0) ? 0.55 : 1.1;
  if (has('onair')) drain *= 0.6;
  if (joeOnMic && decanter > 0) {
    hype += 0.35 * (dt / 1000);
    // one measure roughly every 40s of talking, so a full decanter outlasts a shift and
    // the whisky run is a chore you plan, not an emergency every eighty seconds. (First
    // tuning burned a measure every 26s: the decanter emptied inside one day and hype
    // hit 1 by the bell.)
    if (Math.random() < dt / 40000) {
      decanter = Math.max(0, decanter - 1);
      if (decanter === 0) say('The decanter is dry — Joe is winding down. Crate is in the prop room.', 3200);
    }
  }
  hype -= drain * (dt / 1000);
  hype = Math.max(0, Math.min(100, hype));
}

// ── interactions ─────────────────────────────────────────────────────────────
function act(h) {
  const now = performance.now();
  if (h.exit) { changeRoom(h.exit); return; }
  if (h.cab !== undefined) {
    const i = h.cab, c = cabs[i];
    if (i >= cabCount()) { say('That one has no power. Buy it at the ledger.'); SFX.deny(); return; }
    if (c.jam) { c.jam = false; SFX.fix(); say('Unjammed. Back in service.'); return; }
    if (c.till <= 0) { say('Empty. Let someone play it.'); SFX.deny(); return; }
    const room4 = apronCap() - carry;
    if (room4 <= 0) { say('Apron is full — bank it at the safe.'); SFX.deny(); return; }
    const took = Math.min(c.till, room4);
    c.till -= took; carry += took;
    SFX.coin();
    floaters.push({ x: h.x + h.w / 2, y: h.y + 30, t: now, txt: '+' + took + 'p', col: '#ffd75e' });
    if (c.till > 0) say('Apron full at ' + carry + 'p — some left in the machine.');
    return;
  }
  switch (h.id) {
    case 'safe': {
      if (carry <= 0) { say('Nothing to bank.'); SFX.deny(); return; }
      const bonus = has('counter') ? Math.round(carry * 0.1) : 0;
      cash += carry + bonus; banked += carry + bonus;
      floaters.push({ x: h.x + h.w / 2, y: h.y, t: now,
                      txt: '+' + ((carry + bonus) / 100).toFixed(2) + (bonus ? ' (+10%)' : ''), col: '#8effc2' });
      carry = 0; SFX.bank();
      return;
    }
    case 'ledger':  shopOpen = true; return;
    case 'counter': say('The counter does the counting. The safe takes the bags.'); return;
    case 'decanter': {
      if (decanter >= (has('crate') ? 6 : 3)) { say('Still full.'); SFX.deny(); return; }
      if (bottles <= 0) { say('No bottle on you. There is a crate in the prop room.'); SFX.deny(); return; }
      bottles--; decanter = has('crate') ? 6 : 3; SFX.pour();
      say('Poured. Joe will keep talking.');
      return;
    }
    case 'whisky': {
      if (bottles >= 2) { say('Two bottles is all you can carry.'); SFX.deny(); return; }
      bottles++; SFX.fix(); say('Bottle taken. The decanter is in the studio.');
      return;
    }
    case 'parts': {
      const jammed = cabs.findIndex((c, i) => i < cabCount() && c.jam);
      if (jammed < 0) { say('Nothing jammed right now.'); return; }
      cabs[jammed].jam = false; SFX.fix(); say('Fixed cabinet ' + (jammed + 1) + ' from here.');
      return;
    }
    case 'bitsBox': {
      // THE ONE TWIST (Grok Build, Joe's version): the only free money in the game, and it
      // permanently sours a machine for the night. Osimo 2026-09-04: "why am I getting
      // infinite cash by tapping that box" — because it paid out on EVERY tap and, once
      // every cabinet was already cursed, it paid with no cost at all. It now costs a
      // cabinet every time: no clean cabinet left, no payout. One box per night either way.
      const live = [];
      for (let i = 0; i < cabCount(); i++) if (!cabs[i].cursed) live.push(i);
      if (boxOpenedToday) { say('You have had your hand in there once tonight already.'); SFX.deny(); return; }
      if (!live.length) { say('Every machine is already ruined. The box has nothing to take.'); SFX.deny(); return; }
      boxOpenedToday = true;
      const win = 250 + Math.round(Math.random() * 400);
      const c = live[Math.floor(Math.random() * live.length)];
      cabs[c].cursed = true;
      cash += win; banked += win; SFX.box();
      say('£' + (win / 100).toFixed(2) + ' in the box. Cabinet ' + (c + 1) + ' has never been the same since.', 3200);
      floaters.push({ x: h.x + h.w / 2, y: h.y, t: now, txt: '+' + (win / 100).toFixed(2), col: '#c96bff' });
      return;
    }
    case 'mic':
      say(hosts.joe.room === 'studio' ? 'Joe is on it. Leave him there.' : 'Nobody on the mic. Hype is draining.');
      return;
    case 'vending': say('Stocked for now.'); return;
    case 'cooler':  say('Cold water. No money in it.'); return;
    case 'change':  say('The machine takes notes and gives coins. The coins end up in the cabinets.'); return;
    default: say(h.label);
  }
}

function changeRoom(to) {
  const h = me();
  // enter from the side you walked in from: going RIGHT along ORDER puts you at the
  // left edge of the new room, going LEFT puts you at the right edge. (The first cut
  // of this picked a random edge, which teleported you across the room half the time.)
  const from = h.room;
  const goingRight = ORDER.indexOf(to) > ORDER.indexOf(from);
  h.room = to; room = to;
  // coming back out of the prop room you step through the door in the middle of the
  // corridor, not in at one end — either prop-room exit lands you at the same doorway
  h.x = h.target = (from === 'prop' && to === 'corridor') ? 480 : (goingRight ? 150 : 810);
  shopOpen = false;
  pending = null;
}

// ── shop ─────────────────────────────────────────────────────────────────────
function upgradeCost(u) {
  if (u.max) return Math.round(u.cost * Math.pow(u.scale, apronLvl));
  return u.cost;
}
function upgradeAvailable(u) {
  if (u.once) return !has(u.id);
  if (u.max) return apronLvl < u.max;
  return true;
}
function buy(u) {
  const c = upgradeCost(u);
  if (cash < c) { SFX.deny(); say('Not enough. ' + ((c - cash) / 100).toFixed(2) + ' short.'); return; }
  cash -= c;
  if (u.max) apronLvl++; else owned[u.id] = true;
  SFX.buy();
  say(u.name + ' — bought.');
}

// ── day cycle ────────────────────────────────────────────────────────────────
function endDay() {
  const rent = RENT(day);
  dayPaused = true;
  if (cash < rent) {
    state = 'bust'; SFX.bust();
    setTimeout(() => {
      ArcadeScores.show({ game: SLUG, title: 'THE COUNT', score: banked, accent: ACCENT,
                          onClose: () => { newRun(); state = 'play'; } });
    }, 900);
    return;
  }
  cash -= rent; day++; turnedAway = 0; boxOpenedToday = false; SFX.day();   // per shift
  for (const c of cabs) { c.cursed = false; c.jam = false; }   // a new night, clean machines
  hype = Math.min(100, hype + 10);
  dayEndsAt = performance.now() + DAY_MS;
  dayPaused = false;
  say('RENT PAID £' + (rent / 100).toFixed(2) + ' — DAY ' + day, 3000);
}

// ── input ────────────────────────────────────────────────────────────────────
function hotspotAt(wx, wy) {
  for (const h of ROOMS[room].hotspots) {
    if (wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h) return h;
  }
  return null;
}
let pending = null;
function onTap(e) {
  unlockAudio();
  if (state !== 'play') return;
  const p = e.changedTouches ? e.changedTouches[0] : e;
  const w = toWorld(p.clientX, p.clientY);
  if (e.cancelable) e.preventDefault();

  if (tutorial >= 0) { nextTip(); return; }        // the tutorial owns the tap while it is up
  if (shopOpen) {                                  // the shop is screen-space furniture
    const sr = canvas.getBoundingClientRect();
    shopTap({ x: p.clientX - sr.left, y: p.clientY - sr.top });
    return;
  }
  // the chevrons are painted at the doorways; tapping one walks you to that exit like
  // any other hotspot, so no separate screen-space hit test is needed
  // speaker button, top right
  if (w.x > WORLD_W - 56 && w.y < 46) { cycleSound(); return; }
  // tap the other host to take him over — he stays exactly where you left him
  const o = other();
  if (o.room === room && Math.abs(w.x - o.x) < 46 && w.y > ROOMS[room].floorY - 130) {
    active = otherName(); SFX.swap();
    say('You are ' + (active === 'jimmy' ? 'JIMMY' : 'JOE') + ' now.');
    return;
  }
  const h = hotspotAt(w.x, w.y);
  if (h) { me().target = Math.max(60, Math.min(WORLD_W - 60, h.walkX)); pending = h; return; }
  me().target = Math.max(40, Math.min(WORLD_W - 40, w.x));
  pending = null;
}
canvas.addEventListener('touchstart', onTap, { passive: false });
canvas.addEventListener('mousedown', onTap);

// ── shop UI (drawn on the canvas so it scales with everything else) ──────────
// Laid out in SCREEN space (like the HUD): the room is cover-cropped on wide phones, and
// a world-space list lost its bottom rows off the edge of the crop.
function shopMetrics() {
  // Osimo 2026-09-04: "have him write them in the page not overlapped… following contour of
  // the pages". The book art has a gutter down the middle and its pages curve, so the list
  // is inset to the LEFT PAGE's writing area and each row is nudged along the page's own
  // curve instead of being laid out as a flat table across the whole screen.
  const SW = canvas.clientWidth, SH = canvas.clientHeight;
  const n = UPGRADES.filter(upgradeAvailable).length || 1;
  const top = Math.round(SH * 0.20), bottom = Math.round(SH * 0.10);
  const rowH = Math.max(24, Math.min(40, (SH - top - bottom) / n));
  const w = Math.round(SW * 0.325);                 // the left page, inside its red rule
  return { SW, SH, rowH, w, x: Math.round(SW * 0.165), top };   // fully ON the paper
}
// The book art's red margin rule leans left as it goes down the page (measured off the
// plate: about -0.11 px of x per px of y). Osimo 2026-09-04: "they should be parallel to
// the red line" — so every row is shifted along that same lean, and the whole column runs
// parallel to the rule instead of sitting square on a curved page.
const PAGE_LEAN = -0.11;
function pageCurve(i, n) {
  const t = n > 1 ? i / (n - 1) : 0.5;
  return Math.sin(t * Math.PI) * 4;                 // pages bow out in the middle
}
const SHOP_CLOSE_W = 118, SHOP_CLOSE_H = 38;
function shopCloseRect() {
  const { SW } = shopMetrics();
  return { x: SW - SHOP_CLOSE_W - 12, y: 10, w: SHOP_CLOSE_W, h: SHOP_CLOSE_H };
}
function shopRows() {
  const m = shopMetrics();
  const list = UPGRADES.filter(upgradeAvailable);
  return list.map((u, i) => {
    const y = m.top + i * m.rowH + pageCurve(i, list.length);
    return { u, x: m.x + (y - m.top) * PAGE_LEAN, y, w: m.w, h: m.rowH - 4 };
  });
}
function shopTap(w) {
  // Osimo 2026-09-04: "if you can't buy anything there's no intuitive way to exit the
  // menu". There is a CLOSE button now, and a tap anywhere off the list still closes it.
  const cl = shopCloseRect();
  if (w.x >= cl.x && w.x <= cl.x + cl.w && w.y >= cl.y && w.y <= cl.y + cl.h) { shopOpen = false; return; }
  for (const r of shopRows()) {
    if (w.x >= r.x && w.x <= r.x + r.w && w.y >= r.y && w.y <= r.y + r.h) { buy(r.u); return; }
  }
  shopOpen = false;
}
// Icons are Grok-drawn PNGs from the pack now, not shapes drawn in code (Osimo 2026-09-04:
// "we need reference PNG images on the menu"). ICON_FOR maps an upgrade's icon key to art.
const ICON_FOR = { cab: 'icCab', apron: 'icApron', bulb: 'icBulb', stick: 'icStick',
                   onair: 'icOnair', bottle: 'icBottle', coin: 'icCounter' };
function shopIcon(kind, x, y, size, on) {
  const im = SPR[ICON_FOR[kind] || 'icCoin'];
  if (!im) return;
  ctx.save();
  ctx.globalAlpha = on ? 1 : 0.42;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, Math.round(x - size / 2), Math.round(y - size / 2), size, size);
  ctx.imageSmoothingEnabled = true;
  ctx.restore();
}

// ── walking ──────────────────────────────────────────────────────────────────
function stepHost(h, dt) {
  const sp = 0.44 * dt;   // ~420 world px/s — crossing a room should cost ~2s, not 4
  if (Math.abs(h.target - h.x) > 3) {
    h.face = h.target > h.x ? 1 : -1;
    h.x += Math.sign(h.target - h.x) * Math.min(sp, Math.abs(h.target - h.x));
    h.walk += dt;
  } else if (pending && h === me()) {
    const p = pending; pending = null; act(p);
  }
}

// ── draw ─────────────────────────────────────────────────────────────────────
function drawPlate(id) {
  const im = PLATES[id];
  if (im) { ctx.imageSmoothingEnabled = false; ctx.drawImage(im, 0, 0, WORLD_W, WORLD_H); ctx.imageSmoothingEnabled = true; return; }
  ctx.fillStyle = '#241a14'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  ctx.fillStyle = '#3a2a20'; ctx.fillRect(0, ROOMS[id] ? ROOMS[id].floorY - 20 : 460, WORLD_W, WORLD_H);
}
function drawSprite(im, x, feetY, h) {
  if (!im) return false;
  const w = im.width * (h / im.height);
  return drawSpriteBox(im, x, feetY, w, h);
}
// draws into an EXACT box, so two sprites of different source shapes can be made to
// occupy identical space on screen
function drawSpriteBox(im, x, feetY, w, h) {
  if (!im) return false;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, Math.round(x - w / 2), Math.round(feetY - h), Math.round(w), Math.round(h));
  ctx.imageSmoothingEnabled = true;
  return true;
}
function drawHost(who, h) {
  const walking = Math.abs(h.target - h.x) > 3;
  const feet = ROOMS[h.room].floorY;
  const frames = who === 'jimmy' ? SPR.jimmyWalk : SPR.joeWalk;
  const still = who === 'jimmy' ? SPR.jimmyFront : SPR.joeFront;
  let im = still;
  if (walking && frames && frames.length) im = frames[Math.floor(h.walk / 110) % frames.length] || still;
  ctx.save();
  if (h.face < 0 && walking) { ctx.translate(h.x * 2, 0); ctx.scale(-1, 1); }
  const dx = h.x;
  // Both hosts fill the identical box. A walk frame keeps its own width RATIO against that
  // host's standing frame, so the stride still reads without changing how big he is.
  let boxW = HOST_BOX.w;
  if (walking && im !== still && still && still.width) boxW *= (im.width / still.width);
  if (!drawSpriteBox(im, dx, feet, boxW, HOST_BOX.h)) {
    ctx.fillStyle = who === 'jimmy' ? '#e8e2d8' : '#b0873c';
    ctx.fillRect(dx - HOST_BOX.w / 2, feet - HOST_BOX.h, HOST_BOX.w, HOST_BOX.h);
  }
  ctx.restore();
  if (who !== active) {                     // the one you are not driving
    ctx.fillStyle = 'rgba(232,195,90,0.85)';
    ctx.font = 'bold 13px "Barlow Condensed",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TAP TO SWAP', h.x, feet - HOST_BOX.h - 10);
    ctx.textAlign = 'left';
  }
}
// LIPSYNC REMOVED 2026-09-04. A dot-matrix mouth was painted over the sprite's own baked
// face; at play size it swallowed the eyes and read as a broken face, and Osimo called it:
// "faces broke... forget that faces let's carry on with the game". The sprites carry a
// perfectly good face already, so nothing is drawn over them now. If lipsync ever comes
// back it needs per-sprite visor rects baked into the pack, not a guessed fraction.

function drawPunters() {
  if (room !== 'corridor') return;
  // Osimo 2026-09-04: "could you make it look like people playing on the arcade are facing
  // the arcade playing". The sprites are already back-view, so what was wrong was the
  // PLACEMENT — they stood beside the machine on the shared floor line. Each punter now
  // stands on his own cabinet's base line, centred on its control panel, at that
  // cabinet's depth-appropriate size.
  // Osimo 2026-09-05: "you layered the punters backwards, you put the last punter on top
  // of everyone instead of below number 3". Painter's algorithm — the FURTHEST punter (the
  // one whose feet are highest up the floor) is drawn first, so the nearest ends up on top.
  const order = [];
  for (let i = 0; i < cabCount(); i++) if (cabs[i].busy) order.push(i);
  order.sort((a, b) => MACHINES[a].punter.feet - MACHINES[b].punter.feet);
  for (const i of order) {
    const c = cabs[i];
    const m = MACHINES[i], im = SPR[c.busy.spr];
    if (!im) continue;
    // Osimo 2026-09-04: "maybe we could do it subtly where the punters are like in black
    // and white and they regain colour at the rate that they are staying on the machine
    // for." So the punter IS the progress bar — he arrives drained of colour and fills up
    // from the feet as his session runs; when he is fully coloured, he pays and leaves.
    const prog = c.playFull ? Math.max(0, Math.min(1, 1 - c.playT / c.playFull)) : 1;
    ctx.save();
    if (m.flip) { ctx.translate(m.punter.x * 2, 0); ctx.scale(-1, 1); }
    const px = m.punter.x, feet = m.punter.feet, ph = m.punter.h;
    const pw = im.width * (ph / im.height);
    ctx.save();                                   // grey version, whole body
    ctx.filter = 'grayscale(1) brightness(0.78)';
    drawSprite(im, px, feet, ph);
    ctx.restore();
    if (prog > 0) {                               // colour rises from the feet
      ctx.save();
      ctx.beginPath();
      ctx.rect(px - pw / 2 - 2, feet - ph * prog, pw + 4, ph * prog + 2);
      ctx.clip();
      drawSprite(im, px, feet, ph);
      ctx.restore();
    }
    ctx.restore();
  }
}
function drawCabState() {
  if (room !== 'corridor') return;
  for (let i = 0; i < CAB_N; i++) {
    const m = MACHINES[i], c = cabs[i];
    const [sx, sy, sx1, sy1] = m.screen, sw = sx1 - sx, sh = sy1 - sy;
    const cx = sx + sw / 2;
    if (i >= cabCount()) {
      // OFF: the plate already draws dead black glass, so NOTHING is painted over the
      // machine (Osimo 2026-09-04: "remove those ugly transparent rectangles over the
      // arcades"). Just a price, so a dark machine reads as "buy me" and not "broken".
      badge(cx, sy - 6, '£' + (UPGRADES.find(u => u.id === 'cab' + (i + 1)).cost / 100).toFixed(2), '#9a9a9a');
      continue;
    }
    // SCREEN OVERLAYS REMOVED 2026-09-05 — Osimo: "remove those silly arcade screen
    // overlays, not working". Three attempts (square, sheared one way, sheared the other)
    // never sat convincingly on angled glass, so the plate's own artwork stands on every
    // machine and power state is read from the badges below instead.
    if (c.jam) badge(cx, sy - 6, '⚠ JAMMED', '#ff6b6b');
    else if (c.till > 0) badge(cx, sy - 6, c.till + 'p', c.cursed ? '#c96bff' : '#ffd75e');
    else if (c.cursed) badge(cx, sy - 6, 'CURSED', '#c96bff');
  }
}

function badge(cx, cy, txt, col) {
  ctx.font = 'bold 15px "Barlow Condensed",sans-serif';
  const w = ctx.measureText(txt).width + 16;
  ctx.fillStyle = 'rgba(8,6,4,0.78)';
  ctx.fillRect(cx - w / 2, cy - 18, w, 22);
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - w / 2, cy - 18, w, 22);
  ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.fillText(txt, cx, cy - 2);
  ctx.textAlign = 'left';
}
// Osimo 2026-09-04: "the arrows should only be like in jnj on air, simple, minimalist, and
// shouldn't have one for the store room as you have to click the door." So: no labelled
// boxes any more — a single small pulsing chevron sitting IN the room at each side
// doorway, exactly the jnj-on-air treatment, and the prop room is entered by tapping its
// door like any other object.
function sideExits() {
  const out = [];
  for (const h of ROOMS[room].hotspots) {
    if (!h.exit || h.exit === 'prop') continue;        // the prop door is not an arrow
    out.push({ h, dir: h.x < WORLD_W / 2 ? -1 : 1 });
  }
  return out;
}
function drawExitArrows(now) {
  const a = 0.4 + Math.sin(now * 0.004) * 0.25;
  for (const e of sideExits()) {
    const x = e.dir < 0 ? 30 : WORLD_W - 30, y = ROOMS[room].floorY - 70;
    ctx.fillStyle = 'rgba(232,195,90,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(x - 11 * e.dir, y - 15); ctx.lineTo(x + 11 * e.dir, y); ctx.lineTo(x - 11 * e.dir, y + 15);
    ctx.closePath(); ctx.fill();
  }
}

function drawHUD(now) {
  const SW = canvas.clientWidth, SH = canvas.clientHeight;
  ctx.save();
  ctx.fillStyle = 'rgba(6,5,4,0.62)';
  ctx.fillRect(0, 0, SW, 46);
  ctx.font = 'bold 25px "Barlow Condensed",sans-serif';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('£' + (cash / 100).toFixed(2), 14, 32);
  ctx.font = 'bold 17px "Barlow Condensed",sans-serif';
  ctx.fillStyle = carry >= apronCap() ? '#ff6b6b' : '#e8e2d8';
  ctx.fillText('APRON ' + carry + '/' + apronCap() + 'p', 128, 31);
  // hype bar — the show's pull on the floor
  const hx = 300, hw = 190;
  ctx.fillStyle = '#e8e2d8'; ctx.fillText('HYPE', hx, 31);
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(hx + 46, 16, hw, 15);
  ctx.fillStyle = hype > 55 ? '#8effc2' : hype > 25 ? '#ffd75e' : '#ff6b6b';
  ctx.fillRect(hx + 46, 16, hw * (hype / 100), 15);
  ctx.fillStyle = decanter > 0 ? '#e8c35a' : '#ff6b6b';
  ctx.fillText(decanter > 0 ? '🥃×' + decanter : '🥃 DRY', hx + hw + 58, 31);
  if (bottles) { ctx.fillStyle = '#e8c35a'; ctx.fillText('🍾×' + bottles, hx + hw + 132, 31); }
  // day + clock
  const left = Math.max(0, dayEndsAt - now);
  // Rent warning (Osimo 2026-09-04: "does a pop up warn you when you about to run out?").
  // Fires in the last 25 seconds and only while the safe is short — a warning you can
  // still do something about, not a post-mortem.
  if (!dayPaused && left < 25000 && cash < RENT(day)) {
    const short = (RENT(day) - cash) / 100;
    const pulse = 0.55 + 0.45 * Math.sin(now * 0.012);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = 'rgba(120,10,10,0.92)';
    ctx.fillRect(SW / 2 - 190, 52, 380, 34);
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
    ctx.strokeRect(SW / 2 - 190, 52, 380, 34);
    ctx.fillStyle = '#ffd7d7'; ctx.font = 'bold 17px "Barlow Condensed",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RENT £' + (RENT(day) / 100).toFixed(2) + ' DUE — £' + short.toFixed(2) +
                 ' SHORT. BANK NOW.', SW / 2, 75);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e8e2d8';
  ctx.fillText('DAY ' + day + '   RENT £' + (RENT(day) / 100).toFixed(2), SW - 66, 31);
  ctx.fillStyle = left < 15000 ? '#ff6b6b' : '#ffd75e';
  ctx.font = 'bold 22px "Barlow Condensed",sans-serif';
  ctx.fillText(Math.ceil(left / 1000) + 's', SW - 190, 31);
  ctx.textAlign = 'left';
  ctx.restore();
  // speaker
  ctx.font = '20px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(muted ? '🔇' : musicIdx >= 0 ? '🎵' : '🔊', SW - 14, 32);
  if (musicIdx >= 0 && !muted) {
    ctx.font = 'bold 11px "Barlow Condensed",sans-serif';
    ctx.fillStyle = 'rgba(232,195,90,0.8)';
    ctx.fillText(JINGLES[musicIdx].label, SW - 34, 32);
  }
  ctx.textAlign = 'left';
  // turned-away count — the quiet version of the old flashing NO FREE MACHINE
  if (turnedAway > 0) {
    // Osimo 2026-09-04: "instead of no free machine, maybe it should say, turn on more
    // machines, and place it somewhere where it doesn't show over the b-roll screen."
    // It now says what to DO, and sits low-left — the studio's big screen is dead centre,
    // which is exactly where this used to land.
    ctx.font = 'bold 14px "Barlow Condensed",sans-serif';
    ctx.fillStyle = 'rgba(255,107,107,0.92)';
    ctx.fillText('TURN ON MORE MACHINES — ' + turnedAway + ' walked out', 14, SH - 58);
  }
  // room name
  ctx.font = 'bold 15px "Barlow Condensed",sans-serif';
  ctx.fillStyle = 'rgba(232,195,90,0.65)'; ctx.textAlign = 'center';
  ctx.fillText(ROOMS[room].name, SW / 2, SH - 10);
  ctx.textAlign = 'left';
}
function drawShop() {
  const m = shopMetrics();
  // Osimo 2026-09-04: "make it more like a ledger Jimmy is holding open, and it's written
  // on the scroll you holding in first view as if you were Jimmy holding the scroll." The
  // panel is a Grok-drawn first-person held ledger and the list is written onto its pages.
  ctx.fillStyle = 'rgba(4,3,2,0.96)'; ctx.fillRect(0, 0, m.SW, m.SH);
  const bk = SPR.ledger;
  if (bk) {
    const sc = Math.max(m.SW / bk.width, m.SH / bk.height);
    const dw = bk.width * sc, dh = bk.height * sc;
    ctx.drawImage(bk, (m.SW - dw) / 2, (m.SH - dh) / 2, dw, dh);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5a3618'; ctx.font = 'bold 26px "Barlow Condensed",sans-serif';
  ctx.fillText('THE LEDGER', m.x + m.w / 2, Math.round(m.SH * 0.125));
  ctx.fillStyle = '#7a5a38'; ctx.font = 'bold 15px "Barlow Condensed",sans-serif';
  ctx.fillText('£' + (cash / 100).toFixed(2) + ' in the safe', m.x + m.w / 2, Math.round(m.SH * 0.163));
  ctx.textAlign = 'left';
  for (const r of shopRows()) {
    const c = upgradeCost(r.u), can = cash >= c;
    if (can) {                                   // an affordable line is ringed in pencil
      ctx.fillStyle = 'rgba(226,178,86,0.22)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = 'rgba(122,74,26,0.55)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }
    shopIcon(r.u.icon, r.x + 18, r.y + r.h / 2, Math.min(30, r.h), can);
    ctx.fillStyle = can ? '#3c2410' : '#8a795f';
    ctx.font = 'bold 16px "Barlow Condensed",sans-serif';
    ctx.fillText(r.u.name + (r.u.max ? ' ' + (apronLvl + 1) + '/' + r.u.max : ''), r.x + 42, r.y + 15);
    ctx.font = '12px "Barlow Condensed",sans-serif';
    ctx.fillStyle = can ? '#6b4a24' : '#9d8f77';
    ctx.fillText(r.u.blurb, r.x + 42, r.y + 28);
    ctx.textAlign = 'right';
    ctx.font = 'bold 18px "Barlow Condensed",sans-serif';
    ctx.fillStyle = can ? '#1f6b3a' : '#a05a5a';
    ctx.fillText('£' + (c / 100).toFixed(2), r.x + r.w - 6, r.y + 22);
    ctx.textAlign = 'left';
  }
  const cl = shopCloseRect();
  ctx.fillStyle = 'rgba(122,74,26,0.9)';
  ctx.fillRect(cl.x, cl.y, cl.w, cl.h);
  ctx.strokeStyle = '#e2b256'; ctx.lineWidth = 2;
  ctx.strokeRect(cl.x, cl.y, cl.w, cl.h);
  ctx.fillStyle = '#ffe9c0'; ctx.font = 'bold 18px "Barlow Condensed",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✕  CLOSE', cl.x + cl.w / 2, cl.y + 25);
  ctx.textAlign = 'left';
}
function drawFloaters(now) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i], age = now - f.t;
    if (age > 1200) { floaters.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - age / 1200;
    ctx.fillStyle = f.col; ctx.font = 'bold 21px "Barlow Condensed",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y - age * 0.03);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}
function drawMsg(now) {
  if (!msg || now > msgUntil) return;
  ctx.font = 'bold 19px "Barlow Condensed",sans-serif';
  const w = ctx.measureText(msg).width + 34;
  ctx.fillStyle = 'rgba(6,5,4,0.86)';
  ctx.fillRect((WORLD_W - w) / 2, WORLD_H - 92, w, 34);
  ctx.strokeStyle = 'rgba(232,195,90,0.5)'; ctx.lineWidth = 1.5;
  ctx.strokeRect((WORLD_W - w) / 2, WORLD_H - 92, w, 34);
  ctx.fillStyle = '#ffe9a8'; ctx.textAlign = 'center';
  ctx.fillText(msg, WORLD_W / 2, WORLD_H - 69);
  ctx.textAlign = 'left';
}

// ── loop ─────────────────────────────────────────────────────────────────────
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(48, lastTs ? ts - lastTs : 16);
  lastTs = ts;
  if (state === 'play' && !shopOpen && !dayPaused) {
    updateFloor(dt, ts);
    updateHype(dt);
    stepHost(hosts.jimmy, dt);
    stepHost(hosts.joe, dt);
    if (ts > dayEndsAt) endDay();
  } else if (state === 'attract') {
    updateFloor(dt, ts);
    attractT += dt;
    if (attractT > 3200) { attractT = 0; room = ORDER[(ORDER.indexOf(room) + 1) % ORDER.length]; }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  drawPlate(room);
  if (room === 'studio') tvFrame();
  drawPunters();
  if (state !== 'attract') {
    for (const who of ['jimmy', 'joe']) if (hosts[who] && hosts[who].room === room) drawHost(who, hosts[who]);
  }
  drawCabState();
  if (state !== 'attract') drawExitArrows(ts);
  drawFloaters(ts);
  if (state !== 'attract') drawMsg(ts);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);            // HUD + shop live in SCREEN space, so
  if (state !== 'attract') drawHUD(ts);              // a cover-cropped room never eats them
  if (state !== 'attract') drawBubble(canvas.clientWidth, canvas.clientHeight);
  if (shopOpen) drawShop();
  if (state === 'bust') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 44px "Barlow Condensed",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("CAN'T MAKE RENT", WORLD_W / 2, WORLD_H / 2);
    ctx.textAlign = 'left';
  }
}
let attractT = 0;

// ── boot ─────────────────────────────────────────────────────────────────────
state = 'attract';
newRun();
resize();
loadPack();
requestAnimationFrame(frame);

// Read-only debug hook for QA and the cassette recorder (the pattern game-builder STEP 3
// asks for). Exposes state and a world-coordinate tap; changes nothing about play.
window.__TC = {
  get state() { return { cash, carry, apron: apronCap(), day, hype: Math.round(hype), room,
                         bottles, decanter, banked, cabs: cabs.map(c => ({ till: c.till, jam: c.jam,
                         cursed: c.cursed, busy: !!c.busy })), cabCount: cabCount(), owned: Object.keys(owned),
                         shopOpen, active, jimmyRoom: hosts.jimmy.room, joeRoom: hosts.joe.room }; },
  tapWorld(wx, wy) {
    const r = canvas.getBoundingClientRect();
    const x = r.left + (VIEW.ox + wx * VIEW.scale) / DPR;
    const y = r.top + (VIEW.oy + wy * VIEW.scale) / DPR;
    canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: x, clientY: y, bubbles: true, cancelable: true }));
  },
  giveCoins(n) { cabs[0].till += n; },      // QA only — seeds a till without waiting for a punter
  demo() {                                  // QA only — every machine on and busy, so the
    ['cab2','cab3','cab4','cab5'].forEach(k => { owned[k] = true; });   // whole row can be
    const sp = ['punter34A', 'punter34B', 'punter34C'];                 // judged in one frame
    cabs.forEach((c, i) => { c.busy = { spr: sp[i % 3] }; c.playT = 60000; c.jam = false; });
  },
};

document.getElementById('startBtn').addEventListener('click', () => {
  unlockAudio();
  overlay.classList.add('hidden');
  newRun();
  state = 'play';
  startTips();
  applyMusic();                        // a stored jingle choice resumes with the run
  try {
    document.documentElement.requestFullscreen?.().catch(() => {});
    screen.orientation?.lock?.('landscape').catch(() => {});
  } catch (e) {}
});
document.getElementById('arcadeBtn').addEventListener('click', () => {
  location.href = (new URLSearchParams(location.search).get('from') === 'wip') ? '../wip.html' : '../index.html';
});
if (new URLSearchParams(location.search).get('play') === '1') {
  // deep link straight into a shift (used by QA and the cassette recorder)
  overlay.classList.add('hidden'); newRun(); state = 'play'; startTips();
}
})();
</script>
