(function () {
'use strict';
// ── IDENTITY ─────────────────────────────────────────────────────────────────
const SLUG  = 'jnj-on-air';
const TITLE = 'JNJ: ON AIR IN 10 MIN';

// ── CANVAS + VIEW SCALING ────────────────────────────────────────────────────

const ctx = canvas.getContext('2d');
const WORLD_W = 960, WORLD_H = 540;
const VIEW = { scale: 1, ox: 0, oy: 0 };
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR;
  const s = Math.min(innerWidth / WORLD_W, innerHeight / WORLD_H);
  VIEW.scale = s * DPR;
  VIEW.ox = (canvas.width  - WORLD_W * VIEW.scale) / 2;
  VIEW.oy = (canvas.height - WORLD_H * VIEW.scale) / 2;
}

// ── SFX — house style ────────────────────────────────────────────────────────
let audioCtx = null, muted = localStorage.getItem('sfxMuted_' + SLUG) === '1';
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function tone(f0, f1, dur, type, vol) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const jit = 1 + (Math.random() * 2 - 1) * 0.04;      // LittleJS pitch jitter
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0 * jit, audioCtx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * jit), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.14, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

  blip:   () => tone(520, 700, 0.05, 'square', 0.08),      // dialogue advance

// ── DIALOGUE SYSTEM ──────────────────────────────────────────────────────────
const dlg = { queue: [], current: null, shownAt: 0, onDone: null };
function say(who, text) { dlg.queue.push({ who, text }); }
function sayRun(onDone) { dlg.onDone = onDone || null; if (!dlg.current) nextLine(); }
function nextLine() {
  dlg.current = dlg.queue.shift() || null;

  dlg.audioDur = 0;

    playVoice(dlg.current.who, dlg.current.text);
  } else {
    stopVoice();
    if (dlg.onDone) { const f = dlg.onDone; dlg.onDone = null; f(); }
  }
}
function lineDur(text) {
  const textMs = Math.max(1500, (text.split(' ').length / 3) * 1000 + 350);

function burst(x, y, n, col) {

}

const INV_Y = WORLD_H - 62, INV_S = 52;

function invAt(wx, wy) {

// ── ART PACK (pixel plates + sprite sheets + VO) — lazy, canvas fallback ────
const PLATES = {};
let kettlePatch = null;   // cached feathered shelf patch for the taken kettle              // roomId -> Image (320x180, drawn x3, smoothing off)
const SPR = {};                 // jimmyFront/jimmySide/jimmyWalk[]/joeFront/joeWalk[]
let VOICE = null;               // djb2(who|text) -> base64 mp3
const voiceBuffers = {};
let voiceSource = null;
let packState = 'idle';
function mkImg(uri, cb) { const im = new Image(); im.onload = () => cb(im); im.src = uri; }
function loadPack() {
  if (packState !== 'idle') return;
  packState = 'loading';
  // ?v must be bumped whenever the pack changes. Without it Cloudflare + the browser
  // keep serving the old pack forever, so a sprite or VO fix ships to the CDN and the
  // player still sees and hears the previous build — the game HTML updates, its assets
  // silently do not. v2 = 2026-08-03 walk-cycle frames + caps-fixed voice takes.
  fetch('jnj-on-air-pack.json?v=4').then(r => r.json()).then(p => {
    for (const k of ['studio', 'corridor', 'prop'])
      if (p.art && p.art[k]) mkImg(p.art[k], im => { PLATES[k] = im; });
    // Osimo's kettle-free shelf plate — overlaid on the shelves once the kettle is taken.
    if (p.art && p.art.propKettleGone) mkImg(p.art.propKettleGone, im => { SPR.kettleGone = im; });
    if (p.sprites) {
      for (const k of ['jimmyFront', 'jimmySide', 'joeFront'])
        if (p.sprites[k]) mkImg(p.sprites[k], im => { SPR[k] = im; });
      for (const k of ['jimmyWalk', 'joeWalk'])
        if (p.sprites[k]) { SPR[k] = []; p.sprites[k].forEach((u, i) => mkImg(u, im => { SPR[k][i] = im; })); }
    }

}
function djb2(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (Math.imul(h, 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(16);
}
function stopVoice() {
  if (voiceSource) { try { voiceSource.stop(); } catch (e) {} voiceSource = null; }
}
function playVoice(who, text) {
  stopVoice();
  dlg.audioDur = 0;
  if (!VOICE || !audioCtx || muted || state === 'attract') return;
  const key = djb2(who + '|' + text);
  const b64 = VOICE[key];
  if (!b64) return;
  const start = (buf) => {
    if (!dlg.current || dlg.current.text !== text) return;   // line already skipped
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.value = 0.95;
    src.connect(g); g.connect(audioCtx.destination);
    src.start();
    voiceSource = src;
    dlg.audioDur = buf.duration * 1000;
    dlg.shownAt = worldT;                                    // re-time line to audio start
  };
  if (voiceBuffers[key]) { start(voiceBuffers[key]); return; }
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  audioCtx.decodeAudioData(arr.buffer, buf => { voiceBuffers[key] = buf; start(buf); }, () => {});
}

function serveRound() {
  const r = DUEL_ROUNDS[duel.round];

function buildChoices() {
  const r = DUEL_ROUNDS[duel.round];
  const avail = counters.slice();
  let winPool = r.winners.filter(c => avail.includes(c) && !usedCounters.includes(c));
  if (!winPool.length) winPool = r.winners.filter(c => avail.includes(c));
  const winner = winPool.length ? winPool[Math.floor(Math.random() * winPool.length)]
                                : avail.filter(c => !usedCounters.includes(c))[0] || avail[0];
  const others = avail.filter(c => c !== winner);
  for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  const picks = [winner].concat(others.slice(0, 2));
  for (let i = picks.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [picks[i], picks[j]] = [picks[j], picks[i]]; }
  duel.choices = picks; duel.winner = winner;
}
function pickCounter(id) {
  duel.phase = 'resolving';
  say('JIMMY', COUNTERS[id].line);
  if (id === duel.winner) {
    usedCounters.push(id); score += 400;
    say('JOE', DUEL_ROUNDS[duel.round].winReact);
    sayRun(() => {
      toast('ROUND WON +400', 480, 240); burst(480, 260, 22); sfx.win();
      duel.round++;
      if (duel.round >= DUEL_ROUNDS.length) { winShow(); }
      else serveRound();
    });
  } else {
    say('JOE', FLOP_LINES[Math.floor(Math.random() * FLOP_LINES.length)]);
    sayRun(() => { sfx.flop(); shakeT = 8; buildChoices(); duel.phase = 'choose'; });
  }
}

let touchStart = null;
function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top)  * DPR - VIEW.oy) / VIEW.scale };
}
function hotspotAt(wx, wy) {
  const R = ROOMS[roomId];
  for (const hs of R.hotspots) {
    if (hs.hideWhen && hs.hideWhen()) continue;
    if (wx >= hs.x && wx <= hs.x + hs.w && wy >= hs.y && wy <= hs.y + hs.h) return hs;
  }
  return null;
}
function onDown(e) {
  const p = e.touches ? e.touches[0] : e;
  touchStart = { x: p.clientX, y: p.clientY, t: performance.now() };
  if (e.cancelable) e.preventDefault();
}
function onUp(e) {
  if (!touchStart) return;
  const p = e.changedTouches ? e.changedTouches[0] : e;
  const dx = p.clientX - touchStart.x, dy = p.clientY - touchStart.y;
  const held = performance.now() - touchStart.t;
  const moved = Math.hypot(dx, dy);
  const w = toWorld(p.clientX, p.clientY);
  touchStart = null;
  if (e.cancelable) e.preventDefault();

  // mute button (all states)
  if (w.x > WORLD_W - 60 && w.y < 50) {
    muted = !muted; localStorage.setItem('sfxMuted_' + SLUG, muted ? '1' : '0'); return;
  }
  // fullscreen toggle beside it — without this, leaving fullscreen mid-game left no
  // way back in short of restarting the cassette
  if (w.x > WORLD_W - 130 && w.x <= WORLD_W - 88 && w.y < 50) {
    try {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else {
        document.documentElement.requestFullscreen?.().catch(() => {});
        screen.orientation?.lock?.('landscape').catch(() => {});
      }
    } catch (e) {}
    return;
  }
  if (state === 'attract' || state === 'ended') return;

  // dialogue advance eats every tap
  if (talkActive()) {
    if (moved < DEADZONE) { sfx.blip(); nextLine(); }
    return;
  }
  if (state === 'cutscene') return;

  if (state === 'duel') {
    if (duel && duel.phase === 'choose') {
      const idx = duelChoiceAt(w.x, w.y);
      if (idx >= 0) pickCounter(duel.choices[idx]);
    }
    return;
  }
  if (state !== 'playing' || moved >= DEADZONE) return;

  // inventory
  const it = invAt(w.x, w.y);
  if (it) {
    if (held >= LONGPRESS) { say('JIMMY', ITEMS[it].look); sayRun(); return; }
    if (selectedItem && selectedItem !== it) { combineItems(selectedItem, it); selectedItem = null; return; }
    selectedItem = selectedItem === it ? null : it; sfx.blip(); return;
  }

  const hs = hotspotAt(w.x, w.y);
  if (hs && held >= LONGPRESS) {              // LOOK from anywhere
    lookAt(hs); return;
  }
  if (hs) {
    if (hs.exit && !hs.exit.locked) {
      walkTo(hs.walkX, () => goRoom(hs.exit.to, hs.exit.spawn)); return;
    }
    if (hs.exit && hs.exit.locked) {
      if (hs.exit.locked()) {
        const item = selectedItem; selectedItem = null;
        walkTo(hs.walkX, () => interact(hs, item)); return;
      }
      walkTo(hs.walkX, () => goRoom(hs.exit.to, hs.exit.spawn)); return;
    }
    const item = selectedItem; selectedItem = null;
    walkTo(hs.walkX, () => interact(hs, item));
    return;
  }
  // plain walk
  selectedItem = null;
  walkTo(Math.max(50, Math.min(WORLD_W - 50, w.x)), null);
}
function walkTo(x, action) {
  player.targetX = x; player.action = action || null;
  player.facing = x >= player.x ? 1 : -1;
}
// FULLSCREEN RE-ENTRY on any tap. Osimo 2026-08-18: "once installed as an app, if I exit
// the game play and try to go back in, turning my phone doesn't make it go full screen."
// requestFullscreen is only permitted inside a user gesture, and a rotation is NOT one — so
// after leaving fullscreen (scoreboard, app switch, back gesture) there was no way back in
// except the small toggle. Any tap now re-arms it, which is a gesture the browser accepts.
// Capture phase so it runs before the game's own handlers and never eats their input.
canvas.addEventListener('pointerdown', () => {
  if (state === 'attract' || document.fullscreenElement) return;
  try {
    document.documentElement.requestFullscreen?.().catch(() => {});
    screen.orientation?.lock?.('landscape').catch(() => {});
  } catch (e) {}
}, { capture: true, passive: true });
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mouseup', onUp);

// duel choice hit rects
function duelChoiceRects() {
  const rects = [];
  if (!duel) return rects;
  const n = duel.choices.length;
  for (let i = 0; i < n; i++) {
    rects.push({ x: 100, y: 330 + i * 62, w: WORLD_W - 200, h: 54 });
  }
  return rects;
}
function duelChoiceAt(wx, wy) {
  const rects = duelChoiceRects();
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h) return i;
  }
  return -1;
}

// ── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt) {
  worldT += dt;
  if (player.talkT > 0) player.talkT -= dt;
  if (joe.talkT > 0) joe.talkT -= dt;
  joe.blinkT = (joe.blinkT + dt) % 3400;

  // fade transitions
  if (fadeDir !== 0) {
    fadeT += dt / 300;
    if (fadeDir === 1 && fadeT >= 1) { applyRoomChange(); fadeDir = -1; fadeT = 1; }
    else if (fadeDir === -1) { fadeT -= 2 * dt / 300; if (fadeT <= 0) { fadeDir = 0; fadeT = 0; } }
  }

  if (state === 'playing' || state === 'duel') {
    // clock
    if (state === 'playing') {
      if (!flags.onAir) timeLeft -= dt;
      if (timeLeft <= 0) {
        lateCount++; timeLeft = 120000;
        say('JOE', lateCount === 1 ? "We're late. We're always late. Two more minutes."
                                   : "Late again. I'm docking this from your lollipop budget.");
        sayRun();
      }
    }
    // dialogue auto-advance
    if (dlg.current && worldT - dlg.shownAt > lineDur(dlg.current.text)) nextLine();
    // walking
    if (player.targetX != null && state === 'playing') {
      const dxp = player.targetX - player.x;
      const step = WALK_SPEED * dt;
      if (Math.abs(dxp) <= step) {
        player.x = player.targetX; player.targetX = null; player.walkPhase = 0;
        if (player.action) { const a = player.action; player.action = null; a(); }
      } else {
        player.x += Math.sign(dxp) * step;
        // phase advances with DISTANCE, not time — one frame per WALK_PX_PER_FRAME of
        // travel, so the feet always keep pace with the ground no matter what the
        // speed is. Time-based phase is what made him look like he was sliding: he
        // covered 327px per cycle while the sprite's stride only carries ~145px.
        player.walkPhase += step / WALK_PX_PER_FRAME;
      }
    }
  }
  if (state === 'cutscene' && dlg.current && worldT - dlg.shownAt > lineDur(dlg.current.text)) nextLine();

  if (state === 'attract') {
    attractPan = Math.sin(worldT * 0.00012) * 60;
    attractQuipT += dt;
    if (attractQuipT > 5200) { attractQuipT = 0; attractQuipI++; }
  }

  // keep the speaker animated for the whole line (VO can be long)
  if (dlg.current) {
    if (dlg.current.who === 'JIMMY') player.talkT = 200; else if (dlg.current.who === 'JOE') joe.talkT = 200;
  }
  for (const m of motes) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x > 960 || m.y > 400) { m.x = Math.random() * 900; m.y = 30 + Math.random() * 200; }
  }
  for (let i = toasts.length - 1; i >= 0; i--) {
    const t = toasts[i]; t.t += dt; t.y -= dt * 0.03;
    if (t.t > 1400) toasts.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ── DRAW: CHARACTERS (sprite sheets from Osimo 2026-07-04; canvas fallback) ──
function drawSprite(img, x, feetY, h, flip, bob) {
  // x = center, feetY = feet line, h = world height; sprites face LEFT natively
  const w = img.width / img.height * h;
  const y = feetY - h + (bob || 0);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  // soft ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, feetY - 2, w * 0.34, 7, 0, 0, Math.PI * 2); ctx.fill();
  if (flip) { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(img, -w / 2, y, w, h); }
  else ctx.drawImage(img, x - w / 2, y, w, h);
  ctx.restore();
}
function drawJimmySprite(x, feetY) {
  const walking = player.targetX != null;
  const talkBob = player.talkT > 0 ? Math.sin(worldT * 0.02) * 2 : 0;
  if (walking && SPR.jimmyWalk && SPR.jimmyWalk.length === 8 && SPR.jimmyWalk.every(Boolean)) {
    const f = Math.floor(player.walkPhase) % 8;
    // FLIP WHEN MOVING LEFT, not right. The source art already faces RIGHT (visor on the
    // right of the helmet), so mirroring on facing>0 turned him around exactly when he
    // walked right — Osimo: "walks backwards regardless of direction". I originally
    // misdiagnosed this as bad frames and replaced good art chasing it; the frames were
    // always fine, the flag was inverted.
    drawSprite(SPR.jimmyWalk[f], x, feetY, 171, player.facing < 0, 0);
    return true;
  }
  if (!walking && SPR.jimmyFront) { drawSprite(SPR.jimmyFront, x, feetY, 171, false, talkBob); return true; }
  if (SPR.jimmySide) { drawSprite(SPR.jimmySide, x, feetY, 171, player.facing < 0, talkBob); return true; }
  return false;
}
function drawJoeSprite(x, feetY) {
  if (!SPR.joeFront) return false;
  const talkBob = joe.talkT > 0 ? Math.sin(worldT * 0.018) * 2 : 0;
  drawSprite(SPR.joeFront, x, feetY, 180, false, talkBob);
  if (flags.teaGiven) {              // steam wisps by his hand — the tea is HELD, obviously
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      const ph = worldT * 0.0016 + i * 2.1;
      ctx.beginPath();
      ctx.moveTo(x + 44 + i * 8, feetY - 92);
      ctx.quadraticCurveTo(x + 48 + i * 8 + Math.sin(ph) * 5, feetY - 108, x + 44 + i * 8 + Math.sin(ph + 1) * 6, feetY - 122);
      ctx.stroke();

  }

}

  ctx.moveTo(ex2 - w * 0.11, ey - w * 0.16);

  else { ctx.arc(ex1, ey, w * 0.07, 0, Math.PI * 2); ctx.moveTo(ex2 + w * 0.07, ey); ctx.arc(ex2, ey, w * 0.07, 0, Math.PI * 2); }
  ctx.stroke();

    const o = Math.sin(worldT * 0.03) * w * 0.06;
    ctx.moveTo(x + w * 0.3, my); ctx.quadraticCurveTo(x + w * 0.5, my + w * 0.12 + o, x + w * 0.7, my);
  } else if (mood === 'flat') { ctx.moveTo(x + w * 0.32, my + w * 0.04); ctx.lineTo(x + w * 0.68, my + w * 0.04); }
  else { ctx.moveTo(x + w * 0.32, my); ctx.quadraticCurveTo(x + w * 0.5, my + w * 0.09, x + w * 0.68, my); }

function drawBrickWall(x0, w) {
  ctx.fillStyle = C.brick; ctx.fillRect(x0, 0, w, 470);
  ctx.strokeStyle = C.mortar; ctx.lineWidth = 2;
  for (let y = 0; y < 470; y += 26) {
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke();
    const off = (y / 26) % 2 ? 30 : 0;
    for (let x = x0 + off; x < x0 + w; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26); ctx.stroke();
    }
  }
  // warm sconce pools
  const grd = ctx.createRadialGradient(200, 180, 30, 200, 180, 300);
  grd.addColorStop(0, 'rgba(255,190,110,0.13)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(x0, 0, w, 470);
  const grd2 = ctx.createRadialGradient(760, 180, 30, 760, 180, 300);
  grd2.addColorStop(0, 'rgba(255,190,110,0.13)'); grd2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd2; ctx.fillRect(x0, 0, w, 470);
}

      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(sx + sw - 18, sy + 26); ctx.lineTo(sx + sw - 18, sy + 10); ctx.stroke();
      ctx.fillStyle = '#ff5a8a'; ctx.beginPath(); ctx.arc(sx + sw - 18, sy + 8, 7, 0, 7); ctx.fill();
      ctx.shadowColor = '#ff5a8a'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(sx + sw - 18, sy + 8, 7, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
  });
  drawCabinet(300, 160, 120, 300, '#ff8a3c', 'ANGRY WORMS', (sx, sy, sw, sh) => {
    ctx.fillStyle = '#3a2a10'; ctx.fillRect(sx, sy + sh - 18, sw, 18);
    ctx.fillStyle = '#ff8a3c'; ctx.beginPath(); ctx.arc(sx + 20, sy + sh - 24, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#8aff5a'; ctx.beginPath(); ctx.arc(sx + sw - 24, sy + sh - 26, 6, 0, 7); ctx.fill();
  });
  drawCabinet(480, 160, 120, 300, '#ff5ad0', 'CANDY-TRIS', (sx, sy, sw, sh) => {
    const cols = ['#ff5ad0', '#5ad0ff', '#ffe45a'];
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = cols[i % 3];
      ctx.fillRect(sx + 8 + (i % 3) * 16, sy + sh - 16 - Math.floor(i / 3) * 16, 14, 14);
    }
  });
  // change machine
  ctx.fillStyle = '#3c4048'; ctx.beginPath(); ctx.roundRect(640, 210, 80, 250, 6); ctx.fill();
  ctx.fillStyle = '#22252a'; ctx.fillRect(650, 230, 60, 40);
  ctx.fillStyle = '#ffe45a'; ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillText('CHANGE', 680, 250);
  ctx.fillStyle = '#101216'; ctx.fillRect(658, 380, 44, 26);   // coin return
  if (!flags.gotKey) {   // the key, visible, taunting
    ctx.fillStyle = C.brass; ctx.shadowColor = C.brass; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(672, 392, 5, 0, 7); ctx.fill();
    ctx.fillRect(676, 390, 14, 4); ctx.fillRect(686, 394, 3, 5);
    ctx.shadowBlur = 0;
  }
  // vending machine
  ctx.fillStyle = '#8a2434'; ctx.beginPath(); ctx.roundRect(740, 170, 90, 290, 6); ctx.fill();
  ctx.fillStyle = '#14161c'; ctx.fillRect(748, 185, 56, 200);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    ctx.fillStyle = ['#ffd45a', '#5ad0ff', '#ff8a5a'][c];
    ctx.fillRect(753 + c * 17, 195 + r * 45, 12, 26);
  }
  ctx.fillStyle = '#ffd45a'; ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillText('SNAX', 776, 440);
  // water cooler
  ctx.fillStyle = '#cfe4ee'; ctx.beginPath(); ctx.roundRect(856, 300, 40, 160, 5); ctx.fill();
  ctx.fillStyle = 'rgba(120,190,230,0.6)'; ctx.beginPath(); ctx.roundRect(858, 252, 36, 52, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(864, 258, 8, 40);
  // prop room door
  ctx.fillStyle = flags.propUnlocked ? '#4a3a28' : '#3a2e20';
  ctx.beginPath(); ctx.roundRect(908, 170, 52, 290, 4); ctx.fill();
  ctx.strokeStyle = '#241c14'; ctx.lineWidth = 3; ctx.strokeRect(914, 180, 40, 270);
  ctx.fillStyle = C.brass; ctx.beginPath(); ctx.arc(918, 320, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#c9b06a'; ctx.font = 'bold 9px "Courier New", monospace';
  ctx.fillText('PROPS', 934, 200);
  if (!flags.propUnlocked) {
    ctx.fillStyle = '#ffd45a'; ctx.font = '14px monospace'; ctx.fillText('🔒', 934, 320);
  }
  drawExitArrow(24, 330, -1);
  ctx.restore();
}
function drawProp(camX) {
  ctx.save(); ctx.translate(-camX, 0);
  ctx.fillStyle = '#2e2620'; ctx.fillRect(0, 0, WORLD_W, 470);
  drawFloor();
  // shelves
  ctx.fillStyle = C.woodDark;
  for (const sy of [130, 200, 270]) ctx.fillRect(120, sy, 320, 10);
  ctx.fillRect(120, 90, 10, 190); ctx.fillRect(430, 90, 10, 190);
  // shelf clutter
  ctx.fillStyle = '#c9a35c'; ctx.fillRect(150, 105, 30, 24);      // trophy
  ctx.fillStyle = '#ffd45a'; ctx.beginPath(); ctx.arc(165, 100, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8a5a'; ctx.beginPath(); ctx.arc(300, 118, 11, 0, 7); ctx.fill();  // rubber chicken head
  ctx.fillStyle = '#ff8a5a'; ctx.fillRect(295, 118, 10, 22);
  if (!flags.gotKettle) {
    ctx.fillStyle = '#d8d2c4'; ctx.beginPath(); ctx.roundRect(204, 158, 40, 34, 8); ctx.fill();
    ctx.strokeStyle = '#d8d2c4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(250, 172, 8, -1.2, 1.2); ctx.stroke();
    ctx.fillStyle = '#8a8478'; ctx.fillRect(216, 152, 16, 8);
  }
  ctx.fillStyle = '#6a8aa8'; ctx.fillRect(360, 226, 46, 44);      // old monitor
  ctx.fillStyle = '#0c141c'; ctx.fillRect(366, 232, 34, 26);
  // cassette pile
  const casCols = ['#57ff8a', '#ff8a3c', '#ff5ad0', '#5ad0ff', '#ffe45a'];
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = '#1c1420';
    ctx.save(); ctx.translate(640 + (i % 2) * 46, 442 - Math.floor(i / 2) * 26); ctx.rotate((i * 7 - 10) * 0.02);
    ctx.fillRect(0, 0, 64, 22);
    ctx.fillStyle = casCols[i]; ctx.fillRect(4, 4, 56, 6);
    ctx.restore();
  }
  // bits box
  ctx.fillStyle = '#a8845c'; ctx.beginPath(); ctx.roundRect(500, 370, 130, 80, 4); ctx.fill();
  ctx.fillStyle = '#8a6a48'; ctx.fillRect(500, 360, 130, 16);
  ctx.fillStyle = '#3c2c1c'; ctx.font = 'bold 11px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('BITS BOX', 565, 400);
  ctx.fillText(flags.gotTeabag ? '(OPENED. SORRY JOE)' : 'DO NOT OPEN', 565, 418);
  // ostrich pillow
  ctx.fillStyle = '#b0a494'; ctx.beginPath(); ctx.ellipse(790, 430, 55, 28, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0c0e12'; ctx.beginPath(); ctx.ellipse(790, 422, 22, 12, 0, 0, 7); ctx.fill();
  // shark blanket
  ctx.fillStyle = '#5a7a9a'; ctx.beginPath();
  ctx.moveTo(330, 430); ctx.lineTo(440, 400); ctx.lineTo(420, 430); ctx.lineTo(440, 458); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(345, 426); ctx.lineTo(360, 418); ctx.lineTo(362, 430); ctx.closePath(); ctx.fill();
  // fake plant
  ctx.fillStyle = '#8a4a2c'; ctx.fillRect(870, 420, 36, 46);
  ctx.strokeStyle = '#4a8a3c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const a of [-0.5, -0.1, 0.35]) {
    ctx.beginPath(); ctx.moveTo(888, 424);
    ctx.quadraticCurveTo(888 + a * 70, 360, 888 + a * 110, 320); ctx.stroke();
  }
  drawExitArrow(24, 330, -1);
  ctx.restore();
}
function drawExitArrow(x, y, dir) {
  ctx.fillStyle = 'rgba(232,161,60,' + (0.4 + Math.sin(worldT * 0.004) * 0.25) + ')';
  ctx.beginPath();
  ctx.moveTo(x - 10 * dir, y - 14); ctx.lineTo(x + 10 * dir, y); ctx.lineTo(x - 10 * dir, y + 14);
  ctx.closePath(); ctx.fill();
}

// ── DRAW: UI ─────────────────────────────────────────────────────────────────
function drawDialogue() {
  if (!dlg.current) return;
  const who = dlg.current.who;
  const col = who === 'JIMMY' ? C.jimmyTrim : who === 'JOE' ? C.joeRust : '#9aa';
  ctx.font = '17px "Courier New", monospace';
  const words = dlg.current.text.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > WORLD_W - 200) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  const boxH = 34 + lines.length * 22;
  ctx.fillStyle = 'rgba(8,8,12,0.85)';
  ctx.beginPath(); ctx.roundRect(70, 8, WORLD_W - 140, boxH, 10); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = col; ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(who, 88, 16);
  ctx.fillStyle = '#f0ede4'; ctx.font = '17px "Courier New", monospace';
  lines.forEach((l, i) => ctx.fillText(l, 88, 34 + i * 22));
}
function drawInventory() {
  for (let i = 0; i < inv.length; i++) {
    const r = invRect(i), id = inv[i];
    ctx.fillStyle = 'rgba(10,10,16,0.8)';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
    if (selectedItem === id) {
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.shadowColor = INK; ctx.shadowBlur = 10;
      ctx.stroke(); ctx.shadowBlur = 0;
    } else { ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ITEMS[id].icon, r.x + r.w / 2, r.y + r.h / 2 + 2);
  }
  if (selectedItem) {
    ctx.fillStyle = INK; ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('USE ' + ITEMS[selectedItem].name + ' ON...', 14, INV_Y - 6);
  }
}
function drawHUD() {
  // timer — top-right, clear of the studio's wall clock
  const t = Math.max(0, timeLeft);
  const m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000);
  ctx.font = 'bold 22px "Courier New", monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = t < 60000 ? '#ff5a5a' : '#f0ede4';
  if (t < 60000) { ctx.shadowColor = '#ff5a5a'; ctx.shadowBlur = 10; }
  ctx.fillText(m + ':' + String(s).padStart(2, '0'), WORLD_W - 52, 10);
  ctx.shadowBlur = 0;
  // score
  ctx.font = 'bold 18px "Courier New", monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#fff'; ctx.fillText('SCORE ' + score, 14, 10);
  // comebacks
  ctx.fillStyle = INK; ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText('COMEBACKS ' + counters.length + '/6', 14, 34);
  // mute
  ctx.textAlign = 'right'; ctx.font = '20px serif';
  ctx.fillText(muted ? '🔇' : '🔊', WORLD_W - 14, 10);
  ctx.fillText('⛶', WORLD_W - 106, 10);
}
function drawDuelUI() {
  ctx.fillStyle = INK; ctx.font = 'bold 26px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.shadowColor = INK; ctx.shadowBlur = 14;
  ctx.fillText('BANTER DUEL — ROUND ' + (duel.round + 1) + ' / 3', WORLD_W / 2, 64);
  ctx.shadowBlur = 0;
  if (duel.phase === 'choose') {
    ctx.font = 'bold 15px "Courier New", monospace'; ctx.fillStyle = '#9aa';
    ctx.fillText('PICK YOUR COMEBACK', WORLD_W / 2, 300);
    const rects = duelChoiceRects();
    rects.forEach((r, i) => {
      const id = duel.choices[i];
      ctx.fillStyle = 'rgba(14,14,22,0.92)';
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = INK; ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('▶ ' + COUNTERS[id].label, r.x + 18, r.y + r.h / 2);
    });
  }
}
function drawAttract() {
  drawRoomBG('studio');
  if (!drawJoeSprite(700, 498)) drawJoeSeated(700, 470);
  drawJimmyIdle(300 + attractPan);
  ctx.fillStyle = 'rgba(4,4,8,0.45)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  ctx.fillStyle = INK; ctx.font = '40px "Bungee", "Arial Black", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = INK; ctx.shadowBlur = 24;
  ctx.fillText('JNJ: ON AIR', WORLD_W / 2, 252);
  ctx.fillText('IN 10 MINUTES', WORLD_W / 2, 300);
  ctx.shadowBlur = 0;
  const quips = [
    "JOE: Ten minutes. He's been looking for one lollipop for ten minutes.",
    "JOE: I could make the tea myself. But then he'd learn nothing.",
    "JOE: Insert a coin. Watch a man argue with a broom.",
    "JOE: The paintings have seen things. Mostly Jimmy, panicking.",
  ];
  ctx.fillStyle = '#d8d2c4'; ctx.font = '15px "Courier New", monospace';
  ctx.fillText(quips[attractQuipI % quips.length], WORLD_W / 2, 356);
  if (Math.sin(worldT * 0.005) > -0.2) {
    ctx.fillStyle = '#fff'; ctx.font = '17px "Bungee", "Arial Black", sans-serif';
    ctx.fillText('INSERT COIN', WORLD_W / 2, 408);
  }
}
function drawJimmyIdle(x) {
  const cx = Math.max(150, Math.min(800, x));
  if (SPR.jimmyFront) { drawSprite(SPR.jimmyFront, cx, 502, 171, false, Math.sin(worldT * 0.003) * 2); return; }
  const saveFacing = player.facing, saveTalk = player.talkT;
  player.facing = 1; player.talkT = 0;
  drawJimmy(cx, 496);
  player.facing = saveFacing; player.talkT = saveTalk;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  if (shakeT > 0) { shakeT--; ctx.translate((Math.random() - .5) * shakeT, (Math.random() - .5) * shakeT); }

  if (state === 'attract') { drawAttract(); drawHUDMuteOnly(); return; }

  drawRoomBG(roomId);

  if (roomId === 'studio') {
    if (!drawJoeSprite(700, 498)) drawJoeSeated(700, 470);
  }
  if (state === 'playing' || state === 'duel' || state === 'cutscene' || state === 'ended') {
    if (!drawJimmySprite(player.x, 502)) drawJimmy(player.x, 496);
  }
  if (state === 'duel') {              // spotlight the duel — everything else dims
    ctx.fillStyle = 'rgba(4,4,8,0.5)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    const sp = ctx.createRadialGradient(560, 380, 40, 560, 380, 260);
    sp.addColorStop(0, 'rgba(255,214,150,0.16)'); sp.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sp; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    if (!drawJoeSprite(700, 498)) drawJoeSeated(700, 470);
    if (!drawJimmySprite(player.x, 502)) drawJimmy(player.x, 496);
  }
  // room label
  ctx.fillStyle = 'rgba(232,161,60,0.5)'; ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(ROOMS[roomId].name, WORLD_W / 2, WORLD_H - 8);

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const t of toasts) {
    ctx.globalAlpha = Math.max(0, 1 - t.t / 1400);
    ctx.fillStyle = t.col; ctx.font = 'bold 17px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = t.col; ctx.shadowBlur = 8;
    ctx.fillText(t.text, t.x, t.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  if (state === 'duel') drawDuelUI();
  drawInventory();
  drawHUD();
  drawDialogue();

  if (fadeDir !== 0 || fadeT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, fadeT)) + ')';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }
}
function drawHUDMuteOnly() {
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '20px serif';
  ctx.fillStyle = '#fff'; ctx.fillText(muted ? '🔇' : '🔊', WORLD_W - 14, 10);
}

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(t) {
  const dt = Math.min(32, t - tPrev || 16); tPrev = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ── COIN / START ─────────────────────────────────────────────────────────────
function showOverlay() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  buildButtons();
}
function buildButtons() {
  const row = document.getElementById('btnRow');
  row.innerHTML = '';
  const hasSave = (() => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } })();
  if (hasSave) {
    const rb = document.createElement('button');
    rb.className = 'obtn'; rb.textContent = '▶ RESUME SHIFT';
    rb.addEventListener('click', () => beginGame(true));
    row.appendChild(rb);
  }
  const nb = document.createElement('button');
  nb.className = 'obtn' + (hasSave ? ' ghost' : '');
  nb.textContent = '🪙 ' + (hasSave ? 'NEW GAME' : 'INSERT COIN');
  nb.addEventListener('click', () => beginGame(false));
  row.appendChild(nb);
}
function beginGame(resume) {
  document.getElementById('overlay').classList.add('hidden');
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  // Landscape lock — works on Android once fullscreen; iOS has no API for it, which is
  // what the CSS rotate hint below is for. Must run inside this same tap gesture.
  try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch (e) {}
  unlockAudio();
  loadPack();
  if (resume && loadGame()) {
    state = 'playing';
    say('JIMMY', "Right. Where was I. Tea, lollipop, show. The dream lives on.");
    sayRun();
    return;
  }
  clearSave(); resetGame();
  state = 'playing'; inv = ['cloth'];
  say('JOE', "Ten minutes, Jimmy. The key's gone, the lollipop's missing, and I'm not reading a word until there's tea.");
  say('JIMMY', "Okay. Okay okay okay. Tea, lollipop, show. How hard can it be?");
  say('JOE', "Don't answer that. Nobody answer that.");
  sayRun();
  saveGame();
}
buildButtons();
loadPack();
if (IS_ATTRACT_PARAM) { document.getElementById('overlay').classList.add('hidden'); }

// test hook — playtest-by-evaluate (game-builder QA gate); not a cheat surface worth guarding
window.__onair = {
  get state() { return state; }, flags,
  inv: () => inv, counters: () => counters, score: () => score,
  timeLeft: () => timeLeft, room: () => roomId, duel: () => duel,
  dlgActive: () => !!dlg.current, dlgText: () => dlg.current && dlg.current.text,
  flush: () => { let n = 0; while (dlg.current && n++ < 200) nextLine(); },
  interact, lookAt, combineItems, pickCounter, beginGame,
  jumpRoom: (r, s) => { roomId = r; player.x = ROOMS[r].spawns[s] || 300; },
  hotspot: (id) => { for (const r in ROOMS) { const h = ROOMS[r].hotspots.find(h => h.id === id); if (h) return h; } },
  // world (x,y) -> real screen CSS pixels — lets an external script (recording real
  // gameplay for the cassette preview / b-roll) click actual hotspots like a player
  // would, instead of teleporting state directly
  worldToScreen: (wx, wy) => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left + (wx * VIEW.scale + VIEW.ox) / DPR, y: r.top + (wy * VIEW.scale + VIEW.oy) / DPR };
  },
};

requestAnimationFrame(loop);
})();
</script>
