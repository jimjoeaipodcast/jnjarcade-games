<!-- ════════════════════════════════════════════════════════════
     LUPO ALBERTO — JnJ Arcade Training Cabinet v2.0 (LANDSCAPE)
     Based on: Lupo Alberto (Idea Software, C64, 1990)
     Training purpose: Platform mechanic template — reskin-only for future games

     ── PLATFORM GAME TEMPLATE (copy these to reskins) ──────────

     PHYSICS CONSTANTS (tune these per game feel):
       GRAVITY   = 0.38   px/frame² — lighter = floaty, heavier = snappy
       JUMP      = 11.5   upward impulse (negative Y = up)
       SPEED     = 3.4    horizontal run speed
       TERM_VEL  = 13     max fall speed (prevent tunnelling on slow devices)
       FRICTION  = 0.70   multiplier on vx when no input (0.5=slippery,0.9=sticky)

     AABB PLATFORM COLLISION (top-face only):
       prevY = player.y from LAST frame
       for each platform P:
         hOverlap: p.x+PW > P.x+2  &&  p.x+2 < P.x+P.w
         wasAbove: prevY+PH <= P.y + 2
         isBelow:  p.y+PH  >= P.y
         → land: p.y=P.y-PH; p.vy=0; p.grounded=true

     ENEMY PATROL (simple):
       e.x += e.vx
       if e.x < e.platform.x → reverse vx
       if e.x+EW > e.platform.x+e.platform.w → reverse vx
       death: player AABB overlaps enemy AABB (shrink both by 5px per side)

     VIRTUAL JOYSTICK (landscape mobile):
       Left 45% of screen = joystick zone
         touchstart → record joystick base (jsBase.x, jsBase.y)
         touchmove  → compute dx = touch.x - jsBase.x
         if dx < -DEADZONE → move left; if dx > DEADZONE → move right
       Right 40% of screen = jump zone
         any touch in this zone AND player.grounded → jump

     CONTROLS RENDERED ON CANVAS (not DOM elements):
       drawJoystick(ctx, jsBase, currentDx, active)
       drawJumpBtn(ctx, btnX, btnY, pressed)
       Both semi-transparent, always visible during gameplay

     RESKIN CHECKLIST (change ONLY these for a new game):
       1. PALETTE {}        — colours
       2. drawPlayer()      — sprite, same PW×PH box
       3. drawEnemy()       — sprite, same EW×EH box
       4. drawGoal()        — win condition sprite
       5. drawBg()          — sky, ground, hills
       6. Platform layout in buildLevel() — positions only
       7. Cabinet WORLD entry in app.js
       Everything else (physics/collision/controls/flow): UNTOUCHED
     ════════════════════════════════════════════════════════════ -->

<div id="rotate">
  <div class="icon">📱</div>
  <div class="msg">ROTATE PHONE<br>FOR LUPO ALBERTO</div>
</div>
<div id="shell">
  <div id="hud">
    <a href="../">◀ ARCADE</a>
    <span>LUPO ALBERTO</span>
    <span id="score-el">0</span>
  </div>
  <div id="wrap"><canvas id="c"></canvas></div>
</div>
<script>
'use strict';

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const scoreEl = document.getElementById('score-el');

// ── Physics constants ────────────────────────────────────────────────────────
const GRAVITY   = 0.38;
const JUMP      = 11.5;
const SPEED     = 3.4;
const TERM_VEL  = 13;
const FRICTION  = 0.70;

// ── Sprite bounds ────────────────────────────────────────────────────────────
const PW = 26, PH = 34;   // player w×h
const EW = 30, EH = 28;   // enemy (Moses) w×h
const GW = 28, GH = 32;   // goal (Marta) w×h

// ── State ────────────────────────────────────────────────────────────────────
let W, H;
let platforms = [], hearts = [], enemies = [];
let score = 0, lives = 3, level = 1;
let state = 'ATTRACT';    // ATTRACT | PLAYING | DEAD | CLEAR | GAMEOVER
let deathTimer = 0, clearTimer = 0, attractTick = 0;
let popList = [];

const p = { x:0, y:0, vx:0, vy:0, grounded:false, prevY:0, facing:1, walk:0, invincible:0 };

// ── Virtual joystick state ───────────────────────────────────────────────────
const DEADZONE = 24;
const js    = { active:false, id:-1, baseX:0, baseY:0, dx:0 };  // joystick
const jmp   = { active:false, id:-1, pressed:false };           // jump button
let jsBaseX = 0, jsBaseY = 0;  // fixed display position
let jumpBtnX = 0, jumpBtnY = 0;

// ── Resize ───────────────────────────────────────────────────────────────────
function resize(){
  const wrap = document.getElementById('wrap');
  let w = wrap.clientWidth  - 8;
  let h = wrap.clientHeight - 8;
  // Landscape: constrain to 16:9
  if(w / h > 16/9) w = h * 16/9;
  else              h = w * 9/16;
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
  W = canvas.width;
  H = canvas.height;
  // Fixed joystick/jump positions (bottom of screen)
  jsBaseX  = W * 0.12;
  jsBaseY  = H * 0.80;
  jumpBtnX = W * 0.88;
  jumpBtnY = H * 0.80;
}

// ── Level: first-level layout faithful to C64 original ──────────────────────
// C64 Lupo Alberto (1990): farm scene, 4-5 platforms zigzagging bottom→top-right
// Lupo starts bottom-left, Marta at top-right, Moses on middle platforms
function buildLevel(lv){
  // Platform positions — zigzag path encourages left-right traversal like the original
  platforms = [
    { x:0,       y:H-18,   w:W,       h:18,   type:'ground' },   // ground
    { x:W*0.04,  y:H*0.70, w:W*0.28,  h:14,   type:'hay'   },    // P1 left
    { x:W*0.38,  y:H*0.57, w:W*0.26,  h:14,   type:'wood'  },    // P2 center ← Moses L1
    { x:W*0.06,  y:H*0.43, w:W*0.30,  h:14,   type:'fence' },    // P3 left
    { x:W*0.42,  y:H*0.30, w:W*0.24,  h:14,   type:'fence' },    // P4 center-right
    { x:W*0.68,  y:H*0.17, w:W*0.28,  h:14,   type:'hay'   },    // P5 top-right ← MARTA
  ];

  // Hearts on each platform
  hearts = [
    { x:platforms[1].x+28,                      y:platforms[1].y-18, got:false },
    { x:platforms[1].x+platforms[1].w-50,        y:platforms[1].y-18, got:false },
    { x:platforms[2].x+20,                      y:platforms[2].y-18, got:false },
    { x:platforms[2].x+platforms[2].w*0.55,     y:platforms[2].y-18, got:false },
    { x:platforms[3].x+30,                      y:platforms[3].y-18, got:false },
    { x:platforms[4].x+20,                      y:platforms[4].y-18, got:false },
    { x:platforms[5].x+16,                      y:platforms[5].y-18, got:false },
  ];

  enemies = [];
  const sp1 = 1.1 + (lv-1) * 0.3;
  enemies.push({ x:platforms[2].x+20, y:platforms[2].y-EH, vx:sp1,  platform:platforms[2], walk:0, facing:1 });
  if(lv >= 2){
    const sp2 = 0.9 + (lv-2)*0.3;
    enemies.push({ x:platforms[0].x+W*0.55, y:platforms[0].y-EH, vx:-sp2, platform:platforms[0], walk:0, facing:-1 });
  }
  if(lv >= 3){
    enemies.push({ x:platforms[3].x+10, y:platforms[3].y-EH, vx:1.3, platform:platforms[3], walk:0, facing:1 });
  }

  popList = [];
  resetPlayer();
}

function resetPlayer(){
  p.x = 24; p.y = platforms[0].y - PH;
  p.vx = 0; p.vy = 0;
  p.grounded = true; p.facing = 1; p.walk = 0;
  p.invincible = 110;
}

function goalPos(){ const pl=platforms[5]; return {x:pl.x+pl.w-GW-8, y:pl.y-GH}; }
function heartsLeft(){ return hearts.filter(h=>!h.got).length; }

// ── Physics ───────────────────────────────────────────────────────────────────
function update(){
  if(state !== 'PLAYING') return;

  // Joystick input
  const moveL = js.active && js.dx < -DEADZONE;
  const moveR = js.active && js.dx >  DEADZONE;

  if(moveL && !moveR){ p.vx = -SPEED; p.facing = -1; }
  else if(moveR && !moveL){ p.vx = SPEED; p.facing = 1; }
  else p.vx *= FRICTION;

  // Jump (fired by jumpDown flag set in touch handler)
  if(jmp.pressed && p.grounded){ p.vy = -JUMP; p.grounded = false; jmp.pressed = false; }
  jmp.pressed = false;

  // Gravity
  p.vy = Math.min(p.vy + GRAVITY, TERM_VEL);

  p.prevY = p.y;
  p.x += p.vx;
  p.y += p.vy;
  p.x = Math.max(0, Math.min(W - PW, p.x));
  p.grounded = false;

  // Platform AABB collision (top-face)
  for(const pl of platforms){
    const hOv = p.x+PW > pl.x+2 && p.x+2 < pl.x+pl.w;
    if(!hOv) continue;
    if(p.prevY+PH <= pl.y+2 && p.y+PH >= pl.y){
      p.y = pl.y - PH; p.vy = 0; p.grounded = true;
    }
  }

  if(Math.abs(p.vx) > 0.4) p.walk++;
  if(p.invincible > 0) p.invincible--;

  // Heart collection
  for(const h of hearts){
    if(h.got) continue;
    if(Math.abs(p.x+PW/2-(h.x+8)) < 22 && Math.abs(p.y+PH/2-(h.y+8)) < 22){
      h.got = true; score += 100; scoreEl.textContent = score;
      spawnPop(h.x+8, h.y+8, '#ff4444');
    }
  }

  // Enemy update + death
  for(const e of enemies){
    e.walk++; e.x += e.vx; e.facing = e.vx>0?1:-1;
    const pl=e.platform;
    if(e.x < pl.x){e.x=pl.x; e.vx=Math.abs(e.vx);}
    if(e.x+EW > pl.x+pl.w){e.x=pl.x+pl.w-EW; e.vx=-Math.abs(e.vx);}
    if(p.invincible <= 0){
      const dx=Math.abs(p.x+PW/2-(e.x+EW/2)), dy=Math.abs(p.y+PH/2-(e.y+EH/2));
      if(dx<(PW+EW)/2-5 && dy<(PH+EH)/2-5) diePlayer();
    }
  }

  updatePops();

  // Goal check
  if(heartsLeft() === 0){
    const gp = goalPos();
    if(p.x+PW>gp.x && p.x<gp.x+GW && p.y+PH>gp.y && p.y<gp.y+GH){
      state='CLEAR'; clearTimer=160; score+=500+lives*100; scoreEl.textContent=score;
    }
  }
}

function diePlayer(){
  lives--; spawnPop(p.x+PW/2, p.y+PH/2, '#ff8800');
  if(lives <= 0) state='GAMEOVER';
  else{ state='DEAD'; deathTimer=90; }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnPop(x, y, color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    popList.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color});
  }
}
function updatePops(){
  for(let i=popList.length-1;i>=0;i--){
    const pt=popList[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life-=0.04;
    if(pt.life<=0) popList.splice(i,1);
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg(); drawPlatforms(); drawHearts(); drawGoal();
  drawEnemies(); drawPlayer(); drawHUDOverlay();
  drawControls();
  for(const pt of popList){
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3*pt.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state==='ATTRACT')  drawAttract();
  if(state==='DEAD')     drawDead();
  if(state==='CLEAR')    drawClear();
  if(state==='GAMEOVER') drawGameOver();
}

function drawBg(){
  // Sky gradient — the C64 original had a bright blue sky
  const g=ctx.createLinearGradient(0,0,0,H*0.80);
  g.addColorStop(0,'#5ab5ff'); g.addColorStop(1,'#cceeff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.80);
  // Clouds
  ctx.fillStyle='rgba(255,255,255,0.88)';
  cloud(W*0.10, H*0.08, 0.8); cloud(W*0.40, H*0.05, 1.0); cloud(W*0.72, H*0.09, 0.7);
  // Sun
  ctx.fillStyle='#fff97a';
  ctx.beginPath(); ctx.arc(W*0.92, H*0.07, H*0.046, 0, Math.PI*2); ctx.fill();
  // Rolling hills
  ctx.fillStyle='#4a9e3a';
  ctx.beginPath(); ctx.moveTo(0,H*0.76);
  ctx.bezierCurveTo(W*0.18,H*0.60, W*0.40,H*0.70, W*0.60,H*0.64);
  ctx.bezierCurveTo(W*0.78,H*0.58, W,H*0.68, W,H*0.76); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // Ground fill
  ctx.fillStyle='#4a9e3a'; ctx.fillRect(0,platforms[0].y-4,W,8);
  ctx.fillStyle='#7a4a1e'; ctx.fillRect(0,platforms[0].y+4,W,H-platforms[0].y);
  // Farm fence posts in background (decorative)
  ctx.strokeStyle='rgba(90,58,26,0.3)'; ctx.lineWidth=2;
  for(let fx=W*0.15;fx<W*0.85;fx+=W*0.07){
    ctx.beginPath(); ctx.moveTo(fx,H*0.68); ctx.lineTo(fx,H*0.78); ctx.stroke();
  }
}
function cloud(x,y,scale){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.arc(22,-5,14,0,Math.PI*2); ctx.arc(-18,4,11,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPlatforms(){
  for(const pl of platforms){
    if(pl.type==='ground') continue;
    const {x,y,w,h}=pl;
    if(pl.type==='hay'){
      ctx.fillStyle='#e8b84b'; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle='#c89a20'; ctx.lineWidth=1;
      for(let bx=x+8;bx<x+w-4;bx+=8){ ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx,y+h); ctx.stroke(); }
    } else if(pl.type==='wood'){
      ctx.fillStyle='#7a4e22'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#5a3810'; ctx.fillRect(x,y,w,3);
      ctx.strokeStyle='#5a3810'; ctx.lineWidth=1;
      for(let bx=x+16;bx<x+w;bx+=16){ ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx,y+h); ctx.stroke(); }
    } else {
      ctx.fillStyle='#8b7355'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#6a5235';
      for(let bx=x+2;bx<x+w-2;bx+=10) ctx.fillRect(bx,y+2,8,h-4);
    }
    ctx.fillStyle='#4a9e3a'; ctx.fillRect(x,y,w,4); // grass trim
  }
}

function drawHearts(){
  for(const h of hearts){
    if(h.got) continue;
    const {x,y}=h, s=8;
    ctx.fillStyle='#ff3355';
    ctx.beginPath();
    ctx.moveTo(x+s,y+s*.4);
    ctx.bezierCurveTo(x+s,y, x+s*1.8,y, x+s*1.8,y+s*.5);
    ctx.bezierCurveTo(x+s*1.8,y+s, x+s,y+s*1.3, x+s,y+s*1.6);
    ctx.bezierCurveTo(x+s,y+s*1.3, x+s*.2,y+s, x+s*.2,y+s*.5);
    ctx.bezierCurveTo(x+s*.2,y, x+s,y, x+s,y+s*.4);
    ctx.fill();
    ctx.fillStyle='#ff8899'; ctx.fillRect(x+s*.4,y+s*.2,3,3);
  }
}

function drawGoal(){
  const gp=goalPos(), gl=heartsLeft();
  ctx.save(); ctx.translate(gp.x, gp.y);
  ctx.globalAlpha = gl===0 ? 1 : 0.40;
  // Marta the hen (white, big comb, friendly look)
  ctx.fillStyle='#f5f5f0'; ctx.beginPath(); ctx.ellipse(14,20,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f5f5f0'; ctx.beginPath(); ctx.arc(17,8,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#cc2222';
  ctx.beginPath(); ctx.arc(16,3,4,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.arc(22,2,3,Math.PI,0); ctx.fill();
  ctx.fillStyle='#f5a623'; ctx.beginPath(); ctx.moveTo(25,8); ctx.lineTo(32,10); ctx.lineTo(25,12); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(22,7,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ddddd5'; ctx.beginPath(); ctx.ellipse(6,20,7,11,-0.4,0,Math.PI*2); ctx.fill();
  if(gl===0){
    const pulse=Math.abs(Math.sin(attractTick*.08))*5;
    ctx.fillStyle='#ffdd44'; ctx.font=`bold ${13+pulse}px Bungee,sans-serif`;
    ctx.textAlign='center'; ctx.fillText('MARTA!',14,-7-pulse); ctx.textAlign='left';
  }
  ctx.restore();
}

// Lupo Alberto — wolf, red hat, blue overalls (C64 faithful)
function drawPlayer(){
  if(state==='DEAD' && deathTimer%8<4) return;
  if(p.invincible>0 && p.invincible%6<3) return;
  const flip=p.facing<0, fr=Math.floor(p.walk/5)%2;
  ctx.save();
  ctx.translate(p.x+(flip?PW:0), p.y);
  if(flip) ctx.scale(-1,1);

  // Shoes
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(2, PH-(fr?3:6), 9,5);
  ctx.fillRect(PW-11, PH-(fr?6:3), 9,5);
  // Legs
  ctx.fillStyle='#2255cc';
  ctx.fillRect(4,PH-15, 7, 15-(fr?4:0));
  ctx.fillRect(PW-11,PH-15, 7, 15-(fr?0:4));
  // Overalls bib
  ctx.fillStyle='#2255cc'; rR(ctx,3,14,PW-6,PH-14,3); ctx.fill();
  // Suspenders
  ctx.fillStyle='#1a3a99'; ctx.fillRect(5,13,3,8); ctx.fillRect(PW-8,13,3,8);
  // Wolf head
  ctx.fillStyle='#c5c5c5'; rR(ctx,2,4,PW-4,14,5); ctx.fill();
  // Snout
  ctx.fillStyle='#ddd'; rR(ctx,PW-13,8,13,9,3); ctx.fill();
  // Nose
  ctx.fillStyle='#444'; rR(ctx,PW-8,9,6,3,1); ctx.fill();
  // Nostrils
  ctx.fillStyle='#333'; ctx.fillRect(PW-7,10,2,2); ctx.fillRect(PW-4,10,2,2);
  // Eye
  ctx.fillStyle='#fff'; rR(ctx,5,6,8,6,2); ctx.fill();
  ctx.fillStyle='#111'; ctx.fillRect(8,7,3,4);
  // Gleam
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(8,7,1,2);
  // Wolf ears
  ctx.fillStyle='#aaa';
  ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(0,-4); ctx.lineTo(9,4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(PW-7,4); ctx.lineTo(PW-2,-4); ctx.lineTo(PW+2,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath(); ctx.moveTo(5,3); ctx.lineTo(2,-1); ctx.lineTo(8,3); ctx.closePath(); ctx.fill();
  // Hat brim
  ctx.fillStyle='#cc2222'; ctx.fillRect(0,4,PW,4);
  // Hat crown
  ctx.fillStyle='#cc2222'; rR(ctx,3,-8,PW-6,13,2); ctx.fill();
  ctx.fillStyle='#881111'; ctx.fillRect(3,-1,PW-6,4);

  ctx.restore();
}

// Moses — C64 faithful bulldog, stocky, mean look
function drawEnemies(){ for(const e of enemies) drawMoses(e); }
function drawMoses(e){
  const flip=e.facing<0, fr=Math.floor(e.walk/5)%2;
  ctx.save(); ctx.translate(e.x+(flip?EW:0), e.y); if(flip) ctx.scale(-1,1);
  // Legs
  ctx.fillStyle='#b87050';
  ctx.fillRect(3,EH-11,8,fr?11:8); ctx.fillRect(EW-11,EH-11,8,fr?8:11);
  ctx.fillStyle='#d8a585';
  ctx.fillRect(1,EH-(fr?2:5),11,5); ctx.fillRect(EW-12,EH-(fr?5:2),11,5);
  // Body
  ctx.fillStyle='#c8956c'; rR(ctx,2,10,EW-4,EH-10,4); ctx.fill();
  // Head (bulldog: round + jowls)
  ctx.fillStyle='#c8956c'; ctx.beginPath(); ctx.ellipse(EW-5,8,12,10,0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d8a585'; ctx.beginPath(); ctx.ellipse(EW+1,12,8,5,0,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.ellipse(EW+5,10,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#555'; ctx.fillRect(EW+2,10,2,2); ctx.fillRect(EW+6,10,2,2);
  // Eyes (angry)
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(EW-11,5,4,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a00'; ctx.beginPath(); ctx.ellipse(EW-10,5,2,2,0,0,Math.PI*2); ctx.fill();
  // Angry brow
  ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(EW-15,1); ctx.lineTo(EW-7,4); ctx.stroke();
  // Spike collar
  ctx.fillStyle='#2a1800'; ctx.fillRect(3,16,EW-6,5);
  ctx.fillStyle='#aaa';
  for(let sx=7;sx<EW-6;sx+=6){
    ctx.beginPath(); ctx.moveTo(sx,16); ctx.lineTo(sx+3,11); ctx.lineTo(sx+6,16); ctx.closePath(); ctx.fill();
  }
  // Tail
  ctx.fillStyle='#c8956c'; ctx.beginPath(); ctx.ellipse(2,EH*.4,4,3,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── HUD overlay (small, top of canvas) ───────────────────────────────────────
function drawHUDOverlay(){
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?'#ff3355':'#441122';
    ctx.font='13px sans-serif'; ctx.fillText('♥',8+i*16,20);
  }
  ctx.fillStyle='#e8b84b'; ctx.font='11px Bungee,sans-serif';
  ctx.textAlign='center'; ctx.fillText('LV '+level, W/2, 18); ctx.textAlign='left';
  const hl=heartsLeft();
  ctx.fillStyle=hl>0?'#ff8888':'#ffffaa'; ctx.font='11px "Barlow Condensed",sans-serif';
  ctx.textAlign='right';
  ctx.fillText(hl>0?'♥×'+hl:'REACH MARTA!', W-8, 18);
  ctx.textAlign='left';
}

// ── Virtual controls (drawn on canvas) ───────────────────────────────────────
function drawControls(){
  if(state!=='PLAYING' && state!=='DEAD') return;
  ctx.save();

  // Joystick base
  ctx.globalAlpha=0.18; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(jsBaseX,jsBaseY,50,0,Math.PI*2); ctx.fill();

  // Joystick knob
  const kx = jsBaseX + Math.max(-32, Math.min(32, js.dx));
  ctx.globalAlpha = js.active ? 0.55 : 0.30;
  ctx.fillStyle='#e8b84b';
  ctx.beginPath(); ctx.arc(kx,jsBaseY,24,0,Math.PI*2); ctx.fill();

  // Left/right arrows on base
  ctx.globalAlpha=0.4; ctx.fillStyle='#fff';
  ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('◀', jsBaseX-38, jsBaseY); ctx.fillText('▶', jsBaseX+38, jsBaseY);

  // Jump button
  ctx.globalAlpha=jmp.active?0.70:0.22; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(jumpBtnX,jumpBtnY,44,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=jmp.active?0.95:0.50; ctx.fillStyle='#e8b84b';
  ctx.font='bold 14px Bungee,sans-serif';
  ctx.fillText('JUMP', jumpBtnX, jumpBtnY);

  ctx.globalAlpha=1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.restore();
}

// ── State overlays ────────────────────────────────────────────────────────────
function drawAttract(){
  attractTick++;
  ctx.fillStyle='rgba(10,5,0,0.62)';
  ctx.fillRect(W*0.2, H*0.2, W*0.6, H*0.55);
  ctx.fillStyle='#e8b84b'; ctx.textAlign='center';
  ctx.font=`bold ${Math.floor(H*.09)}px Bungee,sans-serif`;
  ctx.fillText('LUPO ALBERTO', W/2, H*0.38);
  ctx.fillStyle='#ffdd88'; ctx.font=`${Math.floor(H*.04)}px Barlow Condensed,sans-serif`;
  ctx.fillText('Collect ♥ hearts · Reach Marta', W/2, H*0.49);
  ctx.fillText('Avoid Moses the guard dog!', W/2, H*0.55);
  if(Math.floor(attractTick/30)%2){
    ctx.fillStyle='#e8b84b'; ctx.font=`bold ${Math.floor(H*.055)}px Bungee,sans-serif`;
    ctx.fillText('TAP TO START', W/2, H*0.68);
  }
  ctx.textAlign='left';
}
function drawDead(){
  deathTimer--;
  if(deathTimer<=0){resetPlayer();state='PLAYING';return;}
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff4444'; ctx.textAlign='center';
  ctx.font=`bold ${Math.floor(H*.07)}px Bungee,sans-serif`;
  ctx.fillText('WOOF!', W/2, H*0.46);
  ctx.fillStyle='#fff'; ctx.font=`${Math.floor(H*.038)}px Barlow Condensed,sans-serif`;
  ctx.fillText('Moses got you! '+lives+' left', W/2, H*0.54);
  ctx.textAlign='left';
}
function drawClear(){
  clearTimer--;
  if(clearTimer<=0){level++;buildLevel(level);state='PLAYING';return;}
  ctx.fillStyle='rgba(0,30,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#aaff88'; ctx.textAlign='center';
  ctx.font=`bold ${Math.floor(H*.065)}px Bungee,sans-serif`;
  ctx.fillText('♥ CIAO MARTA! ♥', W/2, H*0.44);
  ctx.fillStyle='#ffffaa'; ctx.font=`${Math.floor(H*.038)}px Barlow Condensed,sans-serif`;
  ctx.fillText('Level '+level+' — +500pts', W/2, H*0.53);
  ctx.textAlign='left';
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff4444'; ctx.textAlign='center';
  ctx.font=`bold ${Math.floor(H*.075)}px Bungee,sans-serif`;
  ctx.fillText('GAME OVER', W/2, H*0.42);
  ctx.fillStyle='#fff'; ctx.font=`${Math.floor(H*.042)}px Barlow Condensed,sans-serif`;
  ctx.fillText('Score: '+score, W/2, H*0.51);
  if(Math.floor(attractTick/30)%2){
    ctx.fillStyle='#e8b84b'; ctx.font=`bold ${Math.floor(H*.04)}px Bungee,sans-serif`;
    ctx.fillText('TAP TO CONTINUE', W/2, H*0.62);
  }
  ctx.textAlign='left';
}

// ── Helper ────────────────────────────────────────────────────────────────────
function rR(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y);
  c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}

// ── Attract AI ────────────────────────────────────────────────────────────────
function attractUpdate(){
  attractTick++;
  p.vx=1.4; p.facing=1; p.walk++;
  p.vy=Math.min(p.vy+GRAVITY,TERM_VEL);
  p.prevY=p.y; p.y+=p.vy; p.x+=p.vx;
  p.grounded=false;
  for(const pl of platforms){
    if(p.x+PW>pl.x&&p.x<pl.x+pl.w && p.prevY+PH<=pl.y+2&&p.y+PH>=pl.y){
      p.y=pl.y-PH; p.vy=0; p.grounded=true;
    }
  }
  if(p.grounded&&(p.x>W-100||Math.random()<0.018)){p.vy=-JUMP*.8;p.grounded=false;}
  if(p.x>W) p.x=0;
  for(const e of enemies){e.walk++;e.x+=e.vx;}
}

// ── Touch / input — multi-touch joystick + jump ───────────────────────────────
function getTouchZone(clientX){
  const rect=canvas.getBoundingClientRect();
  const x=(clientX-rect.left)/rect.width*W;
  return x < W*0.50 ? 'left' : 'right';
}
function getTouchXY(touch){
  const rect=canvas.getBoundingClientRect();
  return {
    x:(touch.clientX-rect.left)/rect.width*W,
    y:(touch.clientY-rect.top)/rect.height*H,
  };
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const zone=getTouchZone(t.clientX);
    if(state==='ATTRACT'){startGame();return;}
    if(state==='GAMEOVER'){endGame();return;}
    if(zone==='left' && !js.active){
      const {x,y}=getTouchXY(t);
      js.active=true; js.id=t.identifier; js.baseX=x; js.baseY=y; js.dx=0;
    } else if(zone==='right'){
      jmp.active=true; jmp.id=t.identifier;
      if(p.grounded){jmp.pressed=true;}
    }
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(js.active && t.identifier===js.id){
      const {x}=getTouchXY(t);
      js.dx = x - js.baseX;
    }
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(js.active && t.identifier===js.id){ js.active=false; js.dx=0; }
    if(jmp.active && t.identifier===jmp.id){ jmp.active=false; }
  }
},{passive:false});

// Keyboard fallback
window.addEventListener('keydown', e=>{
  if(state==='ATTRACT'){startGame();return;}
  if(state==='GAMEOVER'){endGame();return;}
  if(e.key==='ArrowLeft'||e.key==='a'){js.active=true;js.dx=-60;}
  if(e.key==='ArrowRight'||e.key==='d'){js.active=true;js.dx=60;}
  if((e.key==='ArrowUp'||e.key===' '||e.key==='w')&&p.grounded){jmp.pressed=true;}
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d'){js.active=false;js.dx=0;}
});

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(){
  score=0; lives=3; level=1; state='PLAYING';
  resize(); buildLevel(1); scoreEl.textContent=0;
  canvas.requestFullscreen?.().catch(()=>{});
}
function endGame(){
  if(score>0){
    ArcadeScores.show('lupo-alberto',score,()=>{state='ATTRACT';resize();buildLevel(1);});
  } else {
    state='ATTRACT'; resize(); buildLevel(1);
  }
}

// ── Game loop ─────────────────────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastTs<14) return;
  lastTs=ts;
  if(state==='ATTRACT') attractUpdate();
  else if(state==='PLAYING') update();
  else if(state==='GAMEOVER') attractTick++;
  draw();
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{resize();if(state!=='ATTRACT')buildLevel(level);});
resize(); buildLevel(1); requestAnimationFrame(loop);
</script>
