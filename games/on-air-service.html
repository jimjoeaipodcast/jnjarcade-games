let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR;
  const s = Math.min(innerWidth / WORLD_W, innerHeight / WORLD_H);

// ── SFX — house style: lazy ctx, gesture unlock, mute + localStorage ────────
let audioCtx = null, muted = localStorage.getItem('sfxMuted_' + SLUG) === '1';
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function tone(f0, f1, dur, type, vol, when) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const t0 = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sfx = {                            // ONE sound per outcome — no variants
  serve:    () => { tone(880, 1320, 0.12, 'square', 0.14); tone(1320, 1760, 0.1, 'square', 0.08, 0.08); },
  pickup:   () => tone(520, 700, 0.06, 'square', 0.1),
  cookDone: () => tone(700, 1050, 0.09, 'triangle', 0.12),
  cookStart:() => tone(300, 380, 0.07, 'square', 0.08),
  buzz:     () => tone(150, 90, 0.18, 'sawtooth', 0.2),
  trombone: () => { tone(233, 220, 0.22, 'sawtooth', 0.14); tone(220, 208, 0.22, 'sawtooth', 0.14, 0.22);

// minimal music pulse — tempo nudges +5 BPM per combo star above 2 (cap +15)
let nextBeat = 0, beatN = 0;
function musicTick() {
  if (muted || !audioCtx || state !== 'playing') { nextBeat = 0; return; }
  const bpm = 96 + Math.min(15, Math.max(0, stars - 2) * 5);
  const beatDur = 60 / bpm / 2;
  const now = audioCtx.currentTime;
  if (!nextBeat || nextBeat < now - 1) nextBeat = now + 0.05;
  while (nextBeat < now + 0.25) {
    if (beatN % 2 === 0) tone(110, 82, 0.09, 'sine', 0.045, nextBeat - now);
    else tone(2400, 2000, 0.02, 'square', 0.012, nextBeat - now);
    if (beatN % 8 === 6) tone(165, 140, 0.08, 'sine', 0.035, nextBeat - now);
    nextBeat += beatDur; beatN++;
  }
}

// ── SHADING HELPERS (house 3-band diffuse technique, ported from jimmy-run) ──
function lerpCol(a, b, k) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const h = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return '#' + h(pa[0] + (pb[0] - pa[0]) * k) + h(pa[1] + (pb[1] - pa[1]) * k) + h(pa[2] + (pb[2] - pa[2]) * k);
}
function shadeGradV(g, y0, y1, base) {
  const grad = g.createLinearGradient(0, y0, 0, y1);
  grad.addColorStop(0, lerpCol(base, '#ffffff', 0.32));
  grad.addColorStop(0.5, base);
  grad.addColorStop(1, lerpCol(base, '#000000', 0.4));
  return grad;
}
function aoPool(g, x, y, rx, ry, alpha) {
  const grad = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
  grad.addColorStop(0, `rgba(10,6,4,${alpha})`);
  grad.addColorStop(1, 'rgba(10,6,4,0)');
  g.fillStyle = grad;
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
}

// ── ART PACK (studio + corridor plates reused verbatim, Jimmy/Joe sprites) ──
const PLATES = {};   // studio / corridor Image(320×180) drawn ×3
const SPR = {};      // jimmyFront, joeFront
let packState = 'idle';
function mkImg(uri, cb) { const im = new Image(); im.onload = () => cb(im); im.src = uri; }
function loadPack() {
  if (packState !== 'idle') return;
  packState = 'loading';
  fetch('on-air-service-pack.json?v=1').then(r => r.json()).then(p => {
    if (p.art) { if (p.art.studio) mkImg(p.art.studio, im => { PLATES.studio = im; });
                 if (p.art.corridor) mkImg(p.art.corridor, im => { PLATES.corridor = im; }); }
    if (p.sprites) { if (p.sprites.jimmyFront) mkImg(p.sprites.jimmyFront, im => { SPR.jimmyFront = im; });
                     if (p.sprites.joeFront) mkImg(p.sprites.joeFront, im => { SPR.joeFront = im; }); }
    packState = 'ready';
  }).catch(() => { packState = 'failed'; });
}
loadPack();

// ── THE GALLEY plate — painted once at 320×180 native, drawn ×3 ─────────────
const galleyPlate = document.createElement('canvas');
galleyPlate.width = 320; galleyPlate.height = 180;
(function paintGalley() {
  const g = galleyPlate.getContext('2d');
  // wall
  const wg = g.createLinearGradient(0, 0, 0, 110);
  wg.addColorStop(0, '#23272e'); wg.addColorStop(1, '#2e333c');
  g.fillStyle = wg; g.fillRect(0, 0, 320, 110);
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
  for (let x = 0; x <= 320; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 110); g.stroke(); }
  g.beginPath(); g.moveTo(0, 24); g.lineTo(320, 24); g.stroke();
  // floor
  for (let ty = 110; ty < 180; ty += 10) for (let tx = 0; tx < 320; tx += 10)
    { g.fillStyle = ((tx + ty) / 10) % 2 ? '#3a3f47' : '#31353c'; g.fillRect(tx, ty, 10, 10); }
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 110, 320, 4);
  // hanging warm lamps
  for (const lx of [56, 160, 264]) {
    g.strokeStyle = '#111'; g.beginPath(); g.moveTo(lx, 0); g.lineTo(lx, 8); g.stroke();
    g.fillStyle = '#c97a3d'; g.beginPath(); g.arc(lx, 11, 4, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,190,110,0.10)'; g.beginPath(); g.arc(lx, 30, 22, 0, Math.PI * 2); g.fill();
  }
  // ── GRILL  world x:120-280 y:80-200 → native x:40-93 y:27-67
  aoPool(g, 67, 69, 30, 6, 0.4);
  g.fillStyle = shadeGradV(g, 27, 67, '#464a52');
  g.fillRect(40, 27, 54, 40);
  let gWell = g.createRadialGradient(67, 38, 2, 67, 42, 28);
  gWell.addColorStop(0, '#2c2f36'); gWell.addColorStop(1, '#0a0b0d');
  g.fillStyle = gWell; g.fillRect(44, 31, 46, 22);
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 1; g.strokeRect(44.5, 31.5, 45, 21);
  g.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const ly = 34 + i * 4;
    g.strokeStyle = '#6b7078'; g.beginPath(); g.moveTo(46, ly - 0.5); g.lineTo(88, ly - 0.5); g.stroke();
    g.strokeStyle = '#2e3136'; g.beginPath(); g.moveTo(46, ly + 0.5); g.lineTo(88, ly + 0.5); g.stroke();
  }
  g.fillStyle = 'rgba(255,150,60,0.14)';
  g.beginPath(); g.arc(67, 50, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = shadeGradV(g, 46, 52, '#ff7830'); g.fillRect(46, 48, 42, 4);
  g.fillStyle = shadeGradV(g, 63, 67, '#c97a3d'); g.fillRect(40, 63, 54, 4);
  // ── COUNTER world x:360-520 → native x:120-173
  aoPool(g, 147, 69, 30, 6, 0.38);
  g.fillStyle = shadeGradV(g, 33, 67, '#5a3d22'); g.fillRect(120, 33, 54, 34);
  g.fillStyle = shadeGradV(g, 27, 33, '#8a6238'); g.fillRect(120, 27, 54, 6);
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.moveTo(120, 33.5); g.lineTo(174, 33.5); g.stroke();
  for (let i = 0; i < 6; i++) {
    const gy = 37 + i * 5, wob = (i % 2) * 1.4;
    g.strokeStyle = i % 2 ? 'rgba(0,0,0,0.10)' : 'rgba(255,210,150,0.06)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(122, gy + wob); g.lineTo(172, gy - wob); g.stroke();
  }
  g.fillStyle = shadeGradV(g, 37, 59, '#2a2d33'); g.fillRect(128, 37, 16, 22);
  g.fillStyle = shadeGradV(g, 41, 46, '#c97a3d'); g.fillRect(131, 41, 10, 5);
  g.fillStyle = '#e8e8ee'; g.fillRect(134, 52, 6, 6);
  aoPool(g, 137, 58, 5, 1.6, 0.3);

  if (Math.random() < 0.6) batch.push('jimmy');

function comboMult() { return stars >= 3 ? [1.5, 1.75, 2][Math.min(2, stars - 3)] : 1; }

}

  if (!dragging && Math.hypot(p.clientX - touchStart.x, p.clientY - touchStart.y) >= DEADZONE) dragging = true;
  if (dragging) dragPt = toWorld(p.clientX, p.clientY);

    if (st) { tryCook(st); return; }

}

// ── JUICE ───────────────────────────────────────────────────────────────────
function burstCone(x, y, n, col, ang, spread) {

    const a = ang + (Math.random() - 0.5) * spread, sp = 2 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * sp + 0.6, vy: Math.sin(a) * sp - 1,

}
function addFloater(x, y, txt, col) {

// ── HOTSPOT LABELS (2s, first entry) ────────────────────────────────────────
let zoneLabel = null, lastZone = null;
function currentZone() {
  const room = ROOMS[player.room];
  for (const ex of room.exits) if (player.x > ex.x - 10 && player.x < ex.x + ex.w + 10) return { id: ex.id, text: ex.label };
  const c = nearestServable();
  if (c) return { id: 'cust_' + c.seat.id, text: ARCH[c.arch].label };
  if (player.room === 'galley') {
    const st = room.stations.find(s => player.x >= s.x - 14 && player.x <= s.x + s.w + 14 && player.y < 430);
    if (st) return { id: st.id, text: st.label };

// ── UPDATE ──────────────────────────────────────────────────────────────────
function movePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx -= 1;
  if (keys.has('arrowright') || keys.has('d')) dx += 1;
  if (keys.has('arrowup') || keys.has('w')) dy -= 1;
  if (keys.has('arrowdown') || keys.has('s')) dy += 1;
  if (!dx && !dy && dragging && dragPt) {
    const ex = dragPt.x - player.x, ey = Math.max(FLOOR_MIN, Math.min(FLOOR_MAX, dragPt.y)) - player.y;
    const d = Math.hypot(ex, ey);
    if (d > 6) { dx = ex / d; dy = ey / d; }
  } else if (dx || dy) {
    const d = Math.hypot(dx, dy); dx /= d; dy /= d;
  }
  const step = Math.hypot(dx, dy) * SPEED * dt;
  if (step > 0) {
    player.x += dx * SPEED * dt;
    player.y += dy * SPEED * dt;
    player.y = Math.max(FLOOR_MIN, Math.min(FLOOR_MAX, player.y));
    player.x = Math.max(24, Math.min(WORLD_W - 24, player.x));
    if (dx) player.facing = dx > 0 ? 1 : -1;
    // distance-driven stride: phase counts SPRITE FRAMES via real pixels moved
    player.walkPhase += step / WALK_PX_PER_FRAME;
    player.moved = 2;
  } else if (player.moved > 0) player.moved--;
  // exit hotspots → instant room cut (jnj-on-air convention)
  if (player.exitCd > 0) { player.exitCd -= dt; return; }
  const room = ROOMS[player.room];
  for (const ex of room.exits) {
    if (player.x > ex.x && player.x < ex.x + ex.w && player.y > ex.y &&
        player.y < Math.max(ex.y + ex.h, FLOOR_MAX + 1)) {
      player.room = ex.to; player.x = ex.spawn.x; player.y = ex.spawn.y;
      player.exitCd = 450; lastZone = null;
      break;
    }
  }
}
function update(dt) {
  worldT += dt;
  if (state === 'attract') { attractUpdate(dt); tickShared(dt); return; }
  if (state !== 'playing') { tickShared(dt); return; }
  sessionT += dt;
  movePlayer(dt);
  // zone labels
  const z = currentZone();
  if (z && (!lastZone || lastZone !== z.id)) { zoneLabel = { text: z.text, t: 2000 }; }
  lastZone = z ? z.id : null;
  if (zoneLabel) { zoneLabel.t -= dt; if (zoneLabel.t <= 0) zoneLabel = null; }
  // cooking
  for (let i = cooking.length - 1; i >= 0; i--) {
    const k = cooking[i];
    k.t += dt;
    if (k.t >= k.total) {
      cooking.splice(i, 1);
      prepQueue.push(k.item);
      sfx.cookDone();
    }
  }
  // customers
  for (const c of customers) {
    if (c.state !== 'active') continue;
    c.pat -= dt;
    const used = 1 - c.pat / c.patMax;
    const want = c.happyT > 0 ? 'happy' : used < 0.5 ? 'neutral' : used < 0.8 ? 'impatient' : 'annoyed';
    if (want !== c.expr) { c.exprPrev = c.expr; c.expr = want; c.exprMixT = 0; }
    c.exprMixT += dt;
    if (c.happyT > 0) c.happyT -= dt;
    if (c.pat <= 0) timeoutCustomer(c);
  }
  for (const c of customers) {
    if (c.state !== 'served' || c.happyT <= 0) continue;
    c.happyT -= dt;
    if (c.expr !== 'happy') { c.exprPrev = c.expr; c.expr = 'happy'; c.exprMixT = 0; }
    c.exprMixT += dt;
  }
  customers = customers.filter(c => c.state === 'active' || worldT - c.resolveT < 800);
  if (rep <= 0) { endSession(); return; }   // REP dead → shift over → SHIFT COMPLETE summary
  // waves
  if (wave.phase === 'calm') {
    wave.calmT -= dt;
    if (wave.calmT <= 0) buildWave();
  } else if (wave.phase === 'spawning') {
    wave.spawnT -= dt;
    if (wave.spawnT <= 0 && wave.toSpawn.length) {
      if (spawnCustomer(wave.toSpawn[0])) wave.toSpawn.shift();
      wave.spawnT = 2200;
    }
    if (!wave.toSpawn.length) wave.phase = 'active';
  } else if (wave.phase === 'active') {
    if (!customers.some(c => c.state === 'active')) {
      if (wave.num >= 6) { endSession(); return; }   // soft cap: shift over after wave 6
      wave.phase = 'calm'; wave.calmT = 5000;
    }
  }
  musicTick();
  tickShared(dt);
}
function tickShared(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt; f.y -= dt * 0.045; f.x += dt * 0.012;
    if (f.t >= f.life) floaters.splice(i, 1);
  }
  if (summaryTapDelay > 0) summaryTapDelay -= dt;
}

// ── SESSION END → DAY-END SUMMARY → ArcadeScores ────────────────────────────
let summaryData = null;
function endSession() {
  if (state !== 'playing') return;
  const prevBest = storedBestRep();
  const newBest = Math.max(prevBest, Math.round(repPeak));
  localStorage.setItem(REP_KEY, String(newBest));
  summaryData = { prevBest, newBest, repPeak: Math.round(repPeak) };
  refreshUnlocks();
  state = 'summary';
  summaryTapDelay = 900;
  sfx.over();
}
function leaveSummary() {
  if (summaryTapDelay > 0) return;
  gameOver();
}
function gameOver() {
  state = 'ended';

  } else { startGame(); }
}

// ── EXPRESSIONS (Jimmy/Joe + every customer share the same thresholds) ──────
function drawFace(g, x, y, size, expr, alpha) {

    g.fillStyle = 'rgba(255,207,138,0.30)';
    g.beginPath(); g.arc(x, y + size * 0.06, size * 0.62, 0, Math.PI * 2); g.fill();
  } else if (expr === 'annoyed') {
    const flash = Math.floor(worldT / 150) % 2 === 0;   // same 150ms cadence drawBubble already flashes at below 20% patience
    g.fillStyle = flash ? 'rgba(255,80,60,0.38)' : 'rgba(255,140,110,0.22)';
    g.beginPath(); g.arc(x, y + size * 0.06, size * 0.68, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = '#bfe8ff'; g.fillStyle = '#bfe8ff'; g.lineWidth = Math.max(1.2, size * 0.09);
  g.lineCap = 'round';

  if (expr === 'happy') {
    g.beginPath(); g.arc(x - e, y, size * 0.14, Math.PI, 0); g.stroke();
    g.beginPath(); g.arc(x + e, y, size * 0.14, Math.PI, 0); g.stroke();

  } else if (expr === 'neutral') {
    g.beginPath(); g.arc(x - e, y, size * 0.09, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + e, y, size * 0.09, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(x - size * 0.2, y + size * 0.34); g.lineTo(x + size * 0.2, y + size * 0.34); g.stroke();
  } else if (expr === 'impatient') {
    g.strokeStyle = '#ffcf8a'; g.fillStyle = '#ffcf8a';   // amber — already used elsewhere in this file (cook-start floater), matches drawBubble's 50%-tier amber tint at the same threshold (this branch's used<0.8 verified numerically equivalent to drawBubble's frac<0.5)
    g.beginPath(); g.moveTo(x - e - size * 0.16, y - size * 0.32); g.lineTo(x - e + size * 0.15, y - size * 0.16); g.stroke();
    g.beginPath(); g.moveTo(x + e + size * 0.16, y - size * 0.32); g.lineTo(x + e - size * 0.15, y - size * 0.16); g.stroke();
    g.beginPath(); g.ellipse(x - e, y + size * 0.02, size * 0.08, size * 0.12, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x + e, y + size * 0.02, size * 0.08, size * 0.12, 0, 0, Math.PI * 2); g.fill();

  } else {                             // annoyed
    g.strokeStyle = '#ffb0a0'; g.fillStyle = '#ffb0a0';
    g.beginPath(); g.moveTo(x - e - size * 0.16, y - size * 0.24); g.lineTo(x - e + size * 0.12, y - size * 0.06); g.stroke();
    g.beginPath(); g.moveTo(x + e + size * 0.16, y - size * 0.24); g.lineTo(x + e - size * 0.12, y - size * 0.06); g.stroke();
    g.beginPath(); g.arc(x - e, y + size * 0.05, size * 0.08, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + e, y + size * 0.05, size * 0.08, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x, y + size * 0.52, size * 0.24, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
  }

}

// ── THOUGHT BUBBLES — the PRIMARY timer visual ──────────────────────────────
function drawBubble(c) {
  const frac0 = Math.max(0, c.pat / c.patMax);
  // Joe personality quirk: reads calm until the very end (display-only easing)
  const frac = c.arch === 'joe' ? Math.pow(frac0, 0.3) : frac0;
  const bx = c.seat.x, by = c.seat.headY - 52;
  let sc = Math.min(1, (worldT - c.spawnT) / 150);          // pop-in 0→1 over 0.15s
  if (c.state !== 'active') sc = Math.max(0, 1 - (worldT - c.resolveT) / 200); // pop-shrink
  if (sc <= 0) return;
  let jx = 0, jy = 0;
  if (c.state === 'active' && c.pat < 2000) { jx = (Math.random() - 0.5) * 4; jy = (Math.random() - 0.5) * 4; }
  const rem = c.items.length;
  const bw = Math.max(52, rem * 30 + 22), bh = 46;
  ctx.save();
  ctx.translate(bx + jx, by + jy); ctx.scale(sc, sc);
  // tint tracks patience: bright → amber @50% → flashing red <20%
  let fill = 'rgba(255,255,255,0.95)', edge = '#333';
  if (c.state === 'timeout') { fill = 'rgba(120,40,40,0.9)'; edge = '#802020'; }
  else if (frac < 0.2) { const on = Math.floor(worldT / 150) % 2 === 0; fill = on ? 'rgba(255,90,70,0.95)' : 'rgba(255,220,210,0.95)'; edge = '#a02010'; }
  else if (frac < 0.5) { fill = 'rgba(255,205,120,0.95)'; edge = '#8a5a20'; }
  ctx.fillStyle = fill; ctx.strokeStyle = edge; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-bw / 2, -bh, bw, bh, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(0, 10); ctx.lineTo(7, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  // order item icons — delivered ones dimmed + ticked
  for (let i = 0; i < c.items.length; i++) {
    const ix = -bw / 2 + 12 + i * 30;
    ctx.globalAlpha = c.delivered[i] ? 0.3 : 1;
    ctx.drawImage(ICONS[c.items[i]], ix, -bh + 8, 26, 26);
    ctx.globalAlpha = 1;
    if (c.delivered[i]) {
      ctx.strokeStyle = '#2a8a2a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ix + 4, -bh + 22); ctx.lineTo(ix + 11, -bh + 29); ctx.lineTo(ix + 23, -bh + 12); ctx.stroke();
    }
  }
  // MM:SS readout only once patience < 50%
  if (c.state === 'active' && frac0 < 0.5) {
    const s = Math.max(0, Math.ceil(c.pat / 1000));
    ctx.fillStyle = '#402010'; ctx.font = 'bold 11px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('0:' + String(s).padStart(2, '0'), 0, -3);
  }
  ctx.restore();
}

      const cx0 = k.station === 'all' ? 480 : st.x + st.w / 2;
      const idx = cooking.filter(q => (q.station === k.station)).indexOf(k);
      const cx = cx0 + idx * 44 - (k.station === 'all' ? 0 : 0);
      ctx.drawImage(ICONS[k.item], cx - 15, 96, 30, 30);
      const p = k.t / k.total;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, 111, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.arc(cx, 111, 22, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    }
    // pass-window shelf items
    for (let i = 0; i < prepQueue.length; i++) {
      const sx = slotX(i);
      ctx.fillStyle = 'rgba(255,220,160,0.15)'; ctx.fillRect(sx - 18, 268, 36, 40);
      ctx.drawImage(ICONS[prepQueue[i]], sx - 16, 272, 32, 32);
    }
    for (let i = prepQueue.length; i < prepMax(); i++) {
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
      ctx.strokeRect(slotX(i) - 18, 268, 36, 40);
    }
    // order-ticket rail: incoming uncooked demand, building-wide
    let tk = 0;
    for (const c of customers) {
      if (c.state !== 'active') continue;
      for (const it of remainingItems(c)) {
        if (tk >= 7) break;
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(26 + tk * 19, 34, 17, 22);
        ctx.drawImage(ICONS[it], 27 + tk * 19, 36, 15, 15);
        const fr = c.pat / c.patMax;
        ctx.fillStyle = fr > 0.5 ? '#3fae4a' : fr > 0.2 ? '#e8b23c' : '#e04040';
        ctx.fillRect(26 + tk * 19, 53, 17, 3);
        tk++;
      }
    }
  }

  // customers in this room (stool archetypes), Jimmy & Joe always in the studio
  const roomCust = customers.filter(c => c.room === room && c.arch !== 'jimmy' && c.arch !== 'joe');
  for (const c of roomCust) {
    if (c.state !== 'active' && worldT - c.resolveT > 600) continue;
    ctx.save();
    if (c.state !== 'active') ctx.globalAlpha = Math.max(0, 1 - (worldT - c.resolveT) / 600);
    drawGenericCustomer(c);
    ctx.restore();
  }
  if (room === 'studio') {
    const jnjFor = arch => customers.find(c => c.arch === arch && c.state === 'active')
                        || customers.find(c => c.arch === arch && c.state === 'served' && worldT - c.resolveT < 600);
    drawJnj('jimmy', jnjFor('jimmy') || null);
    drawJnj('joe', jnjFor('joe') || null);
  }

  // player
  drawServer(player.x, player.y, player.carry, player.moved > 0);

  // bubbles on top
  for (const c of customers) if (c.room === room) drawBubble(c);

  // exit indicators
  ctx.font = 'bold 11px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const ex of ROOMS[room].exits) {
    const exx = ex.x + ex.w / 2, pulse = 0.45 + Math.sin(worldT * 0.004) * 0.2;
    ctx.fillStyle = 'rgba(201,122,61,' + pulse + ')';
    const dir = ex.x < WORLD_W / 2 ? -1 : 1;
    ctx.save(); ctx.translate(exx, 330);
    ctx.beginPath(); ctx.moveTo(dir * 12, 0); ctx.lineTo(-dir * 6, -9); ctx.lineTo(-dir * 6, 9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // particles + floaters
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    ctx.fillStyle = f.col; ctx.font = 'bold 15px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Rush amber tint at 3★+
  if (stars >= 3 && state === 'playing') {
    ctx.fillStyle = 'rgba(255,170,60,' + (0.05 + 0.02 * (stars - 3)) + ')';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }

  // zone label near player
  if (zoneLabel && state === 'playing') {
    ctx.globalAlpha = Math.min(1, zoneLabel.t / 500);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText(zoneLabel.text, player.x, player.y - SRV_H - 16);
    ctx.globalAlpha = 1;
  }

  renderHUD(room);
  if (state === 'summary') renderSummary();
  if (state === 'attract' && !IS_ATTRACT) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }
}
function renderHUD(room) {
  ctx.textBaseline = 'top';
  // top-left: SCORE + REP
  ctx.font = 'bold 20px "Courier New", monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#fff'; ctx.fillText('SCORE ' + score, 14, 8);
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillStyle = INK; ctx.fillText('REP ' + Math.round(rep), 180, 12);
  // top-right: wave + timer, then the building-wide patience queue-strip
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('WAVE ' + Math.max(1, wave.num) + '  ' + fmtTime(sessionT), WORLD_W - 14, 10);
  const act = customers.filter(c => c.state === 'active');
  for (let i = 0; i < act.length; i++) {
    const c = act[i], fr = c.pat / c.patMax;
    const px = WORLD_W - 20 - i * 16;
    let col = fr > 0.5 ? '#3fae4a' : fr > 0.2 ? '#e8b23c' : (Math.floor(worldT / 150) % 2 ? '#e04040' : '#ff9080');
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, 40, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, 40, 5.5, 0, Math.PI * 2); ctx.stroke();
  }
  // top-center: combo streak stars
  ctx.textAlign = 'center'; ctx.font = 'bold 20px "Courier New", monospace';
  let starStr = '';
  for (let i = 0; i < 5; i++) starStr += i < stars ? '★' : '☆';
  if (stars >= 5) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14; }
  ctx.fillStyle = stars >= 3 ? '#ffd700' : stars > 0 ? '#e8c35a' : 'rgba(255,255,255,0.35)';
  ctx.fillText(starStr, WORLD_W / 2, 10);
  ctx.shadowBlur = 0;
  if (stars >= 3) {
    ctx.font = 'bold 11px "Courier New", monospace'; ctx.fillStyle = '#ffb060';
    ctx.fillText('RUSH ×' + comboMult().toFixed(2).replace(/0+$/, '').replace(/\.$/, ''), WORLD_W / 2, 32);
  }
  // bottom-center: room label
  ctx.font = 'bold 13px "Courier New", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(ROOMS[room].label, WORLD_W / 2, WORLD_H - 24);
  // bottom-left (galley only): prep status
  if (room === 'galley') {
    ctx.textAlign = 'left'; ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#ffcf8a';
    ctx.fillText(cooking.length + ' COOKING · SHELF ' + prepQueue.length + '/' + prepMax(), 14, WORLD_H - 24);
  }
  // bottom-right: CLOCK OUT + mute
  if (state === 'playing') {
    ctx.strokeStyle = 'rgba(201,122,61,0.8)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(CLOCK_ZONE.x, CLOCK_ZONE.y, CLOCK_ZONE.w, CLOCK_ZONE.h);
    ctx.textAlign = 'center'; ctx.font = 'bold 12px "Courier New", monospace'; ctx.fillStyle = INK;
    ctx.fillText('CLOCK OUT', CLOCK_ZONE.x + CLOCK_ZONE.w / 2, CLOCK_ZONE.y + 11);
  }
  ctx.textAlign = 'right'; ctx.font = '20px "Courier New", monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(muted ? '🔇' : '🔊', WORLD_W - 14, WORLD_H - 34);
}
function renderSummary() {
  const d = summaryData || { prevBest: 0, newBest: 0, repPeak: 0 };
  ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  const px0 = WORLD_W / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = INK; ctx.font = 'bold 34px "Courier New", monospace';
  ctx.shadowColor = INK; ctx.shadowBlur = 18;
  ctx.fillText('SHIFT COMPLETE', px0, 52);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 18px "Courier New", monospace'; ctx.fillStyle = '#fff';
  const lines = [
    'SCORE  ' + score,
    'ORDERS SERVED  ' + servedOrders + '   ·   MISSED  ' + missedOrders,
    'BEST COMBO  ' + bestStars + '★',
    'REP PEAK  ' + d.repPeak + '   (BEST EVER ' + d.newBest + (d.newBest > d.prevBest ? ' — NEW!' : '') + ')',
  ];
  lines.forEach((l, i) => ctx.fillText(l, px0, 112 + i * 30));
  // items breakdown
  const entries = Object.entries(itemsBreakdown).sort((a, b) => b[1] - a[1]).slice(0, 5);
  ctx.font = 'bold 14px "Courier New", monospace'; ctx.fillStyle = '#ccd';
  ctx.fillText('— ITEMS SERVED —', px0, 244);
  if (!entries.length) ctx.fillText('(none)', px0, 268);
  entries.forEach(([id, n], i) => {
    const y = 268 + i * 30;
    ctx.drawImage(ICONS[id], px0 - 110, y - 4, 24, 24);
    ctx.textAlign = 'left';
    ctx.fillText(MENU[id].name, px0 - 78, y);
    ctx.textAlign = 'right';
    ctx.fillText('×' + n, px0 + 110, y);
    ctx.textAlign = 'center';
  });
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText(nextUnlockText(), px0, 442);
  if (summaryTapDelay <= 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(worldT * 0.006) * 0.4) + ')';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText('TAP TO CONTINUE', px0, 478);
  }
}

// ── ATTRACT — silent scripted server loop, real walk/tray code ──────────────
const attractBot = { phase: 0, t: 0 };
function attractReset() {
  attractBot.phase = 0; attractBot.t = 0;
  player.room = 'galley'; player.x = 200; player.y = 440; player.facing = 1;
  player.carry = null; player.walkPhase = 0; player.moved = 0; player.exitCd = 0;
  customers = [];
  // one scripted Jimmy order waiting in the studio
  const seat = SEATS[0];
  customers.push({ arch: 'jimmy', seat, room: 'studio', items: ['coffee'], delivered: [false],
    patMax: 60000, pat: 60000, spawnT: worldT, state: 'active', resolveT: 0,
    happyT: 0, expr: 'neutral', exprPrev: null, exprMixT: 0 });
  cooking = []; prepQueue = [];
}
function botWalkTo(tx, dt) {
  const dx = tx - player.x;
  if (Math.abs(dx) < 8) return true;
  const step = Math.min(Math.abs(dx), 0.42 * dt);
  player.x += Math.sign(dx) * step;
  player.facing = dx > 0 ? 1 : -1;
  player.walkPhase += step / WALK_PX_PER_FRAME;   // same distance-driven stride
  player.moved = 2;
  return false;
}
function attractUpdate(dt) {
  const b = attractBot;
  b.t += dt;
  if (b.t > 5000) { b.t = 0; b.phase++; }          // dt-clamped, never stalls > 5s
  player.moved = Math.max(0, player.moved - 1);
  switch (b.phase) {
    case 0: // walk to counter, "cook"
      if (botWalkTo(440, dt)) { b.phase = 1; b.t = 0; }
      break;
    case 1: // brief cook pause with sparkle
      if (b.t > 900) { player.carry = 'coffee'; b.phase = 2; b.t = 0; }
      break;
    case 2: // carry out to the studio
      if (botWalkTo(930, dt) || player.room === 'studio') { /* exit swap below */ }
      if (player.x > 895 && player.room === 'galley') { player.room = 'studio'; player.x = 80; }
      if (player.room === 'studio') { b.phase = 3; b.t = 0; }
      break;
    case 3: // serve Jimmy
      if (botWalkTo(210, dt)) {
        const c = customers.find(x => x.arch === 'jimmy' && x.state === 'active');
        if (c) { c.delivered[0] = true; c.state = 'served'; c.resolveT = worldT; c.happyT = 1200; }
        player.carry = null;
        burstCone(190, 240, 16, '#ffcf8a', -Math.PI * 0.35, Math.PI * 0.3);
        addFloater(190, 220, '+10', INK);
        b.phase = 4; b.t = 0;
      }
      break;
    case 4: // wander toward the arcade to show room 3
      if (botWalkTo(930, dt)) { }
      if (player.x > 895 && player.room === 'studio') { player.room = 'arcade'; player.x = 80; }
      if (player.room === 'arcade') { b.phase = 5; b.t = 0; }
      break;
    case 5:
      botWalkTo(500, dt);
      if (b.t > 1400) { attractReset(); }
      break;
    default: attractReset();
  }
}

// ── LOOP ────────────────────────────────────────────────────────────────────
function loop(t) {
  const dt = Math.min(32, t - tPrev); tPrev = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ── COIN / START ────────────────────────────────────────────────────────────
function startGame() {
  refreshUnlocks();
  state = 'playing';
  score = 0; rep = 50; repPeak = 50; stars = 0; bestStars = 0;
  servedOrders = 0; missedOrders = 0; itemsBreakdown = {};
  sessionT = 0; shakeT = 0;
  customers = []; cooking = []; prepQueue = [];
  wave.num = 0; wave.phase = 'calm'; wave.calmT = 2500; wave.toSpawn = []; wave.vipIn = 2;
  player.room = 'galley'; player.x = 480; player.y = 450;
  player.facing = 1; player.carry = null; player.walkPhase = 0; player.moved = 0; player.exitCd = 0;
  floaters.length = 0; particles.length = 0;
  zoneLabel = { text: 'WELCOME TO THE GALLEY — COOK, CARRY, SERVE', t: 2600 }; lastZone = 'welcome';
}
document.getElementById('coinBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  unlockAudio();
  startGame();
});

// ── QA/RECORDING HOOK (house pattern: pin-vaders __PV, brick-invaders __game —
//    headless playtest-by-evaluate + footage --start-js need closure access) ──
window.__OU = {
  get state()   { return state; },      get score() { return score; },
  get rep()     { return rep; },        get muted() { return muted; },
  get room()    { return player.room; },
  get x()       { return player.x; },   get y()     { return player.y; },
  get carry()   { return player.carry; },
  get cooking() { return cooking.map(k => k.item); },
  get shelf()   { return prepQueue.slice(); },
  get customers() { return customers.map(c => ({ arch: c.arch, room: c.room, seatX: c.seat.x,
    items: c.items.slice(), delivered: c.delivered.slice(), state: c.state })); },
  bump: d => bumpRep(d),                // QA: drive the REP-0 shift-over path
};

if (IS_ATTRACT) {                        // ?attract=1: silent self-playing loop
  document.getElementById('overlay').classList.add('hidden');
  attractReset();
} else {
  attractReset();                        // same loop runs behind the coin overlay
}
requestAnimationFrame(loop);
})();
</script>
