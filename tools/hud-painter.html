<!DOCTYPE html>
<html lang="en">
<head>
<script>/* Placer key (2026-09-26 security): saves need X-Placer-Key. Open this tool from Osimo's
   bookmark link (…?key=…) once; the key is remembered on that device. */
window.PLACER_KEY=(function(){try{var k=new URLSearchParams(location.search).get('key');
if(k){localStorage.setItem('jnjPlacerKey',k);return k}return localStorage.getItem('jnjPlacerKey')||''}catch(e){return ''}})();</script>

<meta charset="utf-8">
<link rel="stylesheet" href="../cabinet.css">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HUD PLACER</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  Osimo 2026-09-07, after "the buttons still don't respond" survived a reinstall and a
  widened hit-box: "let me use placer and two colours yellow and grey and let me paint the
  clickable area and lock it in pixel perfect." That first version was a PAINT tool (colour
  in the pressable pixels), because the pause+speaker pair overlapped in a way a plain
  rectangle hadn't been able to describe correctly by eye.

  Osimo 2026-09-09, once pause was removed and only the speaker button was left: "can you
  show me the colour placer you made for the speaker button... allow me to edit it not as a
  paint on but as a square." One button doesn't need paint any more — a single drag-and-
  resize BOX describes it completely, so this is now that: the same BOX shape
  overlay-placer.html already uses for the studio TV etc, just in SCREEN space instead of
  the game's 960x540 world (the speaker is drawn in raw CSS pixels, never scaled, so this
  page paints at 1:1 — the numbers it saves ARE the numbers the tap handler reads, no
  world<->screen conversion anywhere in the loop).
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0904; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none;
               font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; color: #e8c35a; }
  #safeProbe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden;
               padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
               padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #c { display: block; position: fixed; left: 0; top: 0; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 6px;
         padding: 7px 10px; z-index: 5; pointer-events: none; flex-wrap: nowrap;
         overflow-x: auto; }
  .bar > * { pointer-events: auto; flex: 0 0 auto; }
  #top { top: 0; background: linear-gradient(rgba(6,5,4,.88), rgba(6,5,4,0)); }
  #bot { bottom: 0; background: linear-gradient(rgba(6,5,4,0), rgba(6,5,4,.92)); }
  button { font: bold 14px/1 'Barlow Condensed', sans-serif; letter-spacing: .04em;
           padding: 10px 13px; border-radius: 9px; border: 1.5px solid #ffffff33;
           background: #1a1409; color: #cfc6b4; cursor: pointer; }
  button.go { background: #e8c35a; color: #241a06; border-color: #e8c35a; }
  #sel { font-size: 14px; color: #fff3d0; white-space: nowrap; }
  #hint { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%);
          font-size: 13px; color: #cfc6b4; text-align: center; z-index: 4; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
           background: rgba(10,8,4,.95); border: 2px solid #e8c35a; border-radius: 14px;
           padding: 18px 24px; font-size: 17px; text-align: center; z-index: 9;
           display: none; max-width: 80vw; white-space: pre-line; }
</style>
</head>
<body>
<div id="safeProbe"></div>
<canvas id="c"></canvas>
<div class="bar" id="top">
  <div id="sel">SPEAKER BOX</div>
  <span style="flex:1"></span>
  <button id="reset">RESET</button>
  <button class="go" id="submit">SUBMIT</button>
</div>
<div id="hint">drag to move · − W + W and − H + H (or pinch) to resize · arrow keys to nudge</div>
<div class="bar" id="bot">
  <button id="wDown">− W</button>
  <button id="wUp">+ W</button>
  <button id="hDown">− H</button>
  <button id="hUp">+ H</button>
</div>
<div id="toast"></div>
<script>
(function () {
'use strict';
const QS = new URLSearchParams(location.search);
const EDIT = QS.get('edit') === '1';
// Osimo 2026-09-07: "you also should teach yourself to use a tool like [this]... paint,
// look, amend, perfect, lock in pixels, publish." For a box that's computable (clear of
// everything else on the HUD) rather than a subjective call, Claude can drive this page
// himself via Playwright — drag, screenshot, submit — instead of only hand-deriving numbers.
// Those submissions are tagged 'claude', never 'osimo', so the self-retire rule below (which
// only fires on Osimo's OWN submission) can't mistake a computed default for his final word.
const BY = QS.get('by') === 'claude' ? 'claude' : 'osimo';

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const SAFE = { l: 0, t: 0 };
function readSafe() {
  const el = document.getElementById('safeProbe');
  const cs = getComputedStyle(el);
  SAFE.l = parseFloat(cs.paddingLeft) || 0;
  SAFE.t = parseFloat(cs.paddingTop) || 0;
}
let DPR = 1, SW = 0, SH = 0;
function resize() {
  readSafe();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = Math.round(document.documentElement.clientWidth);
  SH = Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight);
  canvas.style.width = SW + 'px'; canvas.style.height = SH + 'px';
  canvas.width = Math.round(SW * DPR); canvas.height = Math.round(SH * DPR);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
setInterval(resize, 300);
resize();

// Opens on the CURRENT shipped box (the-count.html's own HUD_CTRL.snd default) — never
// starts from nothing. RESET goes back to exactly this.
const DEFAULT_BOX = { x: 0, y: 0, w: 72, h: 54 };
let box = { ...DEFAULT_BOX };

// The real glyph + the cash figure it sits next to, drawn dim underneath at the game's own
// numbers, so the box is dragged against what is actually on screen — same reference layer
// the paint version had, just carried over (the cash figure is what a first-round paint
// collided with before, per that version's own history).
function drawRef() {
  const L = SAFE.l, T = SAFE.t;
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(6,5,4,0.62)';
  ctx.fillRect(0, 0, SW, 54 + T);
  ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('🔊', L + box.x + 16, 32 + T);
  ctx.font = 'bold 25px "Barlow Condensed",sans-serif';
  ctx.fillText('£12.06', L + 78, 32 + T);
  ctx.globalAlpha = 1;
}

// /api/press only knows two shapes server-side — 'paint' (cells[]) and 'points' (items[]) —
// so a single box rides as ONE 'points' item, exactly the shape overlay-placer's own boxes
// (the studio TV, the podcast monitors) already use. &kind=points matters: the GET route
// picks its KV key from the query string, not from room, and defaults to 'paint' — the old
// hud-painter's own record — without it.
fetch('/api/press?room=hud&kind=points').then(r => r.json()).then(d => {
  if (!d || !Array.isArray(d.items) || !d.items.length) return;
  const it = d.items.find(x => x.id === 'speaker') || d.items[0];
  if (!it) return;
  box = { x: it.x, y: it.y || 0, w: it.w || DEFAULT_BOX.w, h: it.h || DEFAULT_BOX.h };
  updateSel();
  if (d.by === 'osimo' && d.savedAt && !EDIT) retire();
}).catch(() => {});

function frame() {
  requestAnimationFrame(frame);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0904'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawRef();
  const L = SAFE.l, T = SAFE.t;
  ctx.fillStyle = 'rgba(255,215,94,0.30)';
  ctx.fillRect(L + box.x, T + box.y, box.w, box.h);
  ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3;
  ctx.strokeRect(L + box.x, T + box.y, box.w, box.h);
}
requestAnimationFrame(frame);

// Hit-test + drag, same shape as overlay-placer's box: pick() checks the drawn rect, drag
// tracks the pointer's offset FROM the box's own x/y so it doesn't jump to re-centre on grab.
function toLocal(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: (px - r.left) - SAFE.l, y: (py - r.top) - SAFE.t };
}
function inBox(p) {
  return p.x >= box.x - 8 && p.x <= box.x + box.w + 8 && p.y >= box.y - 8 && p.y <= box.y + box.h + 8;
}
let drag = null, pinch = null;
function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    pinch = { d: dist(e.touches[0], e.touches[1]), w: box.w, h: box.h };
    drag = null; return;
  }
  const p = toLocal(e.touches[0].clientX, e.touches[0].clientY);
  drag = inBox(p) ? { dx: p.x - box.x, dy: p.y - box.y } : null;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length === 2) {
    const k = dist(e.touches[0], e.touches[1]) / pinch.d;
    box.w = Math.max(16, Math.min(400, Math.round(pinch.w * k)));
    box.h = Math.max(16, Math.min(200, Math.round(pinch.h * k)));
    updateSel(); return;
  }
  if (!drag || !e.touches.length) return;
  const p = toLocal(e.touches[0].clientX, e.touches[0].clientY);
  box.x = Math.round(p.x - drag.dx); box.y = Math.round(p.y - drag.dy);
  updateSel();
}, { passive: false });
canvas.addEventListener('touchend', e => { if (!e.touches.length) { drag = null; pinch = null; } });
canvas.addEventListener('mousedown', e => {
  const p = toLocal(e.clientX, e.clientY);
  drag = inBox(p) ? { dx: p.x - box.x, dy: p.y - box.y } : null;
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const p = toLocal(e.clientX, e.clientY);
  box.x = Math.round(p.x - drag.dx); box.y = Math.round(p.y - drag.dy);
  updateSel();
});
window.addEventListener('mouseup', () => { drag = null; });
window.addEventListener('keydown', e => {
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') box.x -= step;
  else if (e.key === 'ArrowRight') box.x += step;
  else if (e.key === 'ArrowUp') box.y -= step;
  else if (e.key === 'ArrowDown') box.y += step;
  else return;
  e.preventDefault(); updateSel();
});

function updateSel() {
  document.getElementById('sel').textContent =
    'SPEAKER  x' + box.x + ' y' + box.y + ' w' + box.w + ' h' + box.h;
}
updateSel();

document.getElementById('wDown').onclick = () => { box.w = Math.max(16, box.w - 4); updateSel(); };
document.getElementById('wUp').onclick   = () => { box.w = Math.min(400, box.w + 4); updateSel(); };
document.getElementById('hDown').onclick = () => { box.h = Math.max(16, box.h - 4); updateSel(); };
document.getElementById('hUp').onclick   = () => { box.h = Math.min(200, box.h + 4); updateSel(); };
document.getElementById('reset').onclick = () => {
  box = { ...DEFAULT_BOX }; updateSel(); toast('Back to the shipped box.', 1400);
};

let toastT = 0;
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.display = 'none'; }, ms || 2600);
}
function retire() {
  const b = document.getElementById('submit');
  if (b) b.remove();
}

const submitBtn = document.getElementById('submit');
if (submitBtn) submitBtn.onclick = async () => {
  submitBtn.disabled = true; submitBtn.textContent = 'SENDING…';
  try {
    const r = await fetch('/api/press', {
      method: 'POST', headers: { 'content-type': 'application/json', 'X-Placer-Key': window.PLACER_KEY },
      body: JSON.stringify({ by: BY, room: 'hud', kind: 'points',
                             items: [{ id: 'speaker', x: box.x, y: box.y, w: box.w, h: box.h }] }),
    });
    const d = await r.json();
    if (d.ok) { toast('SUBMITTED ✅\nTell Claude and he will wire the taps.', 5000); retire(); }
    else toast('Did not save: ' + (d.error || r.status), 5000);
  } catch (e) { toast('Did not save: ' + e.message, 5000); }
  submitBtn.disabled = false; submitBtn.textContent = 'SUBMIT';
};
})();
</script>
</body>
</html>
