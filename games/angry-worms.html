<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ANGRY WORMS</title>
<link rel="stylesheet" href="../cabinet.css">
<script src="../vendor/gsap.min.js"></script>
<script src="../arcade-scores.js?v=20"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100dvh; overflow: hidden; background: #000; font-family: 'Bungee', sans-serif; }
#gameCanvas { display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: pointer; }
.hidden { display: none !important; }

#overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#overlay h1 {
  font-size: 52px; color: #e8302a; letter-spacing: 4px;
  text-shadow: 0 0 24px #e8302a, 0 0 48px #e8302a;
  line-height: 1;
}
#overlay h2 {
  font-size: 14px; color: #888; margin-top: 14px; letter-spacing: 6px;
}
#coinBtn {
  margin-top: 50px; padding: 16px 42px;
  background: transparent; color: #fff;
  border: 3px solid #e8302a; cursor: pointer;
  font-family: 'Bungee', sans-serif; font-size: 20px;
  letter-spacing: 3px; animation: blink 1.1s steps(2,start) infinite;
  text-shadow: 0 0 12px #e8302a;
}
@keyframes blink { 50% { opacity: 0.25; } }
#overlay .hint { margin-top: 26px; font-size: 11px; color: #555; letter-spacing: 2px; }

#rotate {
  position: fixed; inset: 0; z-index: 100;
  background: #100304;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center;
}
#rotate .ri { font-size: 56px; }
#rotate h2 { font-family: 'Bungee', cursive; font-size: 20px; color: #f2e9d8; }
#rotate p { font-weight: 600; color: #b8ad97; }
@media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }

#endScreen {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,0.88);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#endScreen h1 { font-size: 48px; letter-spacing: 4px; line-height: 1; }
#endScreen .score { font-size: 22px; color: #fff; margin-top: 20px; letter-spacing: 2px; }
#endScreen .btn {
  margin-top: 30px; padding: 14px 36px; cursor: pointer;
  background: transparent; color: #fff; border: 3px solid #e8302a;
  font-family: 'Bungee', sans-serif; font-size: 18px; letter-spacing: 2px;
  text-shadow: 0 0 12px #e8302a;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="overlay">
  <h1>ANGRY WORMS</h1>
  <h2>ANGRY BIRDS &times; WORMS</h2>
  <button id="coinBtn">TAP TO INSERT COIN</button>
  <div class="hint">DRAG TO AIM &middot; RELEASE TO FIRE &middot; TAP MID-FLIGHT FOR ABILITY</div>
</div>

<div id="rotate">
  <div class="ri">📱</div>
  <h2>Rotate to Landscape</h2>
  <p>Angry Worms needs landscape mode</p>
</div>

<div id="endScreen">
  <h1 id="endTitle">LEVEL CLEAR!</h1>
  <div class="score" id="endScore">SCORE 0</div>
  <button class="btn" id="endBtn">NEXT LEVEL</button>
</div>

<script>
"use strict";

// ====== CONFIG ======
const WORLD_W = 1800;
const WORLD_H = 720;
const GRAVITY = 0.25;
const SLING_X = 220;
const GROUND_Y = 600;
const MAX_PULL = 120;
const SLING_Y = GROUND_Y - 250;  // launch anchor — top of the watchtower turret
const WATER_Y = 695;   // Worms-style sea — anything below this drowns
const TERRAIN_PAD = 260;  // terrain continues past the world edges — wide viewports
                          // used to show the ground ending in mid-air (Osimo 2026-07-03)

// ====== STATE ======
let canvas, ctx;
let W = 0, H = 0, DPR = 1;
let camera = { x: 0, y: 0, targetX: 0 };
let lastTime = 0;

let gameState = "attract";
let level = 1;
let score = 0;
let turn = "player";
let turnTimer = 0;
let wind = 0;
let aiming = false;
let dragStart = null;
let dragCurrent = null;
let loadedWorm = null;
let selectedType = 0;
let inventory = [
  { type: "red", count: 3 },
  { type: "bomber", count: 2 },
  { type: "splitter", count: 1 }
];

let worms = [];
let blocks = [];
let particles = [];
let projectiles = [];
let stars = [];
let clouds = [];
let terrain = [];
let gravestones = [];

let shakeT = 0;   // screenshake frames (violent detonations, AB block slams)
let attractTimer = 0;
let attractPhase = 0;
let attractProj = null;

// ====== INIT ======
window.addEventListener("load", init);

function init() {
  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", resize);
  setupInput();
  generateStars();
  generateClouds();
  buildLevel(1);
  camera.x = 0;
  camera.targetX = 0;

  // Attract mode prep
  startAttractCycle();

  document.getElementById("coinBtn").addEventListener("click", insertCoin);
  document.getElementById("endBtn").addEventListener("click", onEndBtn);

  requestAnimationFrame(gameLoop);
}

const VIEW = { scale: 1, w: WORLD_W, h: WORLD_H };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Fit the world VERTICALLY into the viewport — phone-landscape screens are ~400 CSS px
  // tall, the world is 720: without this the terrain (y 500+) sat below the screen and
  // players saw nothing but sky (Osimo 2026-07-02).
  VIEW.scale = H / WORLD_H;
  VIEW.w = W / VIEW.scale;      // visible world width
  VIEW.h = WORLD_H;
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 20; i++) {
    stars.push({
      x: Math.random() * WORLD_W,
      y: Math.random() * 200,
      r: Math.random() * 1.5 + 0.5,
      tw: Math.random() * Math.PI * 2,
      tws: 0.02 + Math.random() * 0.04
    });
  }
}

function generateClouds() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * WORLD_W,
      y: 40 + Math.random() * 180,
      r: 30 + Math.random() * 40,
      s: 0.1 + Math.random() * 0.2
    });
  }
}

// ====== LEVEL BUILD ======
function buildLevel(lvl) {
  level = lvl;
  terrain = generateTerrain(lvl);
  blocks = [];
  worms = [];
  particles = [];
  projectiles = [];
  gravestones = [];

  // Difficulty curve v3 (Osimo 2026-07-03): early levels EASY — no structures, targets
  // close and in the open. Distance + defenses + ammo pressure all grow with level.
  const zoneStart = Math.min(1450, 600 + lvl * 100);   // enemies start close, drift right
  if (lvl <= 2) {
    // Open ground — just worms on the terrain, nothing to knock down
    const n = 1 + lvl;                                  // L1: 2 worms · L2: 3 worms
    for (let i = 0; i < n; i++) {
      const wx = zoneStart + i * (120 + Math.random() * 60);
      worms.push(makeWorm(wx, terrainHeightAt(wx) - 20, "enemy", "green"));
    }
  } else {
    const baseCount = Math.min(5, lvl - 1);
    let bx = zoneStart;
    for (let i = 0; i < baseCount && bx < 1700; i++) {
      buildStructure(bx, 120 + Math.random() * 60, lvl);
      bx += 180 + Math.random() * 30;
    }
    // one bonus worm in the open between bunkers
    const ox = zoneStart - 90;
    worms.push(makeWorm(ox, terrainHeightAt(ox) - 20, "enemy", "green"));
  }

  // Ammo per level — generous early, tight later; TROOPERS unlock at L3
  // (trooper = doesn't explode, deploys where it lands and shoots from there)
  if (lvl === 1)      inventory = [{ type: "red", count: 4 }];
  else if (lvl === 2) inventory = [{ type: "red", count: 3 }, { type: "bomber", count: 1 }];
  else if (lvl === 3) inventory = [{ type: "red", count: 3 }, { type: "bomber", count: 1 },
                                   { type: "trooper", count: 1 }];
  else if (lvl === 4) inventory = [{ type: "red", count: 3 }, { type: "bomber", count: 2 },
                                   { type: "splitter", count: 1 }, { type: "trooper", count: 1 }];
  else                inventory = [{ type: "red", count: 3 }, { type: "bomber", count: 2 },
                                   { type: "splitter", count: 1 }, { type: "bouncer", count: 1 },
                                   { type: "trooper", count: 2 }];

  // Worms mechanic: TNT barrels near the bunkers — chain reactions (L3+ only)
  if (lvl >= 3) {
    const nBarrels = 1 + Math.floor((lvl - 2) / 2);
    for (let bi = 0; bi < nBarrels; bi++) {
      const bxp = zoneStart - 40 + Math.random() * (1700 - zoneStart);
      blocks.push({ x: bxp, y: terrainHeightAt(bxp + 13) - 34, w: 26, h: 34,
        hp: 10, maxHp: 10, type: "barrel", vx: 0, vy: 0,
        falling: false, settled: true, rot: 0 });
    }
  }
  // COMPLETABILITY BUDGET v2 (Osimo 2026-07-03, "simple calculation: worms given =
  // worms needed"): a kill realistically costs ~2 hits (wound + finish, or a miss),
  // so firepower = 2 per enemy + 1 spare. A trooper is worth 3 (his landed barrage).
  // Top up reds until the budget holds — no level can ship short.
  // v3 (Osimo: "lev 3 was impossible"): a worm ON a bunker costs ~3 (blocks shield
  // it) vs 2 in the open. makeWorm tags bunkered=true from buildStructure.
  const openFoes = worms.filter(w => w.team === "enemy" && !w.bunkered).length;
  const bunkFoes = worms.filter(w => w.team === "enemy" && w.bunkered).length;
  const needed = openFoes * 2 + bunkFoes * 3 + 1;
  let cap = inventory.reduce((s, i) => s + i.count * (i.type === "trooper" ? 3 : 1), 0);
  while (cap < needed) { inventory[0].count++; cap++; }
  selectedType = 0;
  loadNextWorm();
}

function generateTerrain(lvl) {
  const arr = [];
  // Slingshot hill
  const hillX = SLING_X;
  for (let x = -TERRAIN_PAD; x <= WORLD_W + TERRAIN_PAD; x += 4) {
    let y = GROUND_Y;
    // Big slingshot hill
    y -= 80 * Math.exp(-Math.pow((x - hillX) / 140, 2));
    // Rolling hills between
    y -= 40 * Math.sin(x * 0.008) * Math.cos(x * 0.003);
    y -= 30 * Math.sin(x * 0.015 + 1);
    // Right side elevated plateau for structures
    if (x > 1050) {
      const t = Math.min(1, (x - 1050) / 100);
      y -= 60 * t;
    }
    arr.push({ x: x, y: y });
  }
  return arr;
}

function buildStructure(x, width, lvl) {
  const groundY = terrainHeightAt(x + width / 2);
  const layers = 2 + Math.min(3, lvl);
  const blockW = 40;
  const blockH = 30;
  let placed = 0;
  for (let row = 0; row < layers; row++) {
    const count = 2 + Math.floor(Math.random() * 2);
    const rowW = count * blockW;
    const startX = x + (width - rowW) / 2;
    for (let c = 0; c < count; c++) {
      if (placed >= 6 + lvl * 2) break;
      const roll = Math.random();
      // AB material mix: wood default, stone tanky, ice (lvl 2+) shatters in one hit
      const btype = roll < 0.3 ? "stone" : (lvl >= 2 && roll < 0.48 ? "ice" : "wood");
      const bhp = btype === "stone" ? 60 : btype === "ice" ? 12 : 30;
      blocks.push({
        x: startX + c * blockW,
        y: groundY - (row + 1) * blockH,
        w: blockW,
        h: blockH,
        hp: bhp,
        maxHp: bhp,
        type: btype,
        vx: 0, vy: 0,
        falling: false,
        settled: false,
        rot: 0
      });
      placed++;
    }
  }
  // Place enemy worm on top
  const topBlock = blocks.filter(b => b.x >= x && b.x < x + width).reduce((a, b) => a.y > b.y ? a : b, { y: groundY });
  const bw = makeWorm(x + width / 2, topBlock.y - 20, "enemy", "green");
  bw.bunkered = true;   // shielded by blocks — costs more ammo in the budget
  worms.push(bw);
}

function makeWorm(x, y, team, type) {
  return {
    x: x, y: y, vx: 0, vy: 0,
    team: team, type: type,
    hp: 100, maxHp: 100,
    radius: 18,
    alive: true,
    falling: false,
    onGround: false,
    facing: team === "player" ? 1 : -1,
    deathTimer: 0,
    flashTimer: 0,
    wiggle: 0
  };
}

function terrainHeightAt(x) {
  if (x < -TERRAIN_PAD) return GROUND_Y;
  if (x > WORLD_W + TERRAIN_PAD) return GROUND_Y;
  const i = Math.floor((x + TERRAIN_PAD) / 4);
  if (i < 0 || i >= terrain.length - 1) return GROUND_Y;
  const t = (x - terrain[i].x) / 4;
  return terrain[i].y * (1 - t) + terrain[i + 1].y * t;
}

// ====== INPUT ======
function setupInput() {
  let pointerActive = false;
  let panMode = false;
  let lastPanX = 0;
  let downAt = null;
  let movedFar = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  // screen px → world coords (the world is scaled to fit the viewport height)
  function toWorld(p) {
    return { x: p.x / VIEW.scale + camera.x, y: p.y / VIEW.scale + camera.y };
  }

  function onDown(e) {
    e.preventDefault();
    initAudio();
    const p = getPos(e);
    // Check inventory slots (screen-space HUD)
    if (gameState === "playing" && turn === "player") {
      if (checkInventoryTap(p)) return;
    }
    // Check mute button
    if (checkMuteTap(p)) return;

    if (gameState !== "playing") return;
    const wpt = toWorld(p);
    downAt = { x: p.x, y: p.y };
    movedFar = false;
    pointerActive = true;

    // Near the slingshot on your turn = AIM; anywhere else = PAN the camera
    // (Osimo 2026-07-02: "should be able to move back and forth to see my enemies")
    const dx = wpt.x - SLING_X;
    const dy = wpt.y - (SLING_Y);
    if (turn === "player" && loadedWorm && Math.sqrt(dx * dx + dy * dy) < 150) {
      aiming = true;
      panMode = false;
      dragStart = { x: SLING_X, y: SLING_Y };
      dragCurrent = { x: wpt.x, y: wpt.y };
    } else {
      panMode = true;
      lastPanX = p.x;
    }
  }

  function onMove(e) {
    if (!pointerActive) return;
    e.preventDefault();
    const p = getPos(e);
    if (downAt && Math.abs(p.x - downAt.x) + Math.abs(p.y - downAt.y) > 12) movedFar = true;
    if (panMode) {
      // map-style drag: finger right = look left
      camera.targetX -= (p.x - lastPanX) / VIEW.scale;
      camera.x = camera.targetX = Math.max(0, Math.min(WORLD_W - VIEW.w, camera.targetX));
      lastPanX = p.x;
      return;
    }
    const wpt = toWorld(p);
    dragCurrent = { x: wpt.x, y: wpt.y };
  }

  function onUp(e) {
    if (!pointerActive) return;
    e.preventDefault();
    pointerActive = false;
    if (aiming && loadedWorm) {
      fireWorm();
    } else if (panMode && !movedFar) {
      // a clean TAP (no drag) triggers the mid-flight ability
      onTapAbility(e);
    }
    aiming = false;
    panMode = false;
  }

  // Mid-flight ability tap (separate from drag)
  function onTapAbility(e) {
    if (gameState === "playing" && projectiles.length > 0) {
      // Use first projectile
      const p = projectiles[0];
      if (p.type === "bomber" && !p.abilityUsed) {
        p.abilityUsed = true;
        explode(p.x, p.y, 80, p.team);
        p.dead = true;
      } else if (p.type === "bouncer" && !p.abilityUsed) {
        p.abilityUsed = true;
        explode(p.x, p.y, 65, p.team);
        p.dead = true;
      } else if (p.type === "splitter" && !p.abilityUsed) {
        p.abilityUsed = true;
        // Create 2 more
        for (let k = -1; k <= 1; k += 2) {
          projectiles.push({
            x: p.x, y: p.y,
            vx: p.vx + k * 2,
            vy: p.vy - 1,
            type: "splitter",
            team: p.team,
            radius: 12,
            dead: false,
            abilityUsed: true,
            trail: []
          });
        }
      }
    }
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
}

function checkInventoryTap(p) {
  const barY = H - 60;
  const slotW = 120;
  const totalW = inventory.length * slotW;
  const startX = (W - totalW) / 2;
  for (let i = 0; i < inventory.length; i++) {
    const sx = startX + i * slotW;
    if (p.x >= sx && p.x < sx + slotW - 10 && p.y >= barY && p.y < barY + 50) {
      if (inventory[i].count > 0) {
        selectedType = i;
        loadNextWorm();
      }
      return true;
    }
  }
  return false;
}

function checkMuteTap(p) {
  if (p.x > W - 60 && p.x < W - 10 && p.y > H - 55 && p.y < H - 5) {
    muted = !muted;
    localStorage.setItem("aw_muted", muted ? "1" : "0");
    return true;
  }
  return false;
}

let muted = localStorage.getItem("aw_muted") === "1";
let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function playTone(freq, dur, type, vol, sweepTo) {
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function playChord(freqs, dur, type, vol) { freqs.forEach(f => playTone(f, dur, type, vol)); }
const sfx = {
  launch:  () => { playTone(180, 0.25, "sawtooth", 0.12, 900); },                              // slingshot whoosh
  wheee:   () => { playTone(500, 0.55, "sine", 0.1, 1100); },                                  // AB flight cry
  boom:    () => { playTone(90, 0.5, "sine", 0.3, 25); playTone(200, 0.25, "square", 0.1, 40); },
  barrel:  () => { playTone(70, 0.6, "sine", 0.35, 20); playTone(300, 0.3, "sawtooth", 0.12, 50); },
  thud:    () => { playTone(120, 0.12, "sine", 0.18, 55); },
  boing:   () => { playTone(220, 0.22, "sine", 0.16, 660); },                                  // bouncer ricochet
  splash:  () => { playTone(400, 0.3, "sine", 0.14, 90); playTone(700, 0.2, "sine", 0.07, 200); },
  incoming:() => { playTone(660, 0.16, "square", 0.14); setTimeout(() => playTone(520, 0.2, "square", 0.14), 190); setTimeout(() => playTone(660, 0.16, "square", 0.14), 400); },
  fanfare: () => { playChord([523, 659, 784], 0.35, "triangle", 0.13); setTimeout(() => playChord([659, 784, 1047], 0.5, "triangle", 0.13), 220); },
  lose:    () => { playTone(330, 0.4, "sawtooth", 0.16, 140); setTimeout(() => playTone(180, 0.7, "sawtooth", 0.16, 60), 250); }
};

// ====== SLINGSHOT & LOADING ======
function loadNextWorm() {
  loadedWorm = null;
  if (inventory[selectedType].count <= 0) {
    // Find any with count
    for (let i = 0; i < inventory.length; i++) {
      if (inventory[i].count > 0) {
        selectedType = i;
        break;
      }
    }
  }
  if (inventory[selectedType].count > 0) {
    loadedWorm = {
      x: SLING_X,
      y: SLING_Y,
      type: inventory[selectedType].type,
      team: "player",
      radius: 16
    };
  }
}

function fireWorm() {
  if (!loadedWorm || !dragCurrent) return;
  let dx = dragStart.x - dragCurrent.x;
  let dy = dragStart.y - dragCurrent.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 10) return;
  const pull = Math.min(dist, MAX_PULL);
  const power = (pull / MAX_PULL) * 18;
  const ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * power;
  const vy = Math.sin(ang) * power;
  projectiles.push({
    x: loadedWorm.x,
    y: loadedWorm.y,
    vx: vx,
    vy: vy,
    type: loadedWorm.type,
    team: "player",
    radius: 16,
    dead: false,
    abilityUsed: false,
    trail: []
  });
  inventory[selectedType].count--;
  loadedWorm = null;
  sfx.launch();
  setTimeout(() => sfx.wheee(), 120);
}

// ====== TROOPER FIRE (deployed worms shoot from where they landed) ======
// Osimo 2026-07-03: our-turn-only like Angry Birds — the old enemy-AI return fire
// is GONE. Troopers are the new toy: they don't explode, they land, dig in, and
// take 3 aimed bazooka shots at the nearest enemy from wherever they stand.
function trooperFire(w) {
  const targets = worms.filter(e => e.team === "enemy" && e.alive);
  if (!targets.length) { w.shotsLeft = 0; return; }
  let t = targets[0], best = 1e9;
  for (const e of targets) {
    const d = Math.abs(e.x - w.x);
    if (d < best) { best = d; t = e; }
  }
  // Ballistic solve over a fixed flight time → lands near the target every time,
  // with a little scatter so it isn't a laser
  const T = 46;
  const dx = (t.x - w.x) + (Math.random() - 0.5) * 60;
  const dy = (t.y - (w.y - 24)) + (Math.random() - 0.5) * 20;
  projectiles.push({
    x: w.x, y: w.y - 24,
    vx: dx / T,
    vy: dy / T - 0.5 * GRAVITY * T,
    type: "trooperShot",
    team: "player",
    radius: 7,
    dead: false,
    abilityUsed: true,
    trail: []
  });
  w.facing = t.x > w.x ? 1 : -1;
  w.shotsLeft--;
  w.shotTimer = 55;
  sfx.launch();
}

// ====== PHYSICS ======
function updatePhysics(dt) {
  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.age = (p.age || 0) + 1;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 15) p.trail.shift();
    p.vy += GRAVITY;
    p.vx += wind * 0.03;
    p.x += p.vx;
    p.y += p.vy;

    // Camera follows EVERY shot — enemy fire was happening off-screen (Osimo 2026-07-02)
    camera.targetX = Math.max(0, Math.min(WORLD_W - VIEW.w, p.x - VIEW.w / 2));

    // Water splash — the sea eats worms, no boom
    if (p.y > WATER_Y) {
      for (let s = 0; s < 12; s++) {
        particles.push({ x: p.x + (Math.random() - 0.5) * 16, y: WATER_Y,
          vx: (Math.random() - 0.5) * 3, vy: -2.5 - Math.random() * 3.5,
          life: 32, maxLife: 32, size: 3 + Math.random() * 4,
          color: "#9fd0f5", type: "spark", gravity: 0.25 });
      }
      p.dead = true;
      sfx.splash();
    }
    // Terrain collision (armed only after 10 frames — a pulled-back worm sits inside
    // the hillside at launch and used to explode at your feet, Osimo 2026-07-02)
    const groundY = terrainHeightAt(p.x);
    if (!p.dead && p.age > 10 && p.y > groundY - p.radius) {
      // Worms mechanic: BOUNCER ricochets twice before going off
      if (p.type === "bouncer" && (p.bounces || 0) < 2) {
        p.bounces = (p.bounces || 0) + 1;
        p.y = groundY - p.radius;
        p.vy = -Math.abs(p.vy) * 0.65;
        p.vx *= 0.85;
        sfx.boing();
      } else if (p.type === "trooper") {
        // TROOPER: no boom — deploys where he lands and shoots from there
        deployTrooper(p.x, groundY);
        p.dead = true;
      } else {
      // Hit ground
      explode(p.x, groundY, p.type === "trooperShot" ? 38 : 50, p.team);
      p.dead = true;
      }
    }
    // Block collision
    for (const b of blocks) {
      if (b.hp <= 0 || p.age <= 10) continue;
      if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        if (p.type === "trooper") {
          deployTrooper(p.x, b.y);            // lands ON the bunker — great vantage
        } else {
          explode(p.x, p.y, p.type === "trooperShot" ? 38 : 50, p.team);
        }
        p.dead = true;
        break;
      }
    }
    // Worm collision
    for (const w of worms) {
      if (!w.alive) continue;
      if (w.team === p.team) continue;
      const dx = w.x - p.x;
      const dy = w.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) < w.radius + p.radius) {
        if (p.type === "trooper") {
          deployTrooper(p.x, w.y);            // lands beside them — point-blank duty
        } else {
          explode(p.x, p.y, p.type === "trooperShot" ? 38 : 60, p.team);
        }
        p.dead = true;
        break;
      }
    }
    // Off world
    if (p.x < -50 || p.x > WORLD_W + 50 || p.y > WORLD_H + 100) {
      p.dead = true;
    }
    if (p.dead) {
      projectiles.splice(i, 1);
      // Schedule turn end
      if (turnTimer === 0) turnTimer = 90;
    }
  }

  // Update blocks — AB gravity (Osimo 2026-07-03): blocks with nothing under them
  // FALL, shoved blocks slide, towers collapse; a falling block crushes worms.
  function blockSupported(b) {
    const gy = terrainHeightAt(b.x + b.w / 2);
    if (b.y + b.h >= gy - 6) return true;
    for (const o of blocks) {
      if (o === b || o.hp <= 0) continue;
      if (Math.abs((b.y + b.h) - o.y) < 8 &&
          b.x + b.w > o.x + 6 && b.x < o.x + o.w - 6) return true;
    }
    return false;
  }
  for (const b of blocks) {
    if (b.hp <= 0) {
      b.falling = true;
    } else if (!b.falling && !blockSupported(b)) {
      b.falling = true;           // tower lost its base — down it comes
      b.settled = false;
    }
    if (b.falling) {
      b.vy = (b.vy || 0) + GRAVITY;
      b.y += b.vy;
      b.x += (b.vx || 0);
      b.vx = (b.vx || 0) * 0.98;
      b.rot += (b.vx || 0) * 0.05;
      // crush worms under a falling block (AB signature kill)
      if (b.hp > 0 && b.vy > 3) {
        for (const w of worms) {
          if (!w.alive || w.dying) continue;
          if (w.x > b.x - 4 && w.x < b.x + b.w + 4 &&
              w.y + w.radius > b.y && w.y < b.y + b.h + 6) {
            w.hp -= b.vy * (b.type === "stone" ? 9 : 6);
            w.flashTimer = 10;
            sfx.thud();
            if (w.hp <= 0 && !w.dying) startDying(w);
          }
        }
      }
      const gy = terrainHeightAt(b.x + b.w / 2);
      let landY = gy;
      for (const o of blocks) {
        if (o === b || o.hp <= 0 || o.falling) continue;
        if (b.x + b.w > o.x + 6 && b.x < o.x + o.w - 6 && o.y >= b.y + b.h - 12 && o.y < landY) {
          landY = o.y;
        }
      }
      if (b.y + b.h > landY) {
        if (b.vy > 5 && b.hp > 0) { b.hp -= b.vy * 2.5; shakeT = Math.max(shakeT, 5); }
        b.y = landY - b.h;
        b.vy = 0;
        b.vx = (b.vx || 0) * 0.4;
        if (Math.abs(b.vx) < 0.4) { b.vx = 0; b.settled = true; b.falling = b.hp <= 0; }
      }
    }
  }
  // Remove fully destroyed blocks after they fall off
  blocks = blocks.filter(b => b.y < WORLD_H + 200);

  // Update worms (gravity for ones not on ground)
  for (const w of worms) {
    if (!w.alive) {
      w.deathTimer += 1;
      w.vy += GRAVITY * 0.5;
      w.y += w.vy;
      w.x += w.vx;
      continue;
    }
    w.wiggle += 0.1;
    if (w.flashTimer > 0) w.flashTimer--;
    const gy = terrainHeightAt(w.x);
    // Check if supported by block
    let supported = false;
    for (const b of blocks) {
      if (b.hp <= 0) continue;
      if (w.x > b.x - 5 && w.x < b.x + b.w + 5 && Math.abs(w.y + w.radius - b.y) < 5) {
        supported = true;
        w.y = b.y - w.radius;
        break;
      }
    }
    if (!supported) {
      if (w.y + w.radius < gy) {
        w.vy += GRAVITY * 0.6;
        w.y += w.vy;
        w.onGround = false;
      } else {
        // Worms fall damage — knocked off a bunker = it hurts
        if (w.vy > 9 && w.alive) {
          const fdmg = (w.vy - 9) * 7;
          w.hp -= fdmg; w.flashTimer = 10; sfx.thud();
          if (w.hp <= 0 && !w.dying) startDying(w);
        }
        w.y = gy - w.radius;
        w.vy = 0;
        w.onGround = true;
      }
    } else {
      w.vy = 0;
      w.onGround = true;
    }
    // Worms rule: the sea is lethal — splash + sink
    if (w.alive && w.y + w.radius > WATER_Y) {
      w.alive = false;
      w.deathTimer = 40;
      w.vy = 1;
      for (let i = 0; i < 14; i++) {
        particles.push({ x: w.x + (Math.random() - 0.5) * 20, y: WATER_Y,
          vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 3,
          life: 30 + Math.random() * 15, maxLife: 45, size: 3 + Math.random() * 4,
          color: "#9fd0f5", type: "spark", gravity: 0.25 });
      }
      if (w.team === "enemy") score += 100;
      sfx.splash();
    }
    if (w.y > WORLD_H + 50) {
      w.alive = false;
      w.deathTimer = 100;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.vy += pt.gravity || 0.15;
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // Deployed troopers: aim + fire from wherever they landed
  if (gameState === "playing") {
    for (const w of worms) {
      if (w.team === "player" && w.alive && (w.shotsLeft || 0) > 0 && w.onGround && !w.dying) {
        w.shotTimer = (w.shotTimer || 45) - 1;
        if (w.shotTimer <= 0) trooperFire(w);
      }
    }
  }

  // Dying worms: accelerating flash → detonation (attract mode included — it looks great)
  for (const w of worms) {
    if (w.alive && w.dying) {
      w.detonateTimer--;
      w.flashTimer = (w.detonateTimer > 25) ? (w.detonateTimer % 8 < 4 ? 6 : 0)
                                            : (w.detonateTimer % 4 < 2 ? 6 : 0);
      if (w.detonateTimer <= 0) detonate(w);
    }
  }

  // Update gravestones
  for (const g of gravestones) {
    g.timer++;
  }

  // Turn timer
  if (turnTimer > 0) {
    turnTimer--;
    if (turnTimer === 0) {
      switchTurn();
    }
  }
}

// skipTeam (Osimo 2026-07-03): a DEATH detonation must not cluster-kill the dying
// worm's own teammates — free random clears removed the skill. Death booms still
// crater terrain + chain barrels; only your own shots (and barrel blasts) kill worms.
function explode(x, y, radius, team, skipTeam) {
  sfx.boom();
  // Crater
  craterTerrain(x, y, radius * 0.7);

  // Particles - starburst
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 8;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      size: 4 + Math.random() * 6,
      color: Math.random() < 0.5 ? "#ffcc00" : "#ff6600",
      type: "spark",
      gravity: 0.15
    });
  }
  // Smoke ring
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    particles.push({
      x: x + Math.cos(a) * 10,
      y: y + Math.sin(a) * 10,
      vx: Math.cos(a) * 1.5,
      vy: Math.sin(a) * 1.5 - 0.5,
      life: 50,
      maxLife: 50,
      size: 15 + Math.random() * 8,
      color: "#333",
      type: "smoke",
      gravity: -0.05
    });
  }

  // Damage worms
  for (const w of worms) {
    if (!w.alive) continue;
    if (skipTeam && w.team === skipTeam) continue;
    const dx = w.x - x;
    const dy = w.y - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < radius) {
      // direct hit = kill (was capped at 80 vs 100hp — every level was unwinnable)
      const dmg = (1 - d / radius) * 135;
      w.hp -= dmg;
      w.flashTimer = 10;
      for (let s = 0; s < 5; s++) {
        const sa = Math.random() * Math.PI * 2;
        particles.push({ x: w.x, y: w.y - 10, vx: Math.cos(sa) * 3, vy: Math.sin(sa) * 3 - 1,
          life: 22, maxLife: 22, size: 6 + Math.random() * 4,
          color: "#ffe94d", type: "pow", gravity: 0.05, rot: Math.random() * Math.PI });
      }
      w.vx = dx / (d + 1) * 5;
      w.vy = -3;
      if (w.hp <= 0 && !w.dying) {
        startDying(w);
      }
    }
  }

  // Damage blocks (barrels chain-react — classic Worms). AB physics (Osimo 2026-07-03):
  // ICE shatters instantly, stone/wood take a KNOCKBACK shove and can topple.
  const chain = [];
  for (const b of blocks) {
    if (b.hp <= 0) continue;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const d = Math.sqrt((cx - x) ** 2 + (cy - y) ** 2);
    if (d < radius) {
      let dmg = (1 - d / radius) * 50;
      if (b.type === "ice") dmg = 999;              // glass — one blast wave = gone
      // shove: blocks get pushed away from the blast, gravity does the rest
      const push = (1 - d / radius) * (b.type === "stone" ? 3.5 : 6);
      b.vx = (b.vx || 0) + Math.sign(cx - x || 1) * push;
      b.vy = (b.vy || 0) - push * 0.35;
      b.falling = true;
      b.settled = false;
      b.hp -= dmg;
      if (b.hp <= 0) {
        score += 10;
        if (b.type === "ice") {
          for (let s = 0; s < 12; s++) {
            particles.push({ x: cx + (Math.random()-0.5)*b.w, y: cy + (Math.random()-0.5)*b.h,
              vx: (Math.random()-0.5)*5, vy: -1 - Math.random()*4,
              life: 26, maxLife: 26, size: 2 + Math.random()*3,
              color: "#bfeaff", type: "spark", gravity: 0.3 });
          }
        }
        if (b.type === "barrel") {
          chain.push({ x: cx, y: cy });   // TNT — goes up itself
          b.settled = true;               // remove instantly, no falling husk
        } else {
          b.falling = true;
          b.vx = (cx - x) / (d + 1) * 2;
          b.vy = -2;
        }
      }
    }
  }
  // Chain reactions fire a beat later so they READ as a chain
  for (let ci = 0; ci < chain.length; ci++) {
    const cpos = chain[ci];
    setTimeout(() => { if (gameState === "playing") { sfx.barrel(); explode(cpos.x, cpos.y, 75, team); } }, 150 + ci * 130);
  }
}

function craterTerrain(x, y, r) {
  for (let i = 0; i < terrain.length; i++) {
    const dx = terrain[i].x - x;
    const d = Math.abs(dx);
    if (d < r) {
      const depth = Math.sqrt(r * r - d * d) * 0.6;
      terrain[i].y += depth;
      // craters may breach clean through to the sea (Worms rule — drop them in the drink)
      if (terrain[i].y > WATER_Y + 15) terrain[i].y = WATER_Y + 15;
    }
  }
}

// ====== TURN SYSTEM ======
// Worms-style death: a worm at 0hp doesn't just fall over — it flashes faster and
// faster, then DETONATES (chains into barrels + neighbours; Osimo 2026-07-03).
function startDying(w) {
  w.dying = true;
  w.hp = 0;
  w.detonateTimer = 55;
  w.flashTimer = 55;
  sfx.thud();
}

function detonate(w) {
  w.dying = false;
  w.alive = false;
  w.deathTimer = 100;          // no falling corpse — the boom IS the death
  gravestones.push({ x: w.x, y: terrainHeightAt(w.x), timer: 0 });
  if (w.team === "enemy") score += 100;
  // VIOLENT (Osimo 2026-07-03): big shake + white flash ring + fire debris.
  // skipTeam stays — drama, not friendly fire.
  shakeT = 16;
  particles.push({ x: w.x, y: w.y - 6, vx: 0, vy: 0, life: 14, maxLife: 14,
    size: 60, color: "#ffffff", type: "ring", gravity: 0 });
  for (let s = 0; s < 26; s++) {
    const a = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 6;
    particles.push({ x: w.x, y: w.y - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      life: 30 + Math.random() * 16, maxLife: 46, size: 3 + Math.random() * 5,
      color: Math.random() > 0.5 ? "#ff5a1f" : (Math.random() > 0.5 ? "#ffd23d" : "#e8302a"),
      type: "spark", gravity: 0.22 });
  }
  explode(w.x, w.y - 6, 52, w.team === "enemy" ? "player" : "enemy", w.team);
  if (turnTimer === 0) turnTimer = 45;   // re-evaluate win/lose after the dust settles
}

function deployTrooper(x, groundY) {
  // The trooper digs in where he landed — becomes a standing unit with 3 shots
  const t = makeWorm(x, groundY - 20, "player", "trooper");
  t.shotsLeft = 3;
  t.shotTimer = 45;
  worms.push(t);
  sfx.thud();
  for (let s = 0; s < 10; s++) {
    particles.push({ x: x + (Math.random() - 0.5) * 20, y: groundY,
      vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 2.5,
      life: 25, maxLife: 25, size: 2 + Math.random() * 3,
      color: "#b8905a", type: "spark", gravity: 0.25 });
  }
}

// Our-turn-only (Osimo 2026-07-03, "just like Angry Birds"): this fires when a shot
// finishes resolving. No enemy turn, ever — evaluate win/lose, reload the sling.
function switchTurn() {
  const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
  if (enemiesAlive === 0) {
    showEndScreen(true);
    return;
  }
  const playerHasShots = inventory.reduce((s, i) => s + i.count, 0);
  const troopersBusy = worms.some(w => w.team === "player" && w.alive && (w.shotsLeft || 0) > 0);
  const anyDying = worms.some(w => w.alive && w.dying);
  if (anyDying) { turnTimer = 45; return; }   // let detonations resolve first
  if (playerHasShots === 0 && projectiles.length === 0 && !loadedWorm && !troopersBusy) {
    showEndScreen(false);
    return;
  }
  wind = (Math.random() - 0.5) * (4 + level);
  if (!troopersBusy) camera.targetX = 0;   // glide home unless a trooper's mid-barrage
  loadNextWorm();
}

function showEndScreen(won) {
  gameState = "ended";
  const es = document.getElementById("endScreen");
  const et = document.getElementById("endTitle");
  const eb = document.getElementById("endBtn");
  document.getElementById("endScore").textContent = "SCORE " + score;
  if (won) {
    sfx.fanfare();
    const ammoLeft = inventory.reduce((n, it) => n + it.count, 0);
    const starCount = ammoLeft >= 3 ? 3 : ammoLeft >= 1 ? 2 : 1;
    score += starCount * 250;
    et.textContent = "\u2b50".repeat(starCount) + " LEVEL CLEAR!";
    document.getElementById("endScore").textContent = "SCORE " + score;
    et.style.color = "#39ff14";
    et.style.textShadow = "0 0 24px #39ff14, 0 0 48px #39ff14";
    eb.textContent = "NEXT LEVEL ▸";
    // auto-advance (Osimo 2026-07-03) — the button remains as a skip
    const advanceLevel = level;
    setTimeout(() => {
      if (gameState === "ended" && level === advanceLevel &&
          document.getElementById("endScreen").style.display === "flex") {
        onEndBtn();
      }
    }, 2200);
  } else {
    // straight to the scoreboard on death — no INSERT COIN detour (Osimo 2026-07-03)
    sfx.lose();
    if (window.ArcadeScores) {
      ArcadeScores.show({game:"angry-worms",title:"ANGRY WORMS",score:score,accent:"#e8302a",onClose:resetGame});
    } else {
      resetGame();
    }
    return;
  }
  es.style.display = "flex";
}

function onEndBtn() {
  const es = document.getElementById("endScreen");
  es.style.display = "none";
  const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
  if (enemiesAlive === 0) {
    // Next level
    buildLevel(level + 1);
    turn = "player";
    wind = (Math.random() - 0.5) * 6;
    gameState = "playing";
    camera.targetX = 0;
  } else {
    // Game over - use ArcadeScores
    if (window.ArcadeScores) {
      ArcadeScores.show({game:"angry-worms",title:"ANGRY WORMS",score:score,accent:"#e8302a",onClose:resetGame});
    } else {
      resetGame();
    }
  }
}

function resetGame() {
  score = 0;
  buildLevel(1);
  turn = "player";
  wind = (Math.random() - 0.5) * 6;
  gameState = "playing";
  camera.targetX = 0;
  document.getElementById("endScreen").style.display = "none";
}

// ====== COIN / START ======
function insertCoin() {
  const overlay = document.getElementById("overlay");
  overlay.classList.add("hidden");
  // Try fullscreen
  try {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  } catch (e) {}
  startGame();
}

function startGame() {
  score = 0;
  buildLevel(1);
  turn = "player";
  wind = (Math.random() - 0.5) * 6;
  gameState = "intro";
  // Teleport to enemy side, hold 700ms, snap back to catapult
  camera.x = Math.max(0, WORLD_W - VIEW.w);
  camera.targetX = camera.x;
  setTimeout(() => {
    camera.x = 0;
    camera.targetX = 0;
    gameState = "playing";
  }, 700);
}

// ====== ATTRACT MODE ======
function startAttractCycle() {
  attractTimer = 0;
  attractPhase = 0;
  attractProj = null;
}

function updateAttract() {
  attractTimer++;
  if (attractPhase === 0 && attractTimer > 60) {
    // Fire
    attractProj = {
      x: SLING_X,
      y: SLING_Y,
      vx: 14,
      vy: -9,
      type: "red",
      trail: []
    };
    attractPhase = 1;
    attractTimer = 0;
  }
  if (attractPhase === 1 && attractProj) {
    attractProj.trail.push({ x: attractProj.x, y: attractProj.y });
    if (attractProj.trail.length > 20) attractProj.trail.shift();
    attractProj.vy += GRAVITY;
    attractProj.x += attractProj.vx;
    attractProj.y += attractProj.vy;
    // Camera follow
    camera.targetX = Math.max(0, Math.min(WORLD_W - VIEW.w, attractProj.x - VIEW.w / 2));
    const gy = terrainHeightAt(attractProj.x);
    if (attractProj.y > gy - 10) {
      // Explode on structure area
      explode(attractProj.x, attractProj.y, 50, "player");
      attractPhase = 2;
      attractTimer = 0;
    }
  }
  if (attractPhase === 2 && attractTimer > 100) {
    // Reset
    attractPhase = 0;
    attractTimer = 0;
    camera.targetX = 0;
    // Rebuild level to restore structures
    buildLevel(1);
    startAttractCycle();
  }
}

// ====== CAMERA ======
function updateCamera() {
  camera.targetX = Math.max(0, Math.min(WORLD_W - VIEW.w, camera.targetX));
  camera.x += (camera.targetX - camera.x) * 0.08;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > WORLD_W - W) camera.x = Math.max(0, WORLD_W - VIEW.w);
  camera.y = 0;
}

// ====== TRAJECTORY PREDICTION ======
function predictTrajectory(x, y, vx, vy) {
  const points = [];
  let px = x, py = y, pvx = vx, pvy = vy;
  for (let i = 0; i < 60; i++) {
    pvy += GRAVITY;
    pvx += wind * 0.03;
    px += pvx;
    py += pvy;
    if (py > terrainHeightAt(px)) break;
    if (px < 0 || px > WORLD_W) break;
    points.push({ x: px, y: py });
  }
  return points;
}

// ====== RENDER ======
function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(VIEW.scale, VIEW.scale);
  if (shakeT > 0) {
    shakeT--;
    const s = Math.min(10, shakeT) * 0.8;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  ctx.translate(-camera.x, -camera.y);

  drawSky();
  drawClouds();
  drawTerrain();
  drawGravestones();
  drawBlocks();
  drawWorms();
  drawSlingshot();
  if (loadedWorm && gameState === "playing") drawLoadedWorm();
  if (aiming && dragCurrent) drawAim();
  drawProjectiles();
  drawSea();
  drawParticles();

  ctx.restore();

  drawHUD();

  if (gameState === "attract") {
    // Slight dim
  }
}

function drawSky() {
  // Bright Angry-Birds daytime — azure fading to a warm horizon
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, "#2f9ce8");
  grad.addColorStop(0.55, "#7cc4f0");
  grad.addColorStop(1, "#cfeefb");
  ctx.fillStyle = grad;
  ctx.fillRect(camera.x - 10, 0, VIEW.w + 20, GROUND_Y + 140);

  // Sun (parallax — barely moves with the camera)
  const sunX = camera.x * 0.1 + 120, sunY = 90;
  const sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 70);
  sg.addColorStop(0, "rgba(255,246,180,0.95)");
  sg.addColorStop(0.4, "rgba(255,238,140,0.55)");
  sg.addColorStop(1, "rgba(255,238,140,0)");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff3ae";
  ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, Math.PI * 2); ctx.fill();

  // Parallax hill bands behind the playfield (AB backdrop depth)
  ctx.fillStyle = "rgba(120,190,140,0.45)";
  ctx.beginPath();
  ctx.moveTo(camera.x - 10, GROUND_Y + 40);
  for (let x = -10; x <= VIEW.w + 20; x += 8) {
    const wx = camera.x * 0.35 + x;
    ctx.lineTo(camera.x + x, GROUND_Y - 60 - 45 * Math.sin(wx * 0.006) - 20 * Math.sin(wx * 0.013 + 2));
  }
  ctx.lineTo(camera.x + VIEW.w + 20, GROUND_Y + 40);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(90,170,115,0.55)";
  ctx.beginPath();
  ctx.moveTo(camera.x - 10, GROUND_Y + 60);
  for (let x = -10; x <= VIEW.w + 20; x += 8) {
    const wx = camera.x * 0.6 + x;
    ctx.lineTo(camera.x + x, GROUND_Y - 20 - 35 * Math.sin(wx * 0.008 + 4) - 15 * Math.sin(wx * 0.02));
  }
  ctx.lineTo(camera.x + VIEW.w + 20, GROUND_Y + 60);
  ctx.closePath(); ctx.fill();
}

function drawStars() { /* retired — daytime sky (Osimo 2026-07-02: AB look) */ }

function drawClouds() {
  // Chunky flat AB clouds — pure white blobs, no outline
  for (const c of clouds) {
    c.x += c.s;
    if (c.x > WORLD_W + 50) c.x = -50;
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.85, c.y + c.r * 0.15, c.r * 0.75, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.85, c.y + c.r * 0.15, c.r * 0.75, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.35, c.y - c.r * 0.45, c.r * 0.65, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.4, c.y - c.r * 0.35, c.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    // flat base
    ctx.fillRect(c.x - c.r * 1.4, c.y, c.r * 2.8, c.r * 0.55);
  }
}

function drawSea(t) {
  // Worms signature — animated sea across the whole world, in FRONT of terrain
  const time = performance.now() / 600;
  const grad = ctx.createLinearGradient(0, WATER_Y - 8, 0, WORLD_H + 260);
  grad.addColorStop(0, "#2f7fd4");
  grad.addColorStop(1, "#123a78");
  const seaBottom = camera.y + VIEW.h + 300;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(camera.x - 10, seaBottom);
  for (let x = -10; x <= VIEW.w + 20; x += 10) {
    const wx = camera.x + x;
    ctx.lineTo(wx, WATER_Y + 3 * Math.sin(wx * 0.03 + time * 2) + 2 * Math.sin(wx * 0.011 - time));
  }
  ctx.lineTo(camera.x + VIEW.w + 20, seaBottom);
  ctx.closePath(); ctx.fill();
  // foam line
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = -10; x <= VIEW.w + 20; x += 10) {
    const wx = camera.x + x;
    const y = WATER_Y + 3 * Math.sin(wx * 0.03 + time * 2) + 2 * Math.sin(wx * 0.011 - time);
    if (x === -10) ctx.moveTo(wx, y); else ctx.lineTo(wx, y);
  }
  ctx.stroke();
}

function drawTerrain() {
  // Grass top — bright Worms green
  ctx.fillStyle = "#5bd431";
  ctx.strokeStyle = "#1a4a0a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-TERRAIN_PAD, GROUND_Y + 200);
  for (const t of terrain) {
    ctx.lineTo(t.x, t.y);
  }
  ctx.lineTo(WORLD_W + TERRAIN_PAD, GROUND_Y + 200);
  ctx.closePath();
  ctx.fill();

  // Grass strip highlight
  ctx.fillStyle = "#82f05a";
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const t = terrain[i];
    if (i === 0) ctx.moveTo(t.x, t.y);
    else ctx.lineTo(t.x, t.y);
  }
  for (let i = terrain.length - 1; i >= 0; i--) {
    ctx.lineTo(terrain[i].x, terrain[i].y + 20);
  }
  ctx.closePath();
  ctx.fill();
  // grass tufts on the lip (deterministic — no per-frame flicker)
  ctx.strokeStyle = "#2f8a12"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 8; i < terrain.length - 8; i += 14) {
    const t = terrain[i];
    ctx.moveTo(t.x, t.y + 2); ctx.lineTo(t.x - 3, t.y - 7);
    ctx.moveTo(t.x + 4, t.y + 2); ctx.lineTo(t.x + 6, t.y - 6);
  }
  ctx.stroke();

  // Soil layer
  ctx.fillStyle = "#8b5a2a";
  ctx.beginPath();
  ctx.moveTo(-TERRAIN_PAD, GROUND_Y + 220);
  for (const t of terrain) ctx.lineTo(t.x, t.y + 20);
  ctx.lineTo(WORLD_W + TERRAIN_PAD, GROUND_Y + 220);
  ctx.closePath();
  ctx.fill();

  // Soil to rock gradient
  const rg = ctx.createLinearGradient(0, GROUND_Y + 100, 0, WORLD_H);
  rg.addColorStop(0, "#8b5a2a");
  rg.addColorStop(0.3, "#5a3a1a");
  rg.addColorStop(1, "#2a1a0a");
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(-TERRAIN_PAD, WORLD_H);
  for (const t of terrain) ctx.lineTo(t.x, t.y + 20);
  ctx.lineTo(WORLD_W + TERRAIN_PAD, WORLD_H);
  ctx.closePath();
  ctx.fill();
  // dirt speckles (Worms texture — deterministic pseudo-random)
  ctx.fillStyle = "rgba(60,36,14,0.55)";
  for (let i = 0; i < terrain.length; i += 10) {
    const t = terrain[i];
    const seed = (i * 2654435761) % 97;
    ctx.fillRect(t.x + (seed % 30), t.y + 28 + (seed % 46), 3, 3);
    ctx.fillRect(t.x + ((seed * 7) % 34), t.y + 60 + ((seed * 3) % 38), 4, 3);
  }

  // Top outline
  ctx.strokeStyle = "#1a4a0a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const t = terrain[i];
    if (i === 0) ctx.moveTo(t.x, t.y);
    else ctx.lineTo(t.x, t.y);
  }
  ctx.stroke();
}

function drawBlocks() {
  for (const b of blocks) {
    if (b.hp <= 0 && b.settled) continue;
    ctx.save();
    if (b.rot) {
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.rotate(b.rot);
      ctx.translate(-b.w / 2, -b.h / 2);
      ctx.translate(-b.x, -b.y);
    }
    // AB-style chunky blocks: rounded corners, bevel light/shadow, thick outline
    const rr = 5;
    const paths = () => {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, rr);
      else ctx.rect(b.x, b.y, b.w, b.h);
    };
    if (b.type === "barrel") {
      // Worms TNT barrel
      ctx.fillStyle = "#c8342a"; ctx.strokeStyle = "#5c110b"; ctx.lineWidth = 3;
      paths(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#8a2018"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + 2, b.y + b.h * 0.25); ctx.lineTo(b.x + b.w - 2, b.y + b.h * 0.25);
      ctx.moveTo(b.x + 2, b.y + b.h * 0.75); ctx.lineTo(b.x + b.w - 2, b.y + b.h * 0.75);
      ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("TNT", b.x + b.w / 2, b.y + b.h * 0.58);
      ctx.restore();
      continue;
    }
    if (b.type === "wood") { ctx.fillStyle = "#d9a15e"; ctx.strokeStyle = "#6b4318"; }
    else if (b.type === "ice") { ctx.fillStyle = "rgba(170,222,255,0.75)"; ctx.strokeStyle = "#5e9fd4"; }
    else { ctx.fillStyle = "#a8a8ac"; ctx.strokeStyle = "#57575c"; }
    ctx.lineWidth = 3;
    paths(); ctx.fill(); ctx.stroke();
    // bevel: light top, dark bottom
    ctx.fillStyle = "rgba(255,255,255,0.30)";
    ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, Math.max(2, b.h * 0.18));
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(b.x + 3, b.y + b.h - Math.max(2, b.h * 0.16) - 2, b.w - 6, Math.max(2, b.h * 0.16));
    if (b.type === "wood") {
      ctx.strokeStyle = "rgba(107,67,24,0.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + 6, b.y + b.h * 0.4); ctx.lineTo(b.x + b.w - 6, b.y + b.h * 0.4);
      ctx.moveTo(b.x + 6, b.y + b.h * 0.68); ctx.lineTo(b.x + b.w * 0.6, b.y + b.h * 0.68);
      ctx.stroke();
    } else if (b.type === "ice") {
      // glassy shine
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.2, b.y + b.h * 0.7); ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.25);
      ctx.stroke();
    } else {
      // stone rivets
      ctx.fillStyle = "rgba(70,70,76,0.6)";
      ctx.beginPath(); ctx.arc(b.x + 7, b.y + 7, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(b.x + b.w - 7, b.y + 7, 2, 0, Math.PI * 2); ctx.fill();
    }
    // Damage cracks
    if (b.hp < b.maxHp * 0.5) {
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 5);
      ctx.lineTo(b.x + 14, b.y + 15);
      ctx.lineTo(b.x + 10, b.y + b.h - 5);
      ctx.moveTo(b.x + b.w - 12, b.y + 6);
      ctx.lineTo(b.x + b.w - 6, b.y + 18);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawWorms() {
  for (const w of worms) {
    if (!w.alive && w.deathTimer > 100) continue;
    ctx.save();
    if (!w.alive) {
      ctx.translate(w.x, w.y);
      ctx.rotate(w.deathTimer * 0.1);
      ctx.globalAlpha = Math.max(0, 1 - w.deathTimer / 100);
      ctx.translate(-w.x, -w.y);
    }
    drawWormBody(w);
    if (w.alive) drawHPBar(w);
    ctx.restore();
  }
}

function drawWormBody(w) {
  // 2026-07-02 look pass: BIGGER cartoon worms, 3px outlines, Angry-Birds brows on the
  // player team, army-green Worms grunts with helmets + sweat on the other side.
  const x = w.x;
  const y = w.y;
  const S = 1.35;                      // visual scale (hitbox radius unchanged)
  const wiggle = Math.sin(w.wiggle) * 2;
  const F = w.facing;

  let bodyColor, darkColor, bellyColor;
  if (w.team === "enemy") {
    bodyColor = w.flashTimer > 0 ? "#fff" : "#6fce4a";
    darkColor = "#2a7a1a"; bellyColor = "#c9edb0";
  } else {
    if (w.type === "red")        { bodyColor = "#e8302a"; darkColor = "#8a1a16"; bellyColor = "#f6d7b0"; }
    else if (w.type === "bomber"){ bodyColor = "#ffcc00"; darkColor = "#8a6a00"; bellyColor = "#fff3c0"; }
    else if (w.type === "bouncer"){ bodyColor = "#8e44e0"; darkColor = "#4a1a80"; bellyColor = "#e2cdf8"; }
    else if (w.type === "trooper"){ bodyColor = w.flashTimer > 0 ? "#fff" : "#e07820";
                                    darkColor = "#7a3c08"; bellyColor = "#fadfc0"; }
    else                         { bodyColor = "#3a8acf"; darkColor = "#1a4a8a"; bellyColor = "#cde7fa"; }
  }

  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = "#1a1208";
  ctx.lineWidth = 3;
  // Tail tip (curled)
  ctx.beginPath();
  ctx.ellipse(x - 20 * S * F, y + 8 * 1 + wiggle, 5 * S, 6 * S, 0.5 * F, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // Back segment
  ctx.beginPath();
  ctx.ellipse(x - 12 * S * F, y + 5 + wiggle, 8 * S, 10 * S, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // Mid segment
  ctx.beginPath();
  ctx.ellipse(x - 4 * S * F, y + wiggle, 10 * S, 12 * S, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // Head segment (big — AB energy)
  ctx.beginPath();
  ctx.ellipse(x + 7 * S * F, y - 2 + wiggle, 13 * S, 14 * S, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // Belly patch on the head (AB signature)
  ctx.fillStyle = bellyColor;
  ctx.beginPath();
  ctx.ellipse(x + 7 * S * F, y + 6 * S + wiggle, 8 * S, 5.5 * S, 0, 0, Math.PI * 2);
  ctx.fill();

  const hx = x + 7 * S * F, hy = y - 2 + wiggle;

  // Eyes — big whites
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(hx + 4.5 * S * F, hy - 4 * S, 5.5 * S, 0, Math.PI * 2);
  ctx.arc(hx - 3 * S * F, hy - 4 * S, 5 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#1a1208"; ctx.lineWidth = 2; ctx.stroke();
  // Pupils
  ctx.fillStyle = "#1a1208";
  ctx.beginPath();
  ctx.arc(hx + 5.5 * S * F, hy - 4 * S, 2.4 * S, 0, Math.PI * 2);
  ctx.arc(hx - 2 * S * F, hy - 4 * S, 2.2 * S, 0, Math.PI * 2);
  ctx.fill();

  if (w.team === "player") {
    // ANGRY unibrow — the Angry Birds signature
    ctx.strokeStyle = "#1a1208"; ctx.lineWidth = 4.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx - 8 * S * F, hy - 12 * S);
    ctx.lineTo(hx + 1 * S * F, hy - 8 * S);
    ctx.moveTo(hx + 10 * S * F, hy - 12 * S);
    ctx.lineTo(hx + 2 * S * F, hy - 8 * S);
    ctx.stroke();
    ctx.lineCap = "butt";
    // Determined frown-grin
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(hx + 1 * S * F, hy + 6 * S, 4 * S, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else {
    // Worried brows + wobbly mouth
    ctx.strokeStyle = "#1a1208"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx - 7 * S * F, hy - 9 * S);
    ctx.lineTo(hx - 1 * S * F, hy - 11 * S);
    ctx.moveTo(hx + 8 * S * F, hy - 9 * S);
    ctx.lineTo(hx + 3 * S * F, hy - 11 * S);
    ctx.stroke();
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(hx - 3 * S * F, hy + 7 * S);
    ctx.quadraticCurveTo(hx + 1 * S * F, hy + 4 * S, hx + 5 * S * F, hy + 7 * S);
    ctx.stroke();
    // Sweat drop
    ctx.fillStyle = "#7cc4f0";
    ctx.beginPath();
    ctx.ellipse(hx - 10 * S * F, hy - 10 * S + (w.wiggle % 6), 2.2, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Army helmet
    ctx.fillStyle = "#5d6b46";
    ctx.strokeStyle = "#1a1208"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(hx, hy - 8 * S, 12 * S, Math.PI, 0);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#3d4930"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx - 12 * S, hy - 8 * S); ctx.lineTo(hx + 12 * S, hy - 8 * S);
    ctx.stroke();
    ctx.fillStyle = "#77875a";
    ctx.beginPath(); ctx.arc(hx - 4 * S, hy - 13 * S, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Bomber stripes / splitter dots
  if (w.team === "player" && w.type === "bomber") {
    ctx.fillStyle = "#1a1208";
    for (let i = -1; i <= 1; i++) ctx.fillRect(x - (14 - i * 9) * F - 2, y - 5 + wiggle, 4, 11);
  }
  if (w.team === "player" && w.type === "splitter") {
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(x - (14 - i * 8) * F, y + wiggle, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawHPBar(w) {
  if (w.hp >= w.maxHp) return;
  const bx = w.x - 18;
  const by = w.y - 28;
  const bw = 36;
  const bh = 5;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  const pct = Math.max(0, w.hp / w.maxHp);
  ctx.fillStyle = pct > 0.6 ? "#3afa3a" : pct > 0.3 ? "#ffcc00" : "#ff3030";
  ctx.fillRect(bx, by, bw * pct, bh);
  // Segments
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(bx + (bw / 3) * i, by);
    ctx.lineTo(bx + (bw / 3) * i, by + bh);
    ctx.stroke();
  }
}

function drawSlingshot() {
  const sx = SLING_X;
  // Watchtower turret — lifts the launch clear of the hillside (Osimo 2026-07-02:
  // low pulls used to bury the worm in the hill and it exploded at your feet)
  const gy = terrainHeightAt(sx);
  const platY = SLING_Y + 70;          // deck the slingshot stands on
  ctx.strokeStyle = "#4a2808";
  ctx.lineWidth = 7;
  ctx.beginPath();
  // crossed legs down to the hill
  ctx.moveTo(sx - 34, gy + 4); ctx.lineTo(sx - 16, platY);
  ctx.moveTo(sx + 34, gy + 4); ctx.lineTo(sx + 16, platY);
  ctx.moveTo(sx - 26, gy - (gy - platY) * 0.35); ctx.lineTo(sx + 26, gy - (gy - platY) * 0.7);
  ctx.moveTo(sx + 26, gy - (gy - platY) * 0.35); ctx.lineTo(sx - 26, gy - (gy - platY) * 0.7);
  ctx.stroke();
  // deck
  ctx.fillStyle = "#9a6428"; ctx.lineWidth = 3;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(sx - 44, platY - 6, 88, 14, 4); else ctx.rect(sx - 44, platY - 6, 88, 14);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(74,40,8,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let px = sx - 34; px < sx + 40; px += 12) { ctx.moveTo(px, platY - 5); ctx.lineTo(px, platY + 7); }
  ctx.stroke();

  // Slingshot Y on the deck
  const sy = platY - 24;               // trunk top reference
  ctx.fillStyle = "#9a6428";
  ctx.strokeStyle = "#4a2808";
  ctx.lineWidth = 3;
  // Trunk
  ctx.fillRect(sx - 8, sy - 20, 16, 40);
  ctx.strokeRect(sx - 8, sy - 20, 16, 40);
  // Left fork
  ctx.save();
  ctx.translate(sx, sy - 20);
  ctx.rotate(-0.4);
  ctx.fillRect(-7, -45, 14, 50);
  ctx.strokeRect(-7, -45, 14, 50);
  ctx.restore();
  // Right fork
  ctx.save();
  ctx.translate(sx, sy - 20);
  ctx.rotate(0.4);
  ctx.fillRect(-7, -45, 14, 50);
  ctx.strokeRect(-7, -45, 14, 50);
  ctx.restore();

  // Fork tips (band anchors — SLING_Y is the launch anchor between them)
  const leftTip = { x: sx - 22, y: sy - 60 };
  const rightTip = { x: sx + 22, y: sy - 60 };

  // Elastic band
  if (loadedWorm && aiming && dragCurrent) {
    // Stretched - back band
    ctx.strokeStyle = "#7a2418";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(leftTip.x, leftTip.y);
    ctx.lineTo(loadedWorm.x, loadedWorm.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightTip.x, rightTip.y);
    ctx.lineTo(loadedWorm.x, loadedWorm.y);
    ctx.stroke();
    // Front band (drawn after worm)
  } else if (loadedWorm) {
    // Relaxed band
    ctx.strokeStyle = "#7a2418";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(leftTip.x, leftTip.y);
    ctx.lineTo(rightTip.x, rightTip.y);
    ctx.stroke();
  }

  // Store tips for later
  slingTips = { left: leftTip, right: rightTip, base: { x: sx, y: sy - 60 } };
}

let slingTips = null;

function drawLoadedWorm() {
  if (!loadedWorm) return;
  // If aiming, worm is at drag position (clamped)
  let wx = loadedWorm.x;
  let wy = loadedWorm.y;
  if (aiming && dragCurrent) {
    let dx = dragCurrent.x - dragStart.x;
    let dy = dragCurrent.y - dragStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > MAX_PULL) {
      dx = (dx / dist) * MAX_PULL;
      dy = (dy / dist) * MAX_PULL;
    }
    // Only allow pulling back (left/down)
    if (dx > 0) dx = 0;
    wx = dragStart.x + dx;
    wy = dragStart.y + dy;
    loadedWorm.x = wx;
    loadedWorm.y = wy;
  } else {
    wx = SLING_X;
    wy = SLING_Y;
    loadedWorm.x = wx;
    loadedWorm.y = wy;
  }

  // Draw worm in sling
  const tempWorm = { x: wx, y: wy, radius: 16, team: "player", type: loadedWorm.type, facing: 1, wiggle: 0, alive: true, hp: 100, maxHp: 100 };
  drawWormBody(tempWorm);

  // Front elastic band (over worm)
  if (aiming && dragCurrent && slingTips) {
    ctx.strokeStyle = "#5a2a00";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(slingTips.right.x, slingTips.right.y);
    ctx.lineTo(wx, wy);
    ctx.stroke();
  }
}

function drawAim() {
  if (!dragCurrent || !loadedWorm) return;
  let dx = dragStart.x - dragCurrent.x;
  let dy = dragStart.y - dragCurrent.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 10) return;
  const pull = Math.min(dist, MAX_PULL);
  const power = (pull / MAX_PULL) * 18;
  const ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * power;
  const vy = Math.sin(ang) * power;

  // Trajectory dots
  const points = predictTrajectory(loadedWorm.x, loadedWorm.y, vx, vy);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  for (let i = 0; i < points.length; i += 3) {
    const p = points[i];
    const sz = 4 - (i / points.length) * 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  // Power indicator circle
  ctx.strokeStyle = "rgba(255,200,0,0.6)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(dragStart.x, dragStart.y, MAX_PULL, 0, Math.PI * 2);
  ctx.stroke();

  // Power bar
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(dragStart.x, dragStart.y, MAX_PULL, -Math.PI / 2, -Math.PI / 2 + (pull / MAX_PULL) * Math.PI * 2);
  ctx.stroke();
}

function drawProjectiles() {
  for (const p of projectiles) {
    // Trail
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i];
      const a = (i / p.trail.length) * 0.5;
      ctx.fillStyle = p.type === "red" ? "rgba(232,48,42," + a + ")" :
                      p.type === "bomber" ? "rgba(255,204,0," + a + ")" :
                      p.type === "bouncer" ? "rgba(142,68,224," + a + ")" :
                      p.type === "trooper" ? "rgba(224,120,32," + a + ")" :
                      p.type === "trooperShot" ? "rgba(255,240,180," + a + ")" :
                      "rgba(58,138,207," + a + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 + a * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    if (p.type === "trooperShot") {
      // small bazooka shell — tracer dot, not a worm
      ctx.fillStyle = "#fff0b4";
      ctx.strokeStyle = "#1a1208";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      continue;
    }
    // Worm body
    const tw = { x: p.x, y: p.y, radius: p.radius, team: p.team, type: p.type, facing: p.vx > 0 ? 1 : -1, wiggle: p.x * 0.1, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(tw);
  }

  // Attract projectile
  if (gameState === "attract" && attractProj) {
    for (let i = 0; i < attractProj.trail.length; i++) {
      const t = attractProj.trail[i];
      const a = (i / attractProj.trail.length) * 0.5;
      ctx.fillStyle = "rgba(232,48,42," + a + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 + a * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    const tw = { x: attractProj.x, y: attractProj.y, radius: 16, team: "player", type: "red", facing: 1, wiggle: attractProj.x * 0.1, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(tw);
  }
}

function drawParticles() {
  for (const pt of particles) {
    const a = pt.life / pt.maxLife;
    if (pt.type === "pow") {
      // 5-point AB impact star
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate((pt.rot || 0) + (1 - a) * 2);
      ctx.fillStyle = pt.color; ctx.globalAlpha = a;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = (k % 2 === 0 ? pt.size : pt.size * 0.45) * (0.5 + a * 0.5);
        const aa = (k / 10) * Math.PI * 2 - Math.PI / 2;
        if (k === 0) ctx.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
        else ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();
    } else if (pt.type === "smoke") {
      ctx.fillStyle = "rgba(40,40,40," + a * 0.7 + ")";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (2 - a), 0, Math.PI * 2);
      ctx.fill();
    } else if (pt.type === "ring") {
      // detonation shockwave — expands + fades
      ctx.strokeStyle = "rgba(255,255,255," + a + ")";
      ctx.lineWidth = 5 * a + 1;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (1.6 - a), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawGravestones() {
  for (const g of gravestones) {
    ctx.fillStyle = "#666";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(g.x - 12, g.y);
    ctx.lineTo(g.x - 12, g.y - 25);
    ctx.arc(g.x, g.y - 25, 12, Math.PI, 0);
    ctx.lineTo(g.x + 12, g.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Cross
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - 18);
    ctx.lineTo(g.x, g.y - 8);
    ctx.moveTo(g.x - 5, g.y - 14);
    ctx.lineTo(g.x + 5, g.y - 14);
    ctx.stroke();
  }
}

// ====== HUD ======
function drawHUD() {
  // Top bar
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, 48);
  ctx.strokeStyle = "rgba(232,48,42,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 48);
  ctx.lineTo(W, 48);
  ctx.stroke();

  // Turn indicator
  ctx.font = "16px Bungee, sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  if (gameState === "attract") {
    ctx.fillStyle = "#e8302a";
    ctx.fillText("ANGRY WORMS", 16, 24);
  } else {
    // Our-turn-only: no turn banner — show the objective instead
    const foes = worms.filter(w => w.team === "enemy" && w.alive).length;
    ctx.fillStyle = "#39ff14";
    ctx.shadowColor = "#39ff14";
    ctx.shadowBlur = 12;
    ctx.fillText("LVL " + level + " · ENEMIES " + foes, 16, 24);
    ctx.shadowBlur = 0;
  }

  // Score
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText("SCORE " + score, W / 2, 24);

  // Wind
  ctx.textAlign = "right";
  ctx.fillStyle = wind > 0 ? "#ffcc00" : "#3a8acf";
  const arrow = wind > 0.3 ? "→" : wind < -0.3 ? "←" : "•";
  ctx.fillText(arrow + " WIND " + Math.abs(wind).toFixed(1), W - 16, 24);

  // Bottom bar
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, H - 60, W, 60);
  ctx.strokeStyle = "rgba(232,48,42,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 60);
  ctx.lineTo(W, H - 60);
  ctx.stroke();

  // Inventory slots
  const slotW = 120;
  const totalW = inventory.length * slotW;
  const startX = (W - totalW) / 2;
  for (let i = 0; i < inventory.length; i++) {
    const sx = startX + i * slotW;
    const sy = H - 55;
    const sw = slotW - 10;
    const sh = 50;
    const sel = i === selectedType;
    ctx.fillStyle = sel ? "rgba(232,48,42,0.25)" : "rgba(255,255,255,0.08)";
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = sel ? "#e8302a" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = sel ? 3 : 2;
    if (sel) {
      ctx.shadowColor = "#e8302a";
      ctx.shadowBlur = 15;
    }
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.shadowBlur = 0;

    // Mini worm icon
    const iconWorm = { x: sx + 25, y: sy + 25, radius: 12, team: "player", type: inventory[i].type, facing: 1, wiggle: 0, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(iconWorm);

    // Name + count
    ctx.font = "10px Bungee, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    const name = inventory[i].type === "red" ? "RED" : inventory[i].type === "bomber" ? "BOMB" : inventory[i].type === "bouncer" ? "BOUNCE" : inventory[i].type === "trooper" ? "TROOP" : "SPLIT";
    ctx.fillText(name, sx + 50, sy + 18);
    ctx.font = "14px Bungee, sans-serif";
    ctx.fillStyle = "#ffcc00";
    ctx.fillText("x" + inventory[i].count, sx + 50, sy + 34);
  }

  // Mute button
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(W - 60, H - 55, 50, 50);
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 2;
  ctx.strokeRect(W - 60, H - 55, 50, 50);
  ctx.font = "24px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.fillText(muted ? "🔇" : "🔊", W - 35, H - 30);
}

// ====== GAME LOOP ======
function gameLoop(time) {
  const dt = Math.min(32, time - lastTime);
  lastTime = time;

  if (gameState === "attract") {
    updateAttract();
    updatePhysics(dt);
    updateCamera();
  } else if (gameState === "playing") {
    updatePhysics(dt);
    updateCamera();
    // Reload the sling when idle; lose only when ammo AND deployed troopers are spent
    if (!loadedWorm && projectiles.length === 0 && turnTimer === 0) {
      const hasShots = inventory.reduce((s, i) => s + i.count, 0);
      const troopersBusy = worms.some(w => w.team === "player" && w.alive && (w.shotsLeft || 0) > 0);
      const anyDying = worms.some(w => w.alive && w.dying);
      if (hasShots > 0) {
        loadNextWorm();
      } else if (!troopersBusy && !anyDying) {
        const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
        if (enemiesAlive > 0) {
          showEndScreen(false);
        }
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}
</script>
