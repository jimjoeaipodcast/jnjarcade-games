function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }

function tone(f0, f1, dur, type, vol, delay) {
  if (muted || !audioCtx || state === 'attract') return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0 * (1 + 0.05 * (Math.random() * 2 - 1)), t0); // pitch jitter
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.14, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

function djb2vo(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(16);
}
const VO = { b64: null, loading: false, buffers: {}, rot: {}, jimmySrc: null, lastJoeMs: 0 };
function loadVoicePack() {
  if (VO.b64 || VO.loading) return;
  VO.loading = true;
  fetch('dead-air-dash-pack.json?v=1')
    .then(r => r.json())
    .then(d => { VO.b64 = d.voice || {}; VO.loading = false; })
    .catch(() => { VO.loading = false; });
}
if (sfxMode !== 'mute') loadVoicePack();

function voicePlay(who, text, gain) {
  if (!audioCtx || !VO.b64 || state === 'attract') return;
  const key = djb2vo(who + '|' + text);
  const start = (buf) => {
    try {
      const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
      src.buffer = buf; g.gain.value = gain;
      src.connect(g); g.connect(audioCtx.destination);
      if (who === 'JIMMY') {
        if (VO.jimmySrc) { try { VO.jimmySrc.stop(); } catch (e) {} }
        VO.jimmySrc = src;
      }
      src.start();
    } catch (e) {}
  };
  const cached = VO.buffers[key];
  if (cached) { start(cached); return; }
  const b64 = VO.b64[key];
  if (!b64) return;
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  audioCtx.decodeAudioData(bytes.buffer, buf => { VO.buffers[key] = buf; start(buf); }, () => {});
}
function jimmySay(text) { voicePlay('JIMMY', text, JIMMY_GAIN); }
function joeSay(event) {
  const now = Date.now();
  if (now - VO.lastJoeMs < 140) return;
  VO.lastJoeMs = now;
  const bank = JOE_BARKS[event];
  if (!bank) return;
  if (event === 'bounce' && bounceVoiceOff) return;
  VO.rot[event] = ((VO.rot[event] || 0) + 1) % bank.length;
  voicePlay('JOE', bank[VO.rot[event]], event === 'bounce' ? JOE_GAIN * 0.85 : JOE_GAIN);
}
function jimmyPick(bank) {
  VO.rot.__jim = ((VO.rot.__jim || 0) + 1) % bank.length;
  return bank[VO.rot.__jim];
}
function deathVoice() {

    who = last === 'JIMMY' ? 'JOE' : 'JIMMY';

  const tier = DEATH_TIERS.find(t => score >= t.min) || DEATH_TIERS[DEATH_TIERS.length - 1];
  const bank = tier[who];
  voicePlay(who, bank[Math.floor(Math.random() * bank.length)], JIMMY_GAIN);
}

  death:  () => { tone(300, 40, 0.5, 'sawtooth', 0.2); tone(90, 30, 0.7, 'sine', 0.22, 0.05); },
  best:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, null, 0.13, 'triangle', 0.14, 0.12 * i)),

function dispatch(event, tonesFn, arg) {

const sfx = {

  pickup: ()  => dispatch('pickup', TONES.pickup),
  rocket: ()  => dispatch('rocket', TONES.rocket),
  shield: ()  => dispatch('shield', TONES.power),
  magnet: ()  => dispatch('magnet', TONES.power),

// ── STATE ────────────────────────────────────────────────────────────────────
let state = 'attract';                  // attract | playing | ended
let score = 0, shakeT = 0;
let cam = 0;                            // camera top edge in world y (negative going up)
let heightM = 0;                        // metres climbed (score driver)
let bestScore = 0, topScore = 0, pbAnnounced = false, topAnnounced = false, callout = null;
let player, plats, pops, powers, trolls, parts, floats;
let staticY = 0, staticSpd = STATIC_BASE;
let hypeMeter = 0, hypeUntil = 0;
let rocketUntil = 0, magnetUntil = 0, shieldOn = false, shoeCount = 0;
let stompCombo = 0, lastStompMs = 0;
let floorIdx = 0, nextIdleMs = 0;
let seedX = 0;                          // attract steering memory

try { bestScore = parseInt(localStorage.getItem('hs_' + SLUG) || '0', 10); } catch (e) {}
fetch('/api/scores?game=' + SLUG).then(r => r.json())
  .then(d => { if (d.scores && d.scores[0]) topScore = d.scores[0].s | 0; }).catch(() => {});

// ── PLATFORM GENERATION (fairness: every gap is reachable by construction) ───
// types: 0 static · 1 moving · 2 crumble · 3 vanish (fades after one bounce) · 4 spring
let genY;             // y of the last generated platform (going up = decreasing)
function difficulty() { return Math.min(1, heightM / 2400); }
function allowedTypes() {
  const d = heightM * 7;   // world px climbed
  const t = [0];
  if (d >= FLOORS[1].at) t.push(1);
  if (d >= FLOORS[2].at) t.push(2);
  if (d >= FLOORS[4].at) t.push(3);
  return t;
}
function spawnPlat(y, forceType) {
  const d = difficulty();
  const w = PLAT_W0 + (PLAT_W1 - PLAT_W0) * d;
  const types = allowedTypes();
  let type = forceType != null ? forceType : types[Math.floor(Math.random() * types.length)];
  // springs are a bonus roll on top of static
  if (forceType == null && type === 0 && Math.random() < 0.10) type = 4;
  const p = {
    x: Math.random() * (WORLD_W - w), y, w, h: 12, type,
    vx: type === 1 ? (Math.random() < 0.5 ? -1 : 1) * (0.8 + d * 0.9) : 0,
    crumbleT: -1, gone: false, vanishA: 1,
  };
  plats.push(p);
  // dressings: lollipops in a small arc above some platforms
  if (Math.random() < 0.35) {
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++)
      pops.push({ x: p.x + p.w * (0.2 + 0.6 * (n === 1 ? 0.5 : i / (n - 1))), y: y - 26 - Math.random() * 18, taken: false });
  }
  // powerups: rare, sit on the platform
  if (Math.random() < 0.055) {
    const kinds = ['rocket', 'shield', 'magnet', 'shoes'];
    powers.push({ x: p.x + p.w / 2, y: y - 16, kind: kinds[Math.floor(Math.random() * kinds.length)], taken: false });
  }

  if (heightM * 7 >= FLOORS[3].at && Math.random() < (0.10 + d * 0.06)) {
    trolls.push({ x: 30 + Math.random() * (WORLD_W - 60), y: y - 50 - Math.random() * 30,
                  vx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + d * 0.8), r: TROLL_R, alive: true, ph: Math.random() * 6.28 });

}
function gapNow() {
  const d = difficulty();
  const g0 = START_GAP[0] + (END_GAP[0] - START_GAP[0]) * d;
  const g1 = START_GAP[1] + (END_GAP[1] - START_GAP[1]) * d;
  const sparse = heightM * 7 >= FLOORS[6].at ? 1.06 : 1;   // Roof: slightly sparser

function topUpPlatforms() {
  while (genY > cam - 220) {
    genY -= gapNow();
    spawnPlat(genY);
    // crumble/vanish platforms never appear twice in a row at the same height band —
    // guarantee a solid landing option: if the roll was fragile, add a static nearby
    const last = plats[plats.length - 1];
    if ((last.type === 2 || last.type === 3) && Math.random() < 0.6) {
      const q = spawnPlat(genY - 8, 0);
      q.x = (last.x + WORLD_W / 2) % (WORLD_W - q.w);
    }
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
function initGame() {
  player = { x: WORLD_W / 2, y: WORLD_H - 90, vx: 0, vy: BOUNCE_VY, targetX: WORLD_W / 2,
             face: 1, runPh: 0 };
  plats = []; pops = []; powers = []; trolls = []; parts = []; floats = [];
  score = 0; heightM = 0; cam = 0;
  staticY = WORLD_H + 160; staticSpd = STATIC_BASE;
  hypeMeter = 0; hypeUntil = 0; rocketUntil = 0; magnetUntil = 0; shieldOn = false; shoeCount = 0;
  stompCombo = 0; lastStompMs = 0; floorIdx = 0;
  pbAnnounced = false; topAnnounced = false; callout = null;
  nextIdleMs = Date.now() + 14000 + Math.random() * 12000;
  // starting platforms: a guaranteed ladder up + one under the player
  genY = WORLD_H - 60;
  spawnPlat(genY, 0).x = WORLD_W / 2 - PLAT_W0 / 2;
  for (let i = 0; i < 10; i++) { genY -= 85 + Math.random() * 40; spawnPlat(genY, 0); }
}

// ── INPUT — drag steers, edges wrap; mic button 3-way + double-tap ───────────
const DEADZONE = 17;
let touchOn = false;
function toWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return { x: ((px - r.left) * DPR - VIEW.ox) / VIEW.scale,
           y: ((py - r.top)  * DPR - VIEW.oy) / VIEW.scale };
}
const MIC_ZONE = { x: WORLD_W - 52, y: 6, w: 46, h: 40 };
function cycleSfxMode() {
  // 🗣️ hosts talking (DEFAULT) → 🔊 sound FX only → 🔇 mute → 🎙️ …
  sfxMode = sfxMode === 'voice' ? 'tones' : sfxMode === 'tones' ? 'mute' : 'voice';
  muted = sfxMode === 'mute';
  try { localStorage.setItem('sfxMode_' + SLUG, sfxMode); } catch (e) {}
  if (sfxMode !== 'mute') loadVoicePack();
}
function onMicTap() {
  // Strictly LINEAR single tap — every tap advances the cycle, nothing is hidden
  // behind a double tap (FLAP_FIGHT_BIBLE hard rule 1). The old double-tap toggle for
  // Joe's bounce barks is gone: it persisted in localStorage, so a device that once
  // double-tapped kept part of the voice silenced forever with no way to tell, and
  // now that voice is the DEFAULT that trap would be the state everyone starts in.

}
function onDown(e) {

  if (w.x >= MIC_ZONE.x && w.x <= MIC_ZONE.x + MIC_ZONE.w && w.y >= MIC_ZONE.y && w.y <= MIC_ZONE.y + MIC_ZONE.h) {
    onMicTap();
    if (e.cancelable) e.preventDefault();
    return;

  if (state === 'playing' && player) player.targetX = w.x;
  if (e.cancelable) e.preventDefault();
}
function onMove(e) {
  if (!touchOn || state !== 'playing' || !player) return;

  if (e.cancelable) e.preventDefault();
}
function onUp(e) { touchOn = false; if (e.cancelable) e.preventDefault(); }
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });

canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
document.addEventListener('keydown', e => {

// ── JUICE ────────────────────────────────────────────────────────────────────
function burst(x, y, n, c0, c1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.6;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
                 t: 0, life: 24 + Math.random() * 14, s0: 3, s1: 0.6,
                 c0: c0 || INK, c1: c1 || '#ffffff' });
  }
}
function confetti(n) {
  const cols = ['#ff4d6d', '#ffd23d', '#4dd9f5', '#7dffb8', '#c084fc', '#ff9900'];
  for (let i = 0; i < n; i++)
    parts.push({ x: Math.random() * WORLD_W, y: cam - 20 - Math.random() * 40,
                 vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2,
                 t: 0, life: 60 + Math.random() * 40, s0: 2.5, s1: 1.5,
                 c0: cols[i % 6], c1: cols[(i + 3) % 6] });
}
function float(x, y, text, color) {
  floats.push({ x, y, text, a: 1.4, vy: -1.1, color: color || '#fff' });
}

// ── UPDATE ───────────────────────────────────────────────────────────────────
function bounceOff(p) {
  const shoes = shoeCount > 0;
  if (shoes) shoeCount--;
  player.vy = p && p.type === 4 ? SPRING_VY : shoes ? SHOE_VY : BOUNCE_VY;
  if (hypeUntil > Date.now()) player.vy *= 1.18;
  if (p && p.type === 4) { sfx.spring(); burst(player.x, p.y, 10, '#ffd23d'); }
  else sfx.bounce();
  stompCombo = 0;   // combo is stomp-chain only; touching a platform resets it
  if (p && p.type === 2) { p.crumbleT = 14; }

}
function die() {
  if (state !== 'playing') return;
  state = 'ended';
  sfx.death();
  burst(player.x, player.y, 30, '#ffffff', '#35e0c8');
  shakeT = 14;
  if (score > bestScore) {
    bestScore = score;
    try { localStorage.setItem('hs_' + SLUG, bestScore); } catch (e) {}
  }
  setTimeout(() => {
    if (window.ArcadeScores) {
      ArcadeScores.show({ game: SLUG, title: TITLE, score: score, accent: INK,
                          onClose: () => { initGame(); state = 'playing'; sfx.start(); } });
    } else { initGame(); state = 'playing'; }
  }, 900);
}
function update(dt) {

    stepParts(dt);
    return;
  }
  const now = Date.now();
  const hype = hypeUntil > now;
  const rocket = rocketUntil > now;

  // steer
  const dx = player.targetX - player.x;
  player.vx = dx * STEER_K * dt;
  if (Math.abs(player.vx) > 9) player.vx = Math.sign(player.vx) * 9;
  player.x += player.vx;
  if (Math.abs(player.vx) > 0.4) player.face = Math.sign(player.vx);
  player.runPh += Math.abs(player.vx) * 0.09 * dt;

  if (player.x < -PLAYER_W / 2) player.x = WORLD_W + PLAYER_W / 2 - 1;
  if (player.x > WORLD_W + PLAYER_W / 2) player.x = -PLAYER_W / 2 + 1;

  // vertical
  if (rocket) {
    player.vy = ROCKET_VY;
    if (Math.random() < 0.5) burst(player.x, player.y + PLAYER_H / 2, 1, '#ff9900', '#ffd23d');
  } else {
    player.vy += GRAV * dt;
  }
  player.y += player.vy * dt;

  // platform collision (falling only, feet within platform span)
  if (player.vy > 0 && !rocket) {
    for (const p of plats) {
      if (p.gone || p.crumbleT === 0) continue;
      const feet = player.y + PLAYER_H / 2;
      if (feet >= p.y && feet <= p.y + p.h + player.vy * dt + 2 &&
          player.x > p.x - 6 && player.x < p.x + p.w + 6) {
        player.y = p.y - PLAYER_H / 2;
        bounceOff(p);
        break;
      }
    }
  }

  // platform dynamics
  for (const p of plats) {
    if (p.type === 1) {
      p.x += p.vx * dt;
      if (p.x < 0 || p.x + p.w > WORLD_W) p.vx *= -1;
    }
    if (p.crumbleT > 0) {
      p.crumbleT -= dt;
      if (p.crumbleT <= 0) { p.crumbleT = 0; sfx.breakP(); burst(p.x + p.w / 2, p.y, 8, '#8a7a5a'); }
    }
    if (p.gone && p.vanishA > 0) p.vanishA -= 0.08 * dt;
  }

  const targetCam = player.y - WORLD_H * 0.55;
  if (targetCam < cam) cam += (targetCam - cam) * 0.12 * dt;
  const climbed = Math.max(0, Math.round((-(cam)) / 7));
  if (climbed > heightM) {

    heightM = climbed;
  }

  const px = heightM * 7;
  if (floorIdx < FLOORS.length - 1 && px >= FLOORS[floorIdx + 1].at) {
    floorIdx++;

    float(WORLD_W / 2, cam + 160, '🏢 ' + FLOORS[floorIdx].name.toUpperCase(), '#7dffb8');
    confetti(18);
  }

  staticSpd = STATIC_BASE + (STATIC_MAX - STATIC_BASE) * difficulty() *

  staticY -= staticSpd * dt;             // static rises (up = smaller y)
  if (staticY > cam + WORLD_H + STATIC_LEASH) staticY = cam + WORLD_H + STATIC_LEASH;

  if (player.y + PLAYER_H / 2 > staticY) {
    if (shieldOn) {
      shieldOn = false;
      player.vy = SPRING_VY;             // shield hurls you back up
      sfx.save();
      float(player.x, player.y - 30, '🛡 SAVED!', '#4dd9f5');
      burst(player.x, player.y, 16, '#4dd9f5');
    } else { die(); return; }
  }
  // fell below the screen (into static territory regardless)
  if (player.y > cam + WORLD_H + 80) { die(); return; }

  // lollipops
  const magnet = magnetUntil > now;
  for (const c of pops) {
    if (c.taken) continue;
    if (magnet) {
      const d2 = Math.hypot(c.x - player.x, c.y - player.y);
      if (d2 < MAGNET_R) { c.x += (player.x - c.x) * 0.25 * dt; c.y += (player.y - c.y) * 0.25 * dt; }
    }
    if (Math.abs(c.x - player.x) < POP_R + 8 && Math.abs(c.y - player.y) < POP_R + 12) {

      float(c.x, c.y, '+' + v, '#ff7bd5');
      sfx.pickup();
      burst(c.x, c.y, 6, '#ff7bd5', '#fff');

      if (hypeMeter >= HYPE_NEED && !hype) {
        hypeMeter = 0;
        hypeUntil = now + HYPE_MS;

  }

  for (const pw of powers) {
    if (pw.taken) continue;
    if (Math.abs(pw.x - player.x) < 20 && Math.abs(pw.y - player.y) < 24) {
      pw.taken = true;
      burst(pw.x, pw.y, 12, '#ffd23d');
      if (pw.kind === 'rocket') { rocketUntil = now + ROCKET_MS; sfx.rocket(); float(pw.x, pw.y - 20, '🚀 ON AIR!', '#ff9900'); }
      if (pw.kind === 'shield') { shieldOn = true; sfx.shield(); float(pw.x, pw.y - 20, '🛡 SHIELD', '#4dd9f5'); }
      if (pw.kind === 'magnet') { magnetUntil = now + MAGNET_MS; sfx.magnet(); float(pw.x, pw.y - 20, '🧲 MAGNET', '#c084fc'); }
      if (pw.kind === 'shoes')  { shoeCount = 3; sfx.shoes(); float(pw.x, pw.y - 20, '👟 SPRING ×3', '#7dffb8'); }
    }
  }

  for (const t of trolls) {

    t.x += t.vx * dt;
    t.ph += 0.06 * dt;
    t.y += Math.sin(t.ph) * 0.5 * dt;

    const dxp = player.x - t.x, dyp = player.y - t.y;
    const dist = Math.hypot(dxp, dyp);
    if (dist < t.r + PLAYER_W / 2) {
      const falling = player.vy > 1.5;
      const above = player.y < t.y - t.r * 0.3;
      if ((falling && above) || hype || rocketUntil > now) {
        // stomp
        t.alive = false;
        player.vy = BOUNCE_VY * 0.9;
        stompCombo = (now - lastStompMs < 2600) ? stompCombo + 1 : 1;
        lastStompMs = now;
        const pts = 50 * Math.min(stompCombo, 20);
        score += pts;
        sfx.stomp(stompCombo);
        float(t.x, t.y - 20, stompCombo >= 2 ? `+${pts} ×${stompCombo}` : '+' + pts, '#ffd23d');
        burst(t.x, t.y, 14, '#9fe8ff', '#c084fc');
      } else if (shieldOn) {
        shieldOn = false;
        t.alive = false;
        sfx.save();
        float(player.x, player.y - 30, '🛡 SAVED!', '#4dd9f5');
        burst(t.x, t.y, 12, '#4dd9f5');
      } else { die(); return; }
    }
  }

  // callouts (PB / top-score) + confetti — same triggers as flap-fight
  if (!topAnnounced && topScore > 0 && score > topScore) {
    topAnnounced = true; pbAnnounced = true;
    showCallout('top');
  } else if (!pbAnnounced && bestScore > 0 && score > bestScore) {
    pbAnnounced = true;
    showCallout('pb');
  }

  // rare idle Joe quip

    sfx.idle();
  }

  topUpPlatforms();

  // prune off-screen entities (below static / far below camera)
  const cutoff = cam + WORLD_H + 260;
  plats = plats.filter(p => p.y < cutoff && p.vanishA > 0);
  pops = pops.filter(c => !c.taken && c.y < cutoff);
  powers = powers.filter(p => !p.taken && p.y < cutoff);

}
function stepParts(dt) {

    const p = parts[i];
    p.t += dt;

    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.12 * dt;
  }

    localStorage.setItem('dad_callout_who', who);

  confetti(kind === 'top' ? 60 : 36);
  const line = jimmyPick(kind === 'top' ? JIMMY_TOP_VO : JIMMY_PB_VO);
  if (sfxMode === 'voice') jimmySay(line);
  else if (sfxMode === 'tones') { TONES.best(); setTimeout(() => jimmySay(line), 600); }
  callout.text = line;
}

// ── ATTRACT AI — steers to the best reachable platform, competent + silent ───
function attractStep(dt) {
  if (!player) { initGame(); }
  // pick the nearest platform ABOVE within horizontal reach, steer under it
  let target = null, bd = 1e9;
  for (const p of plats) {
    if (p.gone || p.crumbleT === 0) continue;
    if (p.y < player.y - 15 && p.y > player.y - 260) {
      const d = Math.abs(p.x + p.w / 2 - player.x) + (player.y - p.y) * 0.4;
      if (d < bd) { bd = d; target = p; }
    }
  }
  if (target) player.targetX = target.x + target.w / 2;
  // never let the demo die: if the bot is about to fall into static, rescue-bounce
  if (player.y + PLAYER_H / 2 > staticY - 30 || player.y > cam + WORLD_H + 40) {
    player.vy = SPRING_VY;
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function lerpCol(a, b, k) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return `rgb(${Math.round(pa[0] + (pb[0] - pa[0]) * k)},${Math.round(pa[1] + (pb[1] - pa[1]) * k)},${Math.round(pa[2] + (pb[2] - pa[2]) * k)})`;
}
function drawJimmy(g, x, y) {
  // pixel Jimmy: cyan hoodie, headphones, runs while steering
  const run = Math.floor(player.runPh) % 4;
  const legA = [2, 0, -2, 0][run];
  g.save();
  g.translate(x, y);
  if (player.face < 0) g.scale(-1, 1);
  // legs
  g.fillStyle = '#22333f';
  g.fillRect(-5, 8, 4, 7 + legA);
  g.fillRect(1, 8, 4, 7 - legA);
  // hoodie body
  g.fillStyle = '#35e0c8';
  g.fillRect(-7, -4, 14, 13);
  g.fillStyle = '#2ab8a4';
  g.fillRect(-7, 5, 14, 4);
  // arms
  g.fillStyle = '#35e0c8';
  g.fillRect(-10, -2, 3, 8 - legA);
  g.fillRect(7, -2, 3, 8 + legA);
  // head
  g.fillStyle = '#f2c79b';
  g.fillRect(-6, -15, 12, 11);
  // hair
  g.fillStyle = '#3a2a1a';
  g.fillRect(-6, -16, 12, 4);
  // headphones
  g.fillStyle = '#101418';
  g.fillRect(-8, -13, 2, 6);
  g.fillRect(6, -13, 2, 6);
  g.fillRect(-7, -17, 14, 2);
  // eye
  g.fillStyle = '#101418';
  g.fillRect(2, -11, 2, 2);
  g.restore();
}
function drawTroll(g, t) {
  g.save();
  g.translate(t.x, t.y);
  g.fillStyle = '#6a5acd';
  g.beginPath(); g.arc(0, 0, t.r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#4a3a9d';
  g.fillRect(-t.r, -2, t.r * 2, 4);
  // angry eyes + frown
  g.fillStyle = '#fff';
  g.fillRect(-8, -8, 5, 5); g.fillRect(3, -8, 5, 5);
  g.fillStyle = '#000';
  g.fillRect(-6, -6, 2, 2); g.fillRect(5, -6, 2, 2);
  g.fillStyle = '#2a1a5d';
  g.fillRect(-5, 6, 10, 2);
  g.restore();
}
function render() {
  const g = octx;
  const s = 1 / PIX;
  const now = Date.now();
  const hype = hypeUntil > now;
  g.setTransform(s, 0, 0, s, 0, -cam * s);
  g.imageSmoothingEnabled = false;

  // sky per floor, lerped between bands
  const px = heightM * 7;
  const f = FLOORS[floorIdx], fn = FLOORS[Math.min(floorIdx + 1, FLOORS.length - 1)];
  const span = Math.max(1, fn.at - f.at);
  const k = Math.min(1, Math.max(0, (px - f.at) / span));
  const grd = g.createLinearGradient(0, cam, 0, cam + WORLD_H);
  grd.addColorStop(0, lerpCol(f.sky0, fn.sky0, k));
  grd.addColorStop(1, lerpCol(f.sky1, fn.sky1, k));
  g.fillStyle = grd;
  g.fillRect(0, cam, WORLD_W, WORLD_H);

  // parallax studio wall: shelf lines + posters
  g.fillStyle = lerpCol(f.wall, fn.wall, k);
  for (let i = 0; i < 8; i++) {
    const wy = Math.floor((cam * 0.5) / 130) * 130 + i * 130;
    const yy = wy - cam * 0.5 + cam;   // parallax 0.5
    g.fillRect(0, yy, WORLD_W, 5);
    g.fillRect(30 + (i % 3) * 120, yy - 34, 44, 30);
  }

  // platforms
  for (const p of plats) {
    if (p.crumbleT === 0) continue;
    g.globalAlpha = p.gone ? Math.max(0, p.vanishA) : 1;
    const shake = p.crumbleT > 0 ? (Math.random() - 0.5) * 2 : 0;
    let c0 = '#3f7f6f', c1 = '#57a98f';
    if (p.type === 1) { c0 = '#3f5f8f'; c1 = '#5f87c9'; }
    if (p.type === 2) { c0 = '#7f6a3f'; c1 = '#a98d57'; }
    if (p.type === 3) { c0 = '#6f3f7f'; c1 = '#a057a9'; }
    if (p.type === 4) { c0 = '#7f3f3f'; c1 = '#d05757'; }
    g.fillStyle = c0;
    g.fillRect(p.x + shake, p.y, p.w, p.h);
    g.fillStyle = c1;
    g.fillRect(p.x + shake, p.y, p.w, 4);
    if (p.type === 4) { g.fillStyle = '#ffd23d'; g.fillRect(p.x + p.w / 2 - 6 + shake, p.y - 5, 12, 5); }
    g.globalAlpha = 1;
  }

  // lollipops
  for (const c of pops) {
    if (c.taken) continue;
    g.fillStyle = '#ff7bd5';
    g.beginPath(); g.arc(c.x, c.y, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff';
    g.fillRect(c.x - 1, c.y + 5, 2, 8);
    g.fillStyle = '#ffb7e8';
    g.fillRect(c.x - 2, c.y - 3, 3, 3);
  }

  // powerups
  for (const pw of powers) {
    if (pw.taken) continue;
    const bob = Math.sin(now / 300 + pw.x) * 3;
    g.font = '14px sans-serif';
    g.textAlign = 'center';
    g.fillText(pw.kind === 'rocket' ? '🚀' : pw.kind === 'shield' ? '🛡️' : pw.kind === 'magnet' ? '🧲' : '👟',
               pw.x, pw.y + bob);
  }

  // trolls
  for (const t of trolls) if (t.alive) drawTroll(g, t);

  // player + trails
  if (player) {
    if (hype) {
      const cols = ['#ff4d6d', '#ffd23d', '#4dd9f5', '#7dffb8'];
      g.fillStyle = cols[Math.floor(now / 90) % 4];
      g.globalAlpha = 0.5;
      g.beginPath(); g.arc(player.x, player.y, 20, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    }
    if (shieldOn) {
      g.strokeStyle = '#4dd9f5';
      g.globalAlpha = 0.7;
      g.lineWidth = 2;
      g.beginPath(); g.arc(player.x, player.y - 3, 19, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
    }
    if (rocketUntil > now) {
      g.fillStyle = '#ff9900';
      g.fillRect(player.x - 3, player.y + 14, 6, 8 + Math.random() * 6);
    }
    drawJimmy(g, player.x, player.y);
  }

  // particles
  for (const p of parts) {
    const kk = p.t / p.life, F = 0.08;
    const fade = kk < F ? kk / F : kk > 1 - F ? (1 - kk) / F : 1;
    g.globalAlpha = Math.min(1, fade);
    g.fillStyle = kk < 0.5 ? p.c0 : p.c1;
    const r = p.s0 + (p.s1 - p.s0) * kk;
    g.beginPath(); g.arc(p.x, p.y, Math.max(0.4, r), 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  // THE DEAD AIR — animated static wall
  if (staticY < cam + WORLD_H + 40) {
    const top = Math.max(cam, staticY);
    g.fillStyle = '#0a0a0a';
    g.fillRect(0, staticY, WORLD_W, cam + WORLD_H - staticY + 60);
    // static noise band
    for (let i = 0; i < 240; i++) {
      const nx = Math.random() * WORLD_W;
      const ny = staticY + Math.random() * Math.min(120, cam + WORLD_H - staticY + 60);
      const v = Math.random();
      g.fillStyle = v > 0.6 ? '#e8e8e8' : v > 0.3 ? '#888' : '#333';
      g.fillRect(nx, ny, 2.5, 2.5);
    }
    // warning fringe
    g.fillStyle = 'rgba(255,60,60,0.65)';
    g.fillRect(0, staticY - 2, WORLD_W, 3);
  }

  // ── upscale to screen ──
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  if (shakeT > 0) { shakeT--; ctx.translate((Math.random() - .5) * shakeT * 0.8, (Math.random() - .5) * shakeT * 0.8); }
  ctx.drawImage(off, 0, 0, off.width, off.height, 0, 0, WORLD_W, WORLD_H);

  // ── crisp HUD layer ──
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + score, 12, 10);
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillStyle = '#9fe8ff';
  ctx.fillText(heightM + 'm · ' + FLOORS[floorIdx].name.toUpperCase(), 12, 34);
  // hype meter
  ctx.fillStyle = '#222';
  ctx.fillRect(12, 54, 90, 8);
  const hk = hypeUntil > now ? (hypeUntil - now) / HYPE_MS : hypeMeter / HYPE_NEED;
  ctx.fillStyle = hypeUntil > now ? '#ffd23d' : '#ff7bd5';
  ctx.fillRect(12, 54, 90 * Math.max(0, Math.min(1, hk)), 8);
  // mic
  ctx.font = '22px sans-serif';
  ctx.textAlign = 'right';
  ctx.globalAlpha = (sfxMode === 'voice' && bounceVoiceOff) ? 0.5 : 1;
  ctx.fillText(sfxMode === 'mute' ? '🔇' : sfxMode === 'voice' ? '🗣️' : '🔊', WORLD_W - 12, 12);
  ctx.globalAlpha = 1;

  // floaters (crisp layer, world coords need cam offset)
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textAlign = 'center';
  for (const fl of floats) {
    ctx.globalAlpha = Math.max(0, Math.min(1, fl.a));
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y - cam);
  }
  ctx.globalAlpha = 1;

  // callout banner
  if (callout && now < callout.until) {
    const ink2 = callout.who === 'JIMMY' ? '#4dd9f5' : '#ffcf3d';
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(3,15,24,0.9)';
    ctx.fillRect(WORLD_W / 2 - 150, 84, 300, 46);
    ctx.strokeStyle = ink2; ctx.lineWidth = 2;
    ctx.strokeRect(WORLD_W / 2 - 150, 84, 300, 46);
    ctx.fillStyle = ink2;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('JIMMY', WORLD_W / 2, 92);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(callout.text || '', WORLD_W / 2, 108);
    ctx.globalAlpha = 1;
  } else if (callout && now >= callout.until) callout = null;

  // attract overlay hint
  if (state === 'attract') {
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now * 0.005);
    ctx.fillText('INSERT COIN', WORLD_W / 2, WORLD_H * 0.8);
    ctx.globalAlpha = 1;
  }
}

// ── LOOP — frame-rate independent (dt in 60fps ticks, flap-fight lesson) ─────
let lastMs = null, animId = null;
function loop() {
  const nowMs = performance.now();
  let dt = 1;
  if (lastMs !== null) {
    dt = (nowMs - lastMs) / (1000 / 60);
    dt = Math.min(Math.max(dt, 0.1), 3);
  }
  lastMs = nowMs;
  update(dt);
  render();
  animId = requestAnimationFrame(loop);
}

// ── COIN / START ─────────────────────────────────────────────────────────────
document.getElementById('coinBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  unlockAudio();
  initGame();
  state = 'playing';
  sfx.start();
});

initGame();          // attract runs on a real world from frame one
requestAnimationFrame(loop);

// headless QA hooks (playtest-by-evaluate)
window.__dad = {
  get state() { return state; }, set state(v) { state = v; },
  get player() { return player; }, get plats() { return plats; },
  get score() { return score; }, set score(v) { score = v; },
  get staticY() { return staticY; }, set staticY(v) { staticY = v; },
  get heightM() { return heightM; },
  get trolls() { return trolls; }, get powers() { return powers; }, get pops() { return pops; },
  get hypeUntil() { return hypeUntil; }, get shieldOn() { return shieldOn; }, set shieldOn(v) { shieldOn = v; },
  get sfxMode() { return sfxMode; }, set sfxMode(v) { sfxMode = v; },
  get VO() { return VO; }, get VO_LINES() { return VO_LINES; },
  update, initGame, die, djb2vo, spawnPlat,
  get cam() { return cam; },
  get floorIdx() { return floorIdx; },
  set bestScore(v) { bestScore = v; }, set topScore(v) { topScore = v; },
  get callout() { return callout; },
};
})();
</script>
