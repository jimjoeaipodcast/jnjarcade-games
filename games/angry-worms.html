<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ANGRY WORMS</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<script src="arcade-scores.js?v=10"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Bungee', sans-serif; }
#gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
.hidden { display: none !important; }

#overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#overlay h1 {
  font-size: 52px; color: #e8302a; letter-spacing: 4px;
  text-shadow: 0 0 24px #e8302a, 0 0 48px #e8302a;
  line-height: 1;
}
#overlay h2 {
  font-size: 14px; color: #888; margin-top: 14px; letter-spacing: 6px;
}
#coinBtn {
  margin-top: 50px; padding: 16px 42px;
  background: transparent; color: #fff;
  border: 3px solid #e8302a; cursor: pointer;
  font-family: 'Bungee', sans-serif; font-size: 20px;
  letter-spacing: 3px; animation: blink 1.1s steps(2,start) infinite;
  text-shadow: 0 0 12px #e8302a;
}
@keyframes blink { 50% { opacity: 0.25; } }
#overlay .hint { margin-top: 26px; font-size: 11px; color: #555; letter-spacing: 2px; }

#rotate {
  position: fixed; inset: 0; z-index: 100; background: #0a0008;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#rotate .phone { font-size: 80px; margin-bottom: 20px; }
#rotate h3 { font-size: 28px; color: #e8302a; letter-spacing: 2px; }
#rotate p { font-size: 13px; color: #666; margin-top: 12px; letter-spacing: 1px; }
@media (orientation:portrait) { #rotate { display: flex !important; } }

#endScreen {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,0.88);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#endScreen h1 { font-size: 48px; letter-spacing: 4px; line-height: 1; }
#endScreen .score { font-size: 22px; color: #fff; margin-top: 20px; letter-spacing: 2px; }
#endScreen .btn {
  margin-top: 30px; padding: 14px 36px; cursor: pointer;
  background: transparent; color: #fff; border: 3px solid #e8302a;
  font-family: 'Bungee', sans-serif; font-size: 18px; letter-spacing: 2px;
  text-shadow: 0 0 12px #e8302a;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="overlay">
  <h1>ANGRY WORMS</h1>
  <h2>ANGRY BIRDS &times; WORMS</h2>
  <button id="coinBtn">TAP TO INSERT COIN</button>
  <div class="hint">DRAG TO AIM &middot; RELEASE TO FIRE &middot; TAP MID-FLIGHT FOR ABILITY</div>
</div>

<div id="rotate">
  <div class="phone">📱</div>
  <h3>ROTATE YOUR PHONE</h3>
  <p>ANGRY WORMS PLAYS IN LANDSCAPE</p>
</div>

<div id="endScreen">
  <h1 id="endTitle">LEVEL CLEAR!</h1>
  <div class="score" id="endScore">SCORE 0</div>
  <button class="btn" id="endBtn">NEXT LEVEL</button>
</div>

<script>
"use strict";

// ====== CONFIG ======
const WORLD_W = 1800;
const WORLD_H = 720;
const GRAVITY = 0.25;
const SLING_X = 220;
const GROUND_Y = 600;
const MAX_PULL = 120;

// ====== STATE ======
let canvas, ctx;
let W = 0, H = 0, DPR = 1;
let camera = { x: 0, y: 0, targetX: 0 };
let lastTime = 0;

let gameState = "attract";
let level = 1;
let score = 0;
let turn = "player";
let turnTimer = 0;
let wind = 0;
let aiming = false;
let dragStart = null;
let dragCurrent = null;
let loadedWorm = null;
let selectedType = 0;
let inventory = [
  { type: "red", count: 3 },
  { type: "bomber", count: 2 },
  { type: "splitter", count: 1 }
];

let worms = [];
let blocks = [];
let particles = [];
let projectiles = [];
let stars = [];
let clouds = [];
let terrain = [];
let gravestones = [];

let attractTimer = 0;
let attractPhase = 0;
let attractProj = null;

// ====== INIT ======
window.addEventListener("load", init);

function init() {
  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", resize);
  setupInput();
  generateStars();
  generateClouds();
  buildLevel(1);
  camera.x = 0;
  camera.targetX = 0;

  // Attract mode prep
  startAttractCycle();

  document.getElementById("coinBtn").addEventListener("click", insertCoin);
  document.getElementById("endBtn").addEventListener("click", onEndBtn);

  requestAnimationFrame(gameLoop);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 20; i++) {
    stars.push({
      x: Math.random() * WORLD_W,
      y: Math.random() * 200,
      r: Math.random() * 1.5 + 0.5,
      tw: Math.random() * Math.PI * 2,
      tws: 0.02 + Math.random() * 0.04
    });
  }
}

function generateClouds() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * WORLD_W,
      y: 40 + Math.random() * 180,
      r: 30 + Math.random() * 40,
      s: 0.1 + Math.random() * 0.2
    });
  }
}

// ====== LEVEL BUILD ======
function buildLevel(lvl) {
  level = lvl;
  terrain = generateTerrain(lvl);
  blocks = [];
  worms = [];
  particles = [];
  projectiles = [];
  gravestones = [];

  const baseCount = 2 + lvl;
  let bx = 1100;
  for (let i = 0; i < baseCount && bx < 1700; i++) {
    buildStructure(bx, 120 + Math.random() * 60, lvl);
    bx += 180 + Math.random() * 30;
  }

  // Reset inventory
  inventory = [
    { type: "red", count: 3 + Math.floor(lvl / 2) },
    { type: "bomber", count: 2 },
    { type: "splitter", count: 1 }
  ];
  selectedType = 0;
  loadNextWorm();
}

function generateTerrain(lvl) {
  const arr = [];
  // Slingshot hill
  const hillX = SLING_X;
  for (let x = 0; x <= WORLD_W; x += 4) {
    let y = GROUND_Y;
    // Big slingshot hill
    y -= 80 * Math.exp(-Math.pow((x - hillX) / 140, 2));
    // Rolling hills between
    y -= 40 * Math.sin(x * 0.008) * Math.cos(x * 0.003);
    y -= 30 * Math.sin(x * 0.015 + 1);
    // Right side elevated plateau for structures
    if (x > 1050) {
      const t = Math.min(1, (x - 1050) / 100);
      y -= 60 * t;
    }
    arr.push({ x: x, y: y });
  }
  return arr;
}

function buildStructure(x, width, lvl) {
  const groundY = terrainHeightAt(x + width / 2);
  const layers = 2 + Math.min(2, lvl);
  const blockW = 40;
  const blockH = 30;
  let placed = 0;
  for (let row = 0; row < layers; row++) {
    const count = 2 + Math.floor(Math.random() * 2);
    const rowW = count * blockW;
    const startX = x + (width - rowW) / 2;
    for (let c = 0; c < count; c++) {
      if (placed >= 6 + lvl * 2) break;
      const isStone = Math.random() < 0.3;
      blocks.push({
        x: startX + c * blockW,
        y: groundY - (row + 1) * blockH,
        w: blockW,
        h: blockH,
        hp: isStone ? 60 : 30,
        maxHp: isStone ? 60 : 30,
        type: isStone ? "stone" : "wood",
        vx: 0, vy: 0,
        falling: false,
        settled: false,
        rot: 0
      });
      placed++;
    }
  }
  // Place enemy worm on top
  const topBlock = blocks.filter(b => b.x >= x && b.x < x + width).reduce((a, b) => a.y > b.y ? a : b, { y: groundY });
  worms.push(makeWorm(x + width / 2, topBlock.y - 20, "enemy", "green"));
}

function makeWorm(x, y, team, type) {
  return {
    x: x, y: y, vx: 0, vy: 0,
    team: team, type: type,
    hp: 100, maxHp: 100,
    radius: 18,
    alive: true,
    falling: false,
    onGround: false,
    facing: team === "player" ? 1 : -1,
    deathTimer: 0,
    flashTimer: 0,
    wiggle: 0
  };
}

function terrainHeightAt(x) {
  if (x < 0) return GROUND_Y;
  if (x > WORLD_W) return GROUND_Y;
  const i = Math.floor(x / 4);
  if (i < 0 || i >= terrain.length - 1) return GROUND_Y;
  const t = (x - terrain[i].x) / 4;
  return terrain[i].y * (1 - t) + terrain[i + 1].y * t;
}

// ====== INPUT ======
function setupInput() {
  let pointerActive = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function onDown(e) {
    e.preventDefault();
    const p = getPos(e);
    // Check inventory slots
    if (gameState === "playing" && turn === "player") {
      if (checkInventoryTap(p)) return;
    }
    // Check mute button
    if (checkMuteTap(p)) return;

    if (gameState !== "playing" || turn !== "player") return;
    if (!loadedWorm) return;
    // Check if tap is near slingshot (in world coords)
    const wx = p.x + camera.x;
    const wy = p.y + camera.y;
    const dx = wx - SLING_X;
    const dy = wy - (GROUND_Y - 150);
    if (Math.sqrt(dx * dx + dy * dy) < 80 || true) {
      // Allow drag from anywhere - more forgiving
      aiming = true;
      dragStart = { x: SLING_X, y: GROUND_Y - 150 };
      dragCurrent = { x: wx, y: wy };
      pointerActive = true;
    }
  }

  function onMove(e) {
    if (!pointerActive) return;
    e.preventDefault();
    const p = getPos(e);
    const wx = p.x + camera.x;
    const wy = p.y + camera.y;
    dragCurrent = { x: wx, y: wy };
  }

  function onUp(e) {
    if (!pointerActive) return;
    e.preventDefault();
    pointerActive = false;
    if (aiming && loadedWorm) {
      fireWorm();
    }
    aiming = false;
  }

  // Mid-flight ability tap (separate from drag)
  function onTapAbility(e) {
    if (gameState === "playing" && projectiles.length > 0) {
      // Use first projectile
      const p = projectiles[0];
      if (p.type === "bomber" && !p.abilityUsed) {
        p.abilityUsed = true;
        explode(p.x, p.y, 80, p.team);
        p.dead = true;
      } else if (p.type === "splitter" && !p.abilityUsed) {
        p.abilityUsed = true;
        // Create 2 more
        for (let k = -1; k <= 1; k += 2) {
          projectiles.push({
            x: p.x, y: p.y,
            vx: p.vx + k * 2,
            vy: p.vy - 1,
            type: "splitter",
            team: p.team,
            radius: 12,
            dead: false,
            abilityUsed: true,
            trail: []
          });
        }
      }
    }
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
}

function checkInventoryTap(p) {
  const barY = H - 60;
  const slotW = 120;
  const totalW = inventory.length * slotW;
  const startX = (W - totalW) / 2;
  for (let i = 0; i < inventory.length; i++) {
    const sx = startX + i * slotW;
    if (p.x >= sx && p.x < sx + slotW - 10 && p.y >= barY && p.y < barY + 50) {
      if (inventory[i].count > 0) {
        selectedType = i;
        loadNextWorm();
      }
      return true;
    }
  }
  return false;
}

function checkMuteTap(p) {
  if (p.x > W - 60 && p.x < W - 10 && p.y > H - 55 && p.y < H - 5) {
    muted = !muted;
    localStorage.setItem("aw_muted", muted ? "1" : "0");
    return true;
  }
  return false;
}

let muted = localStorage.getItem("aw_muted") === "1";

// ====== SLINGSHOT & LOADING ======
function loadNextWorm() {
  loadedWorm = null;
  if (inventory[selectedType].count <= 0) {
    // Find any with count
    for (let i = 0; i < inventory.length; i++) {
      if (inventory[i].count > 0) {
        selectedType = i;
        break;
      }
    }
  }
  if (inventory[selectedType].count > 0) {
    loadedWorm = {
      x: SLING_X,
      y: GROUND_Y - 150,
      type: inventory[selectedType].type,
      team: "player",
      radius: 16
    };
  }
}

function fireWorm() {
  if (!loadedWorm || !dragCurrent) return;
  let dx = dragStart.x - dragCurrent.x;
  let dy = dragStart.y - dragCurrent.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 10) return;
  const pull = Math.min(dist, MAX_PULL);
  const power = (pull / MAX_PULL) * 18;
  const ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * power;
  const vy = Math.sin(ang) * power;
  projectiles.push({
    x: loadedWorm.x,
    y: loadedWorm.y,
    vx: vx,
    vy: vy,
    type: loadedWorm.type,
    team: "player",
    radius: 16,
    dead: false,
    abilityUsed: false,
    trail: []
  });
  inventory[selectedType].count--;
  loadedWorm = null;
  // Camera follows projectile
}

// ====== ENEMY AI ======
function enemyFire() {
  // Pick a target: nearest player worm or slingshot
  const target = { x: SLING_X, y: GROUND_Y - 150 };
  // Find enemy worm position to fire from
  const shooter = worms.find(w => w.team === "enemy" && w.alive);
  if (!shooter) return;
  // Calculate trajectory to hit target
  const sx = shooter.x;
  const sy = shooter.y - 30;
  const tx = target.x;
  const ty = target.y;
  // Simple ballistic with wind compensation
  const dx = tx - sx;
  let power = 16 + Math.random() * 2;
  let angle = Math.atan2(-Math.abs(dx) * 0.4 - 60, dx) + (Math.random() - 0.5) * 0.15;
  // Adjust for wind
  angle += wind * 0.02;
  const vx = Math.cos(angle) * power * (dx > 0 ? 1 : -1);
  // Actually, since enemy is on right and target on left, dx is negative
  const dir = Math.sign(tx - sx) || -1;
  const realVx = Math.cos(angle) * power * dir;
  const realVy = Math.sin(angle) * power;

  projectiles.push({
    x: sx,
    y: sy,
    vx: realVx,
    vy: realVy,
    type: "red",
    team: "enemy",
    radius: 16,
    dead: false,
    abilityUsed: false,
    trail: []
  });
}

// ====== PHYSICS ======
function updatePhysics(dt) {
  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 15) p.trail.shift();
    p.vy += GRAVITY;
    p.vx += wind * 0.03;
    p.x += p.vx;
    p.y += p.vy;

    // Camera follow
    if (turn === "player" || p.team === "player") {
      camera.targetX = Math.max(0, Math.min(WORLD_W - W, p.x - W / 2));
    }

    // Terrain collision
    const groundY = terrainHeightAt(p.x);
    if (p.y > groundY - p.radius) {
      // Hit ground
      explode(p.x, groundY, 50, p.team);
      p.dead = true;
    }
    // Block collision
    for (const b of blocks) {
      if (b.hp <= 0) continue;
      if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        explode(p.x, p.y, 50, p.team);
        p.dead = true;
        break;
      }
    }
    // Worm collision
    for (const w of worms) {
      if (!w.alive) continue;
      if (w.team === p.team) continue;
      const dx = w.x - p.x;
      const dy = w.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) < w.radius + p.radius) {
        explode(p.x, p.y, 60, p.team);
        p.dead = true;
        break;
      }
    }
    // Off world
    if (p.x < -50 || p.x > WORLD_W + 50 || p.y > WORLD_H + 100) {
      p.dead = true;
    }
    if (p.dead) {
      projectiles.splice(i, 1);
      // Schedule turn end
      if (turnTimer === 0) turnTimer = 90;
    }
  }

  // Update blocks (falling)
  for (const b of blocks) {
    if (b.hp <= 0) {
      b.falling = true;
    }
    if (b.falling) {
      b.vy += GRAVITY;
      b.y += b.vy;
      b.rot += b.vx * 0.05;
      const gy = terrainHeightAt(b.x + b.w / 2);
      if (b.y + b.h > gy) {
        b.y = gy - b.h;
        b.vy = 0;
        b.settled = true;
        b.falling = false;
      }
    }
  }
  // Remove fully destroyed blocks after they fall off
  blocks = blocks.filter(b => b.y < WORLD_H + 200);

  // Update worms (gravity for ones not on ground)
  for (const w of worms) {
    if (!w.alive) {
      w.deathTimer += 1;
      w.vy += GRAVITY * 0.5;
      w.y += w.vy;
      w.x += w.vx;
      continue;
    }
    w.wiggle += 0.1;
    if (w.flashTimer > 0) w.flashTimer--;
    const gy = terrainHeightAt(w.x);
    // Check if supported by block
    let supported = false;
    for (const b of blocks) {
      if (b.hp <= 0) continue;
      if (w.x > b.x - 5 && w.x < b.x + b.w + 5 && Math.abs(w.y + w.radius - b.y) < 5) {
        supported = true;
        w.y = b.y - w.radius;
        break;
      }
    }
    if (!supported) {
      if (w.y + w.radius < gy) {
        w.vy += GRAVITY * 0.6;
        w.y += w.vy;
        w.onGround = false;
      } else {
        w.y = gy - w.radius;
        w.vy = 0;
        w.onGround = true;
      }
    } else {
      w.vy = 0;
      w.onGround = true;
    }
    if (w.y > WORLD_H + 50) {
      w.alive = false;
      w.deathTimer = 100;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.vy += pt.gravity || 0.15;
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // Update gravestones
  for (const g of gravestones) {
    g.timer++;
  }

  // Turn timer
  if (turnTimer > 0) {
    turnTimer--;
    if (turnTimer === 0) {
      switchTurn();
    }
  }
}

function explode(x, y, radius, team) {
  // Crater
  craterTerrain(x, y, radius * 0.7);

  // Particles - starburst
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 8;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      size: 4 + Math.random() * 6,
      color: Math.random() < 0.5 ? "#ffcc00" : "#ff6600",
      type: "spark",
      gravity: 0.15
    });
  }
  // Smoke ring
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    particles.push({
      x: x + Math.cos(a) * 10,
      y: y + Math.sin(a) * 10,
      vx: Math.cos(a) * 1.5,
      vy: Math.sin(a) * 1.5 - 0.5,
      life: 50,
      maxLife: 50,
      size: 15 + Math.random() * 8,
      color: "#333",
      type: "smoke",
      gravity: -0.05
    });
  }

  // Damage worms
  for (const w of worms) {
    if (!w.alive) continue;
    const dx = w.x - x;
    const dy = w.y - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < radius) {
      const dmg = (1 - d / radius) * 80;
      w.hp -= dmg;
      w.flashTimer = 10;
      w.vx = dx / (d + 1) * 5;
      w.vy = -3;
      if (w.hp <= 0) {
        w.alive = false;
        w.deathTimer = 0;
        w.vx = dx / (d + 1) * 4;
        w.vy = -8;
        gravestones.push({ x: w.x, y: terrainHeightAt(w.x), timer: 0 });
        if (w.team === "enemy") {
          score += 100;
        }
      }
    }
  }

  // Damage blocks
  for (const b of blocks) {
    if (b.hp <= 0) continue;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const d = Math.sqrt((cx - x) ** 2 + (cy - y) ** 2);
    if (d < radius) {
      const dmg = (1 - d / radius) * 50;
      b.hp -= dmg;
      if (b.hp <= 0) {
        score += 10;
        b.falling = true;
        b.vx = (cx - x) / (d + 1) * 2;
        b.vy = -2;
      }
    }
  }
}

function craterTerrain(x, y, r) {
  for (let i = 0; i < terrain.length; i++) {
    const dx = terrain[i].x - x;
    const d = Math.abs(dx);
    if (d < r) {
      const depth = Math.sqrt(r * r - d * d) * 0.6;
      terrain[i].y += depth;
      if (terrain[i].y > GROUND_Y + 40) terrain[i].y = GROUND_Y + 40;
    }
  }
}

// ====== TURN SYSTEM ======
function switchTurn() {
  // Check win/lose
  const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
  if (enemiesAlive === 0) {
    showEndScreen(true);
    return;
  }
  const playerHasShots = inventory.reduce((s, i) => s + i.count, 0);
  if (playerHasShots === 0 && projectiles.length === 0) {
    showEndScreen(false);
    return;
  }

  if (turn === "player") {
    turn = "enemy";
    wind = (Math.random() - 0.5) * 6;
    turnTimer = 90; // 1.5s aim indicator
    setTimeout(() => {
      if (gameState === "playing" && turn === "enemy") {
        enemyFire();
      }
    }, 1500);
  } else {
    turn = "player";
    wind = (Math.random() - 0.5) * 6;
    loadNextWorm();
    camera.targetX = 0;
  }
}

function showEndScreen(won) {
  gameState = "ended";
  const es = document.getElementById("endScreen");
  const et = document.getElementById("endTitle");
  const eb = document.getElementById("endBtn");
  document.getElementById("endScore").textContent = "SCORE " + score;
  if (won) {
    et.textContent = "LEVEL CLEAR!";
    et.style.color = "#39ff14";
    et.style.textShadow = "0 0 24px #39ff14, 0 0 48px #39ff14";
    eb.textContent = level < 3 ? "NEXT LEVEL" : "VICTORY!";
  } else {
    et.textContent = "GAME OVER";
    et.style.color = "#e8302a";
    et.style.textShadow = "0 0 24px #e8302a, 0 0 48px #e8302a";
    eb.textContent = "INSERT COIN";
  }
  es.style.display = "flex";
}

function onEndBtn() {
  const es = document.getElementById("endScreen");
  es.style.display = "none";
  const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
  if (enemiesAlive === 0 && level < 3) {
    // Next level
    buildLevel(level + 1);
    turn = "player";
    wind = (Math.random() - 0.5) * 6;
    gameState = "playing";
    camera.targetX = 0;
  } else {
    // Game over - use ArcadeScores
    if (window.ArcadeScores) {
      ArcadeScores.show("angry-worms", score, resetGame);
    } else {
      resetGame();
    }
  }
}

function resetGame() {
  score = 0;
  buildLevel(1);
  turn = "player";
  wind = (Math.random() - 0.5) * 6;
  gameState = "playing";
  camera.targetX = 0;
  document.getElementById("endScreen").style.display = "none";
}

// ====== COIN / START ======
function insertCoin() {
  const overlay = document.getElementById("overlay");
  overlay.classList.add("hidden");
  // Try fullscreen
  try {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  } catch (e) {}
  startGame();
}

function startGame() {
  score = 0;
  buildLevel(1);
  turn = "player";
  wind = (Math.random() - 0.5) * 6;
  gameState = "playing";
  // Camera intro pan
  camera.x = 0;
  camera.targetX = WORLD_W - W;
  setTimeout(() => {
    if (gameState === "playing") camera.targetX = 0;
  }, 2000);
}

// ====== ATTRACT MODE ======
function startAttractCycle() {
  attractTimer = 0;
  attractPhase = 0;
  attractProj = null;
}

function updateAttract() {
  attractTimer++;
  if (attractPhase === 0 && attractTimer > 60) {
    // Fire
    attractProj = {
      x: SLING_X,
      y: GROUND_Y - 150,
      vx: 14,
      vy: -9,
      type: "red",
      trail: []
    };
    attractPhase = 1;
    attractTimer = 0;
  }
  if (attractPhase === 1 && attractProj) {
    attractProj.trail.push({ x: attractProj.x, y: attractProj.y });
    if (attractProj.trail.length > 20) attractProj.trail.shift();
    attractProj.vy += GRAVITY;
    attractProj.x += attractProj.vx;
    attractProj.y += attractProj.vy;
    // Camera follow
    camera.targetX = Math.max(0, Math.min(WORLD_W - W, attractProj.x - W / 2));
    const gy = terrainHeightAt(attractProj.x);
    if (attractProj.y > gy - 10) {
      // Explode on structure area
      explode(attractProj.x, attractProj.y, 50, "player");
      attractPhase = 2;
      attractTimer = 0;
    }
  }
  if (attractPhase === 2 && attractTimer > 100) {
    // Reset
    attractPhase = 0;
    attractTimer = 0;
    camera.targetX = 0;
    // Rebuild level to restore structures
    buildLevel(1);
    startAttractCycle();
  }
}

// ====== CAMERA ======
function updateCamera() {
  camera.x += (camera.targetX - camera.x) * 0.08;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > WORLD_W - W) camera.x = Math.max(0, WORLD_W - W);
  camera.y = 0;
}

// ====== TRAJECTORY PREDICTION ======
function predictTrajectory(x, y, vx, vy) {
  const points = [];
  let px = x, py = y, pvx = vx, pvy = vy;
  for (let i = 0; i < 60; i++) {
    pvy += GRAVITY;
    pvx += wind * 0.03;
    px += pvx;
    py += pvy;
    if (py > terrainHeightAt(px)) break;
    if (px < 0 || px > WORLD_W) break;
    points.push({ x: px, y: py });
  }
  return points;
}

// ====== RENDER ======
function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  drawSky();
  drawStars();
  drawClouds();
  drawTerrain();
  drawGravestones();
  drawBlocks();
  drawWorms();
  drawSlingshot();
  if (loadedWorm && gameState === "playing") drawLoadedWorm();
  if (aiming && dragCurrent) drawAim();
  drawProjectiles();
  drawParticles();

  ctx.restore();

  drawHUD();

  if (gameState === "attract") {
    // Slight dim
  }
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, "#1a1a4e");
  grad.addColorStop(0.5, "#3a5a9e");
  grad.addColorStop(1, "#7ab0e0");
  ctx.fillStyle = grad;
  ctx.fillRect(camera.x - 10, 0, W + 20, GROUND_Y + 100);
}

function drawStars() {
  for (const s of stars) {
    s.tw += s.tws;
    const alpha = 0.4 + Math.sin(s.tw) * 0.4;
    ctx.fillStyle = "rgba(255,255,200," + alpha + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawClouds() {
  for (const c of clouds) {
    c.x += c.s;
    if (c.x > WORLD_W + 50) c.x = -50;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.strokeStyle = "rgba(100,120,160,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.7, c.y + 5, c.r * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.7, c.y + 5, c.r * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x, c.y - c.r * 0.4, c.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawTerrain() {
  // Grass top
  ctx.fillStyle = "#4ade2a";
  ctx.strokeStyle = "#1a4a0a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 200);
  for (const t of terrain) {
    ctx.lineTo(t.x, t.y);
  }
  ctx.lineTo(WORLD_W, GROUND_Y + 200);
  ctx.closePath();
  ctx.fill();

  // Grass strip highlight
  ctx.fillStyle = "#6aea4a";
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const t = terrain[i];
    if (i === 0) ctx.moveTo(t.x, t.y);
    else ctx.lineTo(t.x, t.y);
  }
  for (let i = terrain.length - 1; i >= 0; i--) {
    ctx.lineTo(terrain[i].x, terrain[i].y + 20);
  }
  ctx.closePath();
  ctx.fill();

  // Soil layer
  ctx.fillStyle = "#8b5a2a";
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 220);
  for (const t of terrain) ctx.lineTo(t.x, t.y + 20);
  ctx.lineTo(WORLD_W, GROUND_Y + 220);
  ctx.closePath();
  ctx.fill();

  // Soil to rock gradient
  const rg = ctx.createLinearGradient(0, GROUND_Y + 100, 0, WORLD_H);
  rg.addColorStop(0, "#8b5a2a");
  rg.addColorStop(0.3, "#5a3a1a");
  rg.addColorStop(1, "#2a1a0a");
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(0, WORLD_H);
  for (const t of terrain) ctx.lineTo(t.x, t.y + 20);
  ctx.lineTo(WORLD_W, WORLD_H);
  ctx.closePath();
  ctx.fill();

  // Top outline
  ctx.strokeStyle = "#1a4a0a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const t = terrain[i];
    if (i === 0) ctx.moveTo(t.x, t.y);
    else ctx.lineTo(t.x, t.y);
  }
  ctx.stroke();
}

function drawBlocks() {
  for (const b of blocks) {
    if (b.hp <= 0 && b.settled) continue;
    ctx.save();
    if (b.rot) {
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.rotate(b.rot);
      ctx.translate(-b.w / 2, -b.h / 2);
      ctx.translate(-b.x, -b.y);
    }
    if (b.type === "wood") {
      ctx.fillStyle = "#c8945a";
      ctx.strokeStyle = "#5a3a1a";
    } else {
      ctx.fillStyle = "#999";
      ctx.strokeStyle = "#444";
    }
    ctx.lineWidth = 2;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    // Wood grain
    if (b.type === "wood") {
      ctx.strokeStyle = "rgba(90,58,26,0.4)";
      ctx.beginPath();
      ctx.moveTo(b.x + 5, b.y + 8);
      ctx.lineTo(b.x + b.w - 5, b.y + 8);
      ctx.moveTo(b.x + 5, b.y + b.h - 8);
      ctx.lineTo(b.x + b.w - 5, b.y + b.h - 8);
      ctx.stroke();
    } else {
      // Stone texture
      ctx.strokeStyle = "rgba(60,60,60,0.5)";
      ctx.beginPath();
      ctx.moveTo(b.x + b.w / 2, b.y);
      ctx.lineTo(b.x + b.w / 2, b.y + b.h);
      ctx.stroke();
    }
    // Damage cracks
    if (b.hp < b.maxHp * 0.5) {
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 5);
      ctx.lineTo(b.x + 14, b.y + 15);
      ctx.lineTo(b.x + 10, b.y + b.h - 5);
      ctx.moveTo(b.x + b.w - 12, b.y + 6);
      ctx.lineTo(b.x + b.w - 6, b.y + 18);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawWorms() {
  for (const w of worms) {
    if (!w.alive && w.deathTimer > 100) continue;
    ctx.save();
    if (!w.alive) {
      ctx.translate(w.x, w.y);
      ctx.rotate(w.deathTimer * 0.1);
      ctx.globalAlpha = Math.max(0, 1 - w.deathTimer / 100);
      ctx.translate(-w.x, -w.y);
    }
    drawWormBody(w);
    if (w.alive) drawHPBar(w);
    ctx.restore();
  }
}

function drawWormBody(w) {
  const x = w.x;
  const y = w.y;
  const r = w.radius;
  const wiggle = Math.sin(w.wiggle) * 2;

  // Body color by team
  let bodyColor, darkColor;
  if (w.team === "enemy") {
    bodyColor = w.flashTimer > 0 ? "#fff" : "#5acf3a";
    darkColor = "#2a7a1a";
  } else {
    if (w.type === "red") { bodyColor = "#e8302a"; darkColor = "#8a1a16"; }
    else if (w.type === "bomber") { bodyColor = "#ffcc00"; darkColor = "#8a6a00"; }
    else { bodyColor = "#3a8acf"; darkColor = "#1a4a8a"; }
  }

  // Segmented body - 3 segments
  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  // Back segment
  ctx.beginPath();
  ctx.ellipse(x - 12 * w.facing, y + 5 + wiggle, 8, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Mid segment
  ctx.beginPath();
  ctx.ellipse(x - 4 * w.facing, y + wiggle, 10, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Head segment
  ctx.beginPath();
  ctx.ellipse(x + 6 * w.facing, y + wiggle, 12, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x + 6 * w.facing + 3 * w.facing, y - 3 + wiggle, 4, 0, Math.PI * 2);
  ctx.arc(x + 6 * w.facing - 2 * w.facing, y - 3 + wiggle, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Pupils
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x + 6 * w.facing + 4 * w.facing, y - 3 + wiggle, 2, 0, Math.PI * 2);
  ctx.arc(x + 6 * w.facing - 1 * w.facing, y - 3 + wiggle, 2, 0, Math.PI * 2);
  ctx.fill();

  // Mouth - determined for player, nervous for enemy
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (w.team === "player") {
    ctx.arc(x + 6 * w.facing, y + 4 + wiggle, 3, 0, Math.PI);
  } else {
    ctx.moveTo(x + 3 * w.facing, y + 5 + wiggle);
    ctx.lineTo(x + 9 * w.facing, y + 5 + wiggle);
  }
  ctx.stroke();

  // Helmet for enemy
  if (w.team === "enemy") {
    ctx.fillStyle = "#888";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + 6 * w.facing, y - 6 + wiggle, 11, Math.PI, 0);
    ctx.fill();
    ctx.stroke();
    // Helmet shine
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    ctx.arc(x + 6 * w.facing - 3, y - 9 + wiggle, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bomber stripe
  if (w.type === "bomber" && w.team === "player") {
    ctx.fillStyle = "#000";
    for (let i = -1; i <= 1; i++) {
      ctx.fillRect(x - 12 + i * 8, y - 4, 3, 8);
    }
  }
}

function drawHPBar(w) {
  if (w.hp >= w.maxHp) return;
  const bx = w.x - 18;
  const by = w.y - 28;
  const bw = 36;
  const bh = 5;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  const pct = Math.max(0, w.hp / w.maxHp);
  ctx.fillStyle = pct > 0.6 ? "#3afa3a" : pct > 0.3 ? "#ffcc00" : "#ff3030";
  ctx.fillRect(bx, by, bw * pct, bh);
  // Segments
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(bx + (bw / 3) * i, by);
    ctx.lineTo(bx + (bw / 3) * i, by + bh);
    ctx.stroke();
  }
}

function drawSlingshot() {
  const sx = SLING_X;
  const sy = GROUND_Y - 80;
  // Wood posts - Y shape
  ctx.fillStyle = "#7a4a1a";
  ctx.strokeStyle = "#3a1a00";
  ctx.lineWidth = 2;
  // Trunk
  ctx.fillRect(sx - 8, sy - 20, 16, 80);
  ctx.strokeRect(sx - 8, sy - 20, 16, 80);
  // Left fork
  ctx.save();
  ctx.translate(sx, sy - 20);
  ctx.rotate(-0.4);
  ctx.fillRect(-7, -45, 14, 50);
  ctx.strokeRect(-7, -45, 14, 50);
  ctx.restore();
  // Right fork
  ctx.save();
  ctx.translate(sx, sy - 20);
  ctx.rotate(0.4);
  ctx.fillRect(-7, -45, 14, 50);
  ctx.strokeRect(-7, -45, 14, 50);
  ctx.restore();

  // Fork tips
  const leftTip = { x: sx - 22, y: sy - 60 };
  const rightTip = { x: sx + 22, y: sy - 60 };

  // Elastic band
  if (loadedWorm && aiming && dragCurrent) {
    // Stretched - back band
    ctx.strokeStyle = "#3a1a00";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(leftTip.x, leftTip.y);
    ctx.lineTo(loadedWorm.x, loadedWorm.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightTip.x, rightTip.y);
    ctx.lineTo(loadedWorm.x, loadedWorm.y);
    ctx.stroke();
    // Front band (drawn after worm)
  } else if (loadedWorm) {
    // Relaxed band
    ctx.strokeStyle = "#3a1a00";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(leftTip.x, leftTip.y);
    ctx.lineTo(rightTip.x, rightTip.y);
    ctx.stroke();
  }

  // Store tips for later
  slingTips = { left: leftTip, right: rightTip, base: { x: sx, y: sy - 60 } };
}

let slingTips = null;

function drawLoadedWorm() {
  if (!loadedWorm) return;
  // If aiming, worm is at drag position (clamped)
  let wx = loadedWorm.x;
  let wy = loadedWorm.y;
  if (aiming && dragCurrent) {
    let dx = dragCurrent.x - dragStart.x;
    let dy = dragCurrent.y - dragStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > MAX_PULL) {
      dx = (dx / dist) * MAX_PULL;
      dy = (dy / dist) * MAX_PULL;
    }
    // Only allow pulling back (left/down)
    if (dx > 0) dx = 0;
    wx = dragStart.x + dx;
    wy = dragStart.y + dy;
    loadedWorm.x = wx;
    loadedWorm.y = wy;
  } else {
    wx = SLING_X;
    wy = GROUND_Y - 150;
    loadedWorm.x = wx;
    loadedWorm.y = wy;
  }

  // Draw worm in sling
  const tempWorm = { x: wx, y: wy, radius: 16, team: "player", type: loadedWorm.type, facing: 1, wiggle: 0, alive: true, hp: 100, maxHp: 100 };
  drawWormBody(tempWorm);

  // Front elastic band (over worm)
  if (aiming && dragCurrent && slingTips) {
    ctx.strokeStyle = "#5a2a00";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(slingTips.right.x, slingTips.right.y);
    ctx.lineTo(wx, wy);
    ctx.stroke();
  }
}

function drawAim() {
  if (!dragCurrent || !loadedWorm) return;
  let dx = dragStart.x - dragCurrent.x;
  let dy = dragStart.y - dragCurrent.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 10) return;
  const pull = Math.min(dist, MAX_PULL);
  const power = (pull / MAX_PULL) * 18;
  const ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * power;
  const vy = Math.sin(ang) * power;

  // Trajectory dots
  const points = predictTrajectory(loadedWorm.x, loadedWorm.y, vx, vy);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  for (let i = 0; i < points.length; i += 3) {
    const p = points[i];
    const sz = 4 - (i / points.length) * 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  // Power indicator circle
  ctx.strokeStyle = "rgba(255,200,0,0.6)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(dragStart.x, dragStart.y, MAX_PULL, 0, Math.PI * 2);
  ctx.stroke();

  // Power bar
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(dragStart.x, dragStart.y, MAX_PULL, -Math.PI / 2, -Math.PI / 2 + (pull / MAX_PULL) * Math.PI * 2);
  ctx.stroke();
}

function drawProjectiles() {
  for (const p of projectiles) {
    // Trail
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i];
      const a = (i / p.trail.length) * 0.5;
      ctx.fillStyle = p.type === "red" ? "rgba(232,48,42," + a + ")" :
                      p.type === "bomber" ? "rgba(255,204,0," + a + ")" :
                      "rgba(58,138,207," + a + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 + a * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Worm body
    const tw = { x: p.x, y: p.y, radius: p.radius, team: p.team, type: p.type, facing: p.vx > 0 ? 1 : -1, wiggle: p.x * 0.1, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(tw);
  }

  // Attract projectile
  if (gameState === "attract" && attractProj) {
    for (let i = 0; i < attractProj.trail.length; i++) {
      const t = attractProj.trail[i];
      const a = (i / attractProj.trail.length) * 0.5;
      ctx.fillStyle = "rgba(232,48,42," + a + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 + a * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    const tw = { x: attractProj.x, y: attractProj.y, radius: 16, team: "player", type: "red", facing: 1, wiggle: attractProj.x * 0.1, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(tw);
  }
}

function drawParticles() {
  for (const pt of particles) {
    const a = pt.life / pt.maxLife;
    if (pt.type === "smoke") {
      ctx.fillStyle = "rgba(40,40,40," + a * 0.7 + ")";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (2 - a), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawGravestones() {
  for (const g of gravestones) {
    ctx.fillStyle = "#666";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(g.x - 12, g.y);
    ctx.lineTo(g.x - 12, g.y - 25);
    ctx.arc(g.x, g.y - 25, 12, Math.PI, 0);
    ctx.lineTo(g.x + 12, g.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Cross
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - 18);
    ctx.lineTo(g.x, g.y - 8);
    ctx.moveTo(g.x - 5, g.y - 14);
    ctx.lineTo(g.x + 5, g.y - 14);
    ctx.stroke();
  }
}

// ====== HUD ======
function drawHUD() {
  // Top bar
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, 48);
  ctx.strokeStyle = "rgba(232,48,42,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 48);
  ctx.lineTo(W, 48);
  ctx.stroke();

  // Turn indicator
  ctx.font = "16px Bungee, sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  if (gameState === "attract") {
    ctx.fillStyle = "#e8302a";
    ctx.fillText("ANGRY WORMS", 16, 24);
  } else if (turn === "player") {
    ctx.fillStyle = "#39ff14";
    ctx.shadowColor = "#39ff14";
    ctx.shadowBlur = 12;
    ctx.fillText("YOUR TURN", 16, 24);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = "#ff3030";
    ctx.shadowColor = "#ff3030";
    ctx.shadowBlur = 12;
    ctx.fillText("INCOMING!", 16, 24);
    ctx.shadowBlur = 0;
  }

  // Score
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText("SCORE " + score, W / 2, 24);

  // Wind
  ctx.textAlign = "right";
  ctx.fillStyle = wind > 0 ? "#ffcc00" : "#3a8acf";
  const arrow = wind > 0.3 ? "→" : wind < -0.3 ? "←" : "•";
  ctx.fillText(arrow + " WIND " + Math.abs(wind).toFixed(1), W - 16, 24);

  // Bottom bar
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, H - 60, W, 60);
  ctx.strokeStyle = "rgba(232,48,42,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 60);
  ctx.lineTo(W, H - 60);
  ctx.stroke();

  // Inventory slots
  const slotW = 120;
  const totalW = inventory.length * slotW;
  const startX = (W - totalW) / 2;
  for (let i = 0; i < inventory.length; i++) {
    const sx = startX + i * slotW;
    const sy = H - 55;
    const sw = slotW - 10;
    const sh = 50;
    const sel = i === selectedType;
    ctx.fillStyle = sel ? "rgba(232,48,42,0.25)" : "rgba(255,255,255,0.08)";
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = sel ? "#e8302a" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = sel ? 3 : 2;
    if (sel) {
      ctx.shadowColor = "#e8302a";
      ctx.shadowBlur = 15;
    }
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.shadowBlur = 0;

    // Mini worm icon
    const iconWorm = { x: sx + 25, y: sy + 25, radius: 12, team: "player", type: inventory[i].type, facing: 1, wiggle: 0, alive: true, hp: 100, maxHp: 100 };
    drawWormBody(iconWorm);

    // Name + count
    ctx.font = "10px Bungee, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    const name = inventory[i].type === "red" ? "RED" : inventory[i].type === "bomber" ? "BOMB" : "SPLIT";
    ctx.fillText(name, sx + 50, sy + 18);
    ctx.font = "14px Bungee, sans-serif";
    ctx.fillStyle = "#ffcc00";
    ctx.fillText("x" + inventory[i].count, sx + 50, sy + 34);
  }

  // Mute button
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(W - 60, H - 55, 50, 50);
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 2;
  ctx.strokeRect(W - 60, H - 55, 50, 50);
  ctx.font = "24px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.fillText(muted ? "🔇" : "🔊", W - 35, H - 30);
}

// ====== GAME LOOP ======
function gameLoop(time) {
  const dt = Math.min(32, time - lastTime);
  lastTime = time;

  if (gameState === "attract") {
    updateAttract();
    updatePhysics(dt);
    updateCamera();
  } else if (gameState === "playing") {
    updatePhysics(dt);
    updateCamera();
    // Auto switch if no projectiles and no loaded worm but still player turn
    if (turn === "player" && !loadedWorm && projectiles.length === 0 && turnTimer === 0) {
      const hasShots = inventory.reduce((s, i) => s + i.count, 0);
      if (hasShots > 0) {
        loadNextWorm();
      } else {
        // Check lose
        const enemiesAlive = worms.filter(w => w.team === "enemy" && w.alive).length;
        if (enemiesAlive > 0) {
          showEndScreen(false);
        }
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}
</script>
